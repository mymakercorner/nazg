<!-- Mockup of the key test that works on every board (ui-design.md, "The key test").

     First round (2026-10-18). The live test reads the board's switch matrix (id_switch_matrix_state),
     which most VIA firmware refuses: it answers all released unless built with VIA_INSECURE
     (Keychron builds every board so) or SECURE_ENABLE and unlocked. VIA's own Key Tester falls back
     on the computer's key events -- and draws a generic 108-key keyboard, not the board.

     Rico's idea (2026-10-18): on a VIA board, test with the keys the computer receives. Settled with
     him before the mockup: keep both and let Nazg choose -- a key the computer receives while the
     matrix says nothing is pressed means the firmware refuses the matrix: Nazg switches to the
     computer's keys and says so; a press the matrix shows means it works, and Nazg stays on it.
     And the panel always says which method is in use (Rico).

     Where (Rico, 2026-10-18, during the first round): the Matrix view for everyone, its live test AND
     its row/column wiring -- no longer behind Advanced tools.

     The variants: how it says which method; the marks of the computer's keys.

     Settled 2026-10-18 (Rico): a tag at the strip's end as well as the panel's line; shared keys amber
     with a ?, keys that send nothing hatched. The toggles keep the alternatives.
     The board is made up: a 60% with a split space bar (both halves Space), Fn on MO(1), an empty
     position, and a knob. Click keys to press them; the knob's arrows turn it.

     Second round (2026-10-26), after a tester's report: he checks his layers at the end of programming
     -- Fn and 1 sending F1, the navigation keys -- with VIA's Key Tester or SwitchHitter, both reading
     what the computer receives. Nazg's test matched the base layer only (NazgMatrixView.cpp): Fn and 1
     lit nothing. Two proposals, the second row of controls: the strip's tag becomes a choice of test,
     Nazg's pick selected; and the computer's keys test the layer shown, picked in the strip. Fn is
     held by clicking it, let go by clicking it again. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key test mockup</title>
<style>
:root{--window:#f3f3f5;--menubar:#e3e4e9;--text:#1d1e22;--muted:#6b6e78;--control:#ffffff;--border:#c8cad2;--accent:#3b82f6;--accent-text:#fff;--panel:#f8f8fa;--column:#ebecf0;--selected:rgba(59,130,246,.16);
--plate:#d3d4d8;--key:#ffffff;--keyline:#b4b7c2;--ok:#15803d;--warn:#c2410c;--chg:#2563eb;
--seen:#e6f4dc;--seenline:#6aa84f;--maybe:#fff1d6;--maybeline:#d08a1c;--none:#ececef;--layer:#8b5cf6;--layerplate:#ddd5ee}
:root[data-theme="dark"]{--window:#0f0f11;--menubar:#24252b;--text:#ececf1;--muted:#80838f;--control:#20232b;--border:#3a3d48;--accent:#4296fa;--accent-text:#fff;--panel:#16171b;--column:#16171b;--selected:rgba(66,150,250,.22);
--plate:#1c1d23;--key:#3a3c48;--keyline:#4b4e5c;--ok:#4ade80;--warn:#fb923c;--chg:#60a5fa;
--seen:#24401a;--seenline:#6aa84f;--maybe:#47340f;--maybeline:#e0a43a;--none:#25262c;--layer:#9d7bf0;--layerplate:#2a2338}
*{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font-family:Arimo,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.group .name{color:var(--muted);margin-right:4px}
button{font:inherit;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--control);color:var(--text);cursor:pointer}
button.on,button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.stage{padding:16px;overflow-x:auto}
.frame{position:relative;margin:0 auto;width:1000px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--window);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.menubar{display:flex;gap:18px;align-items:center;background:var(--menubar);padding:5px 14px}
.menubar .board{font-weight:600}
.muted{color:var(--muted)}
.menubar .right{margin-left:auto;color:var(--muted)}
.body{display:flex;min-height:470px}
.col{flex:none;width:180px;background:var(--column);border-right:1px solid var(--border);padding:6px 5px;display:flex;flex-direction:column;gap:2px}
.col .hdr{font-weight:700;font-size:12px;padding:6px 10px 2px}
.col .sep{border-top:1px solid var(--border);margin:5px 4px}
.entry{padding:7px 10px;border-radius:6px;color:var(--muted)}
.entry.on{background:var(--selected);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.entry.new{outline:1px dashed var(--chg)}
.entry .adv{font-size:11px;margin-left:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 14px 14px;gap:10px}
.strip{display:flex;gap:4px;align-items:center}
.strip .tab{padding:4px 12px;border:1px solid var(--border);border-radius:6px;background:var(--control)}
.strip .tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.strip .tag{margin-left:auto;padding:3px 9px;border-radius:10px;font-size:12px;border:1px solid var(--border);color:var(--muted)}
.strip .tag.sw{border-color:var(--seenline);color:var(--ok)}
.strip .tag.host{border-color:var(--maybeline);color:var(--warn)}
svg.board{display:block;margin:0 auto;user-select:none}
svg.board .k{cursor:pointer}
.panel{border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:8px 12px;line-height:1.6}
.panel .how{font-weight:600}
.panel .how.sw{color:var(--ok)}
.panel .how.host{color:var(--warn)}
.panel .row{display:flex;gap:10px;align-items:center}
.panel .row .right{margin-left:auto}
.strip .layers{display:flex;gap:4px;align-items:center;margin-left:14px}
.strip .layers .tab{padding:4px 10px;min-width:30px;text-align:center;cursor:pointer}
.strip .layers .tab.followed{background:var(--layer);border-color:var(--layer);color:#fff}
.strip .seg{margin-left:auto;display:inline-flex;align-items:center;gap:0}
.strip .seg .name{color:var(--muted);margin-right:8px}
.strip .seg button{border-radius:0;padding:3px 10px;font-size:12px}
.strip .seg button:first-of-type{border-radius:10px 0 0 10px}
.strip .seg button:last-of-type{border-radius:0 10px 10px 0;margin-left:-1px}
.strip .seg button.on.sw{background:var(--seen);border-color:var(--seenline);color:var(--ok)}
.strip .seg button.on.host{background:var(--maybe);border-color:var(--maybeline);color:var(--warn)}
.strip .seg button:disabled{opacity:.45;cursor:default}
.panel .recv{margin-top:2px}
.panel .recv b{font-weight:600}
.panel .recv button{padding:1px 8px;font-size:12px;margin-left:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--keyline)}
.notes{max-width:1000px;margin:0 auto;padding:4px 16px 30px;color:var(--muted);line-height:1.55}
.notes b{color:var(--text);font-weight:600}
.notes p{margin:0 0 8px}
</style>
</head>
<body>
<div class="controls" id="controls"></div>
<div class="stage"><div class="frame" id="frame"></div></div>
<div class="notes" id="notes"></div>
<script>
"use strict";
// A 60% with a split space bar: [width, legend, keycode]. MO(1) and KC_NO send nothing.
const ROWS = [
  [[1,'Esc','ESC'],[1,'1','1'],[1,'2','2'],[1,'3','3'],[1,'4','4'],[1,'5','5'],[1,'6','6'],[1,'7','7'],[1,'8','8'],[1,'9','9'],[1,'0','0'],[1,'-','MINS'],[1,'=','EQL'],[2,'Bksp','BSPC']],
  [[1.5,'Tab','TAB'],[1,'Q','Q'],[1,'W','W'],[1,'E','E'],[1,'R','R'],[1,'T','T'],[1,'Y','Y'],[1,'U','U'],[1,'I','I'],[1,'O','O'],[1,'P','P'],[1,'[','LBRC'],[1,']','RBRC'],[1.5,'\\','BSLS']],
  [[1.75,'Caps','CAPS'],[1,'A','A'],[1,'S','S'],[1,'D','D'],[1,'F','F'],[1,'G','G'],[1,'H','H'],[1,'J','J'],[1,'K','K'],[1,'L','L'],[1,';','SCLN'],[1,"'",'QUOT'],[2.25,'Enter','ENT']],
  [[2.25,'Shift','LSFT'],[1,'Z','Z'],[1,'X','X'],[1,'C','C'],[1,'V','V'],[1,'B','B'],[1,'N','N'],[1,'M','M'],[1,',','COMM'],[1,'.','DOT'],[1,'/','SLSH'],[1.75,'Shift','RSFT'],[1,'','NO']],
  [[1.25,'Ctrl','LCTL'],[1.25,'Win','LGUI'],[1.25,'Alt','LALT'],[3,'Space','SPC'],[3.25,'Space','SPC'],[1.25,'Alt','RALT'],[1.25,'Fn','MO1'],[1.25,'Ctrl','RCTL']],
];
const SENDS_NOTHING = new Set(['MO1', 'NO']);
const KEYS = [];
ROWS.forEach((r, y) => { let x = 0; r.forEach(([w, l, kc], i) => { KEYS.push({ x, y, w, l, kc, id: y + ':' + i }); x += w; }); });
const KNOB = { x: 15.6, y: 0, l: 'Vol', ccw: 'VOLD', cw: 'VOLU' };
// Layer 1, under Fn: the F-keys on the digits, Delete on Backspace, navigation on the right hand;
// every other key transparent. [keycode on layer 0] -> [keycode on layer 1].
const LAYER1 = { 1: 'F1', 2: 'F2', 3: 'F3', 4: 'F4', 5: 'F5', 6: 'F6', 7: 'F7', 8: 'F8', 9: 'F9', 0: 'F10', MINS: 'F11', EQL: 'F12',
  ESC: 'GRV', BSPC: 'DEL', I: 'UP', J: 'LEFT', K: 'DOWN', L: 'RGHT', U: 'HOME', O: 'END', Y: 'PGUP', H: 'PGDN' };
const LAYER_COUNT = 2;
const LABEL = { GRV: '`', DEL: 'Del', UP: '↑', LEFT: '←', DOWN: '↓', RGHT: '→', HOME: 'Home', END: 'End', PGUP: 'PgUp', PGDN: 'PgDn' };
for (let i = 1; i <= 12; i++) LABEL['F' + i] = 'F' + i;
// What a key holds on a layer, 'TRNS' where the layer leaves it to the one below.
const own = (k, layer) => layer === 0 ? k.kc : (LAYER1[k.kc] || 'TRNS');
// What it sends with `layer` on: the first layer from there down that does not leave it transparent.
function effective(k, layer) { for (let l = layer; l >= 0; l--) { const kc = own(k, l); if (kc !== 'TRNS') return kc; } return 'NO'; }
const labelOf = (k, layer) => { const kc = effective(k, layer); return kc === k.kc ? k.l : (LABEL[kc] || kc); };
const nameOf = kc => LABEL[kc] || KEYS.find(k => k.kc === kc)?.l || kc;

const FIRMWARE = {
  'Stock VIA (matrix refused)': { matrix: false, name: 'Phoenix Project No 1', proto: 'VIA 12' },
  'VIA_INSECURE (Keychron)': { matrix: true, name: 'Keychron Q6', proto: 'VIA 12' },
  'Vial, unlocked': { matrix: true, name: 'F77 Model F Keyboard', proto: 'Vial 6' },
};
const state = { fw: 'Stock VIA (matrix refused)', says: 'A tag in the strip, the line too', marks: 'Shared keys amber, mute keys hatched', theme: 'Light',
  choosing: 'Computer\'s keys by default', layers: 'The layer shown', follow: 'Follows the key received', followMark: 'Its tab',
  pressed: new Set(), seen: new Set(), knob: new Set(), method: null,
  // Second round: the keys seen per layer on the computer's keys; the layer shown; Fn held; the
  // test the user picked (null: Nazg's); a board found not to report its switches; the last key received.
  seenOn: [new Set(), new Set()], layer: 0, fnHeld: false, chosen: null, refused: false, fellBack: false, received: null,
  // Following: the layer a key held came from, shown over the strip's while it is down and a moment
  // after; the key down; the layer the last key received came from.
  peek: null, down: null, receivedFrom: null };

const fw = () => FIRMWARE[state.fw];
const choosing = () => state.choosing !== 'Nazg alone (as built)';
// Computer's keys from the start, whatever the board (Rico, 2026-10-26); Switches by choice.
const hostByDefault = () => state.choosing === 'Computer\'s keys by default';
const byLayer = () => state.layers === 'The layer shown';
const follows = () => byLayer() && state.follow === 'Follows the key received';
const shownLayer = () => !byLayer() ? 0 : follows() && state.peek !== null ? state.peek : state.layer;
// A layer shown because a key came from it, not because it was picked: marked (Rico, 2026-10-26),
// in Behaviour's violet, the colour layer keys wear. Only while it differs from the strip's pick.
const followed = () => follows() && state.peek !== null && state.peek !== state.layer && state.followMark !== 'Nothing';
// The layer a key received came from, as far as Nazg can tell -- the computer does not say: the layer
// whose own key sends it -- not one passing it through a transparent key, so S after Fn is let go is
// layer 0 again, and so is Q with Fn held. Several layers sending it: the one shown if it is one of
// them, else the lowest. None when no key does.
function layersOf(kc) {
  const owners = Array.from({ length: LAYER_COUNT }, (_, l) => l).filter(l => KEYS.some(k => own(k, l) === kc));
  return owners.includes(shownLayer()) ? [shownLayer()] : owners;
}
// Released: the strip's layer back once no key is down, a moment later -- a tap would only flash.
const BACK_MS = 500;
let backTimer = null;
function release() {
  state.down = null;
  if (state.peek === null) return;
  clearTimeout(backTimer);
  backTimer = setTimeout(() => { if (state.down === null) { state.peek = null; render(); } }, BACK_MS);
}
function press(key) {
  // Fn is held by a click and let go by the next: the board's layer 1 while it is down.
  const sent = effective(key, state.fnHeld ? 1 : 0);
  if (key.kc === 'MO1') state.fnHeld = !state.fnHeld;
  // The first press decides, unless the user chose: the matrix shows it, or only the computer
  // receives it. Switches chosen on a board that does not report them: Nazg falls back, and says so.
  if (!state.method) {
    if (state.chosen) state.method = state.chosen;
    else if (fw().matrix) state.method = 'switches';
    else if (!SENDS_NOTHING.has(sent)) { state.method = 'computer'; state.refused = true; }
  }
  if (state.method === 'switches' && !fw().matrix) { state.refused = true; state.fellBack = true; state.method = 'computer'; }
  if (state.method === 'switches') state.seen.add(key.id);
  else if (state.method === 'computer' && !SENDS_NOTHING.has(sent)) {
    // The computer cannot tell which layer was on: a key received counts on every layer whose key
    // sends it, so the layer shown is a view, and showing another later finds it lit there too.
    state.received = sent;
    for (let layer = 0; layer < (byLayer() ? LAYER_COUNT : 1); layer++)
      KEYS.filter(k => effective(k, layer) === sent).forEach(k => state.seenOn[layer].add(k.id));
    // Following: the board shows the layer the key came from while it is down (Rico, 2026-10-26).
    const from = layersOf(sent);
    state.receivedFrom = from.length ? from[0] : null;
    if (follows() && from.length) { clearTimeout(backTimer); state.down = key.id; state.peek = from[0]; }
  }
}
function shared(kc, layer) { return KEYS.filter(k => effective(k, layer) === kc).length > 1; }
// A key the shown layer leaves transparent: drawn faint, as Keymap draws it, and not counted --
// it sends what the layer below does.
const passes = (k, layer) => layer > 0 && own(k, layer) === 'TRNS' && k.kc !== 'MO1';
function markOf(key) {
  const host = state.method === 'computer', layer = shownLayer(), kc = effective(key, layer);
  if (host && SENDS_NOTHING.has(kc)) return 'mute';
  if (state.method === 'switches') return state.seen.has(key.id) ? 'seen' : '';
  if (state.seenOn[layer].has(key.id)) return host && shared(kc, layer) ? 'maybe' : 'seen';
  return '';
}

function boardSvg() {
  const u = 40, W = 17 * u, H = 5 * u + 20;
  let s = `<svg class="board" width="${W + 20}" height="${H + 10}"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--keyline)" stroke-width="2"/></pattern></defs>`;
  const tinted = followed() && state.followMark === 'Its tab and the plate';
  s += `<rect x="4" y="4" width="${15 * u + 12}" height="${5 * u + 12}" rx="8" fill="var(${tinted ? '--layerplate' : '--plate'})"${tinted ? ' stroke="var(--layer)" stroke-width="2"' : ''}/>`;
  // The switches test positions: the base layer's legends. The computer's keys test the layer shown.
  const layer = state.method === 'switches' ? 0 : shownLayer();
  for (const k of KEYS) {
    const m = markOf(k), x = 10 + k.x * u + 2, y = 10 + k.y * u + 2, w = k.w * u - 4, h = u - 4;
    let fill = 'var(--key)', stroke = 'var(--keyline)', sw = 1, op = 1, dash = '';
    if (m === 'seen') { fill = 'var(--seen)'; stroke = 'var(--seenline)'; sw = 2; }
    if (m === 'maybe') { fill = state.marks.startsWith('Shared keys amber') ? 'var(--maybe)' : 'var(--seen)'; stroke = state.marks.startsWith('Shared keys amber') ? 'var(--maybeline)' : 'var(--seenline)'; sw = 2; }
    if (m === 'mute') { op = .55; dash = state.marks.endsWith('hatched') ? '' : '4 3'; }
    if (!m && passes(k, layer)) op = .4;
    // Fn while held: the mockup's stand-in for a finger on it.
    if (k.kc === 'MO1' && state.fnHeld) { stroke = 'var(--accent)'; sw = 2.5; op = 1; }
    s += `<g class="k" data-id="${k.id}" opacity="${op}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;
    if (m === 'mute' && state.marks.endsWith('hatched')) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="url(#hatch)" opacity=".5"/>`;
    s += `<text x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle" font-size="12" fill="var(--text)">${labelOf(k, layer) || (k.kc === 'NO' ? '✕' : '')}</text>`;
    if (passes(k, layer)) s += `<text x="${x + w - 10}" y="${y + h - 4}" font-size="9" fill="var(--muted)">▽</text>`;
    if (m === 'maybe' && state.marks.startsWith('Shared keys amber')) s += `<text x="${x + w - 9}" y="${y + 13}" font-size="11" fill="var(--maybeline)">?</text>`;
    s += `</g>`;
  }
  // The knob: no matrix position -- only the computer's keys test it.
  const cx = 10 + KNOB.x * u + u / 2, cy = 10 + u / 2 + 6, knobSeen = state.method === 'computer' && state.knob.size === 2;
  const knobPart = state.method === 'computer' && state.knob.size === 1;
  s += `<circle cx="${cx}" cy="${cy}" r="${u / 2 - 2}" fill="${knobSeen ? 'var(--seen)' : 'var(--key)'}" stroke="${knobSeen || knobPart ? 'var(--seenline)' : 'var(--keyline)'}" stroke-width="${knobSeen || knobPart ? 2 : 1}" opacity="${state.method === 'switches' ? .45 : 1}"/>`;
  s += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="11" fill="var(--text)">${KNOB.l}</text>`;
  s += `<text class="k" data-knob="ccw" x="${cx - u / 2 - 8}" y="${cy + u / 2 + 18}" font-size="13" fill="var(--muted)" style="cursor:pointer">↺</text>`;
  s += `<text class="k" data-knob="cw" x="${cx + u / 2 - 2}" y="${cy + u / 2 + 18}" font-size="13" fill="var(--muted)" style="cursor:pointer">↻</text>`;
  return s + `</svg>`;
}

function methodWords() {
  if (!state.method)
    return { cls: '', head: 'Press any key.', more: 'Nazg reads the board\'s switches if it reports them, else the keys the computer receives -- it tells which once a key is pressed.' };
  if (state.method === 'switches')
    return { cls: 'sw', head: 'Testing the switches', more: `The board reports which of its switches are pressed, whatever they send. The knob has no switch: turn it in Keymap to try it.`
      + (choosing() ? ` To test what each key sends, on each layer, choose Computer's keys.` : '') };
  const why = state.fellBack ? `The board did not report that press: this firmware does not report its switches (built without VIA_INSECURE), so `
            : state.refused ? `This firmware does not report its switches (built without VIA_INSECURE), so `
            : hostByDefault() && !state.chosen ? `What each key sends, on each layer -- choose Switches to test the switches themselves, by position: `
            : `Chosen: `;
  const layerWords = !byLayer() ? ''
    : follows() ? ` The board shows the layer each key received comes from; keys a layer leaves transparent are faint ▽ and send what the layer below does.`
    : ` On layer ${state.layer}${state.layer ? ', with the key that turns it on held' : ''}: keys it leaves transparent are faint ▽ and send what the layer below does.`;
  return { cls: 'host', head: 'Testing what the computer receives',
    more: why + `a key lights when the computer receives what it sends.` + layerWords + ` `
      + `Fn and the empty key send nothing: they cannot be tested this way. Both halves of the space bar send Space: either lights both. `
      + `Keys the system keeps -- Win, Alt+Tab, Print Screen -- may not arrive.` };
}

function columnHtml() {
  let html = `<div class="col"><div class="hdr">${fw().proto.startsWith('Vial') ? 'Vial' : 'VIA'}</div><div class="entry">Keymap</div><div class="entry">Layout</div><div class="entry">Macros</div>`
    + `<div class="sep"></div><div class="hdr">Tools</div><div class="entry">Device</div>`;
  html += `<div class="entry on new">Matrix</div>`;
  return html + `</div>`;
}

function stripHtml() {
  const tabs = `<span class="tab on">Live test</span><span class="tab">Wiring</span>`;
  // The layers, while the computer's keys are tested: the one shown is the one tested.
  const layers = state.method === 'computer' && byLayer()
    ? `<span class="layers"><span class="muted">Layer</span>` + Array.from({ length: LAYER_COUNT }, (_, n) =>
        `<span class="tab${n === shownLayer() ? (followed() ? ' followed' : ' on') : ''}" data-layer="${n}">${n}</span>`).join('') + `</span>` : '';
  let tag = '';
  if (choosing()) {
    // The tag as a choice: Nazg's pick selected once a key decides, the user's at once. Switches
    // greyed once the board is known not to report them.
    const on = state.method || state.chosen;
    tag = `<span class="seg"><span class="name">Test</span>`
      + `<button data-test="switches" class="${on === 'switches' ? 'on sw' : ''}"${state.refused ? ' disabled title="This firmware does not report its switches"' : ''}>Switches</button>`
      + `<button data-test="computer" class="${on === 'computer' ? 'on host' : ''}">Computer's keys</button></span>`;
  } else if (state.says === 'A tag in the strip, the line too' && state.method)
    tag = state.method === 'switches' ? `<span class="tag sw">Switches</span>` : `<span class="tag host">Computer's keys</span>`;
  return `<div class="strip">${tabs}${layers}${tag}</div>`;
}
// What the computer received last, and where it is: on the layer shown, or only on another --
// a way there offered, never taken by itself: the layer shown is the user's.
function receivedHtml() {
  // As built, nothing says what arrived: Fn and 1 just light nothing.
  if (state.method !== 'computer' || !state.received || !byLayer()) return '';
  const kc = state.received, name = nameOf(kc);
  const on = l => KEYS.filter(k => effective(k, l) === kc);
  // Following, the line keeps where the last key came from after the board went back.
  const layer = follows() && state.receivedFrom !== null ? state.receivedFrom : shownLayer();
  if (on(layer).length) return `<div class="recv">Received <b>${name}</b>: ${on(layer).map(k => k.l || '✕').join(', ')} on layer ${layer}.</div>`;
  const elsewhere = Array.from({ length: LAYER_COUNT }, (_, l) => l).filter(l => l !== layer && on(l).length);
  if (elsewhere.length) return `<div class="recv">Received <b>${name}</b>: not on layer ${layer}; ${on(elsewhere[0]).map(k => k.l).join(', ')} sends it on layer ${elsewhere[0]}.`
    + `<button data-layer="${elsewhere[0]}">Show layer ${elsewhere[0]}</button></div>`;
  return `<div class="recv">Received <b>${name}</b>: no key of this board sends it.</div>`;
}

function panelHtml() {
  const w = methodWords();
  let count = '';
  if (state.method === 'switches') count = `Seen ${state.seen.size} of ${KEYS.length} keys.`;
  else if (state.method === 'computer') {
    // The layer's own keys: on a layer above the base, the ones it does not leave transparent.
    const layer = shownLayer(), keys = KEYS.filter(k => !SENDS_NOTHING.has(effective(k, layer)) && !passes(k, layer));
    const seen = keys.filter(k => state.seenOn[layer].has(k.id)).length;
    count = `Seen ${seen} of ${keys.length} keys` + (byLayer() && layer ? ` of layer ${layer}.` : '.');
  }
  let html = `<div class="panel"><div class="row"><span class="how ${w.cls}">${w.head}</span><span>${count}</span><span class="right"><button id="over">Start over</button></span></div>`
    + `<div class="muted">${w.more}</div>` + receivedHtml();
  if (state.method === 'computer')
    html += `<div class="legend"><span><i style="background:var(--seen);border-color:var(--seenline)"></i>received</span>`
      + (state.marks.startsWith('Shared keys amber') ? `<span><i style="background:var(--maybe);border-color:var(--maybeline)"></i>received, one of several sending it</span>` : '')
      + `<span><i style="background:${state.marks.endsWith('hatched') ? 'repeating-linear-gradient(45deg,var(--keyline) 0 2px,transparent 2px 6px)' : 'var(--key)'};${state.marks.endsWith('hatched') ? '' : 'border-style:dashed;'}opacity:.6"></i>sends nothing: not testable</span></div>`;
  return html + `</div>`;
}

function frameHtml() {
  return `<div class="menubar"><span class="board">${fw().name} ▾</span><span class="muted">${fw().proto}</span><span class="right">Settings</span></div>`
    + `<div class="body">${columnHtml()}<div class="main">${stripHtml()}${boardSvg()}${panelHtml()}</div></div>`;
}

const CONTROLS = [
  ['Firmware', 'fw', Object.keys(FIRMWARE)],
  ['Says', 'says', ['A line in the panel', 'A tag in the strip, the line too']],
  ['Marks', 'marks', ['Shared keys amber, mute keys hatched', 'Shared keys green, mute keys dashed']],
  ['Theme', 'theme', ['Light', 'Dark']],
  'break',
  // Second round (2026-10-26).
  ['Choosing', 'choosing', ['Nazg alone (as built)', 'The tag is a choice', 'Computer\'s keys by default']],
  ['Computer\'s keys test', 'layers', ['The base layer (as built)', 'The layer shown']],
  // With the layer shown: picked in the strip only, or moved to the layer each key received came from.
  ['Layer shown', 'follow', ['Picked in the strip', 'Follows the key received']],
  // While a key's layer is shown, not the strip's: how it is marked.
  ['Layer followed', 'followMark', ['Nothing', 'Its tab', 'Its tab and the plate']],
];
function reset() {
  state.pressed.clear(); state.seen.clear(); state.knob.clear(); state.method = null;
  state.seenOn.forEach(s => s.clear()); state.layer = 0; state.fnHeld = false; state.chosen = null;
  state.refused = false; state.fellBack = false; state.received = null;
  state.peek = null; state.down = null; state.receivedFrom = null; clearTimeout(backTimer);
  if (hostByDefault()) state.method = 'computer';
}
function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  document.getElementById('controls').innerHTML = CONTROLS.map(c => c === 'break' ? '<div style="flex-basis:100%;height:0"></div>' :
    `<div class="group"><span class="name">${c[0]}</span>` + c[2].map(v =>
      `<button data-key="${c[1]}" data-val="${v}"${state[c[1]] === v ? ' class="on"' : ''}>${v}</button>`).join('') + `</div>`).join('');
  document.getElementById('frame').innerHTML = frameHtml();
  document.getElementById('notes').innerHTML = NOTES;
}
document.getElementById('controls').addEventListener('click', e => {
  const b = e.target.closest('button[data-key]');
  if (!b) return;
  state[b.dataset.key] = b.dataset.val;
  if (b.dataset.key === 'fw' || b.dataset.key === 'choosing' || b.dataset.key === 'layers') reset();
  render();
});
document.getElementById('frame').addEventListener('click', e => {
  if (e.target.id === 'over') { reset(); render(); return; }
  const layer = e.target.closest('[data-layer]');
  if (layer) { state.layer = +layer.dataset.layer; state.peek = null; render(); return; }
  // The user's choice of test; a switch to it keeps what each has seen.
  const test = e.target.closest('[data-test]');
  if (test) { if (!test.disabled) { state.chosen = test.dataset.test; state.method = test.dataset.test; state.fellBack = false; } render(); return; }
  const knob = e.target.closest('[data-knob]');
  if (knob) { if (!state.method && !fw().matrix) state.method = 'computer'; if (state.method === 'computer') state.knob.add(knob.dataset.knob); render(); return; }
});
// A key is down while the mouse button is: pressed on mousedown, released on mouseup, so holding the
// button holds the key. Fn stays down from one press to the next.
document.getElementById('frame').addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-id]');
  if (g) { e.preventDefault(); press(KEYS.find(k => k.id === g.dataset.id)); render(); }
});
addEventListener('pointerup', () => { if (state.down !== null) release(); });

const NOTES = `
<p><b>Two methods, chosen by the board.</b> Nazg reads the switch matrix, as the live test does today, and listens to the keys the
computer receives. Until a key is pressed it cannot tell a firmware that refuses the matrix from a board at rest -- both read all
released. The first press decides: shown by the matrix, the switches are tested (a Keychron board, an unlocked Vial board); received
by the computer while the matrix shows nothing, the firmware refuses it, and Nazg tests what the computer receives (most VIA boards).
<i>Firmware</i> switches the board; click keys to press them. A press of Fn alone decides nothing: it sends nothing.</p>
<p><b>Testing what the computer receives</b> tests the keymap and the system as much as the switches. A key that sends nothing -- a
layer key, an empty position, QK_BOOT -- cannot be tested, and says so. Two keys sending the same keycode cannot be told apart:
either lights both, marked. The knob, which has no switch, can be tested only this way. Win, Alt+Tab or Print Screen may never reach
Nazg; Alt+F4 would close it -- Nazg ignores what it can. VIA's own tester draws a generic 108-key keyboard; Nazg draws the board.</p>
<p><b>Where</b> (Rico, 2026-10-18): the Matrix view, in Tools, for everyone -- the live test with both methods, and the
row/column wiring, no longer behind Advanced tools. A separate Key test section, and the wiring kept Advanced, were drawn first. Dashed: what changes.</p>
<p><b>Saying which</b> (Rico): always, in the panel's first line, and what the method cannot see; or a tag at the strip's end too.</p>
<p><b>Second round, 2026-10-26</b> -- the second row of controls. A tester checks his layers at the end of programming, Fn and 1 sending
F1, with VIA's Key Tester or SwitchHitter: what the computer receives. On a board reporting its switches Nazg never offered that, and
on one that does not it matched the base layer only -- Fn and 1 lit nothing (<i>The base layer</i>: hold Fn, press 1).</p>
<p><b>The tag is a choice</b>: <i>Switches</i> or <i>Computer's keys</i>, Nazg's pick selected once the first press decides, the user's
at once. Switches are greyed once the board is known not to report them; chosen before that, the first press falls back and says why.
Each test keeps what it has seen when the other is chosen. Try it with <i>VIA_INSECURE</i> or <i>Vial, unlocked</i>: the switches test
first, then Computer's keys to test the layers.</p>
<p><b>Computer's keys by default</b> (Rico, 2026-10-26), the default here: the choice, with Computer's keys selected from the start
on every board -- what most open the test for, after programming, layers included, and the same test whatever the firmware. Switches
one click away, for a board just soldered: by position, ghosting and rollover, keys that send nothing. Nazg no longer works out a test
before the first press; chosen on a board that refuses its matrix, Switches fall back at the first press and say why. Remembering the
choice in settings.json waits (Rico).</p>
<p><b>The layer shown</b>: while the computer's keys are tested, the strip has the layers, as Keymap's; the board draws the layer
chosen and a key lights when the computer receives what it sends there. Keys the layer leaves transparent are faint with ▽ and not
counted: they send what the layer below does. The count is per layer. The computer cannot tell Nazg which layer is on, so a key
received counts on every layer whose key sends it -- the layer shown is only a view. A key received that the layer shown does not
have is said, with the layer that has it and a button to show it. <b>Layer shown: Follows the key received</b> (Rico, 2026-10-26):
while a key received is down, the board shows the layer it comes from, as far as Nazg can tell -- the layer whose own key sends
it, not one passing it through a transparent key -- and goes back to the strip's layer half a second after it is released, so a tap
is seen (Rico: released, F1 stayed on layer 1). The line keeps where the last key came from. A keycode several layers send keeps the
layer shown if it is one of them, else the lowest. <i>Picked in the strip</i>: the layer moves only when clicked.
<b>Layer followed</b> (Rico, 2026-10-26): while the board shows a key's layer rather than the strip's, its tab is violet --
Behaviour's colour, the one layer keys wear -- instead of the accent blue of a layer picked. Back to the strip's layer, back to
blue. Chosen: the tab only (Rico); the plate tinted and outlined too was declined. A key is down while
the mouse button is: hold it to hold the key. Try it: Layer 1, click Fn to hold it, then 1, I, J... Show layer 0 while Fn is held, press 1: F1 is
received, and the line offers layer 1. The switches test positions, whatever the layer: no layers in the strip there.</p>`;
reset();
render();
</script>
</body>
</html>
