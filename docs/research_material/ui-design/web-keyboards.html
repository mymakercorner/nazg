<!-- Mockup of the keyboard list in the web build (build-and-release.md, "The web build", step 2).

     First round, 2026-10-24. In a browser Nazg sees only the boards the user has allowed it, each
     once, in the browser's own device chooser -- WebHID's requestDevice(), which only a click can
     open. A board allowed once is there at every later visit (getDevices()), with no prompt, until it
     is forgotten (HIDDevice.forget(), or the browser's site settings). Firefox and Safari have no
     WebHID, nor has any phone: the page has to say so rather than show an empty list.

     The questions: where "Add a keyboard..." goes; what follows a choice -- the board listed, or
     opened as a lone board is at start; whether a board can be forgotten from Nazg; what an empty
     first visit says; what becomes of Show all HID devices, which can only list allowed devices here.
     The browser's chooser is drawn after Chrome's (148), roughly: it is the browser's, not Nazg's.

     Settled 2026-10-24 (Rico): Add a keyboard... under the list; a board chosen is opened at once;
     no Forget in Nazg -- the hint names the browser's site settings; Show all HID devices hidden on
     the web. The toggles keep the alternatives. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web keyboard list mockup</title>
<style>
:root{--window:#f3f3f5;--menubar:#e3e4e9;--text:#1d1e22;--muted:#6b6e78;--control:#ffffff;--border:#c8cad2;--accent:#3b82f6;--accent-text:#fff;--panel:#f8f8fa;
--ok:#15803d;--warn:#c2410c;--chg:#2563eb;--shade:rgba(20,22,30,.18);--chrome:#dee1e6;--chromebar:#ffffff;--chrometext:#1f1f1f;--chromeaccent:#0b57d0}
:root[data-theme="dark"]{--window:#0f0f11;--menubar:#24252b;--text:#ececf1;--muted:#80838f;--control:#20232b;--border:#3a3d48;--accent:#4296fa;--accent-text:#fff;--panel:#16171b;
--ok:#4ade80;--warn:#fb923c;--chg:#60a5fa;--shade:rgba(0,0,0,.35);--chrome:#202124;--chromebar:#35363a;--chrometext:#e8eaed;--chromeaccent:#a8c7fa}
*{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font-family:Arimo,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.group .name{color:var(--muted);margin-right:4px}
button{font:inherit;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--control);color:var(--text);cursor:pointer}
button.on,button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:3px 6px}
button.big{padding:7px 18px;font-size:14px}
.stage{padding:16px;overflow-x:auto}
.browser{margin:0 auto;width:1000px;border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);background:var(--chrome)}
.urlbar{display:flex;align-items:center;gap:10px;padding:6px 10px;color:var(--chrometext);font-family:"Segoe UI",Roboto,sans-serif;font-size:13px}
.urlbar .url{flex:1;background:var(--chromebar);border-radius:14px;padding:5px 14px}
.frame{position:relative;min-height:440px;background:var(--window)}
.menubar{display:flex;gap:18px;align-items:center;background:var(--menubar);padding:5px 14px}
.muted{color:var(--muted)}
.menubar .right{margin-left:auto;color:var(--muted)}
.list{max-width:800px;margin:28px auto;padding:0 20px}
.headrow{display:flex;align-items:flex-end;margin:0 0 6px}
.count{font-weight:700}
.headrow .right{margin-left:auto}
table{width:100%;border:1px solid var(--border);border-radius:8px;border-collapse:separate;border-spacing:0;background:var(--control)}
td,th{padding:6px 12px;text-align:left}
th{color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);background:var(--menubar)}
th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td.proto{width:120px}td.act{width:200px;text-align:right;white-space:nowrap}
tr.addrow td{border-top:1px solid var(--border);color:var(--muted)}
.new{outline:1px dashed var(--chg);outline-offset:2px;border-radius:6px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px}
.check i{display:inline-block;width:20px;height:20px;border:1px solid var(--border);border-radius:5px;background:var(--control)}
.hint{color:var(--muted);margin-top:6px;line-height:1.5}
.below{display:flex;align-items:center;gap:14px;margin-top:12px}
.said{margin-bottom:10px;line-height:1.5}
.said.ok{color:var(--ok)}.said.warn{color:var(--warn)}
.empty{max-width:560px;margin:70px auto 0;text-align:center;line-height:1.6}
.empty h2{font-size:17px;margin:0 0 8px}
.empty p{margin:0 0 14px}
.board{display:flex;align-items:center;justify-content:center;height:300px;color:var(--muted);border:1px dashed var(--border);margin:20px;border-radius:8px}
.chooser{position:absolute;left:12px;top:-4px;width:430px;z-index:6;background:var(--chromebar);color:var(--chrometext);border-radius:10px;box-shadow:0 6px 26px rgba(0,0,0,.35);font-family:"Segoe UI",Roboto,sans-serif;font-size:13px;padding:16px 18px 14px}
.chooser h4{margin:0 0 10px;font-size:14px;font-weight:600}
.chooser .item{padding:8px 10px;border-radius:6px}
.chooser .item.sel{background:rgba(11,87,208,.14)}
.chooser .items{border:1px solid rgba(128,128,128,.35);border-radius:8px;padding:4px;margin-bottom:12px;min-height:84px}
.chooser .cf{display:flex;justify-content:flex-end;gap:8px}
.chooser .cf span{padding:6px 16px;border-radius:16px;border:1px solid rgba(128,128,128,.5)}
.chooser .cf span.go{background:var(--chromeaccent);border-color:var(--chromeaccent);color:var(--chromebar)}
.tag{position:absolute;left:460px;top:8px;z-index:6;color:#fff;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:10px;font-size:12px}
.shade{position:absolute;inset:0;background:var(--shade);z-index:5}
.notes{max-width:1000px;margin:0 auto;padding:4px 16px 30px;color:var(--muted);line-height:1.55}
.notes b{color:var(--text);font-weight:600}
.notes p{margin:0 0 8px}
</style>
</head>
<body>
<div class="controls" id="controls"></div>
<div class="stage"><div class="browser"><div class="urlbar"><span>&#8592; &#8594; &#10227;</span><span class="url">mymakercorner.github.io/nazg</span></div><div class="frame" id="frame"></div></div></div>
<div class="notes" id="notes"></div>
<script>
"use strict";
const CONCORDIA = { name: 'The Concordia Type C', proto: 'VIA' };
const F77 = { name: 'F77 Model F Keyboard by Model F Labs', proto: 'Vial' };
const PHOENIX = { name: 'Phoenix Project No 1', proto: 'VIA' };

const STEPS = ['First visit', "Browser's chooser", 'Chosen', 'Later visit', 'No WebHID'];
const state = { step: 'First visit', place: 'Under the list', after: 'Opened', forget: 'Not from Nazg', showAll: 'Hidden', theme: 'Light' };

const ADD = (cls) => `<span class="new"><button class="${cls || 'primary'}">Add a keyboard...</button></span>`;
const FORGET = `<span class="new"><button class="quiet" title="Nazg no longer sees this board until it is added again">Forget</button></span>`;

function allowed() {
  const s = state.step;
  if (s === 'First visit' || s === "Browser's chooser") return [];
  if (s === 'Chosen') return [CONCORDIA];
  return [CONCORDIA, F77];
}

function rowHtml(b) {
  const forget = state.forget === 'Forget on each row' ? FORGET + ' ' : '';
  return `<tr><td>${b.name}</td><td class="proto">${b.proto}</td><td class="act">${forget}<button class="primary">Open</button></td></tr>`;
}

function listHtml(boards) {
  const inHeader = state.place === 'Beside the count';
  const inTable = state.place === 'Last row of the list';
  let html = `<div class="headrow"><span class="count">Keyboards: ${boards.length}</span>${inHeader ? `<span class="right">${ADD()}</span>` : ''}</div>`;
  html += `<table><tr><th>Product</th><th>Protocol</th><th></th></tr>` + boards.map(rowHtml).join('');
  if (inTable) html += `<tr class="addrow"><td colspan="2">Another keyboard? Your browser asks which one Nazg may use.</td><td class="act">${ADD()}</td></tr>`;
  html += `</table>`;
  const showAll = state.showAll === 'Kept' ? `<span class="check" style="margin:0"><i></i>Show all HID devices</span>` : '';
  if (state.place === 'Under the list') html += `<div class="below">${ADD()}${showAll}</div>`;
  else if (showAll) html += `<div class="below">${showAll}</div>`;
  html += `<div class="hint">Nazg sees only the keyboards you add, each once: your browser remembers them for this site.`
    + (state.forget === 'Not from Nazg' ? ` To remove one, use the browser's site settings (the icon left of the address).` : '') + `</div>`;
  return html;
}

function emptyHtml() {
  return `<div class="empty new"><h2>Add your keyboard</h2>`
    + `<p>A web page may only use a keyboard you choose. Click below, and your browser lists the keyboards Nazg can configure -- VIA and Vial ones.`
    + ` Pick yours and click Connect.</p>${ADD('primary big')}`
    + `<p class="hint" style="margin-top:14px">Once added, it is there each time you come back. Not in the browser's list? It may not run VIA or Vial firmware.</p></div>`;
}

function noWebHidHtml() {
  return `<div class="empty new"><h2>This browser cannot reach keyboards</h2>`
    + `<p>Nazg in a browser needs WebHID, which only Chrome, Edge and Opera have, on a computer -- Firefox and Safari do not, nor does any phone.</p>`
    + `<p>Open this page in one of them, or download Nazg for Windows, macOS or Linux.</p><button>Download Nazg</button></div>`;
}

function chooserHtml() {
  return `<div class="shade"></div><div class="chooser"><h4>mymakercorner.github.io wants to connect to a HID device</h4>`
    + `<div class="items"><div class="item sel">The Concordia Type C</div><div class="item">F77 Model F Keyboard by Model F Labs</div><div class="item">Phoenix Project No 1</div></div>`
    + `<div class="cf"><span>Cancel</span><span class="go">Connect</span></div></div>`
    + `<span class="tag">The browser's own window, not Nazg's: it lists only VIA and Vial interfaces (0xFF60 / 0x61)</span>`;
}

function frameHtml() {
  const s = state.step;
  const opened = s === 'Chosen' && state.after === 'Opened';
  let html = `<div class="menubar"><span class="${opened ? '' : 'muted'}">${opened ? 'The Concordia Type C &#9662;' : 'No board open'}</span><span class="right">Settings</span></div>`;
  if (s === 'No WebHID') return html + noWebHidHtml();
  if (opened) return html + `<div class="board">The Concordia, opened -- as a lone board is at start</div>`;
  const boards = allowed();
  if (boards.length === 0) {
    html += emptyHtml();
    if (s === "Browser's chooser") html += chooserHtml();
    return html;
  }
  html += `<div class="list">`;
  if (s === 'Chosen') html += `<div class="said ok">The Concordia Type C is added -- your browser remembers it.</div>`;
  html += listHtml(boards) + `</div>`;
  return html;
}

const CONTROLS = [
  ['Step', 'step', STEPS],
  ['Add a keyboard... sits', 'place', ['Under the list', 'Beside the count', 'Last row of the list']],
  ['After choosing', 'after', ['Opened', 'Listed']],
  ['Forgetting a board', 'forget', ['Not from Nazg', 'Forget on each row']],
  ['Show all HID devices', 'showAll', ['Hidden', 'Kept']],
  ['Theme', 'theme', ['Light', 'Dark']],
];

const NOTES = {
  'First visit': `<b>The first screen most people see on the web</b>: nothing is allowed yet, so the list would be empty.
    Instead it says what to do, one button. The native empty list says "No keyboard found." -- here that would be wrong.`,
  "Browser's chooser": `<b>The browser's chooser</b>, opened by the click: it lists the HID interfaces matching Nazg's filter -- VIA and Vial's
    raw HID, usage page 0xFF60, usage 0x61 -- including boards already allowed. Cancel leaves the page as it was.`,
  'Chosen': `<b>After Connect.</b> "Opened": the board opens at once, as a lone board does at start -- the user just chose it, which is what VIA
    does too. "Listed": the list, saying it was added; one more click. A second board added later goes the same way.`,
  'Later visit': `<b>Coming back</b>: every board allowed before is listed at once, no prompt; with only one plugged in it opens, as natively.
    A board allowed but unplugged is not listed. The list follows plugging and unplugging (WebHID's connect and disconnect events).`,
  'No WebHID': `<b>Firefox, Safari, a phone</b>: no navigator.hid. Said plainly, with the way out -- another browser or the desktop app --
    rather than an empty list or a button that does nothing.`,
};

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  document.getElementById('controls').innerHTML = CONTROLS.map(([label, key, values]) =>
    `<div class="group"><span class="name">${label}</span>` + values.map(v =>
      `<button data-key="${key}" data-value="${v}"${state[key] === v ? ' class="on"' : ''}>${v}</button>`).join('') + `</div>`).join('');
  document.getElementById('frame').innerHTML = frameHtml();
  document.getElementById('notes').innerHTML = `<p>${NOTES[state.step]}</p>`
    + `<p>Dashed outlines mark what differs from the native list. On Linux the browser still needs the board allowed by a udev rule, as the desktop app does:`
    + ` Chrome lists it, the open fails -- the row then says "not allowed by Linux" and points to the manual (Nazg cannot write the rule from a page).</p>`;
}

document.getElementById('controls').addEventListener('click', event => {
  const b = event.target.closest('button[data-key]');
  if (!b) return;
  state[b.dataset.key] = b.dataset.value;
  render();
});
render();
</script>
</body>
</html>
