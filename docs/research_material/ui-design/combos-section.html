<!-- Mockup of the Combos section (ui-design.md, "The Combos section").

     First round (2026-10-10). A combo is Vial's alone: up to four input keycodes pressed together
     send an output keycode instead, 10 bytes per slot, read and written one slot per round trip
     (via-vial-commands.md, vial_dynamic_entry_op). Vial's editor is a tab per slot numbered from 1,
     four "Key" boxes and an "Output key" box, written at once.

     What the firmware does is in ui-design.md, read from QMK's process_combo.c and vial-qmk's
     reload_combo() on 2026-10-10: the inputs are keycodes matched against what a key sends on the
     active layer, end at the first empty one, any order, each within the combo term of the last;
     every combo key is held back up to the term; the output is held while the keys are; the longer
     of two overlapping combos wins, and of two with the same keys the later slot; an empty output
     swallows the keys; one term for all combos, in QMK Settings when the board has them.

     No keycode names a combo slot, unlike M(n) and TD(n): the slot number means nothing to the
     user. Hence the variants: how the slots are listed (numbered in the strip, named by their keys
     in the strip, or a list in the panel), what the board shows (the selected combo, or every
     combo as a small key between its inputs, keymap-drawer's way), whether the inputs are picked by
     clicking the board, where the combo term is set, and a warning for letters often typed one
     after the other.

     Settled 2026-10-10 (Rico): the numbered strip, the selected combo on the board, inputs from
     the board and the picker, the combo term in the panel, no typing-roll warning -- the toggles
     keep the alternatives. The amber dot first drawn on every other key in a combo read as red,
     a warning: dropped.

     The boards: the Model F B104's real definition (Vial 6, Rico's board, 32 combo slots, QMK
     Settings on), and the Corne's (vial-qmk keyboards/crkbd/keymaps/vial/vial.json, rotated thumb
     keys), as an RP2040 build would have it: combos on, QMK Settings off, 16 slots. vial-qmk's own
     Corne keymap turns both off for the Pro Micro's flash. The keymaps are made up: a US ANSI
     layer on the Model F; on the Corne a usual one, Gui on A and ; when held, arrows on layer 1. -->

const BIGRAMS = new Set('th he in er an re on at en nd ti es or te of ed is it al ar st to nt ng se ha as ou io le ve co me de hi ri ro ic ne ea ra ce li ch ll be ma si om ur'.split(' '));

  else if (raw.length > eff.length) {

  const fs = Math.round(u * 0.3);
  let s = `<svg class="board" xmlns="${NS}" width="${(bd.x1 - bd.x0) * u + 2 * m}" height="${(bd.y1 - bd.y0) * u + 2 * m}">`
        + `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.cur{fill:var(--lit);stroke:var(--litline);stroke-width:2}.k.mt{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3}.k.unl{stroke:var(--warn);stroke-width:2.5}`
        + `.t{font:${fs}px Arimo,Arial;fill:var(--text);text-anchor:middle;pointer-events:none}.t.h{font-size:${Math.round(u * 0.2)}px;fill:var(--muted)}.t.lay{font-size:${Math.round(u * 0.2)}px;fill:var(--litline);text-anchor:end}`
        + `.ln{stroke:var(--muted);stroke-width:1.2;fill:none;opacity:.8}.ln.on{stroke:var(--link);stroke-width:2;opacity:1}`
        + `.pill rect{fill:var(--control);stroke:var(--muted)}.pill text{font:${Math.round(u * 0.24)}px Arimo,Arial;fill:var(--text);text-anchor:middle}.pill.on rect{fill:var(--accent);stroke:var(--accent)}.pill.on text{fill:var(--accent-text)}.pill.bad rect{stroke:var(--warn);stroke-width:1.5}</style>`
        + `<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  const gap = Math.max(1, u * 0.06), pick = state.from === 'Board and picker';
  keys.forEach((k, idx) => {
    const layer = lit.get(k);
    const cls = 'k' + (layer !== undefined ? ' cur' : '') + (mtLit.has(k) ? ' mt' : '') + (setup.locked && unlock.includes(k) ? ' unl' : '') + (pick ? ' pick' : '');
    const [ox, oy] = P([k.rx, k.ry]);
    s += `<g${k.r ? ` transform="rotate(${k.r} ${ox} ${oy})"` : ''} data-kidx="${idx}">`;
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, hh = k.h * u - 2 * gap;
    const tip = `<title>${sends[idx][0]}${sends[idx][1] ? ' · layer 1: ' + sends[idx][1] : ''}</title>`;
    s += `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2)
      s += `<rect class="${cls}" x="${(k.x + k.x2 - bd.x0) * u + gap}" y="${(k.y + k.y2 - bd.y0) * u + gap}" width="${k.w2 * u - 2 * gap}" height="${k.h2 * u - 2 * gap}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    const kc = layer ? sends[idx][1] : sends[idx][0], kk = K[kc] || { m: '', h: '' };
    if (kk.h) s += `<text class="t h" x="${x + w / 2}" y="${y + u * 0.26}">${kk.h}</text>`;
    s += `<text class="t" x="${x + w / 2}" y="${y + hh / 2 + fs * 0.35 + (kk.h ? u * 0.08 : 0)}">${kk.m.replace('&', '&amp;').replace('<', '&lt;')}</text>`;
    if (layer) s += `<text class="t lay" x="${x + w - u * 0.08}" y="${y + u * 0.24}">L${layer}</text>`;
    s += `</g>`;
  });
  // The links: from each input key to a small key between them that says what the combo sends.
  const drawn = new Map();
  const linkOf = (c, i, on) => {
    const e = effective(c);
    if (!e.length) return '';
    const pts = [];
    for (const kc of e) { const at = locate(kc); if (at) pts.push(P(centreOf(at.keys[0]))); }
    if (!pts.length) return '';
    let cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    if (pts.length === 1) cy += u * 0.42;   // a key alone: under it, not over its legend
    const keyAt = Math.round(cx / 4) + ',' + Math.round(cy / 4), seen = drawn.get(keyAt) || 0;
    drawn.set(keyAt, seen + 1);
    cy += seen * u * 0.42;
    const text = outName(c.out) || '—', pw = Math.max(u * 0.55, text.length * u * 0.15 + u * 0.22), ph = u * 0.36;
    let g = '';
    if (pts.length > 1 || seen) for (const p of pts) g += `<line class="ln${on ? ' on' : ''}" x1="${p[0]}" y1="${p[1]}" x2="${cx}" y2="${cy}"/>`;
    return { lines: g, pill: `<g class="pill${on ? ' on' : ''}${hasWarning(i) ? ' bad' : ''}" data-cb="${i}"><title>${refOf(i).startsWith('C ') ? 'C ' + i + ': ' : ''}${e.map(legend).join(' + ')} → ${outName(c.out) || 'nothing'}</title><rect x="${cx - pw / 2}" y="${cy - ph / 2}" width="${pw}" height="${ph}" rx="${ph / 2}"/><text x="${cx}" y="${cy + u * 0.085}">${text.replace('&', '&amp;').replace('<', '&lt;')}</text></g>` };
  };
  const parts = [];
  if (state.show === 'Every combo') state.combos.forEach((c, i) => { if (i !== state.cb) parts.push(linkOf(c, i, false)); });
  parts.push(linkOf(cur(), state.cb, true));
  const ok = parts.filter(Boolean);
  s += ok.map(p => p.lines).join('') + ok.map(p => p.pill).join('');
  return s + `</g></svg>`;
}

function stripHtml() {
  if (state.slots === 'List in the panel') return '';
  let b;
  if (state.slots === 'Strip, numbered')
    b = state.combos.map((c, i) => `<button class="${i === state.cb ? 'on' : ''}${isEmpty(c) ? ' empty' : ''}" data-cb="${i}" title="${isEmpty(c) ? 'Empty' : effective(c).map(legend).join(' + ') + ' → ' + (outName(c.out) || 'nothing')}">C ${i}${dirty(i) ? '<span class="dot"></span>' : ''}</button>`).join('');
  else {
    const free = state.combos.filter(isEmpty).length;
    b = state.combos.map((c, i) => ({ c, i })).filter(x => !isEmpty(x.c) || x.i === state.cb)
      .map(({ c, i }) => `<button class="named${i === state.cb ? ' on' : ''}" data-cb="${i}" title="Slot ${i} -- sends ${outName(c.out) || 'nothing'}">${isEmpty(c) ? 'New' : effective(c).map(legend).join('+') || '?'}${hasWarning(i) ? '<span class="bang">!</span>' : ''}${dirty(i) ? '<span class="dot"></span>' : ''}</button>`).join('')
      + `<button class="named" data-act="new" title="${free} of ${state.combos.length} slots free">+ New</button>`;
  }
  return `<div class="stripwrap"><button class="sarrow" data-scroll="-1" title="Earlier">◀</button>`
       + `<div class="strip" id="strip">${b}</div><span class="fade l"></span><span class="fade r"></span>`
       + `<button class="sarrow" data-scroll="1" title="Later">▶</button></div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  buildBoard();
  const setup = setupOf();
  document.getElementById('frame').innerHTML =
    `<div class="menubar"><span class="board">${BOARD.b.name} ▾</span><span class="muted">Vial</span>${setup.locked ? '<span class="lock">🔒 Locked</span>' : ''}<span class="right">Settings</span></div>`
  + `<div class="body"><div class="col"><div class="entry">Keymap</div><div class="entry">Layout</div><div class="entry">Macros</div><div class="entry">Tap Dance</div><div class="entry on">Combos</div><div class="entry">Key Overrides</div>${setup.qmkSettings ? '<div class="entry">QMK Settings</div>' : ''}</div>`
  + `<div class="main">${stripHtml()}<div class="boardarea">${boardSvg()}</div><div class="panel">${renderPanel()}</div></div></div>`;
  if (document.getElementById('strip')) placeStrip();
}

// The strip is one row and scrolls sideways when its slots do not fit, as every strip in Nazg.
function placeStrip() {
  const s = document.getElementById('strip');
  s.style.scrollBehavior = 'auto';
  s.scrollLeft = state.stripScroll;
  const on = s.querySelector('button.on');
  if (on) {
    const l = on.offsetLeft - s.offsetLeft, r = l + on.offsetWidth;
    if (l < s.scrollLeft) s.scrollLeft = l - 30;
    else if (r > s.scrollLeft + s.clientWidth) s.scrollLeft = r - s.clientWidth + 30;
  }
  s.style.scrollBehavior = '';
  s.onscroll = stripEdges;
  s.onwheel = e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && s.scrollWidth > s.clientWidth) { e.preventDefault(); s.scrollLeft += e.deltaY; } };
  stripEdges();
}
function stripEdges() {
  const s = document.getElementById('strip'), w = s.parentElement;
  state.stripScroll = s.scrollLeft;
  const more = s.scrollWidth > s.clientWidth + 1;
  w.querySelector('.fade.l').classList.toggle('on', more && s.scrollLeft > 1);
  w.querySelector('.fade.r').classList.toggle('on', more && s.scrollLeft < s.scrollWidth - s.clientWidth - 1);
  w.querySelectorAll('[data-scroll]').forEach(b => {
    b.style.display = more ? '' : 'none';
    b.disabled = !more || (+b.dataset.scroll < 0 ? s.scrollLeft <= 1 : s.scrollLeft >= s.scrollWidth - s.clientWidth - 1);
  });
}

function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['setup', 'Board', Object.keys(SETUPS)],
   ['slots', 'Slots', ['Strip, numbered', 'Strip, by their keys', 'List in the panel']],
   ['show', 'The board shows', ['The selected combo', 'Every combo']],
   ['from', 'Inputs from', ['Board and picker', 'Picker only']],
   ['termAt', 'Combo term', ['In the panel', 'In QMK Settings only']],
   ['roll', 'Typing-roll warning', ['Shown', 'Hidden']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => { const was = state.setup; state[k] = v; if (k === 'setup' && was !== v) reset(); state.msg = null; render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

// ---------------------------------------------------------------------------------------------
// Editing. An input or the output is selected; a picked key sets it. A click on a board key adds
// what it sends to the inputs, or takes it out when it is in already.
function compact(c) { const e = c.ins.filter(Boolean); c.ins = [...e, null, null, null, null].slice(0, 4); }
function changed() { state.msg = null; }
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-scroll],[data-cb],[data-sel],[data-key],[data-tab],[data-act],[data-fix],[data-kidx]');
  if (!t) return;
  const d = t.dataset, c = cur();
  if (d.scroll !== undefined) { const s = document.getElementById('strip'); s.scrollLeft += +d.scroll * (s.clientWidth - 60); return; }
  if (d.cb !== undefined) { state.cb = +d.cb; state.sel = isEmpty(cur()) ? 'in0' : 'out'; state.msg = null; }
  else if (d.sel !== undefined) state.sel = d.sel;
  else if (d.tab !== undefined) state.tab = d.tab;
  else if (d.kidx !== undefined) {
    if (state.from !== 'Board and picker') return;
    const kc = BOARD.sends[+d.kidx][0];
    if (!kc || kc === 'KC_NO') return;
    const at = c.ins.indexOf(kc);
    if (at >= 0) { c.ins[at] = null; compact(c); }
    else if (c.ins.filter(Boolean).length < 4) { compact(c); c.ins[c.ins.indexOf(null)] = kc; }
    else { state.msg = ['warn', 'A combo takes four keys at most']; render(); return; }
    const free = c.ins.indexOf(null);
    state.sel = c.out ? 'out' : (effective(c).length >= 2 ? 'out' : (free >= 0 ? 'in' + free : 'out'));
    changed();
  }
  else if (d.key !== undefined) {
    if (locked() && d.key === 'QK_BOOT' && state.sel === 'out') return;
    if (state.sel === 'out') c.out = O(d.key, ...(c.out ? c.out.mods : []));
    else {
      const i = +state.sel.slice(2);
      if (c.ins.includes(d.key) && c.ins[i] !== d.key) { state.msg = ['warn', `${legend(d.key)} is in this combo already`]; render(); return; }
      c.ins[i] = d.key; compact(c);
      const free = c.ins.indexOf(null);
      state.sel = effective(c).length < 2 && free >= 0 ? 'in' + free : (c.out ? 'in' + c.ins.indexOf(d.key) : 'out');
    }
    changed();
  }
  else if (d.fix !== undefined) {
    if (d.fix === 'gap') compact(c);
    else if (d.fix.startsWith('mt:')) { const kc = d.fix.slice(3); c.ins[c.ins.indexOf(kc)] = modTapOf(kc); }
    changed();
  }
  else if (d.act === 'remove') { c.ins[+state.sel.slice(2)] = null; compact(c); state.sel = 'out'; changed(); }
  else if (d.act === 'empty') { c.out = null; changed(); }
  else if (d.act === 'clear') { c.ins = [null, null, null, null]; c.out = null; state.sel = 'in0'; changed(); }
  else if (d.act === 'new') { const i = state.combos.findIndex(isEmpty); if (i < 0) { state.msg = ['warn', 'Every slot is in use']; } else { state.cb = i; state.sel = 'in0'; } }
  else if (d.act === 'save') { state.saved = JSON.stringify(state.combos); state.msg = ['ok', 'Stored -- every changed combo, read back the same']; }
  else if (d.act === 'revert') { state.combos = savedList(); state.msg = null; }
  render();
});
frame.addEventListener('change', e => {
  if (e.target.dataset.term !== undefined) { state.term = Math.min(10000, Math.max(0, parseInt(e.target.value) || 0)); render(); }
  if (e.target.dataset.mods !== undefined) { const v = e.target.value; cur().out.mods = v === 'None' ? [] : [v]; changed(); render(); }
});

document.getElementById('notes').innerHTML = `
<p><b>What a combo is.</b> Up to four keys pressed together send another key instead of themselves -- J and K for Esc.
The inputs are <b>keycodes</b>, matched against what the keys send on the active layer, in any order, each within the
<b>combo term</b> of the last (50 ms by default). Every key in a combo pays for it: typed alone, it waits up to the term
before being sent. Held, the output stays held while the keys are. Vial only -- VIA has none -- 4 to 32 slots by
EEPROM, up to 69 when a keymap says so. The facts, from QMK's process_combo.c, are in ui-design.md.</p>
<p><b>No key names a combo slot</b>, unlike a macro (M3) or a tap dance (TD 3): the slot number means nothing to the
user. Hence <b>Slots</b>: <b>numbered in the strip</b> as Tap Dance (C 0..C 31, an empty one outlined); <b>named by their
keys in the strip</b>, the empty slots folded into one "+ New" -- the output on hover; or <b>a list in the panel</b>, each
row the whole combo, and no strip. A "!" marks a combo with a warning.</p>
<p><b>The board shows</b> where the inputs are, since a keycode alone does not say: <b>the selected combo</b> -- its keys lit
and linked to a small key saying what it sends, nothing else marked (an amber dot on every other key in a combo read as a warning: dropped) -- or <b>every combo</b> as
such a small key between its inputs, keymap-drawer's way (the drawings split-keyboard users share), the selected one in
blue; a click on one selects it. An input found on layer 1 only is lit with its layer-1 legend and "L1" (the Corne's
arrows, C 7). An input no key sends, where a home-row key sends it inside a mod-tap, outlines that key dashed (the
Corne's A, C 6).</p>
<p><b>Inputs from</b>: <b>the board and the picker</b> -- a click on a key adds what it sends (layer 0), a second click
takes it out, the picker for anything else; or <b>the picker only</b>, Vial's way.</p>
<p><b>What is said</b>, under the chord, is what Vial never says: what the combo does and costs, then what is wrong --
an input no key sends (and the mod-tap that does, with a button to use it), an input after an empty one, which the
firmware never reaches (C 8, as Vial lets it be stored; with a button to close the gap), one key alone, no output,
two combos with the same keys (C 0 and C 12: the later slot wins), one combo inside another (C 0 inside C 2: the longer
wins). <b>Typing-roll warning</b>, provisional: two letters often typed one after the other (E and R, C 4) fire the
combo on fast typing -- English pairs only here, and which language is the question.</p>
<p><b>Combo term</b>: one for all combos, QMK Settings' "Time out period for combos". <b>In the panel</b> beside the chord,
also in QMK Settings; or <b>in QMK Settings only</b>, the sentence naming it. A board without QMK Settings (the Corne
here) has a term no app can read: said, not shown as a number.</p>
<p><b>Writing</b>: Save / Revert, as Macros and Tap Dance (not a variant here). <b>Locked</b>: Vial's firewall applies to
the output only, so Boot is greyed there and not as an input.</p>`;

render();
</script>
</body>
