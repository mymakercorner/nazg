     alt repeat keys and QMK settings, keycodes as names, the Vial UID to say which keyboard.

     - loading shows what changes first, then one Apply -- not written at once as Vial does;
     - a file from another keyboard (another Vial UID) is ASKED about, as Vial does, then loaded if

     in a popup; what happens once it is written.

// KLE, as in the other section mockups.
function parseKle(rows) {
  const keys = [];
  let x = 0, y = 0, rx = 0, ry = 0, r = 0, p = {};
  const pair = s => { const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  for (const row of rows) {
    if (!Array.isArray(row)) continue;
    for (const item of row) {
      if (typeof item === 'object') {
        if ('r' in item) r = item.r;
        if ('rx' in item || 'ry' in item) { if ('rx' in item) rx = item.rx; if ('ry' in item) ry = item.ry; x = rx; y = ry; }
        if ('x' in item) x += item.x;
        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];
        continue;
      }
      const w = p.w || 1, h = p.h || 1;
      const labels = String(item).split('\n');
      const cell = pair(labels[0]), option = pair(labels[3]);
      if (cell || p.d)
        keys.push({ x, y, w, h, x2: p.x2 || 0, y2: p.y2 || 0, w2: p.w2 || w, h2: p.h2 || h, decal: !!p.d,
                    cell, g: option ? option[0] : -1, o: option ? option[1] : 0 });
      x += w;
      p = {};
    }
    y += 1;
    x = rx;
  }
  return keys;
}

  for (const k of keys)
    for (const [x, y, w, h] of [[k.x, k.y, k.w, k.h], [k.x + k.x2, k.y + k.y2, k.w2, k.h2]]) {
      b.x0 = Math.min(b.x0, x); b.y0 = Math.min(b.y0, y); b.x1 = Math.max(b.x1, x + w); b.y1 = Math.max(b.y1, y + h);

  return b;
}

// The file, as made-up differences from what the board holds: keys by their layer-0 keycode.
const FILE_KEYS = [
  { layer: 0, at: 'KC_CAPS', to: 'LCTL_T(KC_ESC)' },
  { layer: 0, at: 'KC_SCRL', to: 'M0' },
  { layer: 0, at: 'KC_PAUS', to: 'TD(0)' },
  { layer: 1, at: 'KC_I', to: 'KC_UP' },   { layer: 1, at: 'KC_J', to: 'KC_LEFT' },
  { layer: 1, at: 'KC_K', to: 'KC_DOWN' }, { layer: 1, at: 'KC_L', to: 'KC_RGHT' },
  { layer: 1, at: 'KC_U', to: 'KC_HOME' }, { layer: 1, at: 'KC_O', to: 'KC_END' },
];
// What Nazg cannot read in a file saved on older firmware: one key on layer 1.
const UNREADABLE = { layer: 1, at: 'KC_H', raw: '0x5F40' };

const FILES = {
  'This keyboard': { name: 'Model F Labs B104.vil', other: false, shape: true, old: false },
  'Another keyboard, same matrix': { name: 'B104 ISO build.vil', other: true, shape: true, old: false },
  'Another keyboard, other matrix': { name: 'Model F Labs F77.vil', other: true, shape: false, old: false },
  'Saved on older firmware': { name: 'B104 2023.vil', other: false, shape: true, old: true },
};
const NAMES = {
  'Save to file… / Load from file…': ['Save to file…', 'Load from file…', 'Load'],
  'Export… / Import…': ['Export…', 'Import…', 'Import'],
  'Back up… / Restore…': ['Back up…', 'Restore…', 'Restore'],
};
const STEPS = ['Board menu', 'Asked: another keyboard', 'Review', 'Writing', 'Written', 'Saved'];
const state = { step: 'Review', file: 'This keyboard', names: Object.keys(NAMES)[0], where: 'In place of the board',
  after: 'Said, then Back to the board', lock: 'Unlocked', theme: 'Light', layer: 0, hover: null };
const fileOf = () => FILES[state.file];
const verb = () => NAMES[state.names][2];

// ---------------------------------------------------------------------------------------------
// What the board holds, and what it would hold with the file.
const baseOf = k => (SENDS[k.cell.join(',')] || ['KC_NO'])[0];
function nowAt(k, layer) { return (SENDS[k.cell.join(',')] || [])[layer] || 'KC_NO'; }
function fileAt(k, layer) {
  const f = fileOf();
  if (f.old && layer === UNREADABLE.layer && baseOf(k) === UNREADABLE.at) return UNREADABLE.raw;
  if (!f.shape) return nowAt(k, layer);
  const c = FILE_KEYS.find(c => c.layer === layer && c.at === baseOf(k));
  return c ? c.to : nowAt(k, layer);
}
const loaded = () => state.step === 'Written' || state.step === 'Saved';

// The review's lines: what each part of the file changes. `keys`: what the line lights on the board.
function reviewLines() {
  const f = fileOf(), L = [];
  if (f.shape) {
    const per = [0, 1, 2].map(l => FILE_KEYS.filter(k => k.layer === l).length);
    L.push({ id: 'keymap', lab: 'Keymap', val: `<span class="n">${FILE_KEYS.length} keys</span> -- ${per.map((n, l) => n ? `${n} on layer ${l}` : '').filter(Boolean).join(', ')}`
      + (state.where === 'In a popup' ? `: ${FILE_KEYS.map(c => `${words(c.at)} → ${words(c.to)}`).join(', ')}` : ', lit on the board') });
    L.push({ id: 'layout', lab: 'Layout', val: `<span class="n">Split Backspace</span> on -- off now` });
  } else {
    L.push({ id: 'keymap', lab: 'Keymap', warn: true, val: `<span style="color:var(--warn)">not loaded</span> -- the file's keymap has 8 × 16 cells, this keyboard's 8 × 18: its keys would land on other keys` });
    L.push({ id: 'layout', lab: 'Layout', warn: true, val: `<span style="color:var(--warn)">not loaded</span> -- its options are another keyboard's` });
  }
  L.push({ id: 'macros', lab: 'Macros', val: `<span class="n">2 of 16</span> -- M0 changed, M1 new`, keys: /^M[01]$/ });
  L.push({ id: 'td', lab: 'Tap Dance', val: `<span class="n">1 of 16</span> -- TD0 new`, keys: /^TD\(0\)$/ });
  L.push({ id: 'combos', lab: 'Combos', val: 'the same', same: true });
  L.push({ id: 'ko', lab: 'Key Overrides', val: 'the same', same: true });
  L.push({ id: 'arep', lab: 'Alt Repeat Key', val: 'none in the file', same: true });
  L.push({ id: 'qmk', lab: 'QMK Settings', val: `<span class="n">2</span> -- Tapping Term 200 → 180 ms, Permissive Hold on` });
  return L;
}
const changeCount = () => (fileOf().shape ? FILE_KEYS.length + 1 : 0) + 2 + 1 + 2;

function reviewSays() {
  const f = fileOf(), out = [];
  if (f.other) out.push(`<span class="w">Saved from another keyboard</span> -- loaded as you asked; what does not fit this one is left out.`);
  if (f.old) {
    out.push(`Saved on a firmware older than QMK's keycode renumbering (Vial 5): read with that firmware's keycodes.`);
    out.push(`<span class="w">1 key Nazg cannot read</span> -- layer 1, where H is on layer 0, holds <code>${UNREADABLE.raw}</code> in the file: it stays as the board has it.`);
  }
  if (state.lock === 'Locked') out.push(`<span class="w">Macros, Tap Dance and QMK Settings need the keyboard unlocked</span> -- Apply asks you to hold its unlock keys first; the keymap does not need it.`);
  if (state.step !== 'Written') out.push(`Nothing is written before Apply, and only what differs is. Lighting, Audio and the board's own menus are not in a .vil file.`);
  return out.map(s => `<div>${s}</div>`).join('');
}

// ---------------------------------------------------------------------------------------------
// The board: what it holds, or -- in the review -- what it would hold, the changed keys lit.
function boardSvg(review, avail) {
  const bd = boundsOf(KEYS), layer = state.layer;
  const u = Math.min(46, Math.floor(avail / (bd.x1 - bd.x0 + 0.7))), m = u * 0.35;
  const W = (bd.x1 - bd.x0) * u + 2 * m, H = (bd.y1 - bd.y0) * u + 2 * m;
  const fs = Math.round(u * 0.28), hs = Math.round(u * 0.2), gap = Math.max(1, u * 0.06);
  const line = state.hover && reviewLines().find(l => l.id === state.hover);
  let s = `<svg class="board" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}`
    + `.k.li{fill:var(--chgface);stroke:var(--chg);stroke-width:2}.k.bad{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3}`
    + `.t{font:${fs}px Arimo,Arial;fill:var(--text);text-anchor:middle;pointer-events:none}.t.h{font-size:${hs}px;fill:var(--muted)}`
    + `.t.hb{font-size:${hs}px;fill:var(--behav)}.t.hf{font-size:${hs}px;fill:var(--fw)}.t.dim{opacity:.4}</style>`;
  s += `<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  for (const k of KEYS) {
    const now = nowAt(k, layer), then = fileAt(k, layer);
    const kc = review || loaded() ? then : now;
    const changed = review && then !== now && !/^0x/.test(then);
    const lit = line ? !!(line.keys && line.keys.test(kc)) || (line.id === 'keymap' && changed) : changed;
    const bad = review && /^0x/.test(then);
    const lg = legendOf(kc);
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, hh = k.h * u - 2 * gap;
    const tip = review && (changed || bad) ? `<title>${bad ? `${then} in the file: Nazg cannot read it, so it stays ${words(now)}` : `now ${words(now)} · from the file ${words(then)}`}</title>` : `<title>${kc}</title>`;
    const cls = 'k' + (lit ? ' li' : '') + (bad ? ' bad' : '');
    const rect = (rx, ry, rw, rh) => `<rect class="${cls}" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    s += rect(x, y, w, hh);
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2) s += rect((k.x + k.x2 - bd.x0) * u + gap, (k.y + k.y2 - bd.y0) * u + gap, k.w2 * u - 2 * gap, k.h2 * u - 2 * gap);
    const dim = review && !lit && !bad ? ' dim' : '';
    if (lg.h) s += `<text class="t ${lg.cls}${dim}" x="${x + w / 2}" y="${y + u * 0.27}">${lg.h}</text>`;
    s += `<text class="t${dim}" x="${x + w / 2}" y="${y + hh / 2 + fs * 0.35 + (lg.h ? u * 0.08 : 0)}">${String(lg.m).replace('&', '&amp;').replace('<', '&lt;')}</text>`;
  }
  return s + `</g></svg>`;
}
function stripHtml(review) {
  return `<div class="strip">` + [0, 1, 2].map(l => {
    const n = review && fileOf().shape ? FILE_KEYS.filter(c => c.layer === l).length : 0;
    return `<span class="tab${state.layer === l ? ' on' : ''}" data-layer="${l}">Layer ${l}${n ? `<span class="n">${n}</span>` : ''}</span>`;
  }).join('') + `</div>`;
}

// ---------------------------------------------------------------------------------------------
function menubarHtml() {
  const open = state.step === 'Board menu';
  let note = '';
  if (state.step === 'Saved') note = `<span class="note">Saved to Model F Labs B104.vil</span>`;
  if (state.step === 'Written' && state.after === 'Back to the board at once')
    note = `<span class="note">${verb() === 'Load' ? 'Loaded' : verb() === 'Import' ? 'Imported' : 'Restored'} ${fileOf().name} -- ${changeCount()} changes</span>`;
  const lock = state.lock === 'Locked' ? '<span class="muted">Locked</span>' : '';
  let html = `<div class="menubar"><span class="board${open ? ' open' : ''}">Model F Labs B104 ▾</span><span class="muted">Vial 6</span>${lock}`
    + `<span class="right">${note}<span>Settings</span></span></div>`;
  if (open) {
    const [save, load] = NAMES[state.names];
    html += `<div class="menu"><div class="it">Switch to<span class="sub">Aquanaut · VIA ▸</span></div><div class="sep"></div>`
      + `<div class="it">${save}</div><div class="it hl">${load}</div><div class="sep"></div><div class="it">All keyboards</div></div>`;
  }
  return html;
}
function boardScreenHtml() {
  const col = `<div class="col"><div class="hdr">Vial</div>`
    + ['Keymap', 'Layout', 'Macros', 'Tap Dance', 'Combos', 'Key Overrides', 'Alt Repeat Key', 'QMK Settings']
        .map((e, i) => `<div class="entry${i ? '' : ' on'}">${e}</div>`).join('')
    + `<div class="sep"></div><div class="hdr">Tools</div><div class="entry">Diagnostics</div></div>`;
  return `<div class="body">${col}<div class="main">${stripHtml(false)}<div class="boardarea">${boardSvg(false, 1160 - 180 - 60)}</div>`
    + `<div class="panel"><div class="head"><span class="muted">Click a key to change what it sends.</span></div></div></div></div>`;
}
function linesHtml() {
  return `<div class="lines">` + reviewLines().map(l =>
    `<div class="row${state.hover === l.id ? ' hov' : ''}" data-hover="${l.keys || l.id === 'keymap' ? l.id : ''}">`
    + `<div class="lab${l.same ? ' same' : ''}">${l.lab}</div><div class="val${l.same ? ' same' : ''}">${l.val}</div></div>`).join('') + `</div>`;
}
function reviewHead(inDialog) {
  const f = fileOf(), name = `<span class="title">${verb()} ${f.name}</span><span class="desc">saved 2026-10-12 · Vial ${f.old ? 5 : 6}</span>`;
  let right;
  if (state.step === 'Writing') right = `<span class="muted">Writing 9 of ${changeCount() + 4}…</span><div class="bar"><i style="width:55%"></i></div><button disabled>Cancel</button>`;
  else if (state.step === 'Written') right = `<span class="ok">Written and read back -- ${changeCount()} changes</span><button class="primary">Back to the board</button>`;
  else right = `<button>Cancel</button><button class="primary">${state.lock === 'Locked' ? 'Unlock and apply' : 'Apply'}</button>`;
  return inDialog ? { name, right } : `<div class="head">${name}<span class="right">${right}</span></div>`;
}
function reviewInPlaceHtml() {
  return `<div class="body"><div class="main">${fileOf().shape ? stripHtml(true) : ''}<div class="boardarea">${boardSvg(true, 1160 - 60)}</div>`
    + `<div class="panel">${reviewHead(false)}${linesHtml()}<div class="says">${reviewSays()}</div></div></div></div>`;
}
function reviewDialogHtml() {
  const h = reviewHead(true);
  return `<div class="shade"><div class="dialog wide"><div class="dt">${h.name}</div>${linesHtml()}<div class="says">${reviewSays()}</div>`
    + `<div class="df">${h.right}</div></div></div>`;
}
function askHtml() {
  const f = fileOf();
  return `<div class="shade"><div class="dialog"><div class="dt">Another keyboard's file</div><div class="db">`
    + `<b>${f.name}</b> was saved from another keyboard: its Vial ID is <code>0x9c2e41b07d3a5f18</code>, this one's <code>0x51d2a08c3e6b9f47</code>. `
    + `The ID names a keyboard model, so this is most likely a different model.<br><br>`
    + `<span class="muted">Nothing is written yet: Nazg shows what would change, and leaves out what does not fit.</span></div>`
    + `<div class="df"><button>Cancel</button><button class="primary">${verb()} anyway</button></div></div></div>`;
}

function frameHtml() {
  const st = state.step;
  let html = menubarHtml();
  const popup = state.where === 'In a popup';
  const reviewing = st === 'Review' || st === 'Writing' || (st === 'Written' && state.after !== 'Back to the board at once');
  if (reviewing && !popup) return html + reviewInPlaceHtml();
  html += boardScreenHtml();
  if (reviewing && popup) html += reviewDialogHtml();
  if (st === 'Asked: another keyboard') html += askHtml();
  return html;
}

// ---------------------------------------------------------------------------------------------
const CONTROLS = [
  ['Step', 'step', STEPS],
  ['File', 'file', Object.keys(FILES)],
  ['Names', 'names', Object.keys(NAMES)],
  ['Review', 'where', ['In place of the board', 'In a popup']],
  ['Once written', 'after', ['Said, then Back to the board', 'Back to the board at once']],
  ['Board', 'lock', ['Unlocked', 'Locked']],
  ['Theme', 'theme', ['Light', 'Dark']],
];
function disabled(key, v) {
  if (key === 'step' && v === 'Asked: another keyboard') return !fileOf().other;
  return false;
}
function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  if (state.step === 'Asked: another keyboard' && !fileOf().other) state.step = 'Review';
  document.getElementById('controls').innerHTML = CONTROLS.map(([name, key, vals]) =>
    `<div class="group"><span class="name">${name}</span>` + vals.map(v =>
      `<button data-key="${key}" data-val="${v}"${state[key] === v ? ' class="on"' : ''}${disabled(key, v) ? ' disabled' : ''}>${v}</button>`).join('') + `</div>`).join('');
  document.getElementById('frame').innerHTML = frameHtml();
  document.getElementById('notes').innerHTML = NOTES;
}
document.getElementById('controls').addEventListener('click', e => {
  const b = e.target.closest('button[data-key]');
  if (!b || b.disabled) return;
  state[b.dataset.key] = b.dataset.val;
  if (b.dataset.key === 'file' && FILES[b.dataset.val].other && state.step === 'Board menu') state.step = 'Asked: another keyboard';
  render();
});
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-layer]');
  if (t) { state.layer = +t.dataset.layer; render(); }
});
frame.addEventListener('mouseover', e => {
  const r = e.target.closest('[data-hover]');
  const hover = r && r.dataset.hover ? r.dataset.hover : null;
  if (hover !== state.hover) { state.hover = hover; frame.innerHTML = frameHtml(); }
});

const NOTES = `
<p><b>Where.</b> Two items in the board menu, under <i>Switch to</i>, on every board -- VIA's and Vial's. They add nothing to the
first glance: the menu is already there. Vial calls them <i>Save current layout…</i> and <i>Load saved layout…</i>, but in Nazg
"layout" is the Layout section's options, so the names are among the variants.</p>
<p><b>Saving</b> reads what the board holds that a .vil keeps -- the sections it has not opened yet included, about a second on the
Model F -- asks where to save it (the system's dialog, named after the board: <i>Model F Labs B104.vil</i>), and says it is done in the
header. Nazg writes Vial's own spellings (<code>M0</code>, <code>LT1(KC_A)</code>, <code>USER00</code>), and a raw value only
where Vial has no name, so Vial loads Nazg's files as its own (vil-files.md).</p>
<p><b>Loading</b> picks a file, reads the board, and shows what would change before writing anything (Rico, 2026-10-18). In place of
the board screen, the board draws what it would hold, the changed keys lit, the strip counting them per layer; a line of the panel
under the pointer lights the keys it concerns (Macros: the M0 key). The popup keeps the board screen behind and says the keys in
words. What is the same is faint; Apply writes only what differs, each value read back, as the sections do. A write that fails
half way leaves what was written, and the review says what was not.</p>
<p><b>Another keyboard's file</b> -- another Vial ID -- is asked about first, as Vial does (Rico, 2026-10-18); "Load anyway" goes on
to the review. What does not fit is left out and said: a keymap of another matrix size (Vial would put its keys on other keys),
slots past the board's count, layers past its layers. A key Nazg cannot read stays as the board has it, outlined.</p>
<p><b>Older firmware.</b> vial-gui replays a raw value as the new board's, wrong across QMK's renumbering. Nazg reads the file's
raw values with the keycodes of the firmware that saved it (its <code>vial_protocol</code>), so a file from before 2023 loads right.</p>
<p><b>VIA boards.</b> A VIA board's file says <code>uid: -1</code>, so Nazg adds the board's VID:PID to its files -- Vial ignores
keys it does not know -- and asks about a VIA file from another board the same way (Rico, 2026-10-18). The lock: Apply on a locked
Vial board asks for its unlock keys first (the unlock itself is still untested on hardware).</p>`;
render();
</script>
</body>
</html>
