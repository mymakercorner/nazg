<!-- Mockup of the keycode picker -- the Keymap section's panel -- on a 60% board. Open it in a
     browser. Keycaps are drawn as the board draws them (ui-design.md, "The board's look"), with
     what ImGui can draw: rounded rectangles, lines and text. The design is settled (2026-10-04); the
     controls switch the theme, the after-a-pick setting and the board the mockup stands for. Arimo
     comes from Google Fonts, so it needs a network connection. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycode picker mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Noto+Sans+Math&family=Noto+Sans+Symbols+2&display=swap">
<style>
:root{--window:#f3f3f5;--menubar:#e3e4e9;--text:#1d1e22;--muted:#6b6e78;--control:#ffffff;--border:#c8cad2;--ui-accent:#3b82f6;--ui-accent-text:#fff;--panel:#f8f8fa;--warning:#e8590c;--success:#2f9e44;--error:#e03131}
*{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.menubar{display:flex;gap:18px;align-items:center;background:var(--menubar);padding:5px 16px}
.menubar .right{margin-left:auto;color:var(--muted)}
.menubar .proto{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.controls .break{flex-basis:100%;height:0}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.group .name{color:var(--muted);margin-right:4px}
button{font:inherit;padding:3px 10px;border-radius:4px;border:1px solid var(--border);background:var(--control);color:var(--text);cursor:pointer}
button.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-accent-text)}
button:disabled{opacity:.45;cursor:default}
.app{padding:4px 16px 0;display:flex;flex-direction:column}
.strip{display:flex;align-items:center;gap:4px;margin:4px 0 6px;flex:none;min-height:30px;flex-wrap:wrap}
.strip .label{color:var(--muted);margin-right:6px}
.strip button{min-width:34px}
.plate{position:relative;margin:0 auto;border-radius:14px}
.boardarea{display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.splitter{height:12px;flex:none;cursor:row-resize;display:flex;align-items:center;justify-content:center}
.splitter::after{content:'';width:56px;height:4px;border-radius:2px;background:var(--border)}
.splitter:hover::after,.splitter.drag::after{background:var(--ui-accent)}
.keyline{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--border);min-height:41px;flex:none}
.keyline .where{color:var(--muted)}
.keyline input.expr{width:320px;font:13px Consolas,"Cascadia Mono",monospace;padding:4px 7px;border:1px solid var(--border);border-radius:4px;background:var(--control);color:var(--text)}
.keyline input.expr.bad{border-color:var(--error)}
.keyline .msg{font-size:12px}
.keyline .name{color:var(--muted)}
.keyline .seg{display:inline-flex;gap:3px;align-items:center}
.keyline button{min-width:0;padding:2px 8px}
.popup{position:absolute;z-index:8;background:var(--control);border:1px solid var(--border);border-radius:6px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
.popup .prow{display:flex;gap:3px}
.key{position:absolute;overflow:hidden;cursor:pointer}
.t{position:absolute;white-space:nowrap;line-height:1;font-family:Arimo,"Noto Sans Math","Noto Sans Symbols 2",sans-serif}
.panel{display:flex;flex-direction:column;width:100%;margin:0 auto;border:1px solid var(--border);border-radius:6px;background:var(--panel);overflow:hidden;flex:none}
.tile{position:relative;border-radius:5px;overflow:hidden;cursor:pointer;flex:none}
.flow{display:grid;grid-auto-rows:40px;column-gap:4px;row-gap:6px;align-items:start}
.flow .glabel{font-size:12px;line-height:1.2;overflow:hidden;align-self:stretch;display:flex;align-items:center;border:1px solid var(--border);border-radius:5px;padding:0 8px;background:var(--label-fill);color:var(--label-text)}
.pick{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs .tab{border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;padding:5px 9px 4px;cursor:pointer;color:var(--muted);position:relative}
.tabs .tab.on{background:var(--window);border-color:var(--border);color:var(--text);margin-bottom:-1px}
.tabs .tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tabs input{margin-left:auto;margin-bottom:5px;flex:1 1 100px;width:0;min-width:100px;max-width:220px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--control);color:var(--text);font:inherit}
.items{flex:1;overflow-y:auto;padding:8px 12px 12px;background:var(--window)}
.items .info{color:var(--muted);font-size:12px;margin:2px 0 8px;line-height:1.4}
.notes{max-width:1000px;margin:0 auto;padding:14px 16px 30px;color:var(--muted);line-height:1.5}
.notes b{color:var(--text);font-weight:600}
.notes p{margin:0 0 8px}
.flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px var(--success);background:color-mix(in srgb,var(--success) 22%,transparent);animation:flash .9s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tip{position:fixed;pointer-events:none;background:var(--control);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:12px;white-space:pre;z-index:9;display:none;color:var(--text)}
</style>
</head>
<body>
<div class="menubar"><span>Mock 60 &#9662;</span><span class="proto">Vial 6</span><span class="right">Settings</span></div>
<div class="controls" id="controls"></div>
<div class="app" id="app">
  <div class="strip" id="strip"></div>
  <div class="boardarea" id="boardarea"><div class="plate" id="board"></div></div>
  <div class="splitter" id="splitter" title="Drag to share the height between the board and the picker"></div>
  <div class="panel" id="panel"></div>
</div>
<div class="notes" id="notes"></div>
<div class="tip" id="tip"></div>
<script>
'use strict';

// ---------------------------------------------------------------------------------------------
// Themes: the app's Light and Dark (src/ui/NazgPalette.cpp), board colours only.
const THEMES = {
  Light: {
    css: { window: '#f3f3f5', menubar: '#e3e4e9', text: '#1d1e22', muted: '#6b6e78', control: '#ffffff', border: '#c8cad2',
           'ui-accent': '#3b82f6', 'ui-accent-text': '#ffffff', panel: '#f8f8fa', warning: '#e8590c', success: '#2f9e44', error: '#e03131' },
    labelFill: '#d1d4da', labelText: '#2f3238', plate: '#d3d4d8', outline: '#b4b7c2', legend: '#24262b', hovered: 'rgba(0,0,0,0.08)', selected: '#1d1e22',
    alpha: '#ffffff', mod: '#e4e5ea', accent: '#afbfd5', accentLegend: '#18222f', preview: '#1c7ed6',
  },
  Dark: {
    css: { window: '#0f0f11', menubar: '#24252b', text: '#ececf1', muted: '#80838f', control: '#20232b', border: '#3a3d48',
           'ui-accent': '#4296fa', 'ui-accent-text': '#ffffff', panel: '#16171b', warning: '#ffb34d', success: '#78dc82', error: '#ff8b7f' },
    labelFill: '#1d1e25', labelText: '#9a9daa', plate: '#1c1d23', outline: '#4b4e5c', legend: '#ebebf0', hovered: 'rgba(255,255,255,0.13)', selected: '#ececf1',
    alpha: '#3a3c48', mod: '#2c2e38', accent: '#5a6a80', accentLegend: '#e8eff9', preview: '#71b6ff',
  },
};

// The category solver, as NazgPalette.cpp has it: a hue per category, its lightness walked from
// the face away from it to the first reaching the target contrast.
const HUES = { beh: 300, host: 200, board: 80, fw: 30 };
const s2l = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
const l2s = c => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
const hexLin = h => [1, 3, 5].map(i => s2l(parseInt(h.slice(i, i + 2), 16) / 255));
const lum = v => 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function oklchLin(L, C, h) {
  const r = h * Math.PI / 180, a = C * Math.cos(r), b = C * Math.sin(r);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3,
        s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
}
const okL = v => { const l = Math.cbrt(0.4122214708 * v[0] + 0.5363325363 * v[1] + 0.0514459929 * v[2]),
  m = Math.cbrt(0.2119034982 * v[0] + 0.6806995451 * v[1] + 0.1073969566 * v[2]),
  s = Math.cbrt(0.0883024619 * v[0] + 0.2817188376 * v[1] + 0.6299787005 * v[2]);
  return 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s; };
const inGamut = v => v.every(x => x >= 0 && x <= 1);
function clampChroma(L, C, h) {
  if (inGamut(oklchLin(L, C, h))) return oklchLin(L, C, h);
  let lo = 0, hi = C;
  for (let i = 0; i < 20; i++) { const mid = (lo + hi) / 2; if (inGamut(oklchLin(L, mid, h))) lo = mid; else hi = mid; }
  return oklchLin(L, lo, h);
}
const toHex = v => '#' + v.map(c => Math.round(255 * l2s(Math.min(Math.max(c, 0), 1))).toString(16).padStart(2, '0')).join('');
const inkCache = new Map();
function categoryInk(face, cat, use) {
  const target = cat === 'fw' ? (use === 'text' ? 7 : 4.5) : (use === 'text' ? 4.5 : 3);
  const key = face + cat + use;
  if (inkCache.has(key)) return inkCache.get(key);
  const f = hexLin(face), darker = lum(f) > 0.18, L0 = okL(f);
  let out = null;
  for (let step = 0; step <= 200; step++) {
    const L = darker ? 1 - step / 200 : step / 200;
    if (darker ? L > L0 : L < L0) continue;
    const c = toHex(clampChroma(L, 0.16, HUES[cat]));
    if (contrast(hexLin(c), f) >= target) { out = c; break; }
  }
  inkCache.set(key, out);
  return out;
}

// The standard keys in words: [full, short]. Modifiers name their side: in the picker no key has
// a side of the board.
const NAMED = {

  KC_SPC: ['Space'], KC_INS: ['Insert', 'Ins'], KC_DEL: ['Delete', 'Del'], KC_HOME: ['Home'], KC_END: ['End'],
  KC_PGUP: ['Page Up', 'Pg Up'], KC_PGDN: ['Page Down', 'Pg Dn'], KC_PSCR: ['Print Screen', 'PrtSc'],

  KC_LSFT: ['Left Shift', 'L Shift'], KC_RSFT: ['Right Shift', 'R Shift'], KC_LCTL: ['Left Control', 'L Ctrl'],

  KC_P8: ['8'], KC_P9: ['9'], KC_PDOT: ['.'], KC_PSLS: ['/'], KC_PAST: ['*'], KC_PMNS: ['−'], KC_PPLS: ['+'], KC_PENT: ['Enter'],
  KC_INT1: ['Int 1'], KC_INT2: ['Int 2'], KC_INT3: ['Int 3'], KC_INT4: ['Int 4'], KC_INT5: ['Int 5'],
  KC_PEQL: ['='], KC_PCMM: [','], KC_KP_EQUAL_AS400: ['='],
  // The keys HID has and few systems act on, as NazgKeycapLegend.cpp words them.
  KC_KB_POWER: ['Power'], KC_EXEC: ['Execute', 'Exec'], KC_SLCT: ['Select', 'Sel'], KC_KB_VOLUME_UP: ['Vol +'], KC_KB_VOLUME_DOWN: ['Vol −'],
  KC_KB_MUTE: ['Mute'], KC_LCAP: ['Lock Caps', 'L Caps'], KC_LNUM: ['Lock Num', 'L Num'], KC_LSCR: ['Lock Scroll', 'L Scr'],
  KC_ERAS: ['Alt Erase', 'Erase'], KC_SYRQ: ['SysRq'], KC_CNCL: ['Cancel', 'Cncl'], KC_CLR: ['Clear', 'Clr'], KC_RETN: ['Return', 'Ret'],
  KC_SEPR: ['Separator', 'Sep'], KC_CLAG: ['Clear Again', 'Clr Agn'], KC_CRSL: ['CrSel'], KC_EXSL: ['ExSel'], KC_PRIR: ['Prior'],
  KC_OUT: ['Out'], KC_OPER: ['Oper'], KC_HELP: ['Help'], KC_MENU: ['Menu'], KC_STOP: ['Stop'], KC_AGIN: ['Again'], KC_UNDO: ['Undo'],
  KC_CUT: ['Cut'], KC_COPY: ['Copy'], KC_PSTE: ['Paste'], KC_FIND: ['Find'],
};
for (let i = 1; i <= 9; i++) { NAMED['KC_INT' + i] = ['Int ' + i]; NAMED['KC_LNG' + i] = ['Lang ' + i]; }
for (let i = 1; i <= 24; i++) NAMED['KC_F' + i] = ['F' + i];
const ARROWS = { KC_UP: '↑', KC_DOWN: '↓', KC_LEFT: '←', KC_RGHT: '→' };
const LABELS = { KC_ESC: 'Escape', KC_ENT: 'Enter', KC_BSPC: 'Backspace', KC_SPC: 'Spacebar', KC_TAB: 'Tab' };

// Commands: [keycode, category, header, main, header short, main short, QMK label] -- every one
// the app's command table has, so each tile says what the board will.
const C = (kc, cat, head, main, headShort, mainShort, label) => ({ kc, cat, head, main, headShort, mainShort, label });
// Generated from src/ui/NazgCommandTable.cpp ({GUI} as Win), labels from the keycode table.
const COMMAND_ROWS = [

      g('Sequencer', cmds('SQ_ON SQ_OFF SQ_TOGG SQ_TMPD SQ_TMPU SQ_RESD SQ_RESU SQ_SALL SQ_SCLR')),
      g('Steno -- the protocol, then the chord keys', [...cmds('QK_STENO_BOLT QK_STENO_GEMINI QK_STENO_COMB'), ...STENO.map(CMD)]),
      g('Joystick', range(32, n => CMD('JS_' + n))), g('Programmable buttons', range(32, n => CMD('PB_' + (n + 1)))),

// ---------------------------------------------------------------------------------------------
// Writing: every pick is written at once, as the app does, and read back. The key written flashes,

// The window below the controls is the app's: the strip, the board's area, the splitter and the

// Dragging the splitter moves the share; Nazg would keep it in imgui.ini.
(() => {

    const avail = document.getElementById('app').clientHeight - strip.offsetHeight - 30;

const boardWidth = () => 15.7 * state.unit;

// A tile: every one 1u, 46 x 40 px (Rico, 2026-10-04: one size, short forms where needed). Its
// text area is the legend area of a 1u keycap at the board's smallest unit -- 60 px, padded to
// about 40 px wide, words at 11 px -- so a name fits as it does there: on one line, on two, its
// short form, then cut; legend_font checks every keycode fits a 1u keycap. The keycap's face,

// ---------------------------------------------------------------------------------------------

// The composer's choices, in a popup under their button; it stays open while they are toggled.
function reopenPopup() {
  document.querySelectorAll('.popup').forEach(p => p.remove());

  if (!anchor || !cur) { state.popup = null; return; }
  const pop = document.createElement('div'); pop.className = 'popup';
  const row = () => { const r = document.createElement('div'); r.className = 'prow'; pop.appendChild(r); return r; };
  const tapKc = tapOf(cur);
  if (state.popup === 'hold-mods' && cur.kind === 'mt') {
    chips(row(), MOD_NAMES.map(n => [MOD_WORD[n], n]), n => cur.mods[n], n => {
      const mods = { ...cur.mods, [n]: !cur.mods[n] }; if (modsList(mods).length) write({ ...cur, mods }); });

// The tabs, each with its category's dot, and one search box across them all.

    measureCtx.font = getComputedStyle(search).font;
    const fits = measureCtx.measureText(HINT).width + 16 <= search.clientWidth;
    search.placeholder = fits ? HINT : 'Search';
  }).observe(search);
  pickEl.appendChild(bar);
  const items = document.createElement('div'); items.className = 'items';
  if (state.search) renderSearch(items, all);
  else {
    const tab = all.find(t => t.id === state.tab);
    if (tab.lighting) { const i = document.createElement('div'); i.className = 'info'; i.innerHTML = FIRMWARE_LINES[state.firmware] + ' Board lighting: ' + state.lighting + '.'; items.appendChild(i); }
    renderGroups(items, tab.groups);
  }
  pickEl.appendChild(items);
  return pickEl;
}
// The header every item of a group shares -- Media, L1 -- which the group's title stands for.
function sharedHeader(items) {
  const heads = items.map(k => { const d = describe(k, 'picker'); const h = d.hold || d.header; return h ? h.full : null; });
  return heads.length > 1 && heads[0] && heads.every(h => h === heads[0]);
}
// Groups flow side by side where they fit (Rico, 2026-10-04: Digits beside Punctuation), each its
// label then its tiles; a long one takes the width and wraps.
function renderGroups(parent, groups) {
  const flow = document.createElement('div'); flow.className = 'flow'; flow.groups = [];
  parent.appendChild(flow);
  for (const g of groups) {
    if (!g.items.length) continue;
    const dropHeader = sharedHeader(g.items);
    // The title in its box, its first words; the rest on hover. Placed by layoutFlow().
    const label = document.createElement('div'); label.className = 'glabel';
    const [title, more] = g.title.split(' -- ');
    label.textContent = title; if (more) label.title = more;
    const tiles = g.items.map(k => tileEl(k, { dropHeader }));
    flow.append(label, ...tiles);
    flow.groups.push({ label, tiles });
  }
  new ResizeObserver(() => layoutFlow(flow)).observe(flow);
}
// The groups on one grid of cells: a label takes two, a tile one, and no empty cell parts two
// groups on a row -- the label does. A group that does not fit the rest of a row starts the next;
// one longer than a row wraps, its next rows starting under its first tile, and its label box
// spans all its rows (Rico, 2026-10-04).
function layoutFlow(flow) {
  // In half cells: a label takes four, a tile two, and a group starts on an even one.
  const n = 2 * Math.max(6, Math.floor((flow.clientWidth + TILE.gap) / CELL));
  flow.style.gridTemplateColumns = `repeat(${n}, ${HALF - TILE.gap}px)`;
  const place = (el, row, col, span) => { el.style.gridRow = row; el.style.gridColumn = `${col + 1} / span ${span}`; };
  let row = 1, col = 0;
  for (const g of flow.groups) {
    const cells = 4 + 2 * g.tiles.length;
    let start = col === 0 ? 0 : col + (col % 2);
    if (col > 0 && start + Math.min(cells, n) > n) { row++; start = 0; }
    const first = row;
    let c = start + 4;
    g.tiles.forEach(t => {
      if (c + 2 > n) { row++; c = start + 4; }
      place(t, row, c, 2); c += 2;
    });
    place(g.label, first, start, 4);
    g.label.style.gridRow = `${first} / span ${row - first + 1}`;
    col = c;
  }
}
function searchText(k) {
  const d = describe(k, 'picker');
  return [format(k), labelOf(k), d.full, d.short, d.plain, d.shifted, d.header && d.header.full, d.hold && d.hold.full].filter(Boolean).join(' ').toLowerCase();
}
function renderSearch(parent, all) {
  const q = state.search.toLowerCase().trim();
  let found = 0;
  for (const t of all) {
    const items = t.groups.flatMap(g => g.items).filter(k => searchText(k).includes(q));
    if (!items.length) continue;
    found += items.length;
    renderGroups(parent, [{ title: t.name, items }]);
  }
  if (!found) parent.innerHTML = `<div class="info">Nothing matches "${state.search}". Type a QMK expression in the key line for anything not listed.</div>`;
}

    '<p><b>The picker</b>, settled with Rico on 2026-10-04 -- the alternatives it was chosen from are in this file\'s history. <b>Tabs</b> by category, each with its colour, and one search box through them all. <b>Tiles</b>, every one 1u, 46 x 40 px: the keycap\'s face, band and colours, words at a 1u keycap\'s legend size at the board\'s smallest unit, so every name fits as legend_font checks it does there; a header the group\'s title says is left out. Groups pack side by side on one grid, each title in a box spanning its rows.</p>',
    '<p><b>The key line</b>, over the tabs, next to the keycodes it shapes: where the key is, its keycode in QMK\'s words -- editable, the Any entry -- and the composer. "When held" Nothing, Modifiers or Layer, and "Sent with" -- None first -- open in small popups, so the line never wraps; they show only where they apply, with a plain key or one already holding or modified. A tile picked keeps the key\'s hold or modifiers, and its tooltip says what the click writes.</p>',
    '<p><b>Hover preview</b>: once a tile\'s tooltip shows -- ImGui\'s timing, the mouse resting 0.15 s, then none while moving on to the next tile -- the selected key on the board shows what the click would write, outlined in blue; sweeping across the panel to reach a tile leaves the board still. <b>After a pick</b> the selection stays on the key, as ZMK Studio\'s; moving to the next key, as Vial always does and VIA by default, is only a user preference in Settings, off by default: the writes are live and there is no undo, so a second click meant to correct a pick would land, written, on the key after. With it on, the next key is in board order, the selection clears past the last key, the key just written flashes and the message names it.</p>',
    '<p><b>Height and width</b>: every pixel the panel takes comes out of the board, which grows until its area\'s width or height stops it. A <b>splitter</b> under the board shares the height -- drag it, and Nazg would remember where; it stops where the board would fall below 60 px a unit, its legibility floor, and the panel keeps the key line and three rows of tiles. The panel is as wide as the board, at least 980 px, so board and picker read as one column, with room kept for a section column on the left.</p>',
    '<p><b>Tabs</b>. <b>Keys</b>: what a stock keyboard has, plus Shift and a key in one click -- VIA\'s symbols, for a symbol layer -- the rarer HID keys last, and Transparent and None. <b>Layers</b>: the seven operations for each layer the board has, one-shot modifiers, layer lock and tri layer. <b>Media &amp; mouse</b>, as Vial\'s App, Media and Mouse. <b>Lighting</b>: by the lighting policy, and absent when the definition declares none. <b>Features</b>: QMK features that change how keys behave. <b>Macros</b>: keys that play what is set elsewhere, as many as the board has -- macros, tap dances, dynamic macros. <b>Special</b>, VIA\'s word: the settings kept on the board -- QMK\'s Magic keycodes, a group per swap, Win key, NKRO, EE Hands, audio, clicky, music mode, haptic, the Unicode input mode, the output and Bluetooth. <b>Custom</b>, on every board: the keys the firmware\'s own code handles -- the board\'s, QK_KB_n, by the names its definition gives them (416 of VIA\'s 3513 definitions name some; Own keys: Keychron) or else numbered -- VIA\'s Custom, and what Vial calls User -- then the keymap\'s, QMK\'s user range. <b>Devices</b>: the board acting as another device -- MIDI, the sequencer, steno, joystick, programmable buttons -- all in Host\'s colour (Rico, 2026-10-04), as Custom is all in Board\'s: MIDI and steno keys print what they go to over QMK\'s name past its prefix, MIDI / CHND. <b>Firmware</b>, last and apart: the keys that can hurt. Every keycode of the board\'s version is in a tab -- the commands with the app\'s own words, from NazgCommandTable.cpp -- and search finds them all. <b>A group is left out when the board says it cannot work</b>: lighting by the definition, the macro and tap dance counts, Vial\'s feature bits -- switch Protocol: the mock Vial board has no Layer Lock and no Repeat. What nothing tells -- audio, haptic, Unicode, steno -- is offered, as Vial and VIA do.</p>',
    '<p><b>Lighting</b>: switch Firmware and Board lighting to see what the Lighting tab offers -- one set on old and unknown firmware, a set per system on new, the RGB_M modes on old only; hover tells what a key drives where it is not obvious (ui-design.md, "Which lighting keycodes a board gets").</p>',
  ].join('');
}

render();
