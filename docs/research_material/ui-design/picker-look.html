<!-- Mockup of the keycode picker -- the Keymap section's panel -- on a 60% board. Open it in a
     browser. Keycaps are drawn as the board draws them (ui-design.md, "The board's look"), with
     what ImGui can draw: rounded rectangles, lines and text. The controls switch between the
     variants to compare. Arimo comes from Google Fonts, so it needs a network connection. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycode picker mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Noto+Sans+Math&family=Noto+Sans+Symbols+2&display=swap">
<style>
:root{--window:#f3f3f5;--menubar:#e3e4e9;--text:#1d1e22;--muted:#6b6e78;--control:#ffffff;--border:#c8cad2;--ui-accent:#3b82f6;--ui-accent-text:#fff;--panel:#f8f8fa;--warning:#e8590c;--success:#2f9e44;--error:#e03131}
*{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.menubar{display:flex;gap:18px;align-items:center;background:var(--menubar);padding:5px 16px}
.menubar .right{margin-left:auto;color:var(--muted)}
.menubar .proto{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.controls .break{flex-basis:100%;height:0}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.group .name{color:var(--muted);margin-right:4px}
button{font:inherit;padding:3px 10px;border-radius:4px;border:1px solid var(--border);background:var(--control);color:var(--text);cursor:pointer}
button.on{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-accent-text)}
button:disabled{opacity:.45;cursor:default}
.app{padding:4px 16px 0;display:flex;flex-direction:column}
.strip{display:flex;align-items:center;gap:4px;margin:4px 0 6px;flex:none;min-height:30px;flex-wrap:wrap}
.strip .label{color:var(--muted);margin-right:6px}
.strip button{min-width:34px}
.plate{position:relative;margin:0 auto;border-radius:14px}
.boardarea{display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.splitter{height:12px;flex:none;cursor:row-resize;display:flex;align-items:center;justify-content:center}
.splitter::after{content:'';width:56px;height:4px;border-radius:2px;background:var(--border)}
.splitter:hover::after,.splitter.drag::after{background:var(--ui-accent)}
.keystrip{display:flex;align-items:center;gap:6px 12px;margin-left:28px;padding-left:16px;border-left:1px solid var(--border);flex-wrap:wrap}
.keystrip .where{color:var(--muted)}
.keystrip input.expr{width:320px;font:13px Consolas,"Cascadia Mono",monospace;padding:4px 7px;border:1px solid var(--border);border-radius:4px;background:var(--control);color:var(--text)}
.keystrip input.expr.bad{border-color:var(--error)}
.keystrip .msg{font-size:12px}
.keystrip .name{color:var(--muted)}
.keystrip .seg{display:inline-flex;gap:3px;align-items:center}
.keystrip button{min-width:0;padding:2px 8px}
.popup{position:absolute;z-index:8;background:var(--control);border:1px solid var(--border);border-radius:6px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px}
.popup .prow{display:flex;gap:3px}
.key{position:absolute;overflow:hidden;cursor:pointer}
.t{position:absolute;white-space:nowrap;line-height:1;font-family:Arimo,"Noto Sans Math","Noto Sans Symbols 2",sans-serif}
.panel{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;background:var(--panel);overflow:hidden;flex:none}
.card{width:260px;flex:none;padding:12px;border-right:1px solid var(--border);overflow-y:auto}
.card.right{border-right:none;border-left:1px solid var(--border)}
.keybar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;border-bottom:1px solid var(--border)}
.keybar .where{color:var(--muted)}
.keybar input.expr{width:340px;font:13px Consolas,"Cascadia Mono",monospace;padding:4px 7px;border:1px solid var(--border);border-radius:4px;background:var(--control);color:var(--text)}
.keybar input.expr.bad{border-color:var(--error)}
.keybar .msg{font-size:12px}
.keybar .row{display:inline-flex;align-items:center;gap:3px}
.keybar .row .name{color:var(--muted);margin-right:3px}
.keybar .row .name:empty{display:none}
.keybar .note{color:var(--muted);font-size:12px}
.keybar button{padding:2px 8px}
.tile{position:relative;border-radius:5px;overflow:hidden;cursor:pointer;flex:none}
.flow{display:grid;grid-auto-rows:40px;column-gap:4px;row-gap:6px;align-items:start}
.grouprow{display:flex;gap:6px;align-items:flex-start;max-width:100%;min-width:0}
.grouprow .grid{min-width:0}
.flow .glabel{color:var(--muted);font-size:12px;line-height:1.2;overflow:hidden;align-self:stretch;display:flex;align-items:center}
.flow.boxed .glabel{border:1px solid var(--border);border-radius:5px;padding:0 8px;background:var(--label-fill);color:var(--label-text)}
.card .where{color:var(--muted);margin-bottom:8px}
.card .preview{position:relative;height:110px;margin-bottom:8px}
.card input.expr{width:100%;font:13px Consolas,"Cascadia Mono",monospace;padding:5px 7px;border:1px solid var(--border);border-radius:4px;background:var(--control);color:var(--text)}
.card input.expr.bad{border-color:var(--error)}
.card .msg{min-height:18px;margin:4px 0 8px;font-size:12px}
.card .row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:6px 0}
.card .row .name{flex-basis:100%;color:var(--muted)}
.card .row .name:empty{display:none}
.card .note{color:var(--muted);font-size:12px;line-height:1.4;margin:4px 0}
.card button{padding:2px 8px}
.pick{flex:1;display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs .tab{border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;padding:5px 11px 4px;cursor:pointer;color:var(--muted);position:relative}
.tabs .tab.on{background:var(--window);border-color:var(--border);color:var(--text);margin-bottom:-1px}
.tabs .tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tabs input{margin-left:auto;margin-bottom:5px;width:190px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--control);color:var(--text);font:inherit}
.items{flex:1;overflow-y:auto;padding:8px 12px 12px;background:var(--window)}
.items h4{margin:10px 0 5px;font-weight:600;color:var(--muted);font-size:12px}
.items h4:first-child{margin-top:2px}
.items .grid{display:flex;flex-wrap:wrap;gap:4px}
.items .itemkey{position:relative;cursor:pointer}
.items .textbtn{padding:4px 8px;min-width:46px}
.items .info{color:var(--muted);font-size:12px;margin:2px 0 8px;line-height:1.4}
.layers-table{border-collapse:collapse}
.layers-table td{padding:2px 4px 2px 0;vertical-align:middle}
.layers-table td.op{color:var(--muted);padding-right:10px;white-space:nowrap}
.kinds{width:170px;flex:none;border-right:1px solid var(--border);padding:8px 0;overflow-y:auto}
.kinds div{padding:5px 12px;cursor:pointer}
.kinds div.on{background:var(--ui-accent);color:var(--ui-accent-text)}
.kinds .sep{height:1px;background:var(--border);margin:6px 0;padding:0}
.notes{max-width:1000px;margin:0 auto;padding:14px 16px 30px;color:var(--muted);line-height:1.5}
.notes b{color:var(--text);font-weight:600}
.notes p{margin:0 0 8px}
.flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px var(--success);background:color-mix(in srgb,var(--success) 22%,transparent);animation:flash .9s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.tip{position:fixed;pointer-events:none;background:var(--control);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:12px;white-space:pre;z-index:9;display:none;color:var(--text)}
</style>
</head>
<body>
<div class="menubar"><span>Mock 60 &#9662;</span><span class="proto">Vial 6</span><span class="right">Settings</span></div>
<div class="controls" id="controls"></div>
<div class="app" id="app">
  <div class="strip" id="strip"></div>
  <div class="boardarea" id="boardarea"><div class="plate" id="board"></div></div>
  <div class="splitter" id="splitter" title="Drag to share the height between the board and the picker"></div>
  <div class="panel" id="panel"></div>
</div>
<div class="notes" id="notes"></div>
<div class="tip" id="tip"></div>
<script>
'use strict';

// ---------------------------------------------------------------------------------------------
// Themes: the app's Light and Dark (src/ui/NazgPalette.cpp), board colours only.
const THEMES = {
  Light: {
    css: { window: '#f3f3f5', menubar: '#e3e4e9', text: '#1d1e22', muted: '#6b6e78', control: '#ffffff', border: '#c8cad2',
           'ui-accent': '#3b82f6', 'ui-accent-text': '#ffffff', panel: '#f8f8fa', warning: '#e8590c', success: '#2f9e44', error: '#e03131' },
    labelFill: '#d1d4da', labelText: '#2f3238', sage: '#e8efd8', plate: '#d3d4d8', outline: '#b4b7c2', legend: '#24262b', hovered: 'rgba(0,0,0,0.08)', selected: '#1d1e22',
    alpha: '#ffffff', mod: '#e4e5ea', accent: '#afbfd5', accentLegend: '#18222f', preview: '#1c7ed6',
  },
  Dark: {
    css: { window: '#0f0f11', menubar: '#24252b', text: '#ececf1', muted: '#80838f', control: '#20232b', border: '#3a3d48',
           'ui-accent': '#4296fa', 'ui-accent-text': '#ffffff', panel: '#16171b', warning: '#ffb34d', success: '#78dc82', error: '#ff8b7f' },
    labelFill: '#1d1e25', labelText: '#9a9daa', sage: '#1d2419', plate: '#1c1d23', outline: '#4b4e5c', legend: '#ebebf0', hovered: 'rgba(255,255,255,0.13)', selected: '#ececf1',
    alpha: '#3a3c48', mod: '#2c2e38', accent: '#5a6a80', accentLegend: '#e8eff9', preview: '#71b6ff',
  },
};

// The category solver, as NazgPalette.cpp has it: a hue per category, its lightness walked from
// the face away from it to the first reaching the target contrast.
const HUES = { beh: 300, host: 200, board: 80, fw: 30 };
const s2l = c => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
const l2s = c => c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
const hexLin = h => [1, 3, 5].map(i => s2l(parseInt(h.slice(i, i + 2), 16) / 255));
const lum = v => 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function oklchLin(L, C, h) {
  const r = h * Math.PI / 180, a = C * Math.cos(r), b = C * Math.sin(r);
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3, m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3,
        s = (L - 0.0894841775 * a - 1.2914855480 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s];
}
const okL = v => { const l = Math.cbrt(0.4122214708 * v[0] + 0.5363325363 * v[1] + 0.0514459929 * v[2]),
  m = Math.cbrt(0.2119034982 * v[0] + 0.6806995451 * v[1] + 0.1073969566 * v[2]),
  s = Math.cbrt(0.0883024619 * v[0] + 0.2817188376 * v[1] + 0.6299787005 * v[2]);
  return 0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s; };
const inGamut = v => v.every(x => x >= 0 && x <= 1);
function clampChroma(L, C, h) {
  if (inGamut(oklchLin(L, C, h))) return oklchLin(L, C, h);
  let lo = 0, hi = C;
  for (let i = 0; i < 20; i++) { const mid = (lo + hi) / 2; if (inGamut(oklchLin(L, mid, h))) lo = mid; else hi = mid; }
  return oklchLin(L, lo, h);
}
const toHex = v => '#' + v.map(c => Math.round(255 * l2s(Math.min(Math.max(c, 0), 1))).toString(16).padStart(2, '0')).join('');
const inkCache = new Map();
function categoryInk(face, cat, use) {
  const target = cat === 'fw' ? (use === 'text' ? 7 : 4.5) : (use === 'text' ? 4.5 : 3);
  const key = face + cat + use;
  if (inkCache.has(key)) return inkCache.get(key);
  const f = hexLin(face), darker = lum(f) > 0.18, L0 = okL(f);
  let out = null;
  for (let step = 0; step <= 200; step++) {
    const L = darker ? 1 - step / 200 : step / 200;
    if (darker ? L > L0 : L < L0) continue;
    const c = toHex(clampChroma(L, 0.16, HUES[cat]));
    if (contrast(hexLin(c), f) >= target) { out = c; break; }
  }
  inkCache.set(key, out);
  return out;
}

// ---------------------------------------------------------------------------------------------
// Host layouts: the board mockup's, US and French. [plain, shifted, AltGr].
const HOSTS = {"US":{"KC_0":["0",")",""],"KC_1":["1","!",""],"KC_2":["2","@",""],"KC_3":["3","#",""],"KC_4":["4","$",""],"KC_5":["5","%",""],"KC_6":["6","^",""],"KC_7":["7","&",""],"KC_8":["8","*",""],"KC_9":["9","(",""],"KC_BSLS":["\\","|",""],"KC_COMM":[",","<",""],"KC_DOT":[".",">",""],"KC_EQL":["=","+",""],"KC_GRV":["`","~",""],"KC_LBRC":["[","{",""],"KC_MINS":["-","_",""],"KC_NUBS":["\\","|",""],"KC_NUHS":["\\","|",""],"KC_QUOT":["'","\"",""],"KC_RBRC":["]","}",""],"KC_SCLN":[";",":",""],"KC_SLSH":["/","?",""]},"French":{"KC_0":["à","0","@"],"KC_1":["&","1",""],"KC_2":["é","2","~"],"KC_3":["\"","3","#"],"KC_4":["'","4","{"],"KC_5":["(","5","["],"KC_6":["-","6","|"],"KC_7":["è","7","`"],"KC_8":["_","8","\\"],"KC_9":["ç","9",""],"KC_A":["Q","",""],"KC_B":["B","",""],"KC_BSLS":["*","µ",""],"KC_C":["C","",""],"KC_COMM":[";",".",""],"KC_D":["D","",""],"KC_DOT":[":","/",""],"KC_E":["E","","€"],"KC_EQL":["=","+","}"],"KC_F":["F","",""],"KC_G":["G","",""],"KC_GRV":["²","",""],"KC_H":["H","",""],"KC_I":["I","",""],"KC_J":["J","",""],"KC_K":["K","",""],"KC_L":["L","",""],"KC_LBRC":["^","¨",""],"KC_M":[",","?",""],"KC_MINS":[")","°","]"],"KC_N":["N","",""],"KC_NUBS":["<",">",""],"KC_NUHS":["*","µ",""],"KC_O":["O","",""],"KC_P":["P","",""],"KC_Q":["A","",""],"KC_QUOT":["ù","%",""],"KC_R":["R","",""],"KC_RBRC":["$","£","¤"],"KC_S":["S","",""],"KC_SCLN":["M","",""],"KC_SLSH":["!","§",""],"KC_T":["T","",""],"KC_U":["U","",""],"KC_V":["V","",""],"KC_W":["Z","",""],"KC_X":["X","",""],"KC_Y":["Y","",""],"KC_Z":["W","",""]}};
function hostLegend(kc) {
  const h = HOSTS[state.host][kc] || HOSTS.US[kc];
  if (HOSTS[state.host][kc]) return { plain: h[0], shifted: h[1] };
  if (/^KC_[A-Z]$/.test(kc)) return { plain: kc[3] };
  return h ? { plain: h[0], shifted: h[1] } : null;
}

// The standard keys in words: [full, short]. Modifiers name their side: in the picker no key has
// a side of the board.
const NAMED = {
  KC_ESC: ['Esc'], KC_TAB: ['Tab'], KC_CAPS: ['Caps Lock', 'Caps'], KC_ENT: ['Enter'], KC_BSPC: ['Backspace', 'Bksp'],
  KC_SPC: ['Space'], KC_INS: ['Insert', 'Ins'], KC_DEL: ['Delete', 'Del'], KC_HOME: ['Home'], KC_END: ['End'],
  KC_PGUP: ['Page Up', 'Pg Up'], KC_PGDN: ['Page Down', 'Pg Dn'], KC_PSCR: ['Print Screen', 'PrtSc'],
  KC_SCRL: ['Scroll Lock', 'Scr Lk'], KC_PAUS: ['Pause'], KC_APP: ['Menu'], KC_NUM: ['Num Lock', 'Num Lk'],
  KC_LSFT: ['Left Shift', 'L Shift'], KC_RSFT: ['Right Shift', 'R Shift'], KC_LCTL: ['Left Control', 'L Ctrl'],
  KC_RCTL: ['Right Control', 'R Ctrl'], KC_LALT: ['Left Alt', 'L Alt'], KC_RALT: ['Alt Gr'], KC_LGUI: ['Left Win', 'L Win'],
  KC_RGUI: ['Right Win', 'R Win'],
  KC_P0: ['0'], KC_P1: ['1'], KC_P2: ['2'], KC_P3: ['3'], KC_P4: ['4'], KC_P5: ['5'], KC_P6: ['6'], KC_P7: ['7'],
  KC_P8: ['8'], KC_P9: ['9'], KC_PDOT: ['.'], KC_PSLS: ['/'], KC_PAST: ['*'], KC_PMNS: ['−'], KC_PPLS: ['+'], KC_PENT: ['Enter'],
  KC_INT1: ['Int 1'], KC_INT2: ['Int 2'], KC_INT3: ['Int 3'], KC_INT4: ['Int 4'], KC_INT5: ['Int 5'],
  KC_LNG1: ['Lang 1'], KC_LNG2: ['Lang 2'],
};
for (let i = 1; i <= 24; i++) NAMED['KC_F' + i] = ['F' + i];
const ARROWS = { KC_UP: '↑', KC_DOWN: '↓', KC_LEFT: '←', KC_RGHT: '→' };
const LABELS = { KC_ESC: 'Escape', KC_ENT: 'Enter', KC_BSPC: 'Backspace', KC_SPC: 'Spacebar', KC_TAB: 'Tab' };

// Commands: [keycode, category, header, main, header short, main short, QMK label].
const C = (kc, cat, head, main, headShort, mainShort, label) => ({ kc, cat, head, main, headShort, mainShort, label });
const COMMANDS = [
  C('KC_MPLY', 'host', 'Media', 'Play', 0, 0, 'Play/Pause'), C('KC_MNXT', 'host', 'Media', 'Next'), C('KC_MPRV', 'host', 'Media', 'Prev', 0, 0, 'Previous'),
  C('KC_MSTP', 'host', 'Media', 'Stop'), C('KC_MUTE', 'host', 'Media', 'Mute'), C('KC_VOLU', 'host', 'Media', 'Vol +', 0, 0, 'Volume Up'),
  C('KC_VOLD', 'host', 'Media', 'Vol −', 0, 0, 'Volume Down'), C('KC_MFFD', 'host', 'Media', 'Fast Fwd', 0, 'FFwd', 'Fast Forward'),
  C('KC_MRWD', 'host', 'Media', 'Rewind', 0, 'Rew'), C('KC_EJCT', 'host', 'Media', 'Eject'), C('KC_MSEL', 'host', 'Media', 'Select', 0, 'Sel'),
  C('KC_PWR', 'host', 'System', 'Power'), C('KC_SLEP', 'host', 'System', 'Sleep'), C('KC_WAKE', 'host', 'System', 'Wake'),
  C('KC_BRIU', 'host', 'Screen', 'Bri +', 0, 0, 'Brightness Up'), C('KC_BRID', 'host', 'Screen', 'Bri −', 0, 0, 'Brightness Down'),
  C('KC_CALC', 'host', 'App', 'Calc', 0, 0, 'Calculator'), C('KC_MAIL', 'host', 'App', 'Mail'), C('KC_MYCM', 'host', 'App', 'Computer', 0, 'PC', 'My Computer'),
  C('KC_CPNL', 'host', 'App', 'Settings', 0, 'Setup', 'Control Panel'), C('KC_ASST', 'host', 'App', 'Assistant', 0, 'Assist'),
  C('KC_MCTL', 'host', 'App', 'Mission Ctrl', 0, 'Mission', 'Mission Control'), C('KC_LPAD', 'host', 'App', 'Launchpad', 0, 'Launch'),
  C('KC_WBAK', 'host', 'Web', 'Back'), C('KC_WFWD', 'host', 'Web', 'Forward', 0, 'Fwd'), C('KC_WHOM', 'host', 'Web', 'Home'),
  C('KC_WREF', 'host', 'Web', 'Refresh', 0, 'Refr'), C('KC_WSCH', 'host', 'Web', 'Search', 0, 'Srch'), C('KC_WSTP', 'host', 'Web', 'Stop'),
  C('KC_WFAV', 'host', 'Web', 'Favorites', 0, 'Favs'),
  C('UC_WIN', 'host', 'Unicode', 'Windows', 0, 'Win'), C('UC_MAC', 'host', 'Unicode', 'macOS'), C('UC_LINX', 'host', 'Unicode', 'Linux'),
  C('UC_NEXT', 'host', 'Unicode', 'Next'),
  C('OU_AUTO', 'host', 'Output', 'Auto'), C('OU_USB', 'host', 'Output', 'USB'), C('OU_BT', 'host', 'Output', 'BT'),
  C('MS_UP', 'host', 'Mouse', 'Up'), C('MS_DOWN', 'host', 'Mouse', 'Down'), C('MS_LEFT', 'host', 'Mouse', 'Left'), C('MS_RGHT', 'host', 'Mouse', 'Right'),
  C('MS_BTN1', 'host', 'Mouse', 'Btn 1'), C('MS_BTN2', 'host', 'Mouse', 'Btn 2'), C('MS_BTN3', 'host', 'Mouse', 'Btn 3'),
  C('MS_BTN4', 'host', 'Mouse', 'Btn 4'), C('MS_BTN5', 'host', 'Mouse', 'Btn 5'),
  C('MS_WHLU', 'host', 'Mouse', 'Wh Up'), C('MS_WHLD', 'host', 'Mouse', 'Wh Dn'), C('MS_WHLL', 'host', 'Mouse', 'Wh Left', 0, 'Wh Lt'),
  C('MS_WHLR', 'host', 'Mouse', 'Wh Right', 0, 'Wh Rt'), C('MS_ACL0', 'host', 'Mouse', 'Acc 0'), C('MS_ACL1', 'host', 'Mouse', 'Acc 1'),
  C('MS_ACL2', 'host', 'Mouse', 'Acc 2'),
  C('CW_TOGG', 'beh', 'Caps Word', 'On/Off', 'Caps Wd', 0, 'Toggle Caps Word'), C('QK_REP', 'beh', 'Key', 'Repeat', 0, 'Rep'),
  C('QK_AREP', 'beh', 'Key', 'Alt Rep', 0, 0, 'Repeat Alternate'), C('QK_GESC', 'beh', 'Key', 'Grv Esc', 0, 0, 'Grave Escape'),

// row wraps, its next rows starting under its first tile.
function layoutFlow(flow) {
  // In half cells: a label takes four, and a group starts on an even one.
  const n = 2 * Math.max(6, Math.floor((flow.clientWidth + TILE.gap) / CELL));
  flow.style.gridTemplateColumns = `repeat(${n}, ${HALF - TILE.gap}px)`;
  const place = (el, row, col, span) => { el.style.gridRow = row; el.style.gridColumn = `${col + 1} / span ${span}`; };
  let row = 1, col = 0;
  for (const g of flow.groups) {
    const cells = 4 + g.spans.reduce((a, b) => a + b, 0);

    let start = col === 0 ? 0 : col + (col % 2);
    if (col > 0 && start + Math.min(cells, n) > n) { row++; start = 0; }
    const first = row;
    let c = start + 4;
    g.tiles.forEach((t, i) => {
      const s = g.spans[i];

  const row = name => { const r = document.createElement('div'); r.className = 'row'; r.style.cssText = 'display:flex;gap:4px;align-items:center;margin:4px 0 8px';
    r.innerHTML = `<span style="width:90px;color:var(--muted)">${name}</span>`; ed.appendChild(r); return r; };
  const modsRow = () => chips(row('Modifiers'), MOD_NAMES.map(n => [MOD_WORD[n], n]), n => params.mods[n], n => { params.mods = { ...params.mods, [n]: !params.mods[n] }; if (!modsList(params.mods).length) params.mods[n] = true; renderPanel(); });
  const layerRow = () => chips(row('Layer'), KEYMAP.map((_, n) => ['L' + n, n]), n => params.layer === n, n => { params.layer = n; renderPanel(); });
  const keyGrid = build => { const h = document.createElement('h4'); h.textContent = 'Then the key -- click it to write'; ed.appendChild(h);
    renderGroups(ed, tabs()[0].groups.slice(0, 8).map(g => ({ title: g.title, items: g.items.map(build) }))); };
  switch (state.kindTab) {
    case 'key': renderGroups(ed, tabs()[0].groups); break;
    case 'mods': modsRow(); keyGrid(k => ({ kind: 'mods', mods: params.mods, kc: k.kc })); break;
    case 'mt': modsRow(); keyGrid(k => ({ kind: 'mt', mods: params.mods, kc: k.kc })); break;
    case 'lt': layerRow(); keyGrid(k => ({ kind: 'lt', layer: params.layer, kc: k.kc })); break;
    case 'layer': chips(row('Operation'), LAYER_OPS.map(o => [o[1], o[0]]), op => params.op === op, op => { params.op = op; renderPanel(); });
      layerRow(); renderGroups(ed, [{ title: 'Write it', items: [{ kind: 'layer', op: params.op, layer: params.layer }] }]); break;
    case 'lm': layerRow(); modsRow(); renderGroups(ed, [{ title: 'Write it', items: [{ kind: 'lm', layer: params.layer, mods: params.mods }] }]); break;
    case 'osm': modsRow(); renderGroups(ed, [{ title: 'Write it', items: [{ kind: 'osm', mods: params.mods }] }]); break;
    case 'cmd': renderGroups(ed, tabs().slice(2).flatMap(t => t.groups.map(g => ({ title: t.name + ' -- ' + g.title, items: g.items })))); break;
    case 'macro': renderGroups(ed, [tabs()[7].groups[0], tabs()[7].groups[2]]); break;
    case 'td': renderGroups(ed, [tabs()[7].groups[1]]); break;
    case 'special': renderGroups(ed, [{ title: 'Nothing', items: [TRNS, NO] }]); break;
  }
  wrap.appendChild(ed);
  return wrap;
}

function renderNotes() {
  document.getElementById('notes').innerHTML = [
    '<p><b>Try</b>: click a key on the board, then a keycode -- it is written at once, as Nazg does. With the composer, click Caps Lock: it holds Ctrl, taps Esc. Pick another key and the hold stays: the key card shapes every pick, so LT(1, KC_SPC) is "When held: Layer, L1", then Space -- one step, where Vial takes two. Type in the expression box -- <code>LT(2,KC_A)</code>, <code>C(S(KC_T))</code>, <code>OSM(MOD_LSFT)</code> -- and press Enter.</p>',
    '<p><b>Structure</b>. <b>Tabs</b>: categories as VIA and Vial have them, each with its colour; the search box looks through every tab. <b>Keyboard tab</b>: the Keys tab drawn as a full-size keyboard in the host layout, as Vial\'s Basic tab -- quick to find a key by its place, but it takes the panel\'s whole height. <b>Kind + parameters</b>: ZMK Studio\'s model -- the kind first, then its parameters; every keycode is reachable without an expression, at the cost of a click more for the common ones.</p>',
    '<p><b>Items</b>: <b>Compact</b> tiles, 38 px tall -- the keycap\'s face, band and colours, as wide as their words, a header left out where the group\'s title says it, the title beside the row -- or keycaps drawn exactly as the board draws them, or text buttons as today. <b>Key card</b>: on the right, as an inspector -- the palette starts under the board\'s left edge, where the eye starts -- or on the left. Its "When held" and "Sent with" rows show only where they apply: with a plain key, or one already holding or modified.</p>',
    '<p><b>Hover preview</b>: the selected key on the board shows the keycode under the mouse, outlined in blue, before the click -- what the click will write, composer included, which the tile alone does not show; its tooltip says it too. <b>With the tooltip</b>, decided (Rico, 2026-10-04), it waits for ImGui\'s tooltip timing -- the mouse resting 0.15 s, then none while moving on to the next tile -- so sweeping across the panel to reach a tile leaves the board still; <b>at once</b> shows how much the board then flickers, in the corner of the eye. <b>After a pick</b>, decided (Rico, 2026-10-04): the selection <b>stays</b> on the key, as ZMK Studio\'s; <b>moving to the next key</b>, as Vial always does and VIA by default (its Fast Key Mapping; turned off, VIA deselects), is only a user preference in Settings, off by default. Next key fills a row in one click a key instead of two -- but the writes are live and there is no undo, so a second click meant to correct the pick lands, written, on the key after. With the setting on, the next key is in board order, and past the last key the selection clears rather than wrapping round to the first; the key just written flashes, and the message names it. Try it: Next key, then pick twice in a row.</p>',
    '<p><b>Height</b>: every pixel the panel takes comes out of the board, which grows until its area\'s width or height stops it. So the key\'s line sits in the strip row, beside the layers -- no height of its own -- its choices in small popups so the row never wraps; and a <b>splitter</b> under the board shares the height: drag it, and Nazg would remember where. It stops where the board would fall below 60 px a unit, its legibility floor; the panel keeps at least 200 px -- three rows of tiles under the tabs.</p>',
    '<p><b>Lighting</b>: switch Firmware and Board lighting to see what the Lighting tab offers -- one set on old and unknown firmware, a set per system on new, the RGB_M modes on old only; hover tells what a key drives where it is not obvious (ui-design.md, "Which lighting keycodes a board gets").</p>',
    '<p><b>To decide</b>: the structure; keycaps or text; whether the key card\'s composer and its expression box replace the Any dialog; and what the tabs are called and hold.</p>',
  ].join('');
}

buildControls();
render();
</script>
