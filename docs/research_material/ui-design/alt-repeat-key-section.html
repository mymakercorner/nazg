<!-- Mockup of the Alt Repeat Key section (ui-design.md, "The Alt Repeat Key section").

     First round (2026-10-10). Alt Repeat (QK_AREP) sends a key that goes with the last one typed --
     after Ctrl+Z, Ctrl+Y. QMK pairs a few keys itself (arrows, Home / End, Page Up / Down, Bksp /
     Del, brackets, media); Vial adds entries a user sets: 6 bytes per slot, read and written one
     slot per round trip (via-vial-commands.md, vial_dynamic_entry_op). Vial's editor is a tab per
     slot, five rows: Enable, Last key, Alt key, eight boxes of allowed modifiers, three options.

     What the firmware does, from vial-qmk's quantum/vial.c (get_alt_repeat_key_keycode_user,
     2026-02 tree) and QMK's quantum/repeat_key.c, process_repeat_key.c, read 2026-10-10:
     - the last key is the last one pressed that QMK remembers -- never a modifier, a layer key
       (MO, TO, TG, TT, OSL), a one-shot key, Layer Lock or a Repeat key; a mod-tap or layer-tap
       counts as its tap key, held it is not remembered;
     - an entry's keycode is matched against the last key, a mod-tap or layer-tap as its tap key,
       the modifiers in its keycode (Ctrl+Z) as modifiers that must have been held; the modifiers
       held with the last key must be those, plus only the entry's allowed ones;
     - "ignore mod handedness" folds right onto left, for all three: Right Ctrl counts as Ctrl;
     - several entries matching: the one with the most modifiers wins, then the first slot;
     - "bidirectional" also matches the alt key and sends the last key back;
     - "default to this alt key": after a key no entry matches, this entry's alt key is sent, if
       the modifiers held are allowed -- the first such entry wins, and QMK's own pairs are then
       never reached;
     - what is sent is built as (8-bit modifiers << 8) | key, where a keycode carries 5-bit ones:
       a left modifier comes out right, a right one does not (Right Ctrl+Y sends Y, Right Shift a
       tap-hold, Right Alt a layer-tap, Right Win a Unicode character) -- a vial-qmk bug;
     - the alt key is processed as if pressed: any keycode works, a mod-tap or layer-tap as its
       tap key; vial-qmk turns Repeat Key on by default (build_vial.mk), 4 to 32 slots by EEPROM
       size; a reset slot is all zeros: off.

     The variants: how the slots are listed, where "both ways" is set, what the board shows.

     Settled 2026-10-10 (Rico): the numbered strip, both ways set in the arrow, the selected entry
     on the board -- the toggles keep the alternatives.

     The boards: the Corne's real definition (vial-qmk keyboards/crkbd/keymaps/vial/vial.json) with
     Repeat and Alt Repeat on its thumbs, and the Model F B104's (32 slots, as it would report
     rebuilt on today's vial-qmk -- its firmware reports none) with no Alt Repeat key. The keymaps
     are made up, as in key-overrides-section.html. -->

  const keys = [];
  let x = 0, y = 0, rx = 0, ry = 0, r = 0, p = {};
  const pair = s => { const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };

    if (!Array.isArray(row)) continue;

        if ('r' in item) r = item.r;

        if ('y' in item) y += item.y;

        continue;

function toolsHtml() {
  const o = cur(), sel = state.sel, alike = has(o, OPT.alike);
  const modButtons = (list, attr) => Object.keys(MBIT).map(n => `<button class="${list.includes(n) ? 'on' : ''}" data-${attr}="${n}">${n}</button>`).join('');
  let t;
  if (sel === 'key') {
    t = `<b>Last key</b><span class="muted">held with it</span><span class="seg">${modButtons(o.req, 'req')}</span>`;
    if (!alike && o.req.length) t += `<span class="seg">${['Left', 'Right'].map(s => `<button class="${(s === 'Right') === o.reqR ? 'on' : ''}" data-rside="${s}">${s}</button>`).join('')}</span>`;
    t += o.key ? `<span class="sep"></span><button data-act="emptykey">Empty it</button><span class="muted">pick a key below, or click one on the board</span>`
               : `<span class="muted">click a key on the board, or pick one below</span>`;
  } else if (sel === 'allowed') {
    const side = sideOf(o.allowed);
    t = `<b>May also be held</b><span class="seg">${Object.keys(MBIT).map(n => `<button class="${o.allowed & (0x11 << MBIT[n]) ? 'on' : ''}" data-mod="${n}">${n}</button>`).join('')}</span>`;
    if (!alike) t += `<span class="sep"></span><span class="seg">` + ['Either', 'Left', 'Right'].map(s => `<button class="${o.allowed && side === s ? 'on' : ''}" data-side="${s}" ${o.allowed ? '' : 'disabled'}>${s === 'Either' ? 'Either side' : s}</button>`).join('') + `</span>`;
    t += `<span class="muted">${o.req.length ? `besides ${o.req.join(' and ')}, which ${o.req.length > 1 ? 'are' : 'is'} needed` : 'with the last key'}</span>`;
  } else {
    t = `<b>Alt Repeat sends</b><span class="muted">sent with</span><span class="seg">${modButtons(o.altMods, 'amod')}</span>`;
    t += o.alt ? `<span class="sep"></span><button data-act="emptyalt">Empty it</button><span class="muted">pick a key below -- any key, a macro or a layer key too</span>`
               : `<span class="muted">pick a key below, or click one on the board</span>`;
  }
  return `<div class="tools">${t}</div>`;
}

function pickerHtml() {
  let h = `<div class="tabs">${TABS.map(([n, c]) => `<span class="tab${state.tab === n ? ' on' : ''}" data-tab="${n}">${c ? `<span class="dot" style="background:${c}"></span>` : ''}${n}</span>`).join('')}<input placeholder="Search"></div>`;
  h += `<div class="tiles">${Object.values(K).filter(k => k.tab === state.tab).map(k => {
    let off = '';
    if (state.sel === 'key' && forgotten(k.name)) off = `Never the last key: QMK does not remember ${forgotten(k.name)}`;
    if (state.sel === 'alt' && (k.name === 'QK_REP' || k.name === 'QK_AREP')) off = 'Alt Repeat cannot send a Repeat key';
    return `<div class="cap ${k.cls}${off ? ' off' : ''}" data-key="${k.name}" title="${off || k.name}">${k.h ? `<span class="h">${k.h}</span>` : ''}<span class="m">${k.m}</span></div>`;
  }).join('')}</div>`;
  return h;
}

function lineHtml() {
  const o = cur(), anyDirty = state.ars.some((_, i) => dirty(i));
  let msg;
  if (anyDirty) msg = `<span class="warn">Not written yet</span> <span class="muted">-- ${state.ars.filter((_, i) => dirty(i)).length} entr${state.ars.filter((_, i) => dirty(i)).length > 1 ? 'ies' : 'y'} changed</span>`;
  else if (state.msg) msg = `<span class="${state.msg[0]}">${state.msg[1]}</span>`;
  else msg = `<span class="muted">Changes are written by Save.</span>`;
  const title = byKeys() ? (isEmpty(o) ? 'New entry' : refOf(state.ar)) : label(state.ar);
  return `<div class="mline"><span class="title" title="Slot ${state.ar} of ${state.ars.length}">${title}</span>`
       + `<button class="onoff${isOn(o) ? ' on' : ''}" data-act="toggle" ${isEmpty(o) ? 'disabled' : ''} title="An entry off stays on the board, unused">${isOn(o) ? 'On' : 'Off'}</button>`
       + `<button data-act="clear" ${isEmpty(o) ? 'disabled' : ''}>Clear</button>`
       + `<span class="msg">${msg}</span>`
       + `<span class="right"><button data-act="save" ${anyDirty ? '' : 'disabled'}>Save</button><button data-act="revert" ${anyDirty ? '' : 'disabled'}>Revert</button></span></div>`;
}

const renderPanel = () => lineHtml() + editorHtml() + toolsHtml() + pickerHtml();

// ---------------------------------------------------------------------------------------------
function boardSvg() {
  const keys = BOARD.keys, sends = BOARD.sends;
  const bd = boundsOf(keys), avail = 1160 - 180 - 28 - 30;
  const u = Math.min(46, Math.floor(avail / (bd.x1 - bd.x0 + 0.7))), m = u * 0.35;
  const P = ([x, y]) => [(x - bd.x0) * u, (y - bd.y0) * u];
  const o = cur(), lit = new Map();
  const light = kc => { const a = kc && !forgotten(kc) && locate(kc); if (a) a.keys.forEach(k => lit.set(k, a.mt ? 0 : a.layer)); };
  light(o.key);
  if (has(o, OPT.both)) light(o.alt);
  const arep = new Set(arepKeys());
  const fs = Math.round(u * 0.3);
  let s = `<svg class="board" xmlns="${NS}" width="${(bd.x1 - bd.x0) * u + 2 * m}" height="${(bd.y1 - bd.y0) * u + 2 * m}">`
        + `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.cur{fill:var(--lit);stroke:var(--litline);stroke-width:2}.k.arep{fill:var(--behavface);stroke:var(--behav);stroke-width:2}.k.pick{cursor:pointer}`
        + `.t{font:${fs}px Arimo,Arial;fill:var(--text);text-anchor:middle;pointer-events:none}.t.h{font-size:${Math.round(u * 0.2)}px;fill:var(--muted)}.t.hb{font-size:${Math.round(u * 0.2)}px;fill:var(--behav)}.t.lay{font-size:${Math.round(u * 0.2)}px;fill:var(--litline);text-anchor:end}`
        + `.ln{stroke:var(--link);stroke-width:2}`
        + `.pill{cursor:pointer}.pill rect{fill:var(--control);stroke:var(--muted)}.pill text{font:${Math.round(u * 0.24)}px Arimo,Arial;fill:var(--text);text-anchor:middle}.pill.on rect{fill:var(--accent);stroke:var(--accent)}.pill.on text{fill:var(--accent-text)}.pill.bad rect{stroke:var(--warn);stroke-width:1.5}.pill.off{opacity:.45}</style>`
        + `<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  const gap = Math.max(1, u * 0.06);
  keys.forEach((k, idx) => {
    const layer = lit.get(k);
    const cls = 'k pick' + (layer !== undefined ? ' cur' : arep.has(k) ? ' arep' : '');
    const [ox, oy] = P([k.rx, k.ry]);
    s += `<g${k.r ? ` transform="rotate(${k.r} ${ox} ${oy})"` : ''} data-kidx="${idx}">`;
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, hh = k.h * u - 2 * gap;
    const tip = `<title>${sends[idx][0]}${sends[idx][1] ? ' · layer 1: ' + sends[idx][1] : ''}</title>`;
    s += `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2)
      s += `<rect class="${cls}" x="${(k.x + k.x2 - bd.x0) * u + gap}" y="${(k.y + k.y2 - bd.y0) * u + gap}" width="${k.w2 * u - 2 * gap}" height="${k.h2 * u - 2 * gap}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    const kc = layer ? sends[idx][layer] : sends[idx][0], kk = K[kc] || { m: '', h: '' };
    if (kk.h) s += `<text class="t ${kk.cls === 'behav' ? 'hb' : 'h'}" x="${x + w / 2}" y="${y + u * 0.26}">${kk.h}</text>`;
    s += `<text class="t" x="${x + w / 2}" y="${y + hh / 2 + fs * 0.35 + (kk.h ? u * 0.08 : 0)}">${kk.m.replace('&', '&amp;').replace('<', '&lt;')}</text>`;
    if (layer) s += `<text class="t lay" x="${x + w - u * 0.08}" y="${y + u * 0.24}">L${layer}</text>`;
    s += `</g>`;
  });
  // A tag under the last key: the modifiers held with it, and what Alt Repeat then sends.
  const tagOf = (kc, mods, r, sends, i, on, dy) => {
    const a = kc && !forgotten(kc) && locate(kc);
    if (!a) return '';
    const [cx, ky] = P(centreOf(a.keys[0])), cy = ky + u * 0.5 + dy;
    const text = `${mods.length ? (r ? 'R' : '') + mods.join('+') + ' ' : ''}→ ${sends || '∅'}`;
    const pw = Math.max(u * 0.7, text.length * u * 0.14 + u * 0.24), ph = u * 0.36, p = state.ars[i];
    return `<g class="pill${on ? ' on' : ''}${hasWarning(i) ? ' bad' : ''}${isOn(p) ? '' : ' off'}" data-ar="${i}"><title>${label(i)}: ${sentence(p).replace(/<[^>]+>/g, '')}</title>`
         + `<line class="ln" x1="${cx}" y1="${ky}" x2="${cx}" y2="${cy - ph / 2}"/><rect x="${cx - pw / 2}" y="${cy - ph / 2}" width="${pw}" height="${ph}" rx="${ph / 2}"/><text x="${cx}" y="${cy + u * 0.085}">${text.replace('&', '&amp;').replace('<', '&lt;')}</text></g>`;
  };
  const tagsOf = (p, i, on, seen) => {
    if (isEmpty(p)) return '';
    const alike = has(p, OPT.alike);
    const one = (kc, mods, r, out) => { const n = seen.get(kc) || 0; seen.set(kc, n + 1); return tagOf(kc, mods, r && !alike, out, i, on, n * u * 0.42); };
    let t = one(p.key, p.req, p.reqR, keyShort(p.alt, p.altMods, p.altR, false));
    if (has(p, OPT.both)) t += one(p.alt, p.altMods, p.altR, keyShort(p.key, p.req, p.reqR, alike));
    return t;
  };
  const seen = new Map();
  if (state.show === 'Every entry') state.ars.forEach((p, i) => { if (i !== state.ar) s += tagsOf(p, i, false, seen); });
  s += tagsOf(o, state.ar, true, seen);
  return s + `</g></svg>`;
}

function stripHtml() {
  let b;
  if (!byKeys())
    b = state.ars.map((o, i) => `<button class="${i === state.ar ? 'on' : ''}${isEmpty(o) ? ' empty' : ''}${!isEmpty(o) && !isOn(o) ? ' off' : ''}" data-ar="${i}" title="${isEmpty(o) ? 'Empty' : sentence(o).replace(/<[^>]+>/g, '')}">${label(i)}${dirty(i) ? '<span class="dot"></span>' : ''}</button>`).join('');
  else {
    const free = state.ars.filter(isEmpty).length;
    b = state.ars.map((o, i) => ({ o, i })).filter(x => !isEmpty(x.o) || x.i === state.ar)
      .map(({ o, i }) => `<button class="named${i === state.ar ? ' on' : ''}${!isEmpty(o) && !isOn(o) ? ' off' : ''}" data-ar="${i}" title="Slot ${i}">${isEmpty(o) ? 'New' : refOf(i)}${hasWarning(i) ? '<span class="bang">!</span>' : ''}${dirty(i) ? '<span class="dot"></span>' : ''}</button>`).join('')
      + `<button class="named" data-act="new" title="${free} of ${state.ars.length} slots free">+ New</button>`;
  }
  return `<div class="stripwrap"><button class="sarrow" data-scroll="-1" title="Earlier">◀</button>`
       + `<div class="strip" id="strip">${b}</div><span class="fade l"></span><span class="fade r"></span>`
       + `<button class="sarrow" data-scroll="1" title="Later">▶</button></div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  buildBoard();
  document.getElementById('frame').innerHTML =
    `<div class="menubar"><span class="board">${BOARD.b.name} ▾</span><span class="muted">Vial</span><span class="right">Settings</span></div>`
  + `<div class="body"><div class="col"><div class="entry">Keymap</div><div class="entry">Layout</div><div class="entry">Macros</div><div class="entry">Tap Dance</div><div class="entry">Combos</div><div class="entry">Key Overrides</div><div class="entry on">Alt Repeat Key</div><div class="entry">QMK Settings</div></div>`
  + `<div class="main">${stripHtml()}<div class="boardarea">${boardSvg()}</div><div class="panel">${renderPanel()}</div></div></div>`;
  placeStrip();
}

function placeStrip() {
  const s = document.getElementById('strip');
  s.style.scrollBehavior = 'auto';
  s.scrollLeft = state.stripScroll;
  const on = s.querySelector('button.on');
  if (on) {
    const l = on.offsetLeft - s.offsetLeft, r = l + on.offsetWidth;
    if (l < s.scrollLeft) s.scrollLeft = l - 30;
    else if (r > s.scrollLeft + s.clientWidth) s.scrollLeft = r - s.clientWidth + 30;
  }
  s.style.scrollBehavior = '';
  s.onscroll = stripEdges;
  s.onwheel = e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && s.scrollWidth > s.clientWidth) { e.preventDefault(); s.scrollLeft += e.deltaY; } };
  stripEdges();
}
function stripEdges() {
  const s = document.getElementById('strip'), w = s.parentElement;
  state.stripScroll = s.scrollLeft;
  const more = s.scrollWidth > s.clientWidth + 1;
  w.querySelector('.fade.l').classList.toggle('on', more && s.scrollLeft > 1);
  w.querySelector('.fade.r').classList.toggle('on', more && s.scrollLeft < s.scrollWidth - s.clientWidth - 1);
  w.querySelectorAll('[data-scroll]').forEach(b => {
    b.style.display = more ? '' : 'none';
    b.disabled = !more || (+b.dataset.scroll < 0 ? s.scrollLeft <= 1 : s.scrollLeft >= s.scrollWidth - s.clientWidth - 1);
  });
}

function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['setup', 'Board', Object.keys(SETUPS)],
   ['slots', 'Slots', ['Strip, numbered', 'Strip, by their keys']],
   ['bothAt', 'Both ways', ['In the arrow', 'A box']],
   ['show', 'The board shows', ['The selected entry', 'Every entry']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => {
        const was = state.setup; state[k] = v;
        if (k === 'setup' && was !== v) reset();
        state.msg = null; render();
      };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

// ---------------------------------------------------------------------------------------------
// Editing. The last key, the alt key or the allowed modifiers is selected; a picked key sets the
// selected key; a click on a board key sets it to what that key sends on layer 0.
const changed = () => { state.msg = null; };
const startNew = o => { if (isEmpty(o)) o.opts = NEW_OPTS; };
const toggleIn = (list, n) => list.includes(n) ? list.filter(x => x !== n) : Object.keys(MBIT).filter(x => x === n || list.includes(x));
function setKey(o, kc) {
  startNew(o);
  if (state.sel === 'alt') { o.alt = kc; }
  else { o.key = kc; state.sel = o.alt ? 'key' : 'alt'; }
}
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-scroll],[data-ar],[data-sel],[data-key],[data-tab],[data-act],[data-fix],[data-kidx],[data-mod],[data-side],[data-req],[data-rside],[data-amod]');
  if (!t) return;
  const d = t.dataset, o = cur();
  if (d.scroll !== undefined) { const s = document.getElementById('strip'); s.scrollLeft += +d.scroll * (s.clientWidth - 60); return; }
  if (d.ar !== undefined) { state.ar = +d.ar; state.sel = isEmpty(cur()) ? 'key' : 'alt'; state.msg = null; }
  else if (d.sel !== undefined) state.sel = d.sel;
  else if (d.tab !== undefined) state.tab = d.tab;
  else if (d.kidx !== undefined) {
    const s = BOARD.sends[+d.kidx], kc = s[0] && s[0] !== 'KC_NO' ? s[0] : s[1];
    if (!kc || kc === 'KC_NO') return;
    const real = K[kc] && K[kc].tap && state.sel === 'key' ? K[kc].tap : kc;   // a tap-hold is remembered as its tap
    if (state.sel === 'allowed') state.sel = 'key';
    if (state.sel === 'key' && forgotten(real)) { state.msg = ['warn', `${legend(real)} is never the last key: QMK does not remember ${forgotten(real)}`]; render(); return; }
    setKey(o, real); changed();
  }
  else if (d.key !== undefined) {
    if (state.sel === 'allowed') state.sel = 'key';
    if (state.sel === 'key' && forgotten(d.key)) return;
    if (state.sel === 'alt' && (d.key === 'QK_REP' || d.key === 'QK_AREP')) return;
    setKey(o, d.key); changed();
  }
  else if (d.req !== undefined) { startNew(o); o.req = toggleIn(o.req, d.req); changed(); }
  else if (d.amod !== undefined) { startNew(o); o.altMods = toggleIn(o.altMods, d.amod); o.altR = false; changed(); }
  else if (d.rside !== undefined) { o.reqR = d.rside === 'Right'; changed(); }
  else if (d.mod !== undefined) {
    const mask = o.allowed, bits = 0x11 << MBIT[d.mod], side = has(o, OPT.alike) ? 'Either' : sideOf(mask);
    const add = side === 'Left' ? 0x01 << MBIT[d.mod] : side === 'Right' ? 0x10 << MBIT[d.mod] : bits;
    startNew(o); o.allowed = mask & bits ? mask & ~bits : mask | add;
    changed();
  }
  else if (d.side !== undefined) {
    const any = (o.allowed | (o.allowed >> 4)) & 0x0F;
    o.allowed = d.side === 'Left' ? any : d.side === 'Right' ? any << 4 : any | (any << 4);
    changed();
  }
  else if (d.fix !== undefined) {
    if (d.fix === 'on') o.opts |= OPT.on;
    else if (d.fix === 'left') { if (o.reqR) { o.reqR = false; o.opts |= OPT.alike; } o.altR = false; }
    changed();
  }
  else if (d.act === 'both') { startNew(o); o.opts ^= OPT.both; changed(); }
  else if (d.act === 'toggle') { o.opts ^= OPT.on; changed(); }
  else if (d.act === 'emptykey') { o.key = null; o.req = []; changed(); }
  else if (d.act === 'emptyalt') { o.alt = null; o.altMods = []; changed(); }
  else if (d.act === 'clear') { state.ars[state.ar] = blank(); state.sel = 'key'; changed(); }
  else if (d.act === 'new') { const i = state.ars.findIndex(isEmpty); if (i < 0) state.msg = ['warn', 'Every slot is in use']; else { state.ar = i; state.sel = 'key'; } }
  else if (d.act === 'save') { state.saved = JSON.stringify(state.ars); state.msg = ['ok', 'Stored -- every changed entry, read back the same']; }
  else if (d.act === 'revert') { state.ars = savedList(); state.msg = null; }
  render();
});
frame.addEventListener('change', e => {
  const d = e.target.dataset, o = cur();
  if (d.opt !== undefined) { startNew(o); o.opts ^= +d.opt; changed(); render(); }
});

document.getElementById('notes').innerHTML = `
<p><b>What Alt Repeat is.</b> A key, <b>Alt Repeat</b> (QK_AREP), that sends what goes with the last key typed -- after
Ctrl+Z, Ctrl+Y. QMK pairs a few keys itself when no entry matches: ← and →, ↑ and ↓, Home and End, Page Up and Down, Bksp
and Del, [ and ], media and volume. Vial adds <b>entries</b>: a last key, with the modifiers held with it, and what Alt
Repeat then sends. The last key is the last one QMK remembers -- <b>never a modifier, a layer key, a one-shot key or a
Repeat key</b> (AR 8); a home-row mod counts as its letter. Vial only; the facts, from vial-qmk's vial.c and QMK's
repeat_key.c, are in ui-design.md.</p>
<p><b>The modifiers</b>: those held with the last key are part of it -- Ctrl+Z needs Ctrl. <b>May also be held</b> names
the others allowed; any other held, the entry does not apply (Shift+Z after Ctrl+Z is not Ctrl+Z). <b>Left or right
alike</b> makes Right Ctrl count as Ctrl -- on for a new entry, so the side is chosen only when it is wanted. Two entries
for one key: <b>the one with more modifiers wins</b>, then the first (AR 9 under AR 0).</p>
<p><b>A firmware bug</b> found reading vial.c: what Alt Repeat sends is built from 8-bit modifiers where QMK's keycode holds
5 -- left modifiers come out right, <b>right ones are lost</b>: Right Ctrl+Y sends Y, Right Alt and Right Win send
another keycode altogether (AR 7). Nazg writes left modifiers in what is sent, and says so when it reads a right one.</p>
<p><b>Both ways</b> (bidirectional): after the alt key, Alt Repeat sends the last key -- Tab and Shift+Tab (AR 2). Set
<b>in the arrow</b>, a click turning → into ⇄, or <b>a box</b> beside the other two.</p>
<p><b>After any other key too</b> (default to this alt key): when no entry has the last key, this entry's alt key is sent
-- the first such entry wins (AR 6). <b>QMK's own pairs are then never reached</b>: AR 4 (← ⇄ →) becomes needed. Turn AR 6
off and AR 4 says it changes nothing.</p>
<p><b>The board</b> shows the last key lit, a tag under it naming the modifiers held and what is sent, and with both ways
the alt key too; the Alt Repeat key itself is drawn in its behaviour colour, so the section shows where it is. A board
with no Alt Repeat key says so (the Model F). <b>Every entry</b> tags every last key at once.</p>
<p><b>Slots</b>: <b>numbered</b>, AR 0..AR 15, as Combos and Key Overrides; or <b>named by their keys</b> (Ctrl+Z⇄Ctrl+Y).
An entry off is struck through (AR 5). <b>Writing</b>: Save / Revert, read when the section first opens. A new entry
starts on, left and right alike -- where Vial's reset slot is off. The picker greys, for the last key, what is never
remembered, and for what is sent, the Repeat keys; anything else can be sent, a macro or a layer key too.</p>`;

render();
</script>
