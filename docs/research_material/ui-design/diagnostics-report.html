<!-- Mockup: Signal levels watching the keys at rest while another is pressed, and a report saved as one
     HTML file (ui-design.md, "Plugins", "Signal levels, fourth round"; the rounds before are
     diagnostics-section.html, key-health.html and levels-on-keys.html).

     First draft (2026-11-14), from Rico's two ideas: keep the levels of the keys at rest while another
     key is pressed, to see whether pressing one disturbs the others; and save a report -- the key
     presses as the section shows them, and the keys whose level moves abnormally at rest.

     Second draft (2026-11-15): the section page redrawn on Signal levels as built (Rico: the first draft's
     view differed a lot from the last round) -- DrawLevelsPanel()'s first line, the key in focus, the
     summary, the bars beside the key's last presses, Levels and Controller working; only the new parts
     outlined. The bars gain a hollow ring where another key's press takes a key at rest.

     What Rico's F77 says (the 4-minute recording, 2026-10-17, every key pressed slowly): pressing a key
     moves the keys on the same controller column, the next controller row, 2 to 4 towards their
     threshold -- 122 pairs, every one of them neighbours on the controller -- against 0 or 1 when no key
     is pressed. Its keys rest 6 to 13 from their threshold, so nothing comes close: healthy, and the
     measure of what a healthy board does. Every number here is the recording's, per key and per pair;
     the verdicts are this mockup's approximation of Nazg's rules. "Made-up coupling" changes two pairs
     to show what Nazg says when it matters: D brings F to 1 from its threshold, J takes U past it.

     The variants:
     - the F77 as recorded, or with the two made-up pairs;
     - (settled, Rico 2026-11-15: the finding a reason in the verdicts only -- the third tab, Other keys,
       every key moved, was dropped);
     - (settled, Rico 2026-11-15: on the board, the key in focus has the keys its own press moves most
       outlined in dashes, grey when safe, orange when close to their threshold, red when past it);
     - (settled, Rico 2026-11-15: the key's detail on one scale, a line per key moving it; Save report...
       beside Clear on the summary line);
     - the report (second draft, 2026-11-15: Signal levels' own view, its script only showing and hiding):
       its script running or off (printed, or blocked) -- shown, not a choice. Settled (Rico, 2026-11-15):
       tested keys plain, untested hatched; the readings embedded; the safe pairs folded. -->

    + `<text x="${x0 - 8}" y="11" text-anchor="end" fill="var(--muted)">&lt;- further from it is safer</text><text x="${x0 + 8}" y="11" fill="var(--muted)">further past it is safer -&gt;</text>`;
  judged.forEach((k, i) => {

    + `<rect x="10" y="${Y(k.hi)}" width="28" height="${Math.max(2, Y(k.lo) - Y(k.hi) + 2)}" fill="var(--muted)" opacity=".35"/>`

      + `<polyline fill="none" stroke="var(--press)" stroke-width="1.6" points="${tr.map((v, i) => `${X(i)},${Y(v)}`).join(' ')}"/>`
      + centred(hold === null ? 'too short to measure' : `held ${hold - k.th} past`, wordsY, 'var(--ok)')

// One line of levels: the key's band at rest, its threshold, the safe margin before it, and where each

    + `<rect x="${X(k.lo)}" y="6" width="${Math.max(3, X(k.hi) - X(k.lo))}" height="10" rx="2" fill="var(--muted)" opacity=".45"/>`
    + `<text x="${L - 8}" y="15" font-size="11" text-anchor="end" fill="var(--muted)">nothing pressed</text>`

    s += `<text x="${L - 8}" y="${y + 4}" font-size="11" text-anchor="end" fill="var(--text)">${esc(nameOf(p.a))} pressed</text>`
      + `<line x1="${X(k.rest)}" y1="${y}" x2="${X(to) - 5}" y2="${y}" stroke="${col}" stroke-width="2"/>`

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  build();
  renderControls();
  // The folded sections stay as the reader left them: the report's script only shows and hides.
  const stageEl = document.getElementById('stage');
  const opened = [...stageEl.querySelectorAll('details')].map(d => d.open);
  stageEl.innerHTML = state.page === 'Section' ? sectionHtml() : reportHtml();
  stageEl.querySelectorAll('details').forEach((d, i) => { if (opened[i]) d.open = true; });
}
function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  const groups = [['page', 'Show', ['Section', 'Report']], ['board', 'Board', ['As recorded', 'Made-up coupling']]];
  if (state.page === 'Report')
    groups.push(['script', 'Its script', ['Running', 'Off (printed or blocked)']]);
  groups.push(['theme', 'Theme', ['Light', 'Dark']]);
  groups.forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => { state[k] = v; render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}
const stage = document.getElementById('stage');
stage.addEventListener('click', e => {
  const t = e.target.closest('[data-key], [data-tab], [data-act], [data-view], [data-set-theme]');
  if (!t) { if (state.menu) { state.menu = false; render(); } return; }
  if (t.dataset.key) state.selected = t.dataset.key;
  if (t.dataset.tab) state.tab = t.dataset.tab;
  if (t.dataset.view) state.view = t.dataset.view;
  if (t.dataset.act === 'levels') state.levels = !state.levels;
  if (t.dataset.setTheme) state.theme = t.dataset.setTheme;
  if (t.dataset.act === 'menu') { state.menu = !state.menu; render(); return; }
  if (t.dataset.act === 'save') { state.menu = false; state.saved = true; }
  render();
});
const tip = document.getElementById('tip');
stage.addEventListener('mousemove', e => {
  const r = e.target.closest('rect[data-tip]');
  if (r) { tip.textContent = r.dataset.tip; tip.style.display = 'block'; } else tip.style.display = 'none';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 380) + 'px'; tip.style.top = (e.clientY + 18) + 'px';
});
stage.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
