<!-- Mockup: Signal levels watching the keys at rest while another is pressed, and a report saved as one
     HTML file (ui-design.md, "Plugins", "Signal levels, fourth round"; the rounds before are
     diagnostics-section.html, key-health.html and levels-on-keys.html).

     First draft (2026-11-14), from Rico's two ideas: keep the levels of the keys at rest while another
     key is pressed, to see whether pressing one disturbs the others; and save a report -- the key
     presses as the section shows them, and the keys whose level moves abnormally at rest.

     What Rico's F77 says (the 4-minute recording, 2026-10-17, every key pressed slowly): pressing a key
     moves the keys on the same controller column, the next controller row, 2 to 4 towards their
     threshold -- 122 pairs, every one of them neighbours on the controller -- against 0 or 1 when no key
     is pressed. Its keys rest 6 to 13 from their threshold, so nothing comes close: healthy, and the
     measure of what a healthy board does. Every number here is the recording's, per key and per pair;
     the verdicts are this mockup's approximation of Nazg's rules. "Made-up coupling" changes two pairs
     to show what Nazg says when it matters: D brings F to 1 from its threshold, J takes U past it.

     The variants:
     - the F77 as recorded, or with the two made-up pairs;
     - where the new finding shows: a reason in the verdicts, as any other (proposed), or also a third
       tab, Other keys, listing every key moved, the most moved first;
     - on the board, the key in focus: the keys moving it outlined, those it moves too, or nothing;
     - the key's own detail: its readings while each other key was pressed on one scale, or words only;
     - where Save report... sits: beside Clear on the summary line, or in the board menu beside Save to file...;
     - the report: the key presses as the board only or the board and the controller's grid; the
       pairs that move a little but stay safe listed (folded) or left out; the readings embedded
       (Nazg could read them back, a tester's report becoming a recording) or left out. -->

    + `.t{font-family:Arimo,Arial;fill:var(--text);text-anchor:middle;pointer-events:none}`
    + `.ruler{font:11px Arimo,Arial;fill:var(--muted);text-anchor:middle}</style>`;
}
function boardSvg(classOf, u, interactive) {
  const bd = boundsOf(KEYS);
  const m = u * 0.35, gap = Math.max(1, u * 0.06);
  const W = (bd.x1 - bd.x0) * u + 2 * m, H = (bd.y1 - bd.y0) * u + 2 * m;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">${svgStyle()}<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  for (const k of KEYS) {
    const attrs = interactive ? ` data-key="${k.c}" data-tip="${esc(tipOf(k))}"` : '';
    const rect = (x, y, w, h) => `<rect class="${classOf(k)}"${attrs} x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.max(2, u * 0.1)}"/>`;
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, h = k.h * u - 2 * gap;
    s += rect(x, y, w, h);
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2) s += rect((k.x + k.x2 - bd.x0) * u + gap, (k.y + k.y2 - bd.y0) * u + gap, k.w2 * u - 2 * gap, k.h2 * u - 2 * gap);
    const fs = Math.round(u * 0.28);
    s += `<text class="t" x="${x + w / 2}" y="${y + h / 2 + fs * 0.35}" style="font-size:${fs}px">${esc(legendOf(k.kc))}</text>`;
  }
  return s + `</g></svg>`;
}
// The controller's own grid: its columns and rows, as Key presses' Controller view.
function controllerSvg(classOf) {
  const C = REC.info.controllerColumns, R = REC.info.controllerRows, cw = 50, ch = 34, lab = 30;
  const at = new Map(KEYS.map(k => [`${k.cc},${k.cr}`, k]));
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${lab + C * cw + 8}" height="${lab + R * ch + 8}">${svgStyle()}<rect class="plate" width="100%" height="100%" rx="10"/>`;
  for (let c = 0; c < C; c++) s += `<text class="ruler" x="${lab + c * cw + cw / 2}" y="${lab - 10}">${c}</text>`;
  for (let r = 0; r < R; r++) s += `<text class="ruler" x="${lab / 2 + 2}" y="${lab + r * ch + ch / 2 + 4}">${r}</text>`;
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const k = at.get(`${c},${r}`), x = lab + c * cw + 2, y = lab + r * ch + 2;
    if (!k) { s += `<rect class="k none" x="${x}" y="${y}" width="${cw - 4}" height="${ch - 4}" rx="4"/>`; continue; }
    s += `<rect class="${classOf(k)}" x="${x}" y="${y}" width="${cw - 4}" height="${ch - 4}" rx="4"/>`
       + `<text class="t" x="${x + (cw - 4) / 2}" y="${y + (ch - 4) / 2 + 4}" style="font-size:11px">${esc(legendOf(k.kc))}</text>`;
  }
  return s + `</svg>`;
}
function tipOf(k) {
  const v = V.get(k);
  let t = `${nameOf(k)} · ${WORD[v.verdict]}\n${v.reasons.join('\n')}`;
  const m = movesOf(k);
  if (m.length) t += `\nMoved when pressed: ${m.map(p => nameOf(p.a)).join(', ')}`;
  return t;
}

// The section.
function sectionClass(k) {
  let c = 'k ' + (V.get(k).verdict === 'todo' ? '' : V.get(k).verdict);
  const sel = byCell.get(state.selected);
  if (sel === k) return c + ' sel';
  if (sel && state.outline !== 'Nothing') {
    const p = movesOf(sel).find(q => q.a === k);
    if (p) return c + ' mover' + (p.left >= SAFE ? ' calm' : '');

}
function summaryHtml() {
  const chip = v => `<span class="chip"><i style="border-color:var(${COL[v]});background:${v === 'good' ? 'var(--good)' : v === 'risk' ? 'var(--risk)' : v === 'fail' ? 'var(--fail)' : 'transparent'}"></i>${count(v)} ${WORD[v]}</span>`;

function listHtml() {

    + `<span class="muted">${state.tab === 'Other keys' ? 'the keys moved most when another is pressed, first' : 'the weakest first'}</span></div>`;

  if (state.tab === 'Other keys') return h + otherKeysHtml();

// The third tab: every key moved, the most moved first, as a bar of its margin at rest.
function otherKeysHtml() {
  const seen = new Set(), rows = [];
  for (const p of PAIRS) { if (seen.has(p.b)) continue; seen.add(p.b); rows.push(p); }
  let h = `<div class="muted" style="font-size:11px;margin:0 0 4px 6px">the key at rest · the key pressed · its margin at rest, the part the press takes in colour</div>`;
  for (const p of rows.slice(0, 9)) {
    const W = 150, X = v => Math.max(0, Math.min(W, v / Math.max(14, p.margin) * W));
    const col = p.left <= 0 ? 'var(--err)' : p.left < SAFE ? 'var(--warn)' : 'var(--muted)';
    h += `<div class="row${state.selected === p.b.c ? ' sel' : ''}" data-key="${p.b.c}"><span class="kn">${esc(nameOf(p.b))}</span>`
      + `<span class="muted" style="min-width:70px">← ${esc(nameOf(p.a))}</span>`
      + `<svg width="${W + 4}" height="12"><rect x="0" y="2" width="${X(p.margin)}" height="8" rx="2" fill="var(--border)"/>`
      + `<rect x="0" y="2" width="${X(Math.min(p.typ, p.margin + 2))}" height="8" rx="2" fill="${col}"/>`
      + `<line x1="${X(p.margin - SAFE)}" y1="0" x2="${X(p.margin - SAFE)}" y2="12" stroke="var(--warn)" stroke-dasharray="2 2"/></svg>`
      + `<span class="why muted">${p.left <= 0 ? 'past its threshold' : p.left < SAFE ? 'close to its threshold' : 'safe'}</span></div>`;
  }
  return h + `<div class="muted" style="padding:4px 6px">and ${Math.max(0, rows.length - 9)} more, each moved a little and safe.</div>`;
}
// The key in focus: its last presses (as built), then what the other keys' presses did to it.
function detailHtml() {
  const k = byCell.get(state.selected);
  if (!k) return `<div class="muted">Click a key, on the board or in the list, to see its levels.</div>`;
  const v = V.get(k);
  let h = `<div><b>${esc(nameOf(k))}</b> · <span style="color:var(${COL[v.verdict]})">${WORD[v.verdict]}</span></div>`
    + `<div class="ph" style="margin-top:6px">As built: its last presses side by side, the threshold dashed, its band at rest.</div>`;
  const ms = movesOf(k);
  h += `<div class="new" style="padding:2px 4px;margin-top:10px"><div class="dtitle" style="margin-top:2px">While other keys are pressed</div>`;
  if (!ms.length) return h + `<div class="say muted">No other key's press moves it.</div></div>`;
  const worst = ms[0];
  h += `<div class="say">${worst.left <= 0 ? `It went past its threshold each time ${esc(nameOf(worst.a))} was pressed: it types by itself.`
      : worst.left < SAFE ? `${esc(nameOf(worst.a))} brings it close to its threshold: it may type by itself while ${esc(nameOf(worst.a))} is held.`
      : `${ms.map(p => esc(nameOf(p.a))).join(' and ')} move${ms.length > 1 ? '' : 's'} it a little, and it stays well short of its threshold.`}</div>`;
  if (state.detail === 'One scale') h += scaleSvg(k, ms);

}
// One line of levels: the key's band at rest, its threshold, the safe margin before it, and where each
// key pressed took it -- its usual move, an arrow from its resting level.
function scaleSvg(k, ms) {
  const lo = k.rest - 6, hi = k.th + 4, W = 420, L = 110, X = v => L + (v - lo) / (hi - lo) * (W - L - 10);
  const H = 22 + ms.length * 20;
  let s = `<svg width="${W}" height="${H + 18}" style="margin-top:4px">`
    + `<rect x="${X(k.th - SAFE)}" y="4" width="${X(k.th) - X(k.th - SAFE)}" height="${H - 4}" fill="var(--warn)" opacity=".12"/>`
    + `<rect x="${X(k.lo)}" y="6" width="${Math.max(3, X(k.hi) - X(k.lo))}" height="10" rx="2" fill="var(--muted)" opacity=".45"/>`
    + `<text x="${L - 8}" y="15" font-size="11" text-anchor="end" fill="var(--muted)">nothing pressed</text>`
    + `<line x1="${X(k.th)}" y1="2" x2="${X(k.th)}" y2="${H}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>`;
  ms.forEach((p, i) => {
    const y = 30 + i * 20, to = k.rest + p.typ, col = p.left <= 0 ? 'var(--err)' : p.left < SAFE ? 'var(--warn)' : 'var(--text)';
    s += `<text x="${L - 8}" y="${y + 4}" font-size="11" text-anchor="end" fill="var(--text)">${esc(nameOf(p.a))} pressed</text>`
      + `<line x1="${X(k.rest)}" y1="${y}" x2="${X(to) - 5}" y2="${y}" stroke="${col}" stroke-width="2"/>`
      + `<path d="M${X(to)} ${y} l-6 -4 v8 z" fill="${col}"/>`;
  });
  return s + `<text x="${X(k.th)}" y="${H + 14}" font-size="11" text-anchor="middle" fill="var(--warn)">threshold</text></svg>`;
}

// The report: what Save report... writes. Plain HTML and inline SVG, no script, readable offline and printed.
function reportHtml() {
  const I = REC.info, bins = I.thresholds.length;
  const verdictClass = k => 'k ' + (V.get(k).verdict === 'todo' ? '' : V.get(k).verdict);
  const seenClass = k => k.presses ? 'k seen' : 'k';
  const seen = KEYS.filter(k => k.presses).length;
  const vcell = k => `<span class="verdict ${V.get(k).verdict}">${WORD[V.get(k).verdict]}</span>`;
  const pos = k => `R${k.cell[0]} C${k.cell[1]}`, cpos = k => `${k.cc}, ${k.cr}`;
  let h = `<div class="filebar">nazg-F77-2026-11-14.html · ${state.readings === 'Embedded' ? `${Math.round(REC.jsonBytes / 1024 + 60)} KB, the readings inside` : 'about 60 KB'} · opened in the browser</div><div class="doc">`
    + `<h1>Leyden Jar diagnostics: leyden_jar/F77</h1><p class="sub">Saved by Nazg 0.1.0-test.8 on 14 November 2026 at 15:42 · ${REC.readings} level readings over ${Math.round(REC.seconds / 60)} minutes · threshold margins 3 at rest, 3 pressed</p>`;
  // The board and its controller, as Device shows them.
  h += `<h2>The keyboard</h2><dl>`
    + `<dt>Keyboard</dt><dd>${esc(REC.board)}</dd>`
    + `<dt>Controller</dt><dd>Leyden Jar, protocol ${I.version}, ${I.beamSpring ? 'Beam Spring' : 'Model F'}</dd>`
    + `<dt>Matrix</dt><dd>QMK ${I.logicalRows} × ${I.logicalColumns}, controller ${I.controllerRows} rows × ${I.controllerColumns} columns</dd>`
    + `<dt>Bins</dt><dd>${bins}: thresholds ${I.thresholds.join(', ')}, resting references ${I.referenceLevels.join(', ')}</dd>`
    + `<dt>Vial and USB</dt><dd class="muted">as the Device mode shows them: Vial protocol, keyboard UID, VID:PID, release</dd></dl>`;
  // Signal levels' verdicts.
  const chip = v => `<span><span class="verdict ${v}">${count(v)}</span> ${WORD[v]}</span>`;
  h += `<h2>Signal levels</h2><div class="counts">${['good', 'risk', 'fail', 'todo'].map(chip).join('')}</div>`
    + `<div class="figure">${boardSvg(verdictClass, 36, false)}</div>`;
  const bad = KEYS.filter(k => V.get(k).verdict !== 'good').sort((a, b) => ORDER[V.get(a).verdict] - ORDER[V.get(b).verdict]);
  h += `<table><tr><th>Key</th><th>Matrix</th><th>Verdict</th><th>Why</th></tr>`
    + bad.map(k => `<tr><td><b>${esc(nameOf(k))}</b></td><td>${pos(k)}</td><td>${vcell(k)}</td><td>${V.get(k).reasons.map(esc).join('<br>')}</td></tr>`).join('') + `</table>`;
  // The keys at rest moved by another's press: the new finding.
  const risky = PAIRS.filter(p => p.left < SAFE), safe = PAIRS.filter(p => p.left >= SAFE);
  const pairRow = p => `<tr><td><b>${esc(nameOf(p.b))}</b></td><td>${esc(nameOf(p.a))}</td><td>${pos(p.b)} · ${cpos(p.b)}</td><td>${pos(p.a)} · ${cpos(p.a)}</td>`
    + `<td class="n">${p.margin}</td><td class="n">${p.typ}</td><td class="n">${p.most}</td><td class="n">${p.left <= 0 ? `<span class="verdict fail">${p.left < 0 ? `past by ${-p.left}` : 'reached it'}</span>` : p.left}</td><td class="n">${p.n}</td></tr>`;
  const head = `<tr><th>At rest</th><th>Pressed</th><th>Its matrix · controller</th><th>Pressed's</th><th class="n">At rest, from threshold</th><th class="n">Usual move</th><th class="n">Most</th><th class="n">Left</th><th class="n">Presses</th></tr>`;
  h += `<h2>Keys moved by another key's press</h2>`
    + `<p>While a key is pressed alone, every other key's level is watched. These come closer than ${SAFE} to their threshold, or past it, `
    + `when the key beside them is pressed: they may type by themselves.</p>`
    + (risky.length ? `<table>${head}${risky.map(pairRow).join('')}</table>` : `<p class="ok">No key comes close to its threshold when another is pressed.</p>`);
  if (state.safe === 'Folded')
    h += `<details><summary>${safe.length} more pairs move by 2 or more and stay safe -- the keyboard's usual coupling</summary>`
      + `<p class="muted">On this board, every one is a key and its neighbour on the controller: the same column, the next row.</p><table>${head}${safe.map(pairRow).join('')}</table></details>`;
  // Key presses, as the mode shows them.
  h += `<h2>Key presses</h2><p>${seen} of ${KEYS.length} keys seen pressed since the readings started.</p><div class="figure">${boardSvg(seenClass, 36, false)}</div>`;
  if (state.presses === 'Board and controller')
    h += `<p class="muted">The same, on the controller's connectors: its columns across, its rows down.</p><div class="figure">${controllerSvg(seenClass)}</div>`;
  // Every key's numbers, folded: Levels' numbers for firmware work.
  h += `<details><summary>Every key's numbers</summary><table><tr><th>Key</th><th>Matrix</th><th>Controller</th><th class="n">Bin</th><th class="n">Threshold</th>`
    + `<th class="n">At rest</th><th class="n">Lowest</th><th class="n">Highest</th><th class="n">Firmest press</th><th class="n">Presses</th><th>Verdict</th></tr>`
    + KEYS.map(k => `<tr><td>${esc(nameOf(k))}</td><td>${pos(k)}</td><td>${cpos(k)}</td><td class="n">${k.bin}</td><td class="n">${k.th}</td><td class="n">${k.rest}</td>`
      + `<td class="n">${k.lo ?? '–'}</td><td class="n">${k.hi ?? '–'}</td><td class="n">${k.peak ?? '–'}</td><td class="n">${k.presses}</td><td>${vcell(k)}</td></tr>`).join('') + `</table></details>`;
  if (state.readings === 'Embedded')
    h += `<h2>The readings</h2><p class="muted">Every level reading of this pass, ${REC.readings} of them, is kept in this file as JSON `
      + `(<code>&lt;script type="application/json" id="nazg-readings"&gt;</code>, ${Math.round(REC.jsonBytes / 1024)} KB) -- the recording format of Nazg's tests. `
      + `Nazg can read it back: send this file to the keyboard's maker.</p>`;
  return h + `</div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();

  document.getElementById('stage').innerHTML = state.page === 'Section' ? sectionHtml() : reportHtml();
}
function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  const groups = [['page', 'Show', ['Section', 'Report']], ['board', 'Board', ['As recorded', 'Made-up coupling']]];
  if (state.page === 'Section')
    groups.push(['where', 'The finding', ['A reason in the verdicts', 'Also a tab, Other keys']],
                ['outline', 'On the board, the key in focus', ['Keys moving it', 'Both ways', 'Nothing']],
                ['detail', 'The key\'s detail', ['One scale', 'Words only']],
                ['save', 'Save report...', ['Beside Clear', 'Board menu']]);
  else
    groups.push(['presses', 'Key presses', ['Board', 'Board and controller']],
                ['safe', 'Safe pairs', ['Folded', 'Left out']],
                ['readings', 'Readings', ['Embedded', 'Left out']]);
  groups.push(['theme', 'Theme', ['Light', 'Dark']]);
  groups.forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => { state[k] = v; if (k === 'where' && v === 'A reason in the verdicts' && state.tab === 'Other keys') state.tab = 'Keys'; render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}
const stage = document.getElementById('stage');
stage.addEventListener('click', e => {
  const t = e.target.closest('[data-key], [data-tab], [data-act]');
  if (!t) { if (state.menu) { state.menu = false; render(); } return; }
  if (t.dataset.key) state.selected = t.dataset.key;
  if (t.dataset.tab) state.tab = t.dataset.tab;
  if (t.dataset.act === 'menu') { state.menu = !state.menu; render(); return; }
  if (t.dataset.act === 'save') { state.menu = false; state.saved = true; }
  render();
});
const tip = document.getElementById('tip');
stage.addEventListener('mousemove', e => {

  tip.style.left = Math.min(e.clientX + 14, innerWidth - 380) + 'px'; tip.style.top = (e.clientY + 18) + 'px';
});
stage.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

<p><b>Where it shows</b>: a reason among the others, its words effect first as the rest ("May type by itself when D is pressed"),
and in the key's detail under its last presses: a line per key moving it, from its resting level to where that key's press took it,
the threshold dashed and the margin before it shaded. <b>Also a tab</b>: every key moved, most first -- the board's coupling at a
glance, which a designer may want; the verdicts already name the keys that matter.</p>
<p><b>On the board</b>, with a key in focus: the keys whose press moves it outlined in dashes, orange when it comes close, grey when
safe; <b>both ways</b> adds, in blue, the keys it moves itself.</p>
<p><b>The report</b> (Show: Report, or click Save report...): one HTML file, no script, readable anywhere and printable -- the
keyboard and its controller, Signal levels' verdicts on the board and the keys to look at, the keys moved by another key's press with
their numbers, the key presses seen on the board and on the controller's grid, every key's numbers folded. Numbers are in tables:
the report is for whoever repairs or builds the board, as Levels is. <b>The readings embedded</b> make a tester's report a
recording Nazg's tests can replay -- about 0.9 MB for 4 minutes; left out, the file is some 60 KB.</p>`;
