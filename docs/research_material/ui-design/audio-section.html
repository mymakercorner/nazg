<!-- Mockup of the Audio section (ui-design.md, "The Audio section").

     First round (2026-10-11). The section edits QMK's audio as VIA's built-in menu `qmk_audio`
     declares it: two toggles on custom channel 4, `id_qmk_audio_channel` -- value 1 audio on,
     value 2 clicky on. VIA's own menu (@the-via/reader 1.14.4, common-menus/qmk_audio.js) is
     "Audio" > "General" > "Audio Enable", "Audio Clicky Enable", drawn as any custom menu.

     What the firmware does, from QMK's quantum/via.c, quantum/audio/audio.c and
     quantum/process_keycode/process_clicky.c (Rico's fork, 2026-09), read 2026-10-11:
     - get [0x08][4][id] answers one byte, 0 or 1; set [0x07][4][id][v] sets the bit of
       audio_config in RAM -- silently: no song, unlike the AU_ON key -- and [0x09][4] stores it;
     - a firmware built without AUDIO_ENABLE answers 0xFF in byte 0 (id_unhandled);
     - clicks sound only while audio is on: process_clicky checks both bits;
     - the clicks' pitch (CK_UP, CK_DOWN, CK_RST), the voice (AU_NEXT, AU_PREV) and music mode
       (MU_*: keys play notes instead of typing) live in RAM only, out of reach of the wire, and
       are forgotten when the board is unplugged;
     - VIA's device indication (0x02 0x05) plays the board's indication song on value 0 and
       toggles each lighting system once per value: 0 then 1 plays it and leaves the lighting
       as it was. The WT60-XT plays its own song there (Fantasie Impromptu).
     Vial has none of it: vial-qmk's via.c has no audio channel and its QMK Settings no audio
     line; vial-gui offers the audio keys only.

     How often (VIA registry, 2026-09 pin; vendor collection): 7 of 2029 V3 definitions declare
     qmk_audio -- boardsource Unicorne, custommk CMK11, Ergostrafer, Ergostrafer RGB, Evo70 R2,
     Pearl, wilba.tech WT60-XT; no board carries its own audio menu (one, the NV-70, puts its own
     lighting on channel 4 under id_qmk_audio_* names).

     The variants: its own section or VIA's menu drawn as a custom menu; the board lighting the
     audio keys or folded away; Clicky greyed or editable while audio is off; the settings only
     the keyboard reaches said or not; a Play a sound button or not.

     Settled 2026-10-11 (Rico): its own section; the audio keys lit; Clicky greyed while audio
     is off; what only the keyboard reaches not shown; a Play a sound button -- the sound comes
     from the keyboard's speaker. The toggles keep the alternatives.

     The boards: the Unicorne (VIA registry, RGB Matrix and audio, QMK's default keymap: CK_TOGG
     and the RM_* keys on layer 2) and the WT60-XT (VIA registry, audio alone; its default keymap
     has no audio key -- "Made up" puts some on layer 1). The values are made up. -->

// KLE, as in the other section mockups.
function parseKle(rows) {
  const keys = [];
  let x = 0, y = 0, rx = 0, ry = 0, r = 0, p = {};
  const pair = s => { const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  for (const row of rows) {
    if (!Array.isArray(row)) continue;
    for (const item of row) {
      if (typeof item === 'object') {
        if ('r' in item) r = item.r;
        if ('rx' in item || 'ry' in item) { if ('rx' in item) rx = item.rx; if ('ry' in item) ry = item.ry; x = rx; y = ry; }
        if ('x' in item) x += item.x;
        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];
        continue;
      }
      const w = p.w || 1, h = p.h || 1;
      const labels = String(item).split('\n');
      const cell = pair(labels[0]), option = pair(labels[3]);
      if (cell || p.d)
        keys.push({ x, y, w, h, x2: p.x2 || 0, y2: p.y2 || 0, w2: p.w2 || w, h2: p.h2 || h, r, rx, ry, decal: !!p.d,
                    cell, g: option ? option[0] : -1, o: option ? option[1] : 0 });
      x += w;
      p = {};
    }
    y += 1;
    x = rx;
  }
  return keys;
}
const placeKeys = (keys, count) => keys.filter(k => !(k.g >= 0 && k.g < count && k.o !== 0));
const NS = 'http://www.w3.org/2000/svg';
const rot = (px, py, k) => {
  if (!k.r) return [px, py];
  const a = k.r * Math.PI / 180, dx = px - k.rx, dy = py - k.ry;
  return [k.rx + dx * Math.cos(a) - dy * Math.sin(a), k.ry + dx * Math.sin(a) + dy * Math.cos(a)];
};
function boundsOf(keys) {
  const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  for (const k of keys)
    for (const [x, y, w, h] of [[k.x, k.y, k.w, k.h], [k.x + k.x2, k.y + k.y2, k.w2, k.h2]])
      for (const [px, py] of [[x, y], [x + w, y], [x, y + h], [x + w, y + h]]) {
        const [qx, qy] = rot(px, py, k);
        b.x0 = Math.min(b.x0, qx); b.y0 = Math.min(b.y0, qy); b.x1 = Math.max(b.x1, qx); b.y1 = Math.max(b.y1, qy);
      }
  return b;
}

  LCTL: 'Ctrl', RCTL: 'Ctrl', LGUI: 'Win', RGUI: 'Win', LALT: 'Alt', RALT: 'AltGr', SPC: '', GRV: '`', UP: '↑', DOWN: '↓',
  LEFT: '←', RGHT: '→', PGUP: 'PgUp', PGDN: 'PgDn', END: 'End', HOME: 'Home', INS: 'Ins', PSCR: 'PrtSc', SCRL: 'ScrLk', PAUS: 'Pause',
  MUTE: 'Mute', VOLU: 'Vol +', VOLD: 'Vol −', NO: '', EXLM: '!', AT: '@', HASH: '#', DLR: '$', PERC: '%', CIRC: '^', AMPR: '&',
  ASTR: '*', LPRN: '(', RPRN: ')' };
function legendOf(kc) {
  if (!kc || kc === 'KC_TRNS') return { m: '' };
  if (AUDIO_KEYS[kc]) return { h: AUDIO_KEYS[kc][0], m: AUDIO_KEYS[kc][1], board: true };
  if (/^RM_/.test(kc)) return { h: 'Light', m: kc.slice(3), board: true };
  if (/^MO\(/.test(kc)) return { h: 'Layer', m: 'Fn', behav: true };
  if (kc === 'QK_BOOT' || kc === 'EE_CLR') return { h: 'Firmware', m: kc === 'QK_BOOT' ? 'Boot' : 'Clear', fw: true };
  const n = kc.replace(/^KC_/, '');
  if (n in NAMED) return { m: NAMED[n] };
  return { m: n.length <= 3 ? n : n.slice(0, 4) };
}

// ---------------------------------------------------------------------------------------------
const SETUPS = {
  'Unicorne · RGB Matrix + audio': { def: 'Unicorne', column: ['Keymap', 'Macros', 'Lighting'] },
  'WT60-XT · audio alone': { def: 'WT60-XT', column: ['Keymap', 'Layout', 'Macros'],
    // "Made up": layer 1's left-hand function column, by layer 0's key.
    made: { KC_F1: 'AU_TOGG', KC_F2: 'CK_TOGG', KC_F3: 'CK_UP', KC_F4: 'CK_DOWN', KC_F5: 'CK_RST', KC_F6: 'MU_TOGG', KC_F7: 'AU_NEXT', KC_F8: 'AU_PREV' } },
};
// Each panel line, and the keys that change what it shows from the keyboard.
const LINES = {
  audio: { name: 'Audio', via: 'Audio Enable', keys: /^AU_(TOGG|ON|OFF)$/,
           desc: "the board's speaker: its songs, the clicks and music mode" },
  clicky: { name: 'Clicky', via: 'Audio Clicky Enable', keys: /^CK_(TOGG|ON|OFF)$/, desc: 'a click with each key press' },
  pitch: { name: 'Click pitch', keys: /^CK_(UP|DOWN|RST)$/, kb: true, desc: 'Freq + and Freq − on the keyboard; forgotten when it is unplugged' },
  voice: { name: 'Voice', keys: /^AU_(NEXT|PREV)$/, kb: true, desc: 'Voice + and Voice − on the keyboard: the sound of every note; forgotten when it is unplugged' },
  music: { name: 'Music mode', keys: /^MU_/, kb: true, desc: 'the keys play notes instead of typing, until it is turned off on the keyboard; forgotten when it is unplugged' },
};
const state = { setup: Object.keys(SETUPS)[0], where: 'Its own section', board: 'Audio keys lit', keys: 'As the board has',
  clicky: 'Greyed', kbonly: 'Not shown', play: 'Yes', firmware: 'Has audio', theme: 'Light',
  hover: null, vals: { audio: true, clicky: false }, msg: null };
const setupOf = () => SETUPS[state.setup];
const tipAttr = t => ` data-tip="${t.replace(/"/g, '&quot;')}"`;
const viaMenu = () => state.where === "VIA's menu, as a custom menu";

// ---------------------------------------------------------------------------------------------
function panelHtml() {
  const msg = state.msg ? `<span class="msg"><span class="${state.msg[0]}">${state.msg[1]}</span></span>` : '';
  if (viaMenu()) {
    // VIA's own menu as Nazg draws any custom menu: one submenu, so no strip; its name heads the panel.
    let html = `<div class="mline"><span class="title">General</span><span class="right">${msg}</span></div><div class="sys"><div class="grid">`;
    if (state.firmware !== 'Has audio') return html + `</div><div class="says"><span class="w">The board answers that it has no such setting.</span></div></div>`;
    for (const id of ['audio', 'clicky'])
      html += `<div class="lab" data-hover="${id}">${LINES[id].via}</div><div class="val"><input type="checkbox" data-check="${id}"${state.vals[id] ? ' checked' : ''}></div>`;
    return html + `</div></div>`;
  }
  let html = `<div class="mline"><span class="title">Audio</span><span class="desc">the keyboard's speaker</span><span class="right">${msg}</span></div>`;
  if (state.firmware !== 'Has audio')
    return html + `<div class="says" style="padding:8px 18px"><span class="w">This firmware is built without audio</span> -- the definition offers it, the board answers it has none. Its maker's firmware with audio built in brings it.</div>`;
  html += `<div class="sys"><div class="grid">`;
  const v = state.vals, greyClicky = !v.audio && state.clicky === 'Greyed';
  html += `<div class="lab" data-hover="audio">Audio</div><div class="val"><input type="checkbox" data-check="audio"${v.audio ? ' checked' : ''}><span class="desc">${LINES.audio.desc}</span></div>`;
  const clickyNote = v.audio ? LINES.clicky.desc : state.clicky === 'Greyed' ? 'heard with Audio on' : 'a click with each key press -- <span class="w" style="color:var(--warn)">heard only with Audio on</span>';
  html += `<div class="lab${greyClicky ? ' dis' : ''}" data-hover="clicky">Clicky</div><div class="val${greyClicky ? ' dis' : ''}"><input type="checkbox" data-check="clicky"${v.clicky ? ' checked' : ''}><span class="desc">${clickyNote}</span></div>`;
  if (state.kbonly === 'Said as lines')
    for (const id of ['pitch', 'voice', 'music'])
      html += `<div class="lab kb" data-hover="${id}">${LINES[id].name}</div><div class="val"><span class="desc">${LINES[id].desc}</span></div>`;
  if (state.play === 'Yes')
    html += `<div class="lab" data-hover="play"></div><div class="val${v.audio ? '' : ' dis'}"><button data-act="play"${v.audio ? '' : ' disabled'}>Play a sound</button>`
          + `<span class="desc">${v.audio ? 'the song the board plays when VIA picks it -- its lights blink once' : 'with Audio on'}</span></div>`;
  return html + `</div></div>`;
}

// ---------------------------------------------------------------------------------------------
// The board.
let BOARD = null;
function buildBoard() {
  const s = setupOf(), b = BOARDS[s.def];
  const keys = placeKeys(parseKle(b.keymap), b.labels.length).filter(k => !k.decal);
  const sends = keys.map(k => {
    const x = (SENDS[s.def][k.cell.join(',')] || ['KC_NO']).slice();
    if (state.keys === 'Made up' && s.made && s.made[x[0]]) x[1] = s.made[x[0]];
    return x;
  });
  BOARD = { keys, sends, b };
}
const isAudioKey = kc => !!AUDIO_KEYS[kc];
function litOf(kc) {
  if (!isAudioKey(kc) || state.firmware !== 'Has audio') return false;
  if (!state.hover) return true;
  return state.hover !== 'play' && LINES[state.hover].keys.test(kc);
}
function boardSvg() {
  const keys = BOARD.keys, sends = BOARD.sends;
  const bd = boundsOf(keys), avail = 1160 - 180 - 28 - 60;
  const u = Math.min(46, Math.floor(avail / (bd.x1 - bd.x0 + 0.7))), m = u * 0.35;
  const W = (bd.x1 - bd.x0) * u + 2 * m, H = (bd.y1 - bd.y0) * u + 2 * m;
  const fs = Math.round(u * 0.28), hs = Math.round(u * 0.2);
  const show = state.board === 'Audio keys lit';
  let s = `<svg class="board" xmlns="${NS}" width="${W}" height="${H}"><style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.li{fill:var(--boardface);stroke:var(--board);stroke-width:2}`
    + `.t{font:${fs}px Arimo,Arial;fill:var(--text);text-anchor:middle;pointer-events:none}.t.h{font-size:${hs}px;fill:var(--muted)}.t.hl{font-size:${hs}px;fill:var(--board)}.t.hb{font-size:${hs}px;fill:var(--behav)}.t.hf{font-size:${hs}px;fill:var(--fw)}`
    + `.t.lay{font-size:${hs}px;fill:var(--board);text-anchor:end}.t.dim{opacity:.35}</style>`;
  s += `<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  const gap = Math.max(1, u * 0.06);
  keys.forEach((k, idx) => {
    const layers = sends[idx];
    const litLayer = show ? layers.findIndex(litOf) : -1;
    const kc = litLayer >= 0 ? layers[litLayer] : layers[0], lg = legendOf(kc);
    const [ox, oy] = [(k.rx - bd.x0) * u, (k.ry - bd.y0) * u];
    s += `<g${k.r ? ` transform="rotate(${k.r} ${ox} ${oy})"` : ''}>`;
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, hh = k.h * u - 2 * gap;
    const tip = `<title>${layers.map((l, i) => i ? (l !== 'KC_TRNS' ? ` · layer ${i}: ${l}` : '') : l).join('')}</title>`;
    const cls = 'k' + (litLayer >= 0 ? ' li' : '');
    const rect = (rx, ry, rw, rh) => `<rect class="${cls}" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    s += rect(x, y, w, hh);
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2) s += rect((k.x + k.x2 - bd.x0) * u + gap, (k.y + k.y2 - bd.y0) * u + gap, k.w2 * u - 2 * gap, k.h2 * u - 2 * gap);
    const dim = show && litLayer < 0 ? ' dim' : '';
    if (lg.h) s += `<text class="t ${lg.board ? 'hl' : lg.behav ? 'hb' : lg.fw ? 'hf' : 'h'}${dim}" x="${x + w / 2}" y="${y + u * 0.27}">${lg.h}</text>`;
    s += `<text class="t${dim}" x="${x + w / 2}" y="${y + hh / 2 + fs * 0.35 + (lg.h ? u * 0.08 : 0)}">${String(lg.m).replace('&', '&amp;').replace('<', '&lt;')}</text>`;
    if (litLayer > 0) s += `<text class="t lay" x="${x + w - u * 0.08}" y="${y + hh - u * 0.08}">L${litLayer}</text>`;
    s += `</g>`;
  });
  return s + `</g></svg>`;
}
function keysSay() {
  if (state.board !== 'Audio keys lit' || state.firmware !== 'Has audio') return '';
  const any = BOARD.sends.some(l => l.some(isAudioKey));
  if (!any) return `<div class="says" style="padding:0 2px">No key on this keymap changes the audio -- Keymap's picker has them, in its Special tab.</div>`;
  return `<div class="says" style="padding:0 2px">Lit: the keys that change the audio from the keyboard -- a line of the panel under the pointer, the keys that change it. Nazg reads the values again each time you come back to this section.</div>`;
}

function columnHtml() {
  const s = setupOf();
  let html = `<div class="hdr">VIA</div>` + s.column.map(e => `<div class="entry">${e}</div>`).join('');
  if (viaMenu()) html += `<div class="sep"></div><div class="hdr">Board</div><div class="entry on">Audio</div>`;
  else html += `<div class="entry on">Audio</div>`;
  return `<div class="col">${html}</div>`;
}
function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  buildBoard();
  const board = state.board !== 'Folded away' ? `<div class="boardarea" id="boardarea">${boardSvg()}</div>` : '';
  document.getElementById('frame').innerHTML =
    `<div class="menubar"><span class="board">${BOARD.b.name} ▾</span><span class="muted">VIA 12</span><span class="right">Settings</span></div>`
  + `<div class="body">${columnHtml()}<div class="main">${board}${keysSay()}<div class="panel">${panelHtml()}</div></div></div>`;
}
function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['setup', 'Board', Object.keys(SETUPS)],
   ['keys', 'Audio keys (WT60-XT)', ['As the board has', 'Made up']],
   ['firmware', 'Firmware', ['Has audio', 'Built without']],
   ['where', 'Where', ['Its own section', "VIA's menu, as a custom menu"]],
   ['board', 'The board', ['Audio keys lit', 'Folded away']],
   ['clicky', 'Clicky while audio is off', ['Greyed', 'Editable, said']],
   ['kbonly', 'What only the keyboard reaches', ['Not shown', 'Said as lines']],
   ['play', 'Play a sound', ['No', 'Yes']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      // The Unicorne has its own audio key; the toggle brings the WT60-XT.
      const other = k === 'keys' && state.setup !== 'WT60-XT · audio alone';
      if (other) bt.style.opacity = '.55';
      bt.onclick = () => { state[k] = v; if (other) state.setup = 'WT60-XT · audio alone'; state.msg = null; render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

// ---------------------------------------------------------------------------------------------
// Editing: written and stored at once ([0x07][4][id][v], then [0x09][4]), read back.
const frame = document.getElementById('frame');
frame.addEventListener('change', e => {
  const d = e.target.dataset;
  if (d.check) { state.vals[d.check] = e.target.checked; state.msg = ['ok', 'Written and stored, read back the same']; render(); }
});
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && t.dataset.act === 'play') { state.msg = ['ok', 'Playing on the keyboard…']; render(); }
});
const tip = document.getElementById('tip');
frame.addEventListener('mouseover', e => {
  const cell = e.target.closest('.lab, .val');
  const line = cell ? (cell.classList.contains('lab') ? cell : cell.previousElementSibling) : null;
  const hover = line ? line.dataset.hover || null : null;
  if (hover !== state.hover) { state.hover = hover; const b = document.getElementById('boardarea'); if (b) b.innerHTML = boardSvg(); }
  const t = e.target.closest('[data-tip]');
  if (t) { tip.innerHTML = t.dataset.tip; tip.style.display = 'block'; } else tip.style.display = 'none';
});
frame.addEventListener('mousemove', e => { tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + 'px'; tip.style.top = (e.clientY + 18) + 'px'; });
frame.addEventListener('mouseleave', () => { tip.style.display = 'none'; state.hover = null; const b = document.getElementById('boardarea'); if (b) b.innerHTML = boardSvg(); });

document.getElementById('notes').innerHTML = `
<p><b>What this section is.</b> QMK's audio as VIA's built-in menu <i>qmk_audio</i> declares it: two settings on the wire,
Audio and Clicky, each one bit the board stores. 7 of VIA's 2029 definitions declare it -- the Unicorne, four custommk boards, the
Pearl, the WT60-XT; no board has its own audio menu, and Vial has no audio setting at all (its boards get the keys only). A
write sets the bit silently -- the AU_ON key plays a song, VIA's write does not.</p>
<p><b>Where</b>: <b>its own section</b>, Nazg's words, in the protocol's sections as planned; or <b>VIA's menu drawn as a custom
menu</b> -- "General", "Audio Enable", "Audio Clicky Enable", under <i>Board</i> in the column -- no code of its own, VIA's
labels and nothing said.</p>
<p><b>The board</b>: <b>audio keys lit</b>, as Lighting lights its keys -- on any layer, a line under the pointer narrowing
them; a keymap without any says so (the WT60-XT's own); or <b>folded away</b> -- two lines need little room.</p>
<p><b>Clicky while audio is off</b>: clicks sound only with Audio on (QMK checks both bits). <b>Greyed</b>, as Lighting greys
a system's lines while it is off; or <b>editable, said</b> -- it can be set ahead.</p>
<p><b>What only the keyboard reaches</b>: the clicks' pitch, the voice and music mode live in the board's RAM, out of the wire's
reach. <b>Not shown</b>; or <b>said as lines</b> without a control, each lighting its keys -- music mode makes the keys play
notes instead of typing, which surprises.</p>
<p><b>Play a sound</b>: VIA's device indication, sent 0 then 1 -- the board plays its indication song (the WT60-XT's is its
own), the lighting blinking once and coming back. The only way to hear the setting from Nazg; nothing else is played.</p>`;

render();
</script>
</body>
</html>
