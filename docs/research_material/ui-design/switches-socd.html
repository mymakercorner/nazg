<!-- Mockup: SOCD on a Keychron Hall-effect board -- two keys, and what is sent while both are down
     (ui-design.md, "The Switches section"; the wire is keychron-commands.md, "SOCD"). The section around it
     is switches-advanced-keys.html, as built.

     First round (2026-11-23). What it rests on, read and played on the K10 HE V3 that day:
     - a pair is apart from its keys' modes and distances, which it leaves untouched;
     - the Launcher's four choices are types 2 (Rappy Snappy), 3 (Last Key Priority), 4 or 5 (Absolute
       Priority) and 6 (Neutral); type 1 plays as 2 on this board and the Launcher draws it blank;
     - both at the bottom, Rappy Snappy keeps the key held first, never both and never the last;
     - once one is released the other, still held, is sent again;
     - a One Key Multiple Commands key never takes part, a Gamepad Analog one only with keyboard keys on;
     - the board has 20 slots, the Launcher stops at 5 but shows a pair it did not make;
     - no command answers what is left after SOCD: a test looks at what the computer receives.

     Settled by Rico (2026-11-23), the variants removed: SOCD beside the modes, as in the Launcher -- not in
     the strip, not a tab of two selected keys, not a section; no line repeating the chosen pair, no choice's
     name beside a pair; Add pair, an x to remove, and how many of the board's 20.
     SOCD is simulated here as socd_action() is written. -->

<script>
// The K10 HE ANSI, corrected 0EA7 definition (dist/k10_he_0EA7/k10_he_ansi_0EA7.json): its KLE.
const KLE = [[{"c":"#777777"},"0,0",{"x":1,"c":"#cccccc"},"0,2","0,3","0,4","0,5",{"x":0.5},"0,6","0,7","0,8","0,9",{"x":0.5},"0,10","0,11","0,12","0,13",{"x":0.25},"0,14","0,15","0,16"],[{"y":0.25},"1,0","1,1","1,2","1,3","1,4","1,5","1,6","1,7","1,8","1,9","1,10","1,11","1,12",{"w":2},"1,13",{"x":0.25},"1,14","1,15","1,16",{"x":0.25},"1,17","1,18","1,19","1,20"],[{"w":1.5},"2,0","2,1","2,2","2,3","2,4","2,5","2,6","2,7","2,8","2,9","2,10","2,11","2,12",{"w":1.5},"2,13",{"x":0.25},"2,14","2,15","2,16",{"x":0.25},"2,17","2,18","2,19",{"h":2},"2,20"],[{"w":1.75},"3,0","3,1","3,2","3,3","3,4","3,5","3,6","3,7","3,8","3,9","3,10","3,11",{"w":2.25,"c":"#777777"},"3,12",{"x":3.5,"c":"#cccccc"},"3,17","3,18","3,19"],[{"w":2.25},"4,0","4,2","4,3","4,4","4,5","4,6","4,7","4,8","4,9","4,10","4,11",{"w":2.75},"4,13",{"x":1.25},"4,15",{"x":1.25},"4,17","4,18","4,19",{"h":2},"4,20"],[{"w":1.25},"5,0",{"w":1.25},"5,1",{"w":1.25},"5,2",{"w":6.25},"5,6",{"w":1.25},"5,9",{"w":1.25},"5,10",{"w":1.25},"5,11",{"w":1.25},"5,12",{"x":0.25},"5,14","5,15","5,16",{"x":0.25,"w":2},"5,17","5,18"]];

// The Windows base layer's legends, and the KeyboardEvent.code that plays each key.
const LEGEND = {
 '0,0':['Esc','Escape'],'0,2':['F1','F1'],'0,3':['F2','F2'],'0,4':['F3','F3'],'0,5':['F4','F4'],'0,6':['F5','F5'],'0,7':['F6','F6'],'0,8':['F7','F7'],'0,9':['F8','F8'],
 '0,10':['F9','F9'],'0,11':['F10','F10'],'0,12':['F11','F11'],'0,13':['F12','F12'],'0,14':['PrtSc','PrintScreen'],'0,15':['Cortana','ScrollLock'],'0,16':['Light','Pause'],
 '1,0':['`','Backquote'],'1,1':['1','Digit1'],'1,2':['2','Digit2'],'1,3':['3','Digit3'],'1,4':['4','Digit4'],'1,5':['5','Digit5'],'1,6':['6','Digit6'],'1,7':['7','Digit7'],
 '1,8':['8','Digit8'],'1,9':['9','Digit9'],'1,10':['0','Digit0'],'1,11':['-','Minus'],'1,12':['=','Equal'],'1,13':['Backspace','Backspace'],'1,14':['Ins','Insert'],
 '1,15':['Home','Home'],'1,16':['PgUp','PageUp'],'1,17':['Num','NumLock'],'1,18':['/','NumpadDivide'],'1,19':['*','NumpadMultiply'],'1,20':['-','NumpadSubtract'],
 '2,0':['Tab','Tab'],'2,1':['Q','KeyQ'],'2,2':['W','KeyW'],'2,3':['E','KeyE'],'2,4':['R','KeyR'],'2,5':['T','KeyT'],'2,6':['Y','KeyY'],'2,7':['U','KeyU'],'2,8':['I','KeyI'],
 '2,9':['O','KeyO'],'2,10':['P','KeyP'],'2,11':['[','BracketLeft'],'2,12':[']','BracketRight'],'2,13':['\\','Backslash'],'2,14':['Del','Delete'],'2,15':['End','End'],
 '2,16':['PgDn','PageDown'],'2,17':['7','Numpad7'],'2,18':['8','Numpad8'],'2,19':['9','Numpad9'],'2,20':['+','NumpadAdd'],
 '3,0':['Caps','CapsLock'],'3,1':['A','KeyA'],'3,2':['S','KeyS'],'3,3':['D','KeyD'],'3,4':['F','KeyF'],'3,5':['G','KeyG'],'3,6':['H','KeyH'],'3,7':['J','KeyJ'],'3,8':['K','KeyK'],
 '3,9':['L','KeyL'],'3,10':[';','Semicolon'],'3,11':["'",'Quote'],'3,12':['Enter','Enter'],'3,17':['4','Numpad4'],'3,18':['5','Numpad5'],'3,19':['6','Numpad6'],
 '4,0':['Shift','ShiftLeft'],'4,2':['Z','KeyZ'],'4,3':['X','KeyX'],'4,4':['C','KeyC'],'4,5':['V','KeyV'],'4,6':['B','KeyB'],'4,7':['N','KeyN'],'4,8':['M','KeyM'],
 '4,9':[',','Comma'],'4,10':['.','Period'],'4,11':['/','Slash'],'4,13':['Shift','ShiftRight'],'4,15':['↑','ArrowUp'],'4,17':['1','Numpad1'],'4,18':['2','Numpad2'],
 '4,19':['3','Numpad3'],'4,20':['Enter','NumpadEnter'],
 '5,0':['Ctrl','ControlLeft'],'5,1':['Win','MetaLeft'],'5,2':['Alt','AltLeft'],'5,6':['Space','Space'],'5,9':['Alt','AltRight'],'5,10':['Win','MetaRight'],
 '5,11':['Fn','ContextMenu'],'5,12':['Ctrl','ControlRight'],'5,14':['←','ArrowLeft'],'5,15':['↓','ArrowDown'],'5,16':['→','ArrowRight'],'5,17':['0','Numpad0'],'5,18':['.','NumpadDecimal']};

function parseKle(rows) {
  const keys = []; let y = 0;
  for (const row of rows) {
    let x = 0, p = {};
    for (const item of row) {
      if (typeof item === 'object') { if ('x' in item) x += item.x; if ('y' in item) y += item.y; if ('w' in item) p.w = item.w; if ('h' in item) p.h = item.h; continue; }
      const w = p.w || 1, h = p.h || 1;
      keys.push({ x, y, w, h, cell: item, name: (LEGEND[item] || ['?'])[0], code: (LEGEND[item] || [])[1] });
      x += w; p = {};
    }
    y += 1;
  }
  return keys;
}
const KEYS = parseKle(KLE);
const BY_CODE = new Map(KEYS.map((k, i) => [k.code, i]));

const FULL = 35, REGULAR = 1, RAPID = 2, DKS = 3, PAD = 4, TOGGLE = 5;
const MODES = ['Regular', 'Rapid Trigger', 'One Key Multiple Commands', 'Long-Press Switch', 'Gamepad Analog'];
const DEEPER = 2, LAST = 3, FIRST = 4, SECOND = 5, NEUTRAL = 6;
const CHOICES = [[DEEPER, 'Rappy Snappy'], [LAST, 'Last Key Priority'], [FIRST, 'Absolute Priority'], [NEUTRAL, 'Neutral']];
const isAbs = t => t === FIRST || t === SECOND;
const choiceName = t => CHOICES.find(([c]) => c === t || (isAbs(t) && c === FIRST))[1];
const PNAMES = ['Default', 'Gaming', 'Gamepad'];
const at = c => KEYS.findIndex(k => k.cell === c);
const mm = v => (v / 10).toFixed(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function fresh() {
  const prof = (mode, pairs) => ({ keys: KEYS.map(() => ({ mode, act: 17 })), pairs });
  const def = prof(REGULAR, []), gaming = prof(RAPID, [
    { a: at('3,1'), b: at('3,3'), type: LAST }, { a: at('2,2'), b: at('3,2'), type: DEEPER },
    { a: at('4,2'), b: at('4,4'), type: SECOND }, { a: at('3,7'), b: at('3,9'), type: NEUTRAL }]), pad = prof(RAPID, []);
  def.keys[at('3,4')].mode = DKS; gaming.keys[at('3,4')].mode = DKS;
  return [def, gaming, pad];
}
let profiles = fresh();
const state = { theme: 'Light', view: 'SOCD', profile: 1, pair: 0, pickFirst: null, adding: false, testing: false, toast: '' };
let selected = new Set();
const P = () => profiles[state.profile];
const pairsOf = i => P().pairs.filter(p => p.a === i || p.b === i);
const SLOTS = 20, SLOTSTIP = `Each of the three profiles has its own ${20}. Keychron&#39;s Launcher makes 5 at most; the board takes ${20}.`;
const adding = () => state.adding || state.pickFirst !== null;   // a pair's keys being picked on the board
const inView = () => state.view === 'SOCD';
// The pair the panel shows: chosen in the list, or the two keys selected.
function shown() {
  if (inView()) return P().pairs[state.pair] || null;
  return null;
}

// ---- SOCD as socd_action() plays it, on simulated switches -------------------------------------
const sim = KEYS.map(() => ({ travel: 0, goal: 0, raw: false, changed: false, sent: false }));
const alone = new Map();   // pair -> the key last held alone, state[i]
let history = [];
function step() {
  let moved = false;
  sim.forEach(s => {
    s.changed = false;
    const speed = FULL / 12;
    if (s.travel !== s.goal) { s.travel = s.travel < s.goal ? Math.min(s.goal, s.travel + speed) : Math.max(s.goal, s.travel - speed); moved = true; }
    const was = s.raw;
    if (!s.raw && s.travel >= 17) s.raw = true; else if (s.raw && s.travel < 14) s.raw = false;
    if (s.raw !== was) s.changed = true;
  });
  const hold = new Set(), dks = i => P().keys[i].mode === DKS;
  for (const p of P().pairs) {
    const A = sim[p.a], B = sim[p.b];
    if (dks(p.a) || dks(p.b)) continue;
    let keep = false;
    if (A.raw && B.raw) {
      if (p.type === DEEPER) {
        const st = alone.get(p), ta = Math.round(A.travel * 10), tb = Math.round(B.travel * 10);
        if (st === p.b && ta > tb) hold.add(p.b); else if (st === p.a && ta < tb) hold.add(p.a); else keep = true;
      } else if (p.type === LAST) {
        if (B.changed && A.was) { hold.add(p.a); alone.set(p, p.b); } else if (A.changed && B.was) { hold.add(p.b); alone.set(p, p.a); } else keep = true;
      } else if (p.type === FIRST) hold.add(p.b); else if (p.type === SECOND) hold.add(p.a);
      else { hold.add(p.a); hold.add(p.b); }
    } else if (A.raw) alone.set(p, p.a); else if (B.raw) alone.set(p, p.b);
    if (keep) { if (alone.get(p) === p.a) hold.add(p.b); else if (alone.get(p) === p.b) hold.add(p.a); }
  }
  sim.forEach((s, i) => { s.sent = s.raw && !hold.has(i) && !dks(i); s.was = s.sent; });
  const p = shown();
  if (state.testing && p) {
    history.push([performance.now(), sim[p.a].travel, sim[p.b].travel, sim[p.a].sent, sim[p.b].sent]);
    const from = performance.now() - 4000; while (history.length && history[0][0] < from) history.shift();
    liveBits(p); redrawBoard();
  } else if (moved) redrawBoard();
}
setInterval(step, 30);

// ---- The board ---------------------------------------------------------------------------------
let U = 39, M = 14, GAP = 2, BD = null;
function bounds() { let x1 = 0, y1 = 0; for (const k of KEYS) { x1 = Math.max(x1, k.x + k.w); y1 = Math.max(y1, k.y + k.h); } return { x1, y1 }; }
const SVGSTYLE = `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.sel{stroke:var(--sel);stroke-width:2.5}.k.want{stroke:var(--sel);stroke-width:2.5;stroke-dasharray:4 3}.k.partner{stroke:var(--rt);stroke-width:2.5}`
  + `.lg{font-family:Arimo,Arial;fill:var(--text);pointer-events:none}.vl{font-family:Arimo,Arial;fill:var(--muted);pointer-events:none}.rt{font-family:Arimo,Arial;fill:var(--rt);font-weight:700;pointer-events:none}`
  + `.fill{fill:var(--press);opacity:.22;pointer-events:none}.fill.on{opacity:.5}.ring{fill:none;stroke:var(--press);stroke-width:2.5;pointer-events:none}.held{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:3 3;pointer-events:none}</style>`;
const other = (p, i) => p.a === i ? p.b : p.a;
function keyTip(i) {
  const k = P().keys[i], lines = [`${KEYS[i].name} (${KEYS[i].cell.replace(',', ', ')})`, `${MODES[k.mode - 1]}${k.mode === DKS ? '' : ` · Actuation Distance ${mm(k.act)} mm`}`];
  pairsOf(i).forEach(p => lines.push(`SOCD with ${KEYS[other(p, i)].name} · ${pairSays(p)}`));
  return lines.join('\n');
}
let hoverKey = null;
function keySvg(k, i) {
  const x = k.x * U + GAP, y = k.y * U + GAP, w = k.w * U - 2 * GAP, h = k.h * U - 2 * GAP, s = sim[i], c = P().keys[i], ps = pairsOf(i), sh = shown();
  const sel = inView() ? sh && (sh.a === i || sh.b === i) && !adding() : selected.has(i);
  const want = state.pickFirst === i, partner = hoverKey !== null && hoverKey !== i && pairsOf(hoverKey).some(p => other(p, hoverKey) === i);
  let t = `<g><rect class="k${sel ? ' sel' : want ? ' want' : partner ? ' partner' : ''}" data-key="${i}" data-tip="${esc(keyTip(i))}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`;
  t += `<text class="lg" x="${x + 4}" y="${y + 12}" style="font-size:${k.name.length > 4 ? 9 : 11}px">${esc(k.name)}</text>`;
  if (ps.length) {
    const n = KEYS[other(ps[0], i)].name, room = ps.length === 1 && Math.max(n.length, k.name.length) <= (5 * k.w - 1) / 2;
    const label = ps.length > 1 ? `⇄${ps.length}` : room ? n : '⇄';
    if (room) t += `<text class="rt" x="${x + w / 2}" y="${y + 12}" text-anchor="middle" style="font-size:10px">⇄</text>`;
    t += `<text class="rt" x="${x + w - 4}" y="${y + 12}" text-anchor="end" style="font-size:10px">${esc(label)}</text>`;
  }
  if (c.mode === DKS) t += `<text class="rt" x="${x + 4}" y="${y + h - 5}" style="font-size:10px">DKS</text>`;
  else {
    t += `<text class="vl" x="${x + 4}" y="${y + h - 5}" style="font-size:10px">${mm(c.act)}</text>`;
    if (c.mode === RAPID) t += `<text class="rt" x="${x + w - 4}" y="${y + h - 5}" text-anchor="end" style="font-size:11px">⇅</text>`;
  }
  if (s.travel > 0) t += `<rect class="fill${s.sent ? ' on' : ''}" x="${x + 1}" y="${y + 1}" width="${w - 2}" height="${(h - 2) * s.travel / FULL}" rx="3"/>`;
  if (s.sent) t += `<rect class="ring" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`; else if (s.raw) t += `<rect class="held" x="${x + 1}" y="${y + 1}" width="${w - 2}" height="${h - 2}" rx="4"/>`;
  return t + '</g>';
}
function boardSvg() {
  BD = bounds(); U = Math.floor((1160 - 180 - 28 - 2 * M - 8) / BD.x1);
  return `<svg id="board" xmlns="http://www.w3.org/2000/svg" width="${BD.x1 * U + 2 * M}" height="${BD.y1 * U + 2 * M}">${SVGSTYLE}<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${M} ${M})" id="keys">${KEYS.map(keySvg).join('')}</g></svg>`;
}

// ---- What a choice does, drawn: the two keys going down and up, what is sent under them ---------
const C1 = 'var(--press)', C2 = 'var(--heat)';
// Two moments: the first key held and the second pressed meanwhile, then the other way round. Depths as
// [from, to, depth]; for Rappy Snappy the first is light and the second deep, then both at the bottom.
function scenes(t) {
  const deep = t === DEEPER;
  return { a: [[2, 46, deep ? .55 : 1], [68, 86, 1]], b: [[16, 32, 1], [54, 98, 1]],
    sent: t === LAST ? [[2, 16, 1], [16, 32, 2], [32, 46, 1], [54, 68, 2], [68, 86, 1], [86, 98, 2]]
      : deep ? [[2, 16, 1], [16, 32, 2], [32, 46, 1], [54, 98, 2]]
      : t === FIRST ? [[2, 46, 1], [54, 68, 2], [68, 86, 1], [86, 98, 2]]
      : t === SECOND ? [[2, 16, 1], [16, 32, 2], [32, 46, 1], [54, 98, 2]]
      : [[2, 16, 1], [32, 46, 1], [54, 68, 2], [86, 98, 2]] };
}
function picture(t, na, nb, w) {
  const s = scenes(t), L = 26, W = w - L, H = 12, X = v => L + v / 100 * W, short = n => n.length > 3 ? n.slice(0, 3) : n;
  const lane = (list, y, col, name) => `<text x="${L - 5}" y="${y + 9}" text-anchor="end" style="font:700 9px Arimo,Arial;fill:var(--text)">${esc(short(name))}</text><line x1="${L}" x2="${w}" y1="${y + .5}" y2="${y + .5}" stroke="var(--border)"/>`
    + list.map(([f, g, d]) => `<rect x="${X(f)}" y="${y}" width="${X(g) - X(f)}" height="${H * d}" fill="${col}" opacity=".45"/>`).join('');
  const sentY = 31;
  return `<svg width="${w}" height="46">` + lane(s.a, 1, C1, na) + lane(s.b, 15, C2, nb)
    + `<text x="${L - 5}" y="${sentY + 10}" text-anchor="end" style="font:9px Arimo,Arial;fill:var(--muted)">sent</text>`
    + s.sent.map(([f, g, k]) => `<rect x="${X(f)}" y="${sentY}" width="${X(g) - X(f)}" height="13" rx="2" fill="${k === 1 ? C1 : C2}"/>` + (X(g) - X(f) > 9 ? `<text x="${(X(f) + X(g)) / 2}" y="${sentY + 10}" text-anchor="middle" style="font:700 9px Arimo,Arial;fill:${k === 1 ? '#fff' : '#1d1e22'}">${esc(short(k === 1 ? na : nb))}</text>` : '')).join('') + '</svg>';
}
function words(p) {
  const a = `<b>${esc(KEYS[p.a].name)}</b>`, b = `<b>${esc(KEYS[p.b].name)}</b>`;
  return p.type === DEEPER ? `While both are down, the one pressed deeper is sent. Both at the bottom, it is the one held first.`
    : p.type === LAST ? `While both are down, the last one pressed is sent. Let go of it, and the other is sent again.`
    : p.type === NEUTRAL ? `While both are down, neither is sent. Let go of one, and the other is sent again.`
    : `While both are down, ${p.type === FIRST ? a : b} is always sent. Let go of it, and ${p.type === FIRST ? b : a} is sent again.`;
}
function warn(p) {
  const d = [p.a, p.b].filter(i => P().keys[i].mode === DKS);
  return d.length ? `<div class="small" style="color:var(--warn);margin-top:4px">${esc(KEYS[d[0]].name)} is One Key Multiple Commands: the board leaves it out of SOCD, so this pair does nothing.</div>` : '';
}
// The four choices, and what the chosen one does; under Absolute Priority, which key wins leads the words.
function editPair(p) {
  const wins = isAbs(p.type) ? `<span class="seg" style="margin-right:10px" data-tip="The key sent while both are down">${[[FIRST, p.a], [SECOND, p.b]].map(([t, k]) => `<button class="${p.type === t ? 'on' : ''}" data-type="${t}">${esc(KEYS[k].name)} wins</button>`).join('')}</span>` : '';
  return `<div class="cards four">${CHOICES.map(([t, n]) => { const on = t === p.type || (t === FIRST && isAbs(p.type)), tt = t === FIRST && isAbs(p.type) ? p.type : t; return `<div class="card${on ? ' on' : ''}" data-type="${tt}"><div class="n">${n}</div>${picture(tt, KEYS[p.a].name, KEYS[p.b].name, 128)}</div>`; }).join('')}</div>`
    + `<div class="words" style="margin-top:7px">${wins}${words(p)}</div>${warn(p)}`;
}

// ---- Test --------------------------------------------------------------------------------------
let barDrag = null;
const LT = [2, 32], LH = 22, LW = 206, LL = 34;   // the two lanes' tops, height, the strip's width and left
const says = s => s.sent ? 'sent' : s.raw ? 'held back' : '';
function lanesSvg(p) {
  const now = performance.now(), X = t => LL + (1 - (now - t) / 4000) * LW;
  const pts = n => {
    let d = '', open = false, lx = 0;
    history.forEach(h => { const x = X(h[0]); if (h[n] > 0) { if (!open) { d += `M${x} 0`; open = true; } d += `L${x} ${h[n] / FULL * LH}`; lx = x; } else if (open) { d += `L${x} 0Z`; open = false; } });
    return open ? d + `L${lx} 0Z` : d;
  };
  const sent = (n, col, name) => {
    const runs = []; let s = null, l = null;
    history.forEach(h => { if (h[n]) { if (s === null) s = h[0]; l = h[0]; } else if (s !== null) { runs.push([s, h[0]]); s = null; } });
    if (s !== null) runs.push([s, l]);
    return runs.map(([f, g]) => `<rect x="${X(f)}" y="62" width="${Math.max(1, X(g) - X(f))}" height="15" rx="2" fill="${col}"/>` + (X(g) - X(f) > 14 ? `<text x="${(X(f) + X(g)) / 2}" y="73" text-anchor="middle" style="font:700 10px Arimo,Arial;fill:${n === 3 ? '#fff' : '#1d1e22'}">${esc(name.slice(0, 4))}</text>` : '')).join('');
  };
  const lane = (n, i, col, f) => {
    const k = sim[i], y = LT[n - 1], at = LL + LW + 8;
    return `<text x="${LL - 6}" y="${y + 14}" text-anchor="end" style="font:700 11px Arimo,Arial;fill:var(--text)">${esc(KEYS[i].name.slice(0, 4))}</text><rect data-bar="${f}" x="${LL}" y="${y}" width="${LW}" height="${LH}" fill="transparent" style="cursor:ns-resize"/>`
      + `<g transform="translate(0 ${y})" pointer-events="none"><line x1="${LL}" x2="${LL + LW}" y1="0" y2="0" stroke="var(--border)"/><path d="${pts(n)}" fill="${col}" opacity=".45"/></g>`
      + `<text x="${at}" y="${y + 9}" style="font:11px Arimo,Arial;fill:var(--muted)">${mm(Math.floor(k.travel))} mm</text><text x="${at}" y="${y + 21}" style="font:700 11px Arimo,Arial;fill:var(--${k.sent ? 'press' : 'muted'})">${says(k)}</text>`;
  };
  return `<svg id="lanes" width="304" height="80">${lane(1, p.a, C1, 'a')}${lane(2, p.b, C2, 'b')}<text x="${LL - 6}" y="73" text-anchor="end" style="font:11px Arimo,Arial;fill:var(--muted)">sent</text>` + sent(3, C1, KEYS[p.a].name) + sent(4, C2, KEYS[p.b].name) + '</svg>';
}
function liveBits(p) { const l = document.getElementById('lanes'); if (l) l.outerHTML = lanesSvg(p); }
function testHtml() {
  const p = shown(), btn = `<button class="${state.testing ? 'on' : ''}" style="margin-left:auto" data-act="test">${state.testing ? 'Stop' : 'Test keys'}</button>`, h = `<div class="h" style="display:flex;align-items:center">Test${btn}</div>`;
  if (!state.testing) return `<div class="gauge" id="gauge">${h}<div class="muted small" style="line-height:1.5;margin-top:6px">Press keys on the board to see how far they go, and what the computer receives. While testing, pressing a key does not select it.</div></div>`;
  if (!p) return `<div class="gauge" id="gauge">${h}<div class="muted small">Press a key on the board.</div></div>`;
  return `<div class="gauge" id="gauge">${h}<div style="margin-top:6px">${lanesSvg(p)}</div></div>`;
}

// ---- The panel ---------------------------------------------------------------------------------
const pairSays = p => choiceName(p.type) + (isAbs(p.type) ? `, ${KEYS[p.type === FIRST ? p.a : p.b].name} wins` : '');
function listHtml() {
  const n = P().pairs.length, full = n >= SLOTS, busy = adding();
  const rows = P().pairs.map((p, k) => `<span class="prow${k === state.pair && !busy ? ' on' : ''}" data-pair="${k}" data-tip="${esc(pairSays(p))}"><span class="cap small">${esc(KEYS[p.a].name)}</span><b style="color:var(--rt)">⇄</b><span class="cap small">${esc(KEYS[p.b].name)}</span><span class="x" data-remove="${k}" data-tip="Remove this pair">×</span></span>`).join('');
  return `<div class="pairs">${rows}<button data-act="add" class="${busy ? 'on' : ''}"${full ? ` disabled data-tip="The board holds ${SLOTS} pairs per profile"` : ' data-tip="Or click two keys of the board"'}>+ Add pair</button>`
    + '</div>';
}
function socdPanel() {
  const p = adding() ? null : shown(), first = state.pickFirst;
  const ed = p ? editPair(p)
    : adding() ? `<div class="words"><div class="pline"><span class="cap${first === null ? ' want' : ''}">${first === null ? '…' : esc(KEYS[first].name)}</span><b style="color:var(--rt)">⇄</b><span class="cap${first === null ? '' : ' want'}">…</span><button data-act="cancel">Cancel</button></div>Click the ${first === null ? 'first' : 'other'} key on the board, or press it.</div>`
    : `<div class="words">No pair on this profile: <b>+ Add pair</b>, or click two keys of the board, A and D for example, to choose what is sent while both are held down.</div>`;
  return keysHead() + listHtml() + `<div class="cols" style="min-height:142px"><div class="editor">${ed}</div>${testHtml()}</div>`;
}
function keysHead() {
  const socd = inView(), n = selected.size, first = [...selected][0], np = P().pairs.length;
  const head = socd ? `<span data-tip="${SLOTSTIP}"><b>${np} pair${np === 1 ? '' : 's'}</b> <span class="muted">of ${SLOTS}</span></span>` : n === 1 ? `<b>${esc(KEYS[first].name)}</b>` : n ? `<b>${n} keys</b> <span class="muted">${esc([...selected].slice(0, 5).map(i => KEYS[i].name).join(' '))}</span>` : `<b>All ${KEYS.length} keys</b>`;
  const m = socd ? 0 : n ? P().keys[first].mode : P().keys[0].mode;
  const modes = `<span class="seg">${MODES.map((l, i) => `<button class="${m === i + 1 ? 'on' : ''}"${socd ? ' data-view="Keys" data-tip="Back to the keys: changes nothing"' : ' data-tip="As built: not part of this mockup"'}>${l}</button>`).join('')}</span>`;
  const own = `<button class="${socd ? 'on' : ''}" data-view="SOCD" data-tip="Two keys, and what is sent while both are down">SOCD</button>`;
  const right = `<button data-act="selall">Select All</button><button data-act="clear"${n ? '' : ' disabled'}>Clear</button>`;
  return `<div class="hline"><span class="what">${head}</span>${modes}${own}<span class="right"${socd ? ' style="visibility:hidden"' : ''}>${right}</span></div>`;
}
function distances() {
  const m = selected.size ? P().keys[[...selected][0]].mode : P().keys[0].mode, row = (l, v, max) => `<div class="erow"><span class="lab">${l}</span><input type="range" min="1" max="${max}" value="${v}"><span class="val">${mm(v)} mm</span></div>`;
  return row('Actuation Distance', 17, FULL) + (m === RAPID ? row('(Press) Trigger Distance', 4, 20) + row('(Release) Reset Distance', 4, 20) : '') + `<div class="words">${m === RAPID ? 'Pressed at 1.7 mm. From there, at any depth: released as soon as it comes up 0.4 mm, pressed again as soon as it goes down 0.4 mm. Back above 1.4 mm, it starts over.' : 'Pressed when it goes down past 1.7 mm, released when it comes back above 1.4 mm.'}</div>`;
}
function keysPanel() {
  return keysHead() + `<div class="cols"><div class="editor">${distances()}</div>${testHtml()}</div>`;
}
function panelHtml() { return inView() ? socdPanel() : keysPanel(); }
function columnHtml() {
  const e = (n, on) => `<div class="entry${on ? ' on' : ''}">${n}</div>`;
  return `<div class="col"><div class="hdr">VIA</div>${e('Keymap')}${e('Macros')}<div class="sep"></div><div class="hdr">Board</div>${e('Lighting')}${e('Switches', true)}<div class="sep"></div><div class="hdr">Tools</div>${e('Matrix view')}${e('Device')}</div>`;
}
function stripHtml() {
  return PNAMES.map((n, i) => `<button class="${state.profile === i ? 'on' : ''}" data-prof="${i}">${state.profile === i ? '<span class="dot">●</span>' : ''}${n}</button>`).join('')
    + `<span style="margin-left:auto;display:flex;gap:14px;font-size:12px"><span class="muted">Full travel ${mm(FULL)} mm <i>(estimated)</i></span><span class="link">Reset profile…</span></span>`;
}
function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase(); renderControls();
  document.getElementById('frame').innerHTML = `<div class="menubar"><span class="board">Keychron K10 HE ANSI ▾</span><span class="muted">VIA</span><span class="right">Settings</span></div>`
    + `<div class="body">${columnHtml()}<div class="main"><div class="strip">${stripHtml()}</div><div class="boardarea">${boardSvg()}</div><div class="panel" id="panel">${panelHtml()}</div></div></div>`;
}
function redrawBoard() { const g = document.getElementById('keys'); if (g) g.innerHTML = KEYS.map(keySvg).join(''); }
function renderControls() {
  const c = document.getElementById('controls'); c.innerHTML = '';
  [['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group'; g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => { const b = document.createElement('button'); b.textContent = v; if (state[k] === v) b.className = 'on'; b.onclick = () => { state[k] = v; render(); }; g.appendChild(b); });
    c.appendChild(g);
  });
  const t = document.createElement('span'); t.className = 'toast'; t.textContent = state.toast; c.appendChild(t);
}

// ---- Events ------------------------------------------------------------------------------------
const frame = document.getElementById('frame'), tip = document.getElementById('tip');
function wrote() { state.toast = 'AMC_SET_SOCD, then AMC_SAVE_PROFILE'; alone.clear(); }
function addPair(a, b, type) {
  if (P().pairs.length >= SLOTS) { state.toast = `The board holds ${SLOTS} pairs per profile`; return; }
  P().pairs.push({ a, b, type }); state.pair = P().pairs.length - 1; wrote();
}
const same = (a, b) => P().pairs.findIndex(p => (p.a === a && p.b === b) || (p.a === b && p.b === a));
function keyChosen(i) {
  state.toast = '';
  if (!inView()) { selected.has(i) ? selected.delete(i) : selected.add(i); return; }
  if (state.pickFirst !== null) {
    const f = state.pickFirst; state.pickFirst = null; state.adding = false;
    if (i === f) return;
    const n = same(f, i); if (n >= 0) state.pair = n; else addPair(f, i, LAST);
    history = []; return;
  }
  if (state.adding) { state.pickFirst = i; return; }
  const n = P().pairs.findIndex(p => p.a === i || p.b === i);
  if (n >= 0 && n !== state.pair) { state.pair = n; history = []; return; }
  if (P().pairs.length < SLOTS) state.pickFirst = i; else state.toast = `The board holds ${SLOTS} pairs per profile`;
}
function dragBar(ev) { const r = document.querySelector(`[data-bar="${barDrag}"]`).getBoundingClientRect(), p = shown(); sim[p[barDrag]].goal = Math.max(0, Math.min(FULL, (ev.clientY - r.top) / r.height * FULL)); }
frame.addEventListener('mousedown', ev => { const b = state.testing ? ev.target.closest('[data-bar]') : null; if (b) { barDrag = b.dataset.bar; dragBar(ev); ev.preventDefault(); } });
window.addEventListener('mousemove', ev => { if (barDrag) dragBar(ev); });
window.addEventListener('mouseup', () => { barDrag = null; });
frame.addEventListener('click', ev => {
  const t = ev.target.closest('button,[data-key],[data-remove],[data-pair],[data-type],[data-view]') || ev.target, d = t.dataset;
  if (d.key !== undefined) { if (state.testing) return; keyChosen(+d.key); }
  else if (d.prof !== undefined) { state.profile = +d.prof; state.pair = 0; state.adding = false; state.pickFirst = null; selected.clear(); alone.clear(); history = []; state.toast = 'AMC_SELECT_PROFILE'; }
  else if (d.view) { const p = shown(); selected.clear(); if (d.view === 'Keys' && p) { selected.add(p.a); selected.add(p.b); } state.view = d.view; state.adding = false; state.pickFirst = null; }
  else if (d.pair !== undefined) { state.pair = +d.pair; state.adding = false; state.pickFirst = null; history = []; }
  else if (d.type) { shown().type = +d.type; wrote(); }
  else if (d.remove !== undefined) { const gone = +d.remove; P().pairs.splice(gone, 1); if (state.pair > gone || state.pair >= P().pairs.length) state.pair = Math.max(0, state.pair - 1); wrote(); }
  else if (d.act === 'add') { state.adding = !adding(); state.pickFirst = null; }
  else if (d.act === 'cancel') { state.adding = false; state.pickFirst = null; }
  else if (d.act === 'test') { state.testing = !state.testing; history = []; sim.forEach(s => { s.goal = 0; }); }
  else if (d.act === 'clear') selected.clear();
  else if (d.act === 'selall') KEYS.forEach((_, i) => selected.add(i));
  else return;
  render();
});
frame.addEventListener('mousemove', ev => {
  const t = ev.target.closest('[data-tip]'), k = ev.target.dataset.key, hk = k !== undefined ? +k : null;
  if (hk !== hoverKey) { hoverKey = hk; redrawBoard(); }
  if (!t || barDrag) { tip.style.display = 'none'; return; }
  tip.style.whiteSpace = 'pre-line'; tip.textContent = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 400) + 'px'; tip.style.top = ev.clientY + 16 + 'px';
});
frame.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
window.addEventListener('keydown', ev => {
  const i = BY_CODE.get(ev.code);
  if (ev.code === 'Escape' && adding()) { state.adding = false; state.pickFirst = null; render(); return; }
  if (i === undefined || ev.ctrlKey || ev.altKey || ev.metaKey || /^F\d/.test(ev.code)) return;
  ev.preventDefault(); if (ev.repeat) return;
  if (state.testing) sim[i].goal = FULL; else { keyChosen(i); render(); }
});
window.addEventListener('keyup', ev => { const i = BY_CODE.get(ev.code); if (i !== undefined) sim[i].goal = 0; });
window.addEventListener('blur', () => sim.forEach(s => { s.goal = 0; }));
document.getElementById('notes').innerHTML = `
<p><b>Try it</b>: the Gaming profile holds four pairs, one per choice (made up). Click a pair on the line or one of its keys; <b>+ Add pair</b>, or two other keys clicked, adds
one, the <b>×</b> on a pair removes it. What a pair does is in its tooltip and its keys', not beside it (Rico, 2026-11-23: the cards below say it already). <b>Test keys</b>, then hold both keys of the pair on your own keyboard, or drag down in a key's lane to press it part of the way: the strip shows the last four
seconds, what went down and what was sent. Simulated as the firmware is written.</p>
<p><b>Beside the modes</b>, settled by Rico (2026-11-23: in the Launcher SOCD is on the row of the modes already built): SOCD ends the line of
modes, apart from them, since it is not one key's mode; the pairs come under it. No number of pairs on it: "SOCD 4" read as a name (Rico, in Nazg), and the keys' marks say there are some. From there a mode
button goes back to the keys, the pair's two selected, and changes nothing. The strip, a tab of two selected keys and a section of its own were the others.</p>
<p><b>On the keys</b>: the other key's name, ⇄ centred between the two (Rico, 2026-11-23, in Nazg) -- ⇄ alone where there is no room -- and the other key ringed in violet when one is pointed at.</p>
<p><b>The choices carry the Launcher's names</b>, each drawn: the two keys going down and up (the height is the depth), under them what is sent, first with the
left key held and the other pressed meanwhile, then the other way round. Rappy Snappy's picture shows the first key light and the second deep, then both at the
bottom, where the key held first stays: read on the K10 HE V3, and not said by the Launcher. Which key wins under Absolute Priority is two named
buttons leading the words. No line repeats the chosen pair (Rico, 2026-11-23): one key of a pair is changed by removing the pair and adding another.</p>
<p><b>A new pair is Last Key Priority</b>, written at once when its second key is clicked: what people call Snap Tap. Nazg offers the board's 20 per profile,
the line saying how many are used; the Launcher makes 5 at most (how it shows more than 5 is not tried).</p>
<p><b>The test</b> shows travel from the board and <b>sent</b> from what the computer receives, as no command answers what is left after SOCD; a key whose keycode
the computer cannot tell apart (a macro, Fn) would be worked out from its travel instead. <b>Held back</b>: down, and not sent. The strip's own lanes carry each key's travel: bars above them said it twice.</p>`;
render();
</script>
</body>
</html>
