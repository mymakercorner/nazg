<!-- Mockup: Signal levels, second round -- helping the user find the keys at risk (ui-design.md,
     "Plugins"; the first round is diagnostics-section.html).

     First draft (2026-10-17). Rico's goal: help the user understand, as simply as possible, which
     keys risk not being recognised, from time to time or at all. No repair advice -- Model F Labs
     documents the causes; Nazg says what it measured and what looks unstable. No firmware change:
     everything comes from the existing level sweep (350 to 499, ~6 readings a second), the bins'
     thresholds and resting levels, and the scans.

     The boards. Rico's F77 -- its own definition, layer 0 and 4 minutes of real readings, recorded
     2026-10-17 (0.9.1, Model F, 3 bins, offset 10, 155 ms a reading with key output off, Rico pressing
     each key slowly) -- and two made-up ones on real definitions: the F122 (Rico's vial-qmk fork,
     keyboards/leyden_jar/f122; 8 x 18, 7 bins, offset +7) and the B104 (8 bins, offset -30). Their
     levels are made up to behave as the F77's did: a hold steady, its level set by the finger, a
     Model F's first reading overshooting. Planted faults on both: Menu dead; Caps Lock only just past
     its threshold however firmly pressed; ' resting close to its threshold; keypad 5 noisy; Insert
     stuck; Home pressed too briefly to measure; Print Screen and Scroll Lock never pressed; one
     controller column weak; on the F122, Pause at 499. The controller's wiring taken as the identity.

     What the F77 taught (two recordings, Rico, 2026-10-17):
     - a press lasts one or two readings unless held -- 95 of 150 lasted two, 24 one -- so the tool's
       three-in-a-row rule cannot judge real presses;
     - a hold is steady, but its level is the finger's: K held 3, 10 and 11 past its threshold, F 3 to
       18, Num Lock 15 every time -- and all work (Rico: no half press on a buckling spring; a light
       touch before the buckle moves the level part-way without activating, Fn 7 short);
     - a Model F's first reading of a press overshoots -- J 438 then 427 -- so the highest reading is
       never the key's level (Rico);
     - at rest the board is quiet: 6 to 15 below the threshold, moving by 5 at most.
     Hence the rules:
     - a press: readings clearly off the key's usual level -- one is enough when well past the
       threshold; it registers when a reading crosses;
     - a hold is measured only over 3 readings or more, by their median -- the overshoot left out;
       shorter presses register, unmeasured: "hold it a moment to measure it";
     - a key's strength is its STRONGEST measured hold -- what it can do; how holds differ is the
       finger, never a verdict;
     - failing: reads pressed at rest; or never got past its threshold in 3 presses or more -- one or
       two such presses ask to press again, firmly;
     - at risk: rests closer to its threshold than half the offset; or wanders at rest by 60 % of its
       margin; or even its firmest hold is under 3 past its threshold -- Rico's tool's rule;
     - no verdict from a released reading inside a hold: on the F77 it accused six healthy keys -- a
       quick double press, or the sweep catching the key moving;
     - to check: reaches 499, the top of the range (Rico's MX case); to do: not pressed yet, press
       again, hold to measure.
     Judged against the key's own board, never fixed numbers. A controller column whose keys hold,
     together, at half the board's typical level or less is said once, as a column. The sentences lead
     with the effect and carry no numbers -- those are in the trace and the tooltip (Rico,
     2026-10-17); "threshold" is the word, as in the firmware and the tool. The instruction: press each
     key down firmly and hold it a moment.

     A controller wired to no matrix -- every threshold at the firmware's sentinel, 300 on a Beam
     Spring, 1023 on a Model F -- gets one sentence instead of the analysis, the board plain (Rico,
     2026-10-17).

     With Advanced tools on, a Levels button before Board / Controller puts the Leyden Jar tool's
     numbers on the keys -- max, now and min, the bin bottom right -- for firmware work; off by
     default, so the view stays as it is (Rico, 2026-10-17). Without Advanced tools, no numbers: the
     tooltips have them. A key held down lights on the board, as a finger on it would: the live feedback
     the numbers gave in the tool.

     Room (Rico, 2026-10-17): the panel a fixed height, the list scrolling inside it under a header
     that stays; Keys and Whole board as tabs sharing one place; keys not pressed yet one line; the
     summary's counts filters; one sentence when a quarter of the keys share one problem. "Problems:
     Many" plants a third of the keys resting close to their threshold to test it.

     The variants: the board coloured by verdict, by margin or not at all; the list as bars or as
     sentences; the selected key's last presses side by side, its whole recording, or none; the
     whole board as one dot per key, or not.

     Rico, 2026-10-17: asked what a key's own press history would look like -- drawn as its last
     presses, kept whenever they were. ("Missed 1 press out of 4" went with the F77: it would have
     counted the finger's light presses as the key's.) A weak
     controller column is one row only: listing its keys pushed the other problems out of sight.
     The presses side by side, the overlaid view dropped (Rico, 2026-10-17).

     Rico, 2026-10-17: the one-dot-per-key view reads better than the histogram, whose bars said
     neither what they counted nor which keys they held -- the histograms are dropped. -->

  + `<div class="boardarea" id="boardarea">${state.view === 'Board' ? boardSvg() : gridSvg()}</div><div class="panel" id="panel">${panelHtml()}</div></div></div>`;
}
function redrawBoard() { const b = document.getElementById('boardarea'); if (b) b.innerHTML = state.view === 'Board' ? boardSvg() : gridSvg(); }
function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['board', 'Board', Object.keys(BOARDS)],
   ['controller', 'Controller', ['Soldered to a matrix', 'Not soldered']],
   ['moment', 'When', ['Nothing pressed yet', 'After a pass']],
   ['colours', 'The board', ['By verdict', 'By margin', 'Plain']],
   ['list', 'The list', ['Bars', 'Sentences']],
   ['trace', 'A key\'s levels', ['Its last presses', 'The whole recording', 'None']],
   ['many', 'Problems', ['A few', 'Many']],
   ['advanced', 'Advanced tools', ['Off', 'On']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => {
        state[k] = v;
        if (k === 'board' || k === 'many') { state.selected = null; state.filter = null; }
        if (k === 'many') { MANY = v === 'Many'; Object.values(BOARDS).forEach(buildBoard); }
        render();
      };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

// ---------------------------------------------------------------------------------------------
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-key], [data-view], [data-column], [data-act], [data-tab], [data-filter]');
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
  if (t.dataset.filter) { state.filter = state.filter === t.dataset.filter ? null : t.dataset.filter; state.tab = 'Keys'; render(); return; }
  if (t.dataset.act === 'levels') { state.levels = !state.levels; render(); return; }
  if (t.dataset.view) state.view = t.dataset.view;
  else if (t.dataset.key !== undefined) { const k = board().keys[+t.dataset.key]; const en = J.all.find(x => x.k === k); state.selected = state.selected === en ? null : en; }
  else if (t.dataset.column !== undefined) { state.view = 'Controller'; }
  render();
});
frame.addEventListener('mouseover', e => {
  const row = e.target.closest('.list [data-key], .list [data-column]');
  let h = null;
  if (row) h = row.dataset.column !== undefined ? { column: +row.dataset.column } : J.all.find(x => x.k === board().keys[+row.dataset.key]);
  if (h !== state.hover && JSON.stringify(h && h.column) !== JSON.stringify(state.hover && state.hover.column) || (h && h.k) !== (state.hover && state.hover.k)) { state.hover = h; redrawBoard(); }
});
const tip = document.getElementById('tip');
frame.addEventListener('mousemove', e => {
  const r = e.target.closest('rect[data-key], circle[data-key]') || (e.target.tagName === 'circle' && e.target.querySelector('title') ? e.target : null);
  const t = r && r.querySelector('title');
  if (t) { tip.textContent = t.textContent; tip.style.display = 'block'; } else tip.style.display = 'none';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 380) + 'px'; tip.style.top = (e.clientY + 18) + 'px';
});
frame.addEventListener('mousedown', e => {
  const r = e.target.closest('#boardarea rect[data-key]');
  if (!r) return;
  state.held = board().keys[+r.dataset.key]; redrawBoard(); e.preventDefault();
});
addEventListener('mouseup', () => { if (state.held) { state.held = null; redrawBoard(); } });
frame.addEventListener('mouseleave', () => { tip.style.display = 'none'; if (state.hover) { state.hover = null; redrawBoard(); } });

document.getElementById('notes').innerHTML = `
<p><b>The F77 is real</b>: Rico's, its own definition and 4 minutes of readings, every key pressed slowly -- but briefly, so most
presses lasted one or two readings: 49 of its keys say "hold a moment to measure", none is accused. The <b>F122</b> and <b>B104</b> are
made up to behave as the F77 did, with faults planted. Click a key, on the board or in the list, to see its presses.</p>
<p><b>When</b>: <b>nothing pressed yet</b> -- what Nazg knows at once: stuck keys, keys resting near their threshold, unsteady ones;
everything else "not pressed yet". <b>After a pass</b> -- the user pressed each key, as the line asks.</p>
<p><b>The board</b>: coloured <b>by verdict</b> -- good keys left plain, so only the problems stand out; <b>by margin</b> -- the tighter
of each key's two margins as a red tint, untested dashed; or <b>plain</b>, the list alone telling.</p>
<p><b>The list</b>, the weakest first, a weak controller column folded into one row -- its keys not listed, which pushed the
other problems out of sight; they light on the board under the pointer: as <b>bars</b> -- each key's usual
resting level (with how much it wanders, the grey band), the threshold, its usual hold (how much its holds differ, the blue band),
this keyboard's usual hold dotted,
each part named in a header right above the bars (a legend of symbols was unreadable, Rico) -- or as <b>sentences</b>, in words. Hover a row: its key lights on the board; a column row lights the column,
a click shows the controller's grid.</p>
<p><b>Room</b> (Rico, 2026-10-17): the panel keeps one height and the list scrolls inside it, under a header that stays; the whole

click "at risk" for those keys alone; and when many keys share one problem, a sentence above the list says it once. Try
<b>Problems: Many</b>.</p>

numbers, whose bars said neither what they counted nor which keys they held (Rico, 2026-10-17).</p>
<p><b>A key's levels</b>: its own last presses, whenever they were -- a key pressed a minute ago keeps them, where a window of the
last seconds would have lost them -- <b>side by side</b>, the last four (Rico chose them over an overlaid view, 2026-10-17), each
saying what it held past the threshold, too short to measure, or not across; at their left its resting readings as a band. The
spring's overshoot is circled, and left out. Or <b>the whole recording</b>.</p>
<p><b>The rules</b>, from the F77 (Rico, 2026-10-17): a press registers when a reading crosses; a hold is measured over 3 readings or

render();
</script>
</body>
