<!-- Mockup: the key's name beside its levels in Diagnostics' Signal levels (tester-feedback.md, 3 and 6;
     ui-design.md, "Plugins"; the rounds before are diagnostics-section.html and key-health.html).

     First draft (2026-11-07). A tester adjusting a Leyden Jar board: "the user would have to count
     ('this is the 15th key from the left which needs adjustment')" -- with Levels on, each key wears
     the tool's numbers INSTEAD of its legend (DescribeLevels(), NazgDiagnosticsSection.cpp), so the
     key he is looking at has no name. And: Signal levels opens on the bars, the numbers a second
     click away, which he expected to be the view itself.

     The board: Rico's F77, its own definition, layer 0, its bins and thresholds as it reported them
     (recorded 2026-10-17). Each key's resting level, how much it wanders and its usual press come
     from the 4-minute recording; the readings here are simulated from them, one every 155 ms as the
     F77 gives them -- a press overshooting on its first reading, as a Model F does. The tool's three
     numbers are computed as Nazg computes them: highest and lowest, each the median of three readings
     in a row on one side of the threshold. The five keys the recording never saw past their
     threshold get a made-up press, 6 past it.

     Press a key: hold it with the mouse, or press the same key on your own keyboard.

     The variants:
     - the numbers on the keys: the numbers alone (as built); the name above them, the board its
       usual size; the name beside them, the board drawn larger (scrolling); or the names alone, the
       numbers only in the panel;
     - the panel following the key pressed, or not;
     - the legend: a sample key in the panel's first line, or the button's tooltip (as built);
     - what Diagnostics shows when opened again: the numbers off (as built), as left for the session,
       as left and kept in settings.json, or always on -- with "Leave and come back" and "Restart
       Nazg" to try each;

// KLE, as in the other section mockups.
function parseKle(rows) {
  const keys = [];
  let x = 0, y = 0, rx = 0, ry = 0, r = 0, p = {};
  const pair = s => { const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  for (const row of rows) {
    if (!Array.isArray(row)) continue;
    for (const item of row) {
      if (typeof item === 'object') {
        if ('r' in item) r = item.r;
        if ('rx' in item || 'ry' in item) { if ('rx' in item) rx = item.rx; if ('ry' in item) ry = item.ry; x = rx; y = ry; }
        if ('x' in item) x += item.x;
        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];
        continue;
      }
      const w = p.w || 1, h = p.h || 1;
      const labels = String(item).split('\n');
      const cell = pair(labels[0]), option = pair(labels[3]);
      if (cell || p.d)
        keys.push({ x, y, w, h, x2: p.x2 || 0, y2: p.y2 || 0, w2: p.w2 || w, h2: p.h2 || h, decal: !!p.d,
                    cell, g: option ? option[0] : -1, o: option ? option[1] : 0 });
      x += w;
      p = {};
    }
    y += 1;
    x = rx;
  }
  return keys;
}

      b.x0 = Math.min(b.x0, x); b.y0 = Math.min(b.y0, y); b.x1 = Math.max(b.x1, x + w); b.y1 = Math.max(b.y1, y + h);

function resetReadings() {
  KEYS.forEach(k => { k.hist = []; k.max = null; k.min = null; k.heldFor = 0; k.seen = false; k.now = k.rest; });

function reading(k) {
  if (held.has(k)) {

    const v = k.heldFor === 0 ? k.press + 9 : k.press + Math.round((Math.random() - 0.5) * 2);
    k.heldFor++;
    return v;
  }
  k.heldFor = 0;
  return Math.max(k.lo, Math.min(k.hi, k.rest + Math.round((Math.random() - 0.5) * (k.hi - k.lo + 1))));
}
function tick() {
  for (const k of KEYS) {
    const v = reading(k);
    k.now = v;
    k.hist.push(v);
    if (k.hist.length > 3) k.hist.shift();
    if (v >= k.th) k.seen = true;
    if (k.hist.length === 3) {
      const med = [...k.hist].sort((a, b) => a - b)[1];
      if (k.hist.every(x => x >= k.th)) k.max = k.max === null ? med : Math.max(k.max, med);
      if (k.hist.every(x => x < k.th)) k.min = k.min === null ? med : Math.min(k.min, med);
    }

const namesOnly = () => state.onKeys === 'Names only, numbers in the panel';
const wide = () => state.onKeys === 'Name beside them, board larger';
const numbersOnKeys = () => state.mode === 'Signal levels' && state.levels && !namesOnly();
const following = () => state.mode === 'Signal levels' && (state.follow === 'On' || namesOnly());

// The key's text: its numbers in one of three arrangements, or its legend.
function keyText(k, x, y, w, h, u) {
  const name = legendOf(k.kc);
  const lv = (cls, tx, ty, v, fs, anchor, bold) => v === null || v === undefined ? ''
    : `<text class="lv ${cls}" x="${tx}" y="${ty}" style="font-size:${fs}px${bold ? ';font-weight:700' : ''}"${anchor ? ` text-anchor="${anchor}"` : ''}>${v}</text>`;
  const bin = BINS > 1 ? k.bin : null;
  if (!numbersOnKeys()) {
    const fs = Math.round(u * 0.28);
    return `<text class="t" x="${x + w / 2}" y="${y + h / 2 + fs * 0.35}" style="font-size:${fs}px">${esc(name)}</text>`;
  }
  const pad = Math.max(3, u * 0.09);
  if (state.onKeys === 'Numbers alone (as built)') {
    // Max top left, now middle left, min bottom left, the bin bottom right.
    const fs = Math.max(8, Math.round(u * 0.22));
    return lv('ex', x + pad, y + pad + fs * 0.85, k.max, fs) + lv('', x + pad, y + h / 2 + fs * 0.35, k.now, fs)
         + lv('ex', x + pad, y + h - pad, k.min, fs) + lv('bn', x + w - pad, y + h - pad, bin, fs, 'end');
  }
  if (state.onKeys === 'Name above the numbers') {
    // The name on the first line; now in bold with the highest at its right; the bin with the lowest.
    const fs = Math.max(8, Math.round(u * 0.21)), row = (h - 2 * pad) / 3;
    return `<text class="nm" x="${x + pad}" y="${y + pad + row * 0.8}" style="font-size:${fs}px">${esc(name)}</text>`
         + lv('', x + pad, y + pad + row * 1.85, k.now, fs, '', true) + lv('ex', x + w - pad, y + pad + row * 1.85, k.max, fs, 'end')
         + lv('bn', x + pad, y + h - pad, bin, fs) + lv('ex', x + w - pad, y + h - pad, k.min, fs, 'end');
  }
  // The tester's shape: the name on the left, the numbers right-aligned, the board drawn larger.
  const fs = Math.max(9, Math.round(u * 0.17)), nfs = Math.max(10, Math.round(u * 0.18));
  return `<text class="nm" x="${x + pad}" y="${y + h / 2 + nfs * 0.35}" style="font-size:${nfs}px">${esc(name)}</text>`
       + lv('bn', x + pad, y + h - pad, bin, fs)
       + lv('ex', x + w - pad, y + pad + fs * 0.85, k.max, fs, 'end') + lv('', x + w - pad, y + h / 2 + fs * 0.35, k.now, fs, 'end', true)
       + lv('ex', x + w - pad, y + h - pad, k.min, fs, 'end');
}
function svgStyle() {
  return `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.none{fill:none;stroke-dasharray:3 3;opacity:.55}`
    + `.k.seen{fill:var(--seen);stroke:var(--seenline)}`
    + `.k.live{fill:color-mix(in srgb, var(--press) 30%, var(--key));stroke:var(--press);stroke-width:2.5}`
    + `.k.last{stroke:var(--accent);stroke-width:2.5}`
    + `.lv{font-family:Arimo,Arial;pointer-events:none;fill:var(--text);font-variant-numeric:tabular-nums}.lv.ex{fill:var(--muted)}.lv.bn{fill:var(--ok)}`
    + `.nm{font-family:Arimo,Arial;fill:var(--text);pointer-events:none;font-weight:600}`
    + `.t{font-family:Arimo,Arial;fill:var(--text);text-anchor:middle;pointer-events:none}`
    + `.ruler{font:11px Arimo,Arial;fill:var(--muted);text-anchor:middle}</style>`;
}
function keyClass(k) {
  if (held.has(k)) return 'k live';
  let c = 'k';
  if (k.seen) c += ' seen';
  if (following() && last === k) c += ' last';
  return c;
}
function tipOf(k) {
  return `${legendOf(k.kc) || 'no key'} · row ${k.cell[0]}, column ${k.cell[1]}${BINS > 1 ? ` · bin ${k.bin}` : ''}\n`
       + `threshold ${k.th} · at rest about ${k.rest}${k.madeUp ? ' · its press made up' : ''}`;
}
function boardSvg() {
  const bd = boundsOf(KEYS), avail = 1160 - 180 - 28 - 30;
  const u = numbersOnKeys() && wide() ? 72 : Math.min(44, Math.floor(avail / (bd.x1 - bd.x0 + 0.7)));
  const m = u * 0.35, gap = Math.max(1, u * 0.06);
  const W2 = (bd.x1 - bd.x0) * u + 2 * m, H = (bd.y1 - bd.y0) * u + 2 * m;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W2}" height="${H}">${svgStyle()}<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  KEYS.forEach((k, i) => {
    const rect = (x, y, w, h) => `<rect class="${keyClass(k)}" data-key="${i}" data-tip="${esc(tipOf(k))}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.max(2, u * 0.1)}"/>`;
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, h = k.h * u - 2 * gap;
    s += rect(x, y, w, h);
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2) s += rect((k.x + k.x2 - bd.x0) * u + gap, (k.y + k.y2 - bd.y0) * u + gap, k.w2 * u - 2 * gap, k.h2 * u - 2 * gap);
    s += keyText(k, x, y, w, h, u);
  });
  return s + `</g></svg>`;
}
function gridSvg() {
  const big = numbersOnKeys() && wide(), cw = big ? 72 : 48, ch = big ? 60 : 44, lab = 34;
  const W2 = lab + F77.cols * cw + 10, H = lab + F77.rows * ch + 10;
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W2}" height="${H}">${svgStyle()}<rect class="plate" width="100%" height="100%" rx="12"/>`;
  for (let c = 0; c < F77.cols; c++) s += `<text class="ruler" x="${lab + c * cw + cw / 2}" y="${lab - 10}">C${c}</text>`;
  for (let r = 0; r < F77.rows; r++) s += `<text class="ruler" x="${lab / 2 + 2}" y="${lab + r * ch + ch / 2 + 4}">R${r}</text>`;
  const at = new Map(KEYS.map((k, i) => [k.cell.join(','), i]));
  for (let r = 0; r < F77.rows; r++) for (let c = 0; c < F77.cols; c++) {
    const i = at.get(`${r},${c}`), x = lab + c * cw + 2, y = lab + r * ch + 2;
    if (i === undefined) { s += `<rect class="k none" x="${x}" y="${y}" width="${cw - 4}" height="${ch - 4}" rx="4"/>`; continue; }
    const k = KEYS[i];
    s += `<rect class="${keyClass(k)}" data-key="${i}" data-tip="${esc(tipOf(k))}" x="${x}" y="${y}" width="${cw - 4}" height="${ch - 4}" rx="4"/>`
       + keyText(k, x, y, cw - 4, ch - 4, big ? 68 : 42);
  }
  return s + `</svg>`;
}

// ---------------------------------------------------------------------------------------------
// The panel.
function sampleKey() {
  // The legend: one key, words where the numbers go, in the arrangement shown.
  const w = 132, h = 50, pad = 5, fs = 10;
  const t = (x, y, s, cls, anchor, bold) => `<text class="lv ${cls}" x="${x}" y="${y}" style="font-size:${fs}px${bold ? ';font-weight:700' : ''}"${anchor ? ` text-anchor="${anchor}"` : ''}>${s}</text>`;
  let inner = '';
  if (state.onKeys === 'Numbers alone (as built)')
    inner = t(pad, pad + 9, 'highest', 'ex') + t(pad, h / 2 + 4, 'now', '') + t(pad, h - pad, 'lowest', 'ex') + (BINS > 1 ? t(w - pad, h - pad, 'bin', 'bn', 'end') : '');
  else if (state.onKeys === 'Name above the numbers')
    inner = `<text class="nm" x="${pad}" y="${pad + 10}" style="font-size:${fs}px">key</text>` + t(pad, h / 2 + 5, 'now', '', '', true) + t(w - pad, h / 2 + 5, 'highest', 'ex', 'end')
          + (BINS > 1 ? t(pad, h - pad, 'bin', 'bn') : '') + t(w - pad, h - pad, 'lowest', 'ex', 'end');
  else
    inner = `<text class="nm" x="${pad}" y="${h / 2 + 4}" style="font-size:11px">key</text>` + (BINS > 1 ? t(pad, h - pad, 'bin', 'bn') : '')
          + t(w - pad, pad + 9, 'highest', 'ex', 'end') + t(w - pad, h / 2 + 4, 'now', '', 'end', true) + t(w - pad, h - pad, 'lowest', 'ex', 'end');
  return `<svg width="${w}" height="${h}" style="margin:-3px 0">${svgStyle()}<rect class="k" x="0.5" y="0.5" width="${w - 1}" height="${h - 1}" rx="5"/>${inner}</svg>`;
}
function scaleSvg(k) {
  // The key's readings on one line: at rest (its band), the threshold, its highest, now.
  const W = 260, H = 26, lo = 350, hi = Math.max(440, k.press + 15), X = v => 6 + (v - lo) / (hi - lo) * (W - 12);
  let s = `<svg width="${W}" height="${H}"><line x1="6" y1="13" x2="${W - 6}" y2="13" stroke="var(--border)" stroke-width="2"/>`
    + `<rect x="${X(k.lo)}" y="8" width="${Math.max(2, X(k.hi) - X(k.lo))}" height="10" rx="2" fill="var(--muted)" opacity=".45"/>`
    + `<line x1="${X(k.th)}" y1="2" x2="${X(k.th)}" y2="24" stroke="var(--warn)" stroke-width="2"/>`;
  if (k.max !== null) s += `<circle cx="${X(k.max)}" cy="13" r="4" fill="none" stroke="var(--press)" stroke-width="2"/>`;
  s += `<circle cx="${X(k.now)}" cy="13" r="5" fill="${k.now >= k.th ? 'var(--press)' : 'var(--text)'}"/></svg>`;
  return s;
}
function followHtml() {
  if (!last)
    return `<div class="follow${namesOnly() ? ' big' : ''}" id="follow"><span class="muted">Press a key: its levels show here, live, as long as you hold it -- and stay once you let go.</span></div>`;
  const k = last, v = x => x === null ? '–' : x;
  const num = (value, word, cls) => `<div class="num"><b${cls ? ` style="color:var(${cls})"` : ''}>${v(value)}</b><span>${word}</span></div>`;
  return `<div class="follow${namesOnly() ? ' big' : ''}" id="follow"><span class="key">${esc(legendOf(k.kc) || 'no key')}</span>`
    + num(k.now, 'now', k.now >= k.th ? '--press' : '') + num(k.max, 'highest') + num(k.min, 'lowest')
    + num(k.th, 'threshold', '--warn') + (BINS > 1 ? num(k.bin, 'bin', '--ok') : '')
    + `<div style="margin-left:auto">${scaleSvg(k)}<div class="muted" style="font-size:11px">at rest · threshold · highest ○ · now ●</div></div></div>`;
}
function panelHtml() {
  if (state.mode === 'Key presses')
    return `<div class="mline"><span class="title">Key presses</span><span class="desc">press keys on the keyboard: each lights while it is down</span>`
      + `<span class="right"><span class="seg"><button class="on">Board</button><button>QMK matrix</button><button>Controller</button></span></span></div>`
      + `<div class="rest"><div class="ph">As built: every key seen pressed ticked green. Choose <b>Signal levels</b> in the strip.</div></div>`
      + `<div class="mline" style="border-top:1px solid var(--border);border-bottom:none"><span class="out">Key output off: the keyboard types nothing while Diagnostics shows</span></div>`;
  const viewSeg = `<span class="seg">${['Board', 'Controller'].map(v => `<button class="${state.view === v ? 'on' : ''}" data-view="${v}">${v}</button>`).join('')}</span>`;
  const levelsTip = 'The Leyden Jar tool\'s numbers on the keys: the highest reading past the threshold, the reading now, the lowest below it, and the bin';
  const levelsButton = namesOnly() ? '' : `<button class="${state.levels ? 'on' : ''}" data-act="levels"${state.legend === 'Tooltip (as built)' ? ` title="${levelsTip}"` : ''}>Levels</button>`;
  const legend = state.levels && !namesOnly() && state.legend === 'Sample key' ? `<span class="muted" style="font-size:12px">each key:</span>${sampleKey()}` : '';
  let h = `<div class="mline"><span class="title">Signal levels</span><span class="desc">press each key down firmly and hold it a moment, one after the other</span>`
    + `<span class="right"><span class="margins">Threshold margin, rest <input value="3"> press <input value="3"></span><span class="divider"></span>${legend}${levelsButton}${viewSeg}</span></div>`;
  if (following()) h += followHtml();
  h += `<div class="rest"><div class="ph">As built, unchanged by this mockup: the summary (good, at risk, failing, to do -- each a filter), then <b>Keys</b> and <b>Whole board</b> as tabs `
    + `sharing one place -- the keys at risk as bars, the weakest first -- and a key's last presses when one is clicked. `
    + `${following() ? 'The line above takes some of their height: the panel keeps one height, the list scrolling inside it.' : ''}</div></div>`;
  return h + `<div class="mline" style="border-top:1px solid var(--border);border-bottom:none"><span class="out">Key output off: the keyboard types nothing while Diagnostics shows</span></div>`;
}
function columnHtml() {
  const vial = ['Keymap', 'Layout', 'Macros', 'Tap Dance', 'Combos', 'Key Overrides', 'QMK Settings'];
  return `<div class="col"><div class="hdr">Vial</div>${vial.map(e => `<div class="entry">${e}</div>`).join('')}`
    + `<div class="sep"></div><div class="hdr">Tools</div><div class="entry">Device</div><div class="entry on">Diagnostics</div><div class="entry">Matrix</div></div>`;
}
function boardHtml() { return state.view === 'Board' || state.mode === 'Key presses' ? boardSvg() : gridSvg(); }
function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  const strip = ['Key presses', 'Signal levels', 'Device'].map(m => `<button class="${state.mode === m ? 'on' : ''}" data-mode="${m}">${m}</button>`).join('');
  document.getElementById('frame').innerHTML =
    `<div class="menubar"><span class="board">Model F Labs F77 ▾</span><span class="muted">Vial</span><span class="right">Settings</span></div>`
  + `<div class="body">${columnHtml()}<div class="main"><div class="strip">${strip}</div>`
  + `<div class="boardarea${numbersOnKeys() && wide() ? ' wide' : ''}" id="boardarea">${boardHtml()}</div><div class="panel" id="panel">${panelHtml()}</div></div></div>`;
}
function redrawLive() {
  const b = document.getElementById('boardarea');
  if (b) b.innerHTML = boardHtml();
  const f = document.getElementById('follow');
  if (f) f.outerHTML = followHtml();
}

// ---------------------------------------------------------------------------------------------
// The variants, and the two actions that show what each "when opened again" choice does.
function reopen(restart) {
  if (state.reopen === 'Off: click Levels (as built)') state.levels = false;
  else if (state.reopen === 'As left, this session') state.levels = restart ? false : state.levels;
  else if (state.reopen === 'Always on') state.levels = true;
  // 'As left, kept in settings': unchanged, even after a restart.
  state.mode = state.opensOn;
  held.clear(); last = null; resetReadings();
  state.toast = `${restart ? 'Nazg started again' : 'Diagnostics shown again'}: ${state.mode}${state.mode === 'Signal levels' && !namesOnly() ? `, the numbers ${state.levels ? 'on' : 'off'}` : ''}`
              + (state.opensOn === 'Key presses' && !namesOnly() ? ` (Levels ${state.levels ? 'on' : 'off'} once Signal levels is chosen)` : '');
  render();
}
function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['onKeys', 'The numbers on the keys', ['Numbers alone (as built)', 'Name above the numbers', 'Name beside them, board larger', 'Names only, numbers in the panel']],
   ['follow', 'Panel follows the key pressed', ['On', 'Off']],
   ['legend', 'Legend', ['Sample key', 'Tooltip (as built)']],
   ['reopen', 'Numbers when shown again', ['Off: click Levels (as built)', 'As left, this session', 'As left, kept in settings', 'Always on']],
   ['opensOn', 'Opens on', ['Key presses', 'Signal levels']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => { state[k] = v; state.toast = ''; render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
  const g = document.createElement('div'); g.className = 'group';
  g.innerHTML = `<span class="name">Try</span>`;
  [['Leave and come back', false], ['Restart Nazg', true]].forEach(([label, restart]) => {
    const bt = document.createElement('button'); bt.textContent = label; bt.onclick = () => reopen(restart); g.appendChild(bt);
  });
  const bt = document.createElement('button'); bt.textContent = 'Clear readings'; bt.onclick = () => { resetReadings(); last = null; render(); }; g.appendChild(bt);
  c.appendChild(g);
  if (state.toast) { const t = document.createElement('span'); t.className = 'toast'; t.textContent = state.toast; c.appendChild(t); }
}

// ---------------------------------------------------------------------------------------------
// Pressing: the mouse on a key, or the same key on the computer's keyboard.
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-view], [data-act], [data-mode]');
  if (!t) return;
  if (t.dataset.act === 'levels') state.levels = !state.levels;
  if (t.dataset.view) state.view = t.dataset.view;
  if (t.dataset.mode && t.dataset.mode !== 'Device') state.mode = t.dataset.mode;
  render();
});
function press(k) { held.add(k); last = k; redrawLive(); }
function release(k) { held.delete(k); redrawLive(); }
let mouseKey = null;
frame.addEventListener('mousedown', e => {
  const r = e.target.closest('#boardarea rect[data-key]');
  if (!r) return;
  mouseKey = KEYS[+r.dataset.key]; press(mouseKey); e.preventDefault();
});
addEventListener('mouseup', () => { if (mouseKey) { release(mouseKey); mouseKey = null; } });
const CODE_TO_KC = c => {
  if (/^Key[A-Z]$/.test(c)) return 'KC_' + c.slice(3);
  if (/^Digit\d$/.test(c)) return 'KC_' + c.slice(5);
  if (/^F\d+$/.test(c)) return 'KC_' + c;
  if (/^Numpad\d$/.test(c)) return 'KC_P' + c.slice(6);
  return { Escape: 'KC_ESC', Backquote: 'KC_GRV', Minus: 'KC_MINS', Equal: 'KC_EQL', Backspace: 'KC_BSPC', Tab: 'KC_TAB',
    BracketLeft: 'KC_LBRC', BracketRight: 'KC_RBRC', Enter: 'KC_ENT', CapsLock: 'KC_CAPS', Semicolon: 'KC_SCLN', Quote: 'KC_QUOT',
    Backslash: 'KC_BSLS', IntlBackslash: 'KC_NUBS', Comma: 'KC_COMM', Period: 'KC_DOT', Slash: 'KC_SLSH', ShiftLeft: 'KC_LSFT',
    ShiftRight: 'KC_RSFT', ControlLeft: 'KC_LCTL', ControlRight: 'KC_RCTL', AltLeft: 'KC_LALT', AltRight: 'KC_RALT',
    MetaLeft: 'KC_LGUI', MetaRight: 'KC_RGUI', ContextMenu: 'KC_APP', Space: 'KC_SPC', ArrowUp: 'KC_UP', ArrowDown: 'KC_DOWN',
    ArrowLeft: 'KC_LEFT', ArrowRight: 'KC_RGHT', Insert: 'KC_INS', Delete: 'KC_DEL', Home: 'KC_HOME', End: 'KC_END',
    PageUp: 'KC_PGUP', PageDown: 'KC_PGDN', NumLock: 'KC_NUM', NumpadDivide: 'KC_PSLS', NumpadMultiply: 'KC_PAST',
    NumpadSubtract: 'KC_PMNS', NumpadAdd: 'KC_PPLS', NumpadEnter: 'KC_PENT', NumpadDecimal: 'KC_PDOT' }[c];
};
addEventListener('keydown', e => {
  const kc = CODE_TO_KC(e.code), k = kc && KEYS.find(x => x.kc === kc);
  if (!k) return;
  e.preventDefault();
  if (!held.has(k)) press(k);
});
addEventListener('keyup', e => {
  const kc = CODE_TO_KC(e.code), k = kc && KEYS.find(x => x.kc === kc);
  if (k) release(k);
});
addEventListener('blur', () => { held.clear(); redrawLive(); });
const tip = document.getElementById('tip');
frame.addEventListener('mousemove', e => {
  const r = e.target.closest('rect[data-tip]');
  if (r) { tip.textContent = r.dataset.tip; tip.style.display = 'block'; } else tip.style.display = 'none';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 380) + 'px'; tip.style.top = (e.clientY + 18) + 'px';
});
frame.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

document.getElementById('notes').innerHTML = `
<p><b>Press a key</b>: hold it with the mouse, or press the same key on your own keyboard. The readings are simulated from Rico's F77
recording, one every 155 ms: a press overshoots on its first reading, then holds at the key's usual level. <b>Highest</b> and
<b>lowest</b> fill in as the tool's do -- only once three readings in a row stay on one side of the threshold, so a quick tap shows
"now" but leaves "highest" empty: hold a key a moment, as the panel asks.</p>
<p><b>The numbers on the keys</b>, with Levels on: <b>alone</b> -- as built, the name gone, which is the tester's complaint;
<b>the name above them</b> -- the board its usual size, now in bold beside the highest, the bin beside the lowest;
<b>the name beside them</b> -- the tester's own shape, the name on the left and the numbers right-aligned, which a 1u key cannot
hold at the usual size, so the board is drawn larger and scrolls; <b>the names alone</b> -- no numbers on the keys at all, no Levels
button: the panel's line carries the key pressed.</p>
<p><b>The panel following the key pressed</b>: the key's name and its numbers, large, while it is held and after -- what the tester
does, pressing Q while watching its levels, without reading a key's corner. The line under it puts the readings on one scale: the
band where the key rests, the threshold, the highest, now. It takes some of the list's height.</p>
<p><b>The legend</b>: a sample key in the panel's first line, words where the numbers go, in the arrangement chosen -- always on screen,
where a tooltip cannot be read while looking at another key (the tester).</p>
<p><b>When shown again</b> -- Rico's call, since numbers by default reverses his 2026-10-17 choice (verdicts and words for everyone,
numbers behind the button): <b>off</b>, as built; <b>as left, this session</b> -- one click per session; <b>as left, kept in
settings.json</b> -- an expert clicks once, ever; <b>always on</b>. <b>Opens on</b>: Key presses, as built, or Signal levels.
"Leave and come back" and "Restart Nazg" show what each does.</p>
<p><b>Controller</b> shows the same choices on the controller's grid. Space is named here, as Matrix and Diagnostics now name it.</p>`;

resetReadings();
render();
setInterval(tick, READING_MS);
</script>
</body>
</html>
