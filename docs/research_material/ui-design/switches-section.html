<!-- Mockup: a Keychron Hall-effect board's switch settings -- actuation point, Rapid Trigger and the
     three profiles (ui-design.md, "The Switches section"; the wire is keychron-commands.md, 0xA9).

     First round (2026-11-08), scope chosen by Rico: actuation, Rapid Trigger, profiles. DKS, toggle,
     gamepad, SOCD and calibration are round two: they show here only as faint entries, to judge where
     they would go.

     The board: the K10 HE ANSI Rico borrowed, its corrected 0EA7 definition (dist/k10_he_0EA7/), the
     Windows base layer's legends. Its profile 0 in the three states read on 2026-11-08 -- as it came,
     Rapid Trigger ticked in Keychron's Launcher, unticked again -- byte for byte (global 0x00010445;
     the 104 keys 0, 0x00010446 or 0x00010445), plus one made-up state with keys that differ. Profiles
     2 and 3 were never read: they show the board's defaults. Full travel 3.5 mm, the board's curve's
     last x; pressing any key to the bottom "measures" it, as the live readout's clamp would.

     Press keys on your own keyboard: they are the K10's keys. They select, or -- with Test keys on --
     play the K10's switches, travelling down while held and up when let go, pressed and released by
     the settings of their key, with the raw values on request. Selecting is Keychron's (Rico,
     2026-11-08): a click selects or unselects a key, a box drawn over several selects them (or
     unselects them when all were), a key pressed on the board selects or unselects it too, and
     Select All / Clear.

     Settled by Rico (2026-11-08), the variants removed: the profiles in the strip, picking one makes
     the board use it, the Actuation Distance on every key, the selection edited or else every key,
     and Rapid Trigger's (Press) Trigger Distance and (Release) Reset Distance set apart. The profiles
     carry the Launcher's names, Default, Gaming and Gamepad, where the board's name field is empty.

     The names are exactly Keychron's Launcher's (Rico, 2026-11-08): Actuation Distance, (Press)
     Trigger Distance, (Release) Reset Distance. -->

<style>

<body>
<div class="controls" id="controls"></div>
<div class="stage"><div class="frame" id="frame"></div></div>
<div class="notes" id="notes"></div>
<div class="tip" id="tip"></div>
<script>
// The K10 HE ANSI, corrected 0EA7 definition (dist/k10_he_0EA7/k10_he_ansi_0EA7.json): its KLE.
const KLE = [[{"c":"#777777"},"0,0",{"x":1,"c":"#cccccc"},"0,2","0,3","0,4","0,5",{"x":0.5},"0,6","0,7","0,8","0,9",{"x":0.5},"0,10","0,11","0,12","0,13",{"x":0.25},"0,14","0,15","0,16"],[{"y":0.25},"1,0","1,1","1,2","1,3","1,4","1,5","1,6","1,7","1,8","1,9","1,10","1,11","1,12",{"w":2},"1,13",{"x":0.25},"1,14","1,15","1,16",{"x":0.25},"1,17","1,18","1,19","1,20"],[{"w":1.5},"2,0","2,1","2,2","2,3","2,4","2,5","2,6","2,7","2,8","2,9","2,10","2,11","2,12",{"w":1.5},"2,13",{"x":0.25},"2,14","2,15","2,16",{"x":0.25},"2,17","2,18","2,19",{"h":2},"2,20"],[{"w":1.75},"3,0","3,1","3,2","3,3","3,4","3,5","3,6","3,7","3,8","3,9","3,10","3,11",{"w":2.25,"c":"#777777"},"3,12",{"x":3.5,"c":"#cccccc"},"3,17","3,18","3,19"],[{"w":2.25},"4,0","4,2","4,3","4,4","4,5","4,6","4,7","4,8","4,9","4,10","4,11",{"w":2.75},"4,13",{"x":1.25},"4,15",{"x":1.25},"4,17","4,18","4,19",{"h":2},"4,20"],[{"w":1.25},"5,0",{"w":1.25},"5,1",{"w":1.25},"5,2",{"w":6.25},"5,6",{"w":1.25},"5,9",{"w":1.25},"5,10",{"w":1.25},"5,11",{"w":1.25},"5,12",{"x":0.25},"5,14","5,15","5,16",{"x":0.25,"w":2},"5,17","5,18"]];

// The Windows base layer's legends, and the KeyboardEvent.code that plays each key.
const LEGEND = {
 '0,0':['Esc','Escape'],'0,2':['F1','F1'],'0,3':['F2','F2'],'0,4':['F3','F3'],'0,5':['F4','F4'],'0,6':['F5','F5'],'0,7':['F6','F6'],'0,8':['F7','F7'],'0,9':['F8','F8'],
 '0,10':['F9','F9'],'0,11':['F10','F10'],'0,12':['F11','F11'],'0,13':['F12','F12'],'0,14':['PrtSc','PrintScreen'],'0,15':['Cortana','ScrollLock'],'0,16':['Light','Pause'],
 '1,0':['`','Backquote'],'1,1':['1','Digit1'],'1,2':['2','Digit2'],'1,3':['3','Digit3'],'1,4':['4','Digit4'],'1,5':['5','Digit5'],'1,6':['6','Digit6'],'1,7':['7','Digit7'],
 '1,8':['8','Digit8'],'1,9':['9','Digit9'],'1,10':['0','Digit0'],'1,11':['-','Minus'],'1,12':['=','Equal'],'1,13':['Backspace','Backspace'],'1,14':['Ins','Insert'],
 '1,15':['Home','Home'],'1,16':['PgUp','PageUp'],'1,17':['Num','NumLock'],'1,18':['/','NumpadDivide'],'1,19':['*','NumpadMultiply'],'1,20':['-','NumpadSubtract'],
 '2,0':['Tab','Tab'],'2,1':['Q','KeyQ'],'2,2':['W','KeyW'],'2,3':['E','KeyE'],'2,4':['R','KeyR'],'2,5':['T','KeyT'],'2,6':['Y','KeyY'],'2,7':['U','KeyU'],'2,8':['I','KeyI'],
 '2,9':['O','KeyO'],'2,10':['P','KeyP'],'2,11':['[','BracketLeft'],'2,12':[']','BracketRight'],'2,13':['\\','Backslash'],'2,14':['Del','Delete'],'2,15':['End','End'],
 '2,16':['PgDn','PageDown'],'2,17':['7','Numpad7'],'2,18':['8','Numpad8'],'2,19':['9','Numpad9'],'2,20':['+','NumpadAdd'],
 '3,0':['Caps','CapsLock'],'3,1':['A','KeyA'],'3,2':['S','KeyS'],'3,3':['D','KeyD'],'3,4':['F','KeyF'],'3,5':['G','KeyG'],'3,6':['H','KeyH'],'3,7':['J','KeyJ'],'3,8':['K','KeyK'],
 '3,9':['L','KeyL'],'3,10':[';','Semicolon'],'3,11':["'",'Quote'],'3,12':['Enter','Enter'],'3,17':['4','Numpad4'],'3,18':['5','Numpad5'],'3,19':['6','Numpad6'],
 '4,0':['Shift','ShiftLeft'],'4,2':['Z','KeyZ'],'4,3':['X','KeyX'],'4,4':['C','KeyC'],'4,5':['V','KeyV'],'4,6':['B','KeyB'],'4,7':['N','KeyN'],'4,8':['M','KeyM'],
 '4,9':[',','Comma'],'4,10':['.','Period'],'4,11':['/','Slash'],'4,13':['Shift','ShiftRight'],'4,15':['↑','ArrowUp'],'4,17':['1','Numpad1'],'4,18':['2','Numpad2'],
 '4,19':['3','Numpad3'],'4,20':['Enter','NumpadEnter'],
 '5,0':['Ctrl','ControlLeft'],'5,1':['Win','MetaLeft'],'5,2':['Alt','AltLeft'],'5,6':['Space','Space'],'5,9':['Alt','AltRight'],'5,10':['Win','MetaRight'],
 '5,11':['Fn','ContextMenu'],'5,12':['Ctrl','ControlRight'],'5,14':['←','ArrowLeft'],'5,15':['↓','ArrowDown'],'5,16':['→','ArrowRight'],'5,17':['0','Numpad0'],'5,18':['.','NumpadDecimal']};

function parseKle(rows) {
  const keys = []; let y = 0;
  for (const row of rows) {
    let x = 0, p = {};
    for (const item of row) {
      if (typeof item === 'object') { if ('x' in item) x += item.x; if ('y' in item) y += item.y; if ('w' in item) p.w = item.w; if ('h' in item) p.h = item.h; continue; }
      const w = p.w || 1, h = p.h || 1;
      keys.push({ x, y, w, h, cell: item, name: (LEGEND[item] || ['?'])[0], code: (LEGEND[item] || [])[1] });
      x += w; p = {};
    }
    y += 1;
  }
  return keys;
}
const KEYS = parseKle(KLE);
const BY_CODE = new Map(KEYS.map((k, i) => [k.code, i]));

// ---------------------------------------------------------------------------------------------
// The profile, as analog_key_config_t decodes: mode 0 follow / 1 regular / 2 rapid trigger; the
// three distances in 0.1 mm, 0 following the profile.
const FULL = 35;                 // the curve's last x on the K10 HE
const G0 = { mode: 1, act: 17, press: 4, rel: 4 };   // global 0x00010445: regular, 1.7, 0.4, 0.4
const ZERO = { mode: 0, act: 0, press: 0, rel: 0 };
function allKeys(cfg) { return KEYS.map(() => ({ ...cfg })); }
const STATES = {
  'As it came (all 0)': () => allKeys(ZERO),
  'Rapid Trigger ticked in the Launcher': () => allKeys({ mode: 2, act: 17, press: 4, rel: 4 }),
  'Unticked again': () => allKeys({ ...G0 }),
  'Some keys apart (made up)': () => {
    const keys = allKeys({ ...G0 });
    for (const c of ['2,2', '3,1', '3,2', '3,3']) keys[KEYS.findIndex(k => k.cell === c)] = { mode: 2, act: 5, press: 2, rel: 2 };
    keys[KEYS.findIndex(k => k.cell === '5,6')] = { mode: 1, act: 25, press: 4, rel: 4 };
    return keys;
  },
};
function freshProfiles(stateName) {
  return [
    { name: '', global: { ...G0 }, keys: STATES[stateName]() },
    { name: '', global: { ...G0 }, keys: allKeys(ZERO) },
    { name: '', global: { ...G0 }, keys: allKeys(ZERO) },
  ];
}

const state = {
  where: 'Profiles in the strip', pick: 'Picking uses it', onKeys: 'Actuation on every key',
  scope: 'Nothing selected: every key', sens: 'Press and release apart', testing: false, raw: false, boardState: 'As it came (all 0)', theme: 'Light',
  profile: 0, inUse: 0, mode: 'Actuation', tab: 'Whole profile', toast: '', renaming: false, measured: false,
};
let profiles = freshProfiles(state.boardState);
let selected = new Set();

function eff(i, p = profiles[state.profile]) {
  const k = p.keys[i], g = p.global;
  return { mode: k.mode || g.mode, act: k.act || g.act, press: k.press || g.press, rel: k.rel || g.rel };
}
const mm = v => (v / 10).toFixed(1);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// The Launcher's names where the board's name field is empty, as on every profile read so far.
function profileName(i) { return profiles[i].name || ['Default', 'Gaming', 'Gamepad'][i]; }

// The keys folded by what they do -- their EFFECTIVE settings, not whether their word is 0: the
// three states read on the board must read alike when they behave alike (keychron-commands.md).
function groups() {
  const m = new Map();
  KEYS.forEach((k, i) => {
    const e = eff(i), id = `${e.mode}|${e.act}|${e.mode === 2 ? e.press + '|' + e.rel : ''}`;
    if (!m.has(id)) m.set(id, { e, keys: [] });
    m.get(id).keys.push(i);
  });
  return [...m.values()].sort((a, b) => b.keys.length - a.keys.length);
}
function describe(e, short) {
  if (e.mode === 1) return short ? `Regular, ${mm(e.act)} mm` : `Regular · Actuation Distance ${mm(e.act)} mm`;
  const s = e.press === e.rel && state.sens === 'One sensitivity' ? `Sensitivity ${mm(e.press)} mm` : `Trigger Distance ${mm(e.press)} mm · Reset Distance ${mm(e.rel)} mm`;
  return short ? `Rapid Trigger, ${mm(e.act)} mm` : `Rapid Trigger · Actuation Distance ${mm(e.act)} mm · ${s}`;
}
function names(list, max = 12) {
  const n = list.map(i => KEYS[i].name);
  return n.length > max ? n.slice(0, max).join(' ') + ` … ${n.length - max} more` : n.join(' ');
}

// What the editor acts on.
function target() {
  if (state.scope === 'Nothing selected: every key') return selected.size ? [...selected] : KEYS.map((_, i) => i);
  return state.tab === 'Whole profile' ? KEYS.map((_, i) => i) : [...selected];
}
function common(list, f) {
  const v = list.map(i => eff(i)[f]);
  return v.every(x => x === v[0]) ? v[0] : null;
}
function apply(field, value, list) {
  const p = profiles[state.profile];
  for (const i of list) {
    const e = eff(i), k = p.keys[i];
    // Written as the Launcher does: every key explicit. Whether to write the profile's global and 0
    // into the keys instead is in the notes.
    Object.assign(k, e, { [field]: value });
    if (field === 'press' && state.sens === 'One sensitivity') k.rel = value;
  }
  state.toast = `Written to ${profileName(state.profile)} and saved (AMC_SET_TRAVAL, then AMC_SAVE_PROFILE)`;
}

// ---------------------------------------------------------------------------------------------
// The switches simulated: each key's travel, and pressed or not by its own settings
// (action_regular_trigger.c, action_rapid_trigger.c).
const sim = KEYS.map(() => ({ travel: 0, down: false, pressed: false, peak: 0, trough: 0 }));
let followed = null;   // the key the gauge shows: the last pressed, else the selection's first
const SPEED = FULL / 220 * 16;   // full travel in ~220 ms
function step() {
  let moved = false;
  sim.forEach((s, i) => {
    const goal = s.down ? FULL : 0;
    if (s.travel === goal) return;
    s.travel = s.down ? Math.min(FULL, s.travel + SPEED) : Math.max(0, s.travel - SPEED);
    if (s.travel >= FULL && !state.measured) { state.measured = true; state.toast = 'Full travel measured: 3.5 mm (the live readout pinned at 215)'; renderControls(); redrawPanelHead(); }
    const e = eff(i), act = e.act, off = Math.max(0, act - 3);
    if (e.mode === 1) {
      if (!s.pressed && s.travel >= act) s.pressed = true;
      else if (s.pressed && s.travel < off) s.pressed = false;
    } else {
      if (s.travel < off) { s.pressed = false; s.peak = 0; s.trough = 0; }
      else if (!s.pressed && (s.trough === 0 ? s.travel >= act : s.travel >= s.trough + e.press)) { s.pressed = true; s.peak = s.travel; }
      else if (s.pressed) {
        s.peak = Math.max(s.peak, s.travel);
        if (s.travel <= s.peak - e.rel && s.travel < FULL * 0.95 - e.rel) { s.pressed = false; s.trough = s.travel; }
      } else s.trough = Math.min(s.trough, s.travel);
    }
    moved = true;
  });
  if (moved) redrawLive();
}
setInterval(step, 16);

// ---------------------------------------------------------------------------------------------
// The board.
let U = 39, M = 14, GAP = 2, BD = null;
function bounds() {
  let x1 = 0, y1 = 0;
  for (const k of KEYS) { x1 = Math.max(x1, k.x + k.w); y1 = Math.max(y1, k.y + k.h); }
  return { x1, y1 };
}
function svgStyle() {
  return `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}`
    + `.k.sel{stroke:var(--sel);stroke-width:2.5}.k.dim{opacity:.55}`
    + `.lg{font-family:Arimo,Arial;fill:var(--text);pointer-events:none}`
    + `.vl{font-family:Arimo,Arial;fill:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}`
    + `.vl.b{fill:var(--text);font-weight:700}.rt{font-family:Arimo,Arial;fill:var(--rt);font-weight:700;pointer-events:none}`
    + `.fill{fill:var(--press);opacity:.22;pointer-events:none}.fill.on{opacity:.5}.ring{fill:none;stroke:var(--press);stroke-width:2.5;pointer-events:none}</style>`;
}
function heat(act) {
  // Shallow actuation strong, deep light: the eye goes to the hair-trigger keys.
  const t = 1 - (act - 1) / (FULL - 1);
  return `color-mix(in srgb, var(--heat) ${Math.round(75 * t * t)}%, var(--key))`;
}
function keySvg(k, i, majority) {
  const x = k.x * U + GAP, y = k.y * U + GAP, w = k.w * U - 2 * GAP, h = k.h * U - 2 * GAP, e = eff(i), s = sim[i];
  const differs = !majority.has(i);
  const show = state.onKeys !== 'Only keys that differ' || differs;
  const fill = state.onKeys === 'Colour by actuation' ? ` style="fill:${heat(e.act)}"` : '';
  const dim = '';
  const tip = `${k.name} (${k.cell.replace(',', ', ')})\n${describe(e)}` + (profiles[state.profile].keys[i].mode === 0 ? '\nLeft to the profile' : '');

Rico's choice all the same (2026-11-08): press it again. On the board, Nazg knows the key pressed
from VIA's matrix state, which every Keychron answers (VIA_INSECURE).</p>
<p><b>The three states read on the board</b>, under "Default (profile 1) as read": <b>as it came</b>, every key's word 0, following the
profile; <b>Rapid Trigger ticked</b> in the Launcher, which wrote all 104 keys and left the profile's own setting saying Regular;
<b>unticked again</b>, the 104 keys now explicitly Regular 1.7 mm. The first and third behave alike and <b>read alike here</b>:
every key says 1.7, and the editor says "All 104 keys". Nazg compares what each key does, never whether its word is 0, so a
board the Launcher has touched does not show 104 exceptions. There is no list of the keys' settings: the values are on the keys
(Rico, 2026-11-08). "Some keys apart" is made up: WASD on Rapid Trigger at 0.5 mm, sensitivity 0.2, the space bar
deeper.</p>
<p><b>Settled by Rico</b> (2026-11-08): <b>the profiles in the strip</b>, as Keymap's layers -- the whole set of settings,
which round two's Hall-effect sections (advanced keys, SOCD) would share; Gamepad's curve and calibration are not per profile, so
there the strip would be absent. <b>Picking a profile makes the board use it</b>, as Fn + P + Z/X/C and the Launcher do, so what
is shown is always what is in use. <b>The Actuation Distance on every key</b>, RT on those in Rapid Trigger, as the Launcher.
<b>The selection is edited, or every key when nothing is selected.</b> <b>(Press) Trigger Distance and (Release) Reset Distance
apart</b>. Every change is <b>written at once</b>, a slider once let go, then saved (AMC_SAVE_PROFILE).</p>
<p><b>Full travel</b> bounds every slider, 3.5 mm on this board. No command reports it: Nazg starts from the gamepad curve's last x,
and the first key read pressed fully down settles it -- press one to the bottom here. It is one value for the whole board even
with mixed switches, since calibration scales every key to it (keychron-commands.md, "How travel is computed"); the tooltip says
what that means for a longer switch.</p>
<p><b>Not decided here, for the build</b>: whether "every key" writes each key, as the Launcher does, or the profile's own setting
and 0 into every key (untested: nothing has been written to a board yet); the sensitivity's range (0.1-2.0 mm here; the firmware
takes up to 3.9); how Nazg notices a profile switched from the keyboard.</p>`;

render();
