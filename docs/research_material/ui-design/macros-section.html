<!-- Mockup of the Macros section (ui-design.md, "Sections, and the strip that belongs to them"):
     the slots M0..M15 in the strip, the selected macro in the panel.

     First round (2026-10-10). Rico compared Vial's and VIA's editors
     (macro-editors-vial-via.html): VIA's chain is more visual, and Vial's rows take the height
     while leaving the width empty -- Nazg's panel is wide and short, so the chain, VIA's way.
     Already decided: no macro names (the board stores none) and no macro contents on hover in
     Keymap. VIA's chain only records; here it is edited: click a step to select it, click
     between two steps to add there, and the keycode picker below gives the keys, as in Keymap.

     Variants: how a held key looks (a bracket around what happens while it is held, or VIA's
     press and release marks), whether the board stays drawn to show where the macro is, writing
     at once or Save / Revert, a script line, and how text is stored -- the firmware's US table,
     or the host layout's keys, which Nazg knows and neither app uses.

     Settled 2026-10-10 (Rico), and opened on: press / release marks, the board shown, Save /
     Revert, text stored as the host layout's keys (ui-design.md, "The Macros section"). The
     script line is not chosen yet.

     Second round, the same day. Rico: with every feature in the chain, the script needs no
     editing -- it is a tooltip on the macro's name, read-only. Press and release are steps of
     their own, as the board stores them, paired only for reading; a lone one is said.

     Third round, the same day: one rule for text. The firmware's "characters" are keys of a US
     layout in disguise, so text is shown as what it types with the host layout and stored as
     whatever makes that layout type it -- one byte where the US table reaches the key, dead keys
     composing accents (Rico: every character the host layout can type, on every layout Nazg
     supports). The "Text stored as" toggle is gone. The layouts are QMK's extras for US, US
     International, French, Bépo and German, generated with their dead keys.

     The boards are real definitions, drawn with Nazg's placement rule: the Model F B104 (Vial 6,
     Rico's board, its definition the one it serves) and ZX60 (VIA's registry, GPL-3.0), the
     latter also as an older firmware on VIA protocol 10, which has no delays. Byte counts follow
     via-vial-commands.md, "Macros -- the buffer and its byte format"; the buffer sizes are
     examples, a board reports its own. -->

*{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font-family:Arimo,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}

.muted{color:var(--muted)}

.body{display:flex;min-height:560px}

.boardarea{display:flex;justify-content:center}
svg.board{display:block}
.panel{border:1px solid var(--border);border-radius:6px;background:var(--panel)}

.msg{font-size:12px}

  }

// The bytes a keystroke costs. One byte when the firmware's US table reaches the key at that

// Pairing, for reading only: a release goes with the last press of the same key not yet

    }

// Bytes, per protocol (via-vial-commands.md): Vial 6 prefixed with 16-bit actions and two-byte
// waits; VIA 12 prefixed, 8-bit actions, waits in ASCII digits; VIA 10 unprefixed, no waits.
function measure(list, setup, problems) {

    if (K[k].v > 0xFF && p !== 'vial6') { problems.push(['err', `A VIA macro holds basic keys only -- ${K[k].h} ${K[k].m} cannot be stored`]); return false; }
    return true;

  list.forEach((s, i) => {

    } else if (s.t === 'key') {

      n += p === 'vial6' ? (m || K[s.k].v > 0xFF ? 4 : 3) : (m ? 2 * act * (m + 1) : act);
    } else if (s.t === 'press' || s.t === 'release') {
      keyOk(s.k);
      n += p === 'vial6' && K[s.k].v > 0xFF ? 4 : act;
      if (!partner.has(i)) problems.push(['warn', s.t === 'press'
        ? `${K[s.k].m} is pressed and never released: it stays held after the macro ends`
        : `${K[s.k].m} is released but this macro never pressed it: it releases your own ${K[s.k].m}, if you hold it`]);
    } else if (s.t === 'delay') {

const hostSelect = () => `<select data-host>${Object.entries(LAYOUT_NAMES).map(([k, n]) => `<option value="${k}"${k === state.host ? ' selected' : ''}>${n}</option>`).join('')}</select>`;

function renderPanel() {

  const total = state.macros.reduce((n, l) => n + sizeOf(l, setup), 0);
  const others = total - mine;

  else if (state.writing === 'Save / Revert' && state.macros.some((_, i) => dirty(i))) msg = `<span class="warn">Not written yet</span> <span class="muted">-- ${state.macros.filter((_, i) => dirty(i)).length} macro(s) changed</span>`;
  else if (state.msg) msg = `<span class="${state.msg[0]}">${state.msg[1].split(' -- ')[0]}</span> <span class="muted">-- ${state.msg[1].split(' -- ')[1] || ''}</span>`;
  else msg = `<span class="muted">${state.writing === 'At once' ? 'Each change is written to the board at once.' : 'Changes are written by Save.'}</span>`;
  const place = PLACES[state.m] ? `on layer ${PLACES[state.m].layer}, row ${PLACES[state.m].cell[0]} col ${PLACES[state.m].cell[1]}` : 'on no key yet';

        + `<span class="gauge" title="All macros share the board's ${setup.buffer} bytes"><span class="bar"><b style="left:0;width:${100 * others / setup.buffer}%"></b><i style="left:${100 * others / setup.buffer}%;width:${100 * mine / setup.buffer}%"></i></span>${mine} bytes · ${setup.buffer - total} of ${setup.buffer} free</span>`
        + `<span class="msg">${msg}</span>`;

    const any = state.macros.some((_, i) => dirty(i));

  }

     + `</div></div>`;

  } else {
    const s = state.sel !== null ? list[state.sel] : null;

    const adds = `<span class="seg"><span class="muted">Add${s ? ' after it' : ' here'}:</span><button data-add="text">Text</button>`
      + `<button data-add="delay" ${noDelay ? 'disabled title="This firmware (VIA protocol 10) has no waits"' : ''}>Wait</button>`
      + `<button data-add="hold" title="A press and a release, the + between them">Held key</button><span class="muted">or a key below</span></span>`;
    let t;
    if (!s) t = adds;

      t = `<b>${name}</b>`;
      if (s.t === 'key') t += `<span class="seg"><span class="muted">Sent with</span>${MODS.map(([m]) => `<button data-mod="${m}" class="${s.mods.includes(m) ? 'on' : ''}">${m}</button>`).join('')}</span><span class="muted">pick a key below to change it</span>`;
      if (s.t === 'press' || s.t === 'release') t += `<span class="muted">pick a key below to change it${paired ? ', and its ' + (s.t === 'press' ? 'release' : 'press') : ''}</span>`;

      t += `<span class="seg"><button data-act="left" title="Move before">◀</button><button data-act="right" title="Move after">▶</button>`

// Where the macros sit on the board: a few keys of the top row hold M0..M5.

        + `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.mac{fill:var(--hostface);stroke:var(--host)}.k.cur{fill:var(--lit);stroke:var(--litline);stroke-width:2}.k.unl{stroke:var(--warn);stroke-width:2.5}.t{font:${Math.round(u * 0.27)}px Arimo,Arial;fill:var(--text);text-anchor:middle}.t.s{font-size:${Math.round(u * 0.2)}px;fill:var(--muted)}</style>`
        + `<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;

    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, hh = k.h * u - 2 * gap;

    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2)
      s += `<rect class="${cls}" x="${(k.x + k.x2 - bd.x0) * u + gap}" y="${(k.y + k.y2 - bd.y0) * u + gap}" width="${k.w2 * u - 2 * gap}" height="${k.h2 * u - 2 * gap}" rx="${Math.max(2, u * 0.1)}"/>`;

// A chain longer than the panel wraps, and each row's end is linked to the next row's start: down

// carriage return, so the chain still reads as one line.
function linkRows() {

  if (!chain) return;
  chain.querySelector('svg.links')?.remove();

    const r = (e.querySelector('.cap,.textchip,.waitchip') || e).getBoundingClientRect();
    const o = e.getBoundingClientRect();
    return { l: o.left - box.left, r: o.right - box.left, t: r.top - box.top, b: r.bottom - box.top };
  });
  const rows = [];
  for (const it of items) {
    const row = rows[rows.length - 1];
    if (row && Math.abs(row[0].t + (row[0].b - row[0].t) / 2 - (it.t + (it.b - it.t) / 2)) < 20) row.push(it); else rows.push([it]);
  }
  if (rows.length < 2) return;
  const R = 7, out = 10;
  let d = '';
  for (let i = 0; i + 1 < rows.length; i++) {
    const a = rows[i][rows[i].length - 1], b = rows[i + 1][0];
    const ya = (a.t + a.b) / 2, yb = (b.t + b.b) / 2;
    const yg = (Math.max(...rows[i].map(x => x.b)) + Math.min(...rows[i + 1].map(x => x.t))) / 2;
    const xr = a.r + out, xl = Math.max(-out, b.l - out);
    d += `M${a.r} ${ya} H${xr - R} Q${xr} ${ya} ${xr} ${ya + R} V${yg - R} Q${xr} ${yg} ${xr - R} ${yg} H${xl + R} Q${xl} ${yg} ${xl} ${yg + R} V${yb - R} Q${xl} ${yb} ${xl + R} ${yb} H${b.l} `;
  }
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'links');
  svg.innerHTML = `<path d="${d}"/>`;
  chain.prepend(svg);
}
window.addEventListener('resize', linkRows);

function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['setup', 'Board', Object.keys(SETUPS)], ['boardArea', 'Board area', ['Shown', 'Folded']],
   ['writing', 'Writing', ['At once', 'Save / Revert']], ['hostChosen', 'Host layout chosen', ['No', 'Yes']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => { state[k] = v; if (k === 'writing') state.saved = JSON.stringify(state.macros); state.msg = null; render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

// ---------------------------------------------------------------------------------------------
// Editing.
function insertAt() {
  return state.sel !== null ? state.sel + 1 : state.caret !== null ? state.caret : cur().length;
}
function insertSteps(steps, caretOffset, what) {
  const i = insertAt();
  cur().splice(i, 0, ...steps);
  state.sel = null;
  state.caret = i + caretOffset;
  changed(what);
}
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-m],[data-path],[data-index],[data-key],[data-tab],[data-mod],[data-add],[data-act]');
  if (!t) return;
  const d = t.dataset;
  if (d.m !== undefined) { state.m = +d.m; state.sel = null; state.caret = null; state.msg = null; }
  else if (d.path !== undefined) {
    state.sel = +d.path; state.caret = null;
    if (e.target.tagName === 'INPUT') { render(); const i = document.querySelector(`[data-text="${d.path}"],[data-ms="${d.path}"]`); if (i) i.focus(); return; }
  }
  else if (d.index !== undefined) { state.caret = +d.index; state.sel = null; }
  else if (d.tab !== undefined) state.tab = d.tab;
  else if (d.key !== undefined) {
    const kc = K[d.key];
    if (kc.v > 0xFF && SETUPS[state.setup].proto !== 'vial6') return;
    const s = state.sel !== null ? cur()[state.sel] : null;
    if (s && (s.t === 'key' || s.t === 'press' || s.t === 'release')) {
      const partner = pairsOf(cur());
      if (partner.has(state.sel)) cur()[partner.get(state.sel)].k = d.key;
      s.k = d.key; changed(kc.m + ' set');
    } else insertSteps([{ t: 'key', k: d.key, mods: [] }], 1, kc.m + ' added');
  }
  else if (d.mod !== undefined) { const s = cur()[state.sel]; s.mods = s.mods.includes(d.mod) ? s.mods.filter(m => m !== d.mod) : MODS.map(x => x[0]).filter(m => m === d.mod || s.mods.includes(m)); changed('modifiers changed'); }
  else if (d.add === 'text') insertSteps([{ t: 'text', s: 'text' }], 1, 'text added');
  else if (d.add === 'delay') insertSteps([{ t: 'delay', ms: 100 }], 1, 'wait added');
  else if (d.add === 'hold') insertSteps([{ t: 'press', k: 'KC_LSFT' }, { t: 'release', k: 'KC_LSFT' }], 1, 'held key added');
  else if (d.act === 'save') { state.saved = JSON.stringify(state.macros); state.msg = ['ok', `Stored -- every macro, read back the same`]; }
  else if (d.act === 'revert') { state.macros = savedList(); state.sel = null; state.caret = null; }
  else if (d.act === 'remove') {
    const partner = pairsOf(cur()), i = state.sel;
    const gone = partner.has(i) ? [i, partner.get(i)].sort((a, b) => b - a) : [i];
    gone.forEach(j => cur().splice(j, 1));
    state.sel = null; state.caret = Math.min(...gone); changed('step removed');
  } else if (d.act === 'left' || d.act === 'right') {
    const l = cur(), i = state.sel, j = i + (d.act === 'left' ? -1 : 1);
    if (j >= 0 && j < l.length) { [l[i], l[j]] = [l[j], l[i]]; state.sel = j; changed('step moved'); }
  }
  render();
});
frame.addEventListener('input', e => {
  const d = e.target.dataset;
  if (d.text !== undefined) { const s = cur()[+d.text]; s.s = e.target.value; delete s.ascii; e.target.size = Math.max(3, e.target.value.length); }
  else if (d.ms !== undefined) cur()[+d.ms].ms = Math.max(0, parseInt(e.target.value) || 0);
  linkRows();
});
frame.addEventListener('change', e => {
  if (e.target.dataset.host !== undefined) { state.host = e.target.value; state.hostChosen = 'Yes'; render(); return; }
  if (e.target.dataset.text !== undefined || e.target.dataset.ms !== undefined) { changed(e.target.dataset.text !== undefined ? 'text changed' : 'wait changed'); render(); }
});
// Hovering a press or a release lights its partner.
frame.addEventListener('mouseover', e => {
  const c = e.target.closest('[data-pair]');
  frame.querySelectorAll('.pairhl').forEach(x => x.classList.remove('pairhl'));
  if (c && c.dataset.pair !== '') frame.querySelectorAll(`[data-pair="${c.dataset.pair}"]`).forEach(x => x.classList.add('pairhl'));
});

document.getElementById('notes').innerHTML = `
<p><b>What it shows.</b> The Macros section: the slots in the strip (an empty one dashed, a changed one dotted), the
board with the keys that play a macro (the selected one's lit, "L1" when on another layer), and the panel -- a line
saying which macro, the room it takes in the board's shared memory (the grey part is the other macros) and what was
written; then the macro as a chain, left to right; then the tools for the selected step; then Keymap's picker, which
gives the keys. <b>Hovering the macro's name</b> ("M2") gives it in VIA's script syntax, read-only (Rico: the chain
edits everything, so the script needs no editing).</p>
<p><b>A long macro wraps</b> (M8), and each row's end is linked to the next row's start -- down, back left

<p><b>Editing.</b> Click a step to select it; click between two steps (a + shows) to add there. A key picked in the

<p><b>Press and release are steps of their own</b>, as the board stores them -- ▼ pressed, ▲ released. <b>Held key</b>
adds a pair with the + between them; each mark then moves on its own, so they can cross (M4: Ctrl and Shift released in

<p><b>Text is typed the way the computer types it</b>, with its host layout -- every character the layout can
type. Each character becomes its keystrokes: on a key directly (é is AltGr+E on US International), else its accent's
dead key then its letter (ê: ^ then E), else a dead key's own character, the dead key then Space (' on US

<p><b>Settled</b> (Rico, 2026-10-10): the board shown and Save / Revert -- the toggles keep the alternatives.</p>
<p><b>What the board cannot do</b> is said where it matters: ZX60 on VIA 10 has no waits (Wait greyed, M1's wait in

render();
</script>
