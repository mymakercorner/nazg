<!-- Mockup of the Lighting section (ui-design.md, "The Lighting section").

     First round (2026-10-11). The section edits QMK's own lighting systems -- backlight, underglow
     (rgblight) and RGB Matrix -- as VIA's built-in menus (qmk_backlight, qmk_rgblight,
     qmk_backlight_rgblight, qmk_rgb_matrix) and Vial's `lighting` presets (the same three, and
     VialRGB) declare them. A board's own lighting menus are custom menus, not this section.

     What the firmware does, from QMK's quantum/via.c and quantum/rgblight/ (Rico's fork,
     2026-09), vial-qmk's quantum/via.c and quantum/vialrgb.c (2026-02), the VIA app (935106a,
     2026-09) with @the-via/reader 1.14.4's common menus, and vial-gui (2026-05), read 2026-10-11:
     - a value is set in RAM (id_custom_set_value, every QMK function `_noeeprom`) and stored by a
       separate save (id_custom_save); the VIA app saves after every change, vial-gui on Save;
     - QMK numbers the underglow and RGB Matrix effects among those built in: an effect left out
       moves every later number. VIA's lists assume every effect is built -- right for ~75% of
       QMK's underglow boards, wrong for most RGB Matrix ones (163 VIA definitions carry their own
       RGB Matrix menu instead). VialRGB has fixed effect ids and lists those the board has;
     - underglow's speed is stored and never read by an underglow effect: the speed is the
       effect's variant (Breathing 1-4: 30, 20, 10, 5 ms steps). VIA shows a speed slider anyway;
     - Vial's QMK lighting is the pre-V3 format -- no channel byte, ids 0x80-0x83 and 0x09-0x0A,
       underglow brightness unscaled -- reads the underglow effect even while off (so "off" cannot
       be read), and ignores an effect written while off (it turns on with the old one).

     The variants: the systems in the strip or stacked; the board showing the lighting keys, a
     glow of the colour, or folded away; underglow effects as effect + variant or VIA's flat
     list; the colour as two sliders, a hue x saturation field, or swatches; written at once or
     Save / Revert.

     Settled 2026-10-11 (Rico): several systems in the strip, one at a time; the board showing
     the lighting keys -- the keyboard itself is the preview, writes going out at once -- and,
     under the pointer, one panel line narrowing them to the keys that change it (as QMK Settings
     lights what a line concerns), a sentence when the keymap has none; underglow effects as an
     effect and its own variant buttons; the colour as two sliders; written at once. The toggles
     keep the alternatives.

     The boards: the Phoenix Project No 1 (VIA registry, underglow, every effect built, its
     default keymap: UG_* on layer 1), the 1up60rgb (VIA registry, backlight + underglow; its
     layer 1 lighting keys made up), the GMMK Pro (vial-qmk's Vial keymap, VialRGB, RGB_* on
     layer 1; the effects it lists made up). The values are made up. -->

function parseKle(rows) {

  for (const row of rows) {
    if (!Array.isArray(row)) continue;
    for (const item of row) {
      if (typeof item === 'object') {
        if ('r' in item) r = item.r;
        if ('rx' in item || 'ry' in item) { if ('rx' in item) rx = item.rx; if ('ry' in item) ry = item.ry; x = rx; y = ry; }
        if ('x' in item) x += item.x;
        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];
        continue;
      }
      const w = p.w || 1, h = p.h || 1;
      const labels = String(item).split('\n');
      const cell = pair(labels[0]), option = pair(labels[3]);
      if (cell || p.d)
        keys.push({ x, y, w, h, x2: p.x2 || 0, y2: p.y2 || 0, w2: p.w2 || w, h2: p.h2 || h, r, rx, ry, decal: !!p.d,
                    cell, g: option ? option[0] : -1, o: option ? option[1] : 0 });
      x += w;

    }
    y += 1;

  }

}

<p><b>Several systems</b> (backlight + underglow): <b>in the strip</b>, one at a time, as QMK Settings' groups; or
<b>stacked</b> in the panel, both short enough to fit.</p>
<p><b>The board</b>: <b>lighting keys shown</b> -- the keys that change the lighting from the keyboard, on any layer, L1
tagged; a line of the panel under the pointer narrows them to the keys that change it (Brightness: Bri + and Bri −);
a keymap without any says so. What they change makes the panel stale, so Nazg reads the values again each time the
section opens. Or a
<b>glow preview</b>: the plate glows in the colour, the keys in the backlight or the matrix colour -- the effect itself is
not drawn, only breathing and rainbows hinted. Or <b>folded away</b>.</p>
<p><b>Underglow effects</b>: QMK's 42 numbered modes are 11 effects and their variants -- Breathing 1 to 4 are four speeds,
Snake 1 to 6 three speeds each way, Gradient 1 to 10 five spreads each way, Twinkle 1 to 6 three speeds of one colour or
random. <b>Effect + variant</b> says so: an effect, then its own Speed, Spread, Direction or Colours buttons. <b>VIA's
list</b> keeps the 42 names. Neither has a Speed slider: underglow stores a speed and no underglow effect reads it -- VIA
shows one anyway. Both name the effects as QMK numbers them with every effect built in (the <i>i</i>): a board built with
fewer numbers them otherwise, and Nazg cannot tell -- the board's reply to a write is what is shown. RGB Matrix through
VialRGB has fixed effect ids and lists its own, so the GMMK Pro shows only what it has.</p>
<p><b>Colour</b>: <b>two sliders</b>, hue and saturation; a <b>hue × saturation field</b>, one click; or <b>swatches</b>
-- QMK's named colours -- with the sliders behind "Other colour…". Hidden when the effect makes its own colours (rainbows,
Christmas, RGB Test, random twinkle, the matrix's cycles).</p>
<p><b>Writing</b>: <b>at once</b> -- the keyboard changes while a slider moves (QMK's RAM-only set), and the value is
stored when it is let go, as Layout and QMK Settings write; or <b>Save / Revert</b>, as vial-gui -- the keyboard shows
the change at once anyway, and stores it on Save. The backlight's brightness settles on the firmware's steps (three by
default), as the board answers.</p>`;
