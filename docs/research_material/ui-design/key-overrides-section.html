<!-- Mockup of the Key Overrides section (ui-design.md, "The Key Overrides section").

     First round (2026-10-10). A key override is Vial's alone: with some modifiers held, a key sends
     another instead -- Shift + Backspace for Delete. 10 bytes per slot, read and written one slot
     per round trip (via-vial-commands.md, vial_dynamic_entry_op). Vial's editor is redrawn in
     key-override-editor-vial.html: a tab per slot, eight rows of checkboxes, written at once.

     What the firmware does, from QMK's quantum/process_keycode/process_key_override.c and
     vial-qmk's vial_get_key_override() (2026-02 tree), read 2026-10-10:
     - the trigger is a keycode matched against what the pressed key sends -- the whole keycode,
       a mod-tap is not its tap -- on the layer the key was pressed on (read_source_layers_cache),
       which must be in the override's layers; an empty trigger means the modifiers alone;
     - the held modifiers: all of them by default, any one with ko_option_one_mod; both sides of a
       modifier set means either side; a "negative" modifier held stops it; suppressed modifiers are
       hidden from the computer while it is active;
     - the replacement is registered with register_code(uint8_t), its modifiers as weak mods: a
       plain key, media key included, with modifiers -- anything else (a layer key, Boot, a macro,
       a tap dance) sends nothing; empty, it blocks the combination;
     - the slots are tried in order and the first that matches wins;
     - it ends when the key is released, a held modifier released, a negative one pressed or
       another key pressed (unless no_unregister_on_other_key_down); the key still held is then
       sent again (unless no_reregister_trigger), 50 ms later -- or 500 ms after its press
       (KEY_OVERRIDE_REPEAT_DELAY), as a key repeat would;
     - no activation option set is read as all three; vial-qmk turns key overrides on by default
       (build_vial.mk), 4 to 32 slots by EEPROM size; a reset slot is all zeros: off, no layer.

     The variants: how the slots are listed, how the modifiers are edited (in the rule, or a table
     of all three masks), what the board shows (the selected override, or every one), and whether
     the start and stop options are folded.

     Settled 2026-10-10 (Rico): the numbered strip, the selected override on the board, the
     modifiers in the rule (one side per set: a mixed set is shown and kept, not built), the
     options folded by default and kept open or folded as left -- the toggles keep the
     alternatives.

     The boards: the Model F B104's real definition (Vial 6, 32 slots) and the Corne's (vial-qmk
     keyboards/crkbd/keymaps/vial/vial.json, rotated thumb keys), as in combos-section.html, four
     layers each. The keymaps are made up: on the Model F a US ANSI layer 0, F1-F3 sending Mute,
     Vol - and Vol + on layer 1; on the Corne a usual one, Gui on A and ; when held, arrows on layer 1. -->

// KLE: the keys, each with its matrix cell (legend position 0), its layout option (position 3,
// "group,option") and its rotation. Legend-only keys are left out; decals kept, never drawn.
function parseKle(rows) {
  const keys = [];
  let x = 0, y = 0, rx = 0, ry = 0, r = 0, p = {};
  const pair = s => { const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  for (const row of rows) {
    if (!Array.isArray(row)) continue;
    for (const item of row) {
      if (typeof item === 'object') {
        if ('r' in item) r = item.r;
        if ('rx' in item || 'ry' in item) { if ('rx' in item) rx = item.rx; if ('ry' in item) ry = item.ry; x = rx; y = ry; }
        if ('x' in item) x += item.x;
        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];
        continue;
      }
      const w = p.w || 1, h = p.h || 1;
      const labels = String(item).split('\n');
      const cell = pair(labels[0]), option = pair(labels[3]);
      if (cell || p.d)
        keys.push({ x, y, w, h, x2: p.x2 || 0, y2: p.y2 || 0, w2: p.w2 || w, h2: p.h2 || h, r, rx, ry, decal: !!p.d,
                    cell, g: option ? option[0] : -1, o: option ? option[1] : 0 });
      x += w;
      p = {};
    }
    y += 1;
    x = rx;

    const chip = (sel, mask, any) => `<span class="chip${state.sel === sel ? ' sel' : ''}${mask ? '' : ' none'}" data-sel="${sel}">${mask ? modsText(mask, any) : 'none'}</span>`;
    h += `<div class="cond"><span><span class="k">Not while held</span>${chip('neg', o.neg, true)}</span>`
       + `<span><span class="k">Hidden from the computer</span>${chip('sup', o.sup)}</span></div>`;
  }
  let says = sentence(o);
  for (const x of analyse(state.ko))
    says += `<br><span class="${x.w ? 'w' : 'i'}">${x.w ? '⚠ ' : 'ⓘ '}${x.t}</span>${x.fix ? `<button data-fix="${x.fix[1]}">${x.fix[0]}</button>` : ''}`;
  h += `<div class="says">${says}</div>`;
  return h + optionsHtml();
}

// The start and stop options, in words; the two "no_" bits shown the other way round.
function optionsHtml() {
  const o = cur(), act = (o.opts & 7) || 7, open = state.optsAt === 'Shown' || state.optsOpen;
  const usual = (o.opts & 0x3F & ~OPT.oneMod) === 7 || (o.opts & 0x3F & ~OPT.oneMod) === 0;
  const box = (bit, label, checked, dis, tip) => `<label class="${dis ? 'dis' : ''}" title="${tip || ''}"><input type="checkbox" data-opt="${bit}" ${checked ? 'checked' : ''} ${dis ? 'disabled' : ''}> ${label}</label>`;
  let h = `<div class="opts">`;
  if (state.optsAt === 'Folded')
    h += `<div class="optline" data-act="opts">${open ? '▾' : '▸'} <b>When it starts and stops</b> <span class="muted">-- ${usual ? 'as QMK sets it' : 'changed from QMK\'s usual'}</span></div>`;
  if (open) {
    const key = o.trig ? legend(o.trig) : 'the key', held = o.held ? modsText(o.held, o.opts & OPT.oneMod) : 'the modifiers';
    h += `<div class="optgrid"><span class="k">Starts when</span><span>`
       + box(OPT.trigDown, `${key} is pressed, ${held} held`, act & OPT.trigDown)
       + box(OPT.modDown, `${held} ${o.held && modNames(o.held).length > 1 ? 'are' : 'is'} pressed, ${key} held`, act & OPT.modDown, !o.held, 'Within 500 ms of the key\'s press, the replacement waits until then, as a key repeat would')
       + box(OPT.negUp, `${o.neg ? modsText(o.neg, true) : 'a modifier not allowed'} is released`, act & OPT.negUp, !o.neg)
       + `</span><span class="k">Ends when</span><span>`
       + box(OPT.noUnreg, `another key is pressed`, !(o.opts & OPT.noUnreg))
       + `<span class="muted">-- or ${key} or ${held} released.</span></span>`
       + `<span class="k">After it</span><span>`
       + box(OPT.noRereg, `${key}, still held, is sent again`, !(o.opts & OPT.noRereg))
       + `</span></div>`;
  }
  return h + `</div>`;
}

function toolsHtml() {

      + ['Either', 'Left', 'Right'].map(s => `<button class="${mask && side === s ? 'on' : ''}" data-side="${s}" ${mask ? '' : 'disabled'}>${s === 'Either' ? 'Either side' : s}</button>`).join('') + `</span>`;

// ---------------------------------------------------------------------------------------------
function boardSvg() {
  const keys = BOARD.keys, sends = BOARD.sends;
  const bd = boundsOf(keys), avail = 1160 - 180 - 28 - 30;
  const u = Math.min(46, Math.floor(avail / (bd.x1 - bd.x0 + 0.7))), m = u * 0.35;
  const P = ([x, y]) => [(x - bd.x0) * u, (y - bd.y0) * u];
  const o = cur(), at = o.trig && locate(o.trig, o.layers);
  const lit = new Map();
  if (at) at.keys.forEach(k => lit.set(k, at.layer));
  const mtKeys = new Set();
  if (o.trig && !at) { const mt = modTapOf(o.trig); if (mt) keys.forEach((k, i) => { if (sends[i][0] === mt) mtKeys.add(k); }); }
  const fs = Math.round(u * 0.3);
  let s = `<svg class="board" xmlns="${NS}" width="${(bd.x1 - bd.x0) * u + 2 * m}" height="${(bd.y1 - bd.y0) * u + 2 * m}">`
        + `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.cur{fill:var(--lit);stroke:var(--litline);stroke-width:2}.k.mt{stroke:var(--warn);stroke-width:2;stroke-dasharray:4 3}.k.pick{cursor:pointer}`
        + `.t{font:${fs}px Arimo,Arial;fill:var(--text);text-anchor:middle;pointer-events:none}.t.h{font-size:${Math.round(u * 0.2)}px;fill:var(--muted)}.t.lay{font-size:${Math.round(u * 0.2)}px;fill:var(--litline);text-anchor:end}`
        + `.ln{stroke:var(--link);stroke-width:2}`
        + `.pill{cursor:pointer}.pill rect{fill:var(--control);stroke:var(--muted)}.pill text{font:${Math.round(u * 0.24)}px Arimo,Arial;fill:var(--text);text-anchor:middle}.pill.on rect{fill:var(--accent);stroke:var(--accent)}.pill.on text{fill:var(--accent-text)}.pill.bad rect{stroke:var(--warn);stroke-width:1.5}.pill.off{opacity:.45}</style>`
        + `<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  const gap = Math.max(1, u * 0.06);
  keys.forEach((k, idx) => {
    const layer = lit.get(k);
    const cls = 'k pick' + (layer !== undefined ? ' cur' : '') + (mtKeys.has(k) ? ' mt' : '');
    const [ox, oy] = P([k.rx, k.ry]);
    s += `<g${k.r ? ` transform="rotate(${k.r} ${ox} ${oy})"` : ''} data-kidx="${idx}">`;
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, hh = k.h * u - 2 * gap;
    const tip = `<title>${sends[idx][0]}${sends[idx][1] ? ' · layer 1: ' + sends[idx][1] : ''}</title>`;
    s += `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2)
      s += `<rect class="${cls}" x="${(k.x + k.x2 - bd.x0) * u + gap}" y="${(k.y + k.y2 - bd.y0) * u + gap}" width="${k.w2 * u - 2 * gap}" height="${k.h2 * u - 2 * gap}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    const kc = layer ? sends[idx][layer] : sends[idx][0], kk = K[kc] || { m: '', h: '' };
    if (kk.h) s += `<text class="t h" x="${x + w / 2}" y="${y + u * 0.26}">${kk.h}</text>`;
    s += `<text class="t" x="${x + w / 2}" y="${y + hh / 2 + fs * 0.35 + (kk.h ? u * 0.08 : 0)}">${kk.m.replace('&', '&amp;').replace('<', '&lt;')}</text>`;
    if (layer) s += `<text class="t lay" x="${x + w - u * 0.08}" y="${y + u * 0.24}">L${layer}</text>`;
    s += `</g>`;
  });
  // A tag under the key: what the override sends, with which modifiers held.
  const tagOf = (p, i, on) => {
    if (isEmpty(p) || !p.trig) return '';
    const a = locate(p.trig, p.layers || boardLayers());
    if (!a) return '';
    const [cx, ky] = P(centreOf(a.keys[0])), cy = ky + u * 0.5;
    const text = `${p.held ? modsShort(p.held, p.opts & OPT.oneMod) + ' → ' : '→ '}${replName(p.repl) || '∅'}`;
    const pw = Math.max(u * 0.7, text.length * u * 0.14 + u * 0.24), ph = u * 0.36;
    return `<g class="pill${on ? ' on' : ''}${hasWarning(i) ? ' bad' : ''}${isOn(p) ? '' : ' off'}" data-ko="${i}"><title>KO ${i}: ${sentence(p).replace(/<[^>]+>/g, '')}</title>`
         + `<line class="ln" x1="${cx}" y1="${ky}" x2="${cx}" y2="${cy - ph / 2}"/><rect x="${cx - pw / 2}" y="${cy - ph / 2}" width="${pw}" height="${ph}" rx="${ph / 2}"/><text x="${cx}" y="${cy + u * 0.085}">${text.replace('&', '&amp;').replace('<', '&lt;')}</text></g>`;
  };
  if (state.show === 'Every override') {
    // Several on one key are stacked under it.
    const seen = new Map();
    state.kos.forEach((p, i) => {
      if (i === state.ko || isEmpty(p) || !p.trig) return;
      const n = seen.get(p.trig) || 0; seen.set(p.trig, n + 1);
      s += tagOf(p, i, false).replace(/<g class/, `<g transform="translate(0 ${n * u * 0.4})" class`);
    });
    const n = seen.get(o.trig) || 0;
    s += tagOf(o, state.ko, true).replace(/<g class/, `<g transform="translate(0 ${n * u * 0.4})" class`);
  } else s += tagOf(o, state.ko, true);
  return s + `</g></svg>`;
}

function stripHtml() {
  let b;
  if (!byRule())
    b = state.kos.map((o, i) => `<button class="${i === state.ko ? 'on' : ''}${isEmpty(o) ? ' empty' : ''}${!isEmpty(o) && !isOn(o) ? ' off' : ''}" data-ko="${i}" title="${isEmpty(o) ? 'Empty' : sentence(o).replace(/<[^>]+>/g, '')}">KO ${i}${dirty(i) ? '<span class="dot"></span>' : ''}</button>`).join('');
  else {
    const free = state.kos.filter(isEmpty).length;
    b = state.kos.map((o, i) => ({ o, i })).filter(x => !isEmpty(x.o) || x.i === state.ko)
      .map(({ o, i }) => `<button class="named${i === state.ko ? ' on' : ''}${!isEmpty(o) && !isOn(o) ? ' off' : ''}" data-ko="${i}" title="Slot ${i} -- sends ${replName(o.repl) || 'nothing'}">${isEmpty(o) ? 'New' : refOf(i) || '?'}${hasWarning(i) ? '<span class="bang">!</span>' : ''}${dirty(i) ? '<span class="dot"></span>' : ''}</button>`).join('')
      + `<button class="named" data-act="new" title="${free} of ${state.kos.length} slots free">+ New</button>`;
  }
  return `<div class="stripwrap"><button class="sarrow" data-scroll="-1" title="Earlier">◀</button>`
       + `<div class="strip" id="strip">${b}</div><span class="fade l"></span><span class="fade r"></span>`
       + `<button class="sarrow" data-scroll="1" title="Later">▶</button></div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  buildBoard();
  document.getElementById('frame').innerHTML =
    `<div class="menubar"><span class="board">${BOARD.b.name} ▾</span><span class="muted">Vial</span><span class="right">Settings</span></div>`
  + `<div class="body"><div class="col"><div class="entry">Keymap</div><div class="entry">Layout</div><div class="entry">Macros</div><div class="entry">Tap Dance</div><div class="entry">Combos</div><div class="entry on">Key Overrides</div><div class="entry">QMK Settings</div></div>`
  + `<div class="main">${stripHtml()}<div class="boardarea">${boardSvg()}</div><div class="panel">${renderPanel()}</div></div></div>`;
  placeStrip();
}

// The strip is one row and scrolls sideways when its slots do not fit, as every strip in Nazg.
function placeStrip() {
  const s = document.getElementById('strip');
  s.style.scrollBehavior = 'auto';
  s.scrollLeft = state.stripScroll;
  const on = s.querySelector('button.on');
  if (on) {
    const l = on.offsetLeft - s.offsetLeft, r = l + on.offsetWidth;
    if (l < s.scrollLeft) s.scrollLeft = l - 30;
    else if (r > s.scrollLeft + s.clientWidth) s.scrollLeft = r - s.clientWidth + 30;
  }
  s.style.scrollBehavior = '';
  s.onscroll = stripEdges;
  s.onwheel = e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && s.scrollWidth > s.clientWidth) { e.preventDefault(); s.scrollLeft += e.deltaY; } };
  stripEdges();
}
function stripEdges() {
  const s = document.getElementById('strip'), w = s.parentElement;
  state.stripScroll = s.scrollLeft;
  const more = s.scrollWidth > s.clientWidth + 1;
  w.querySelector('.fade.l').classList.toggle('on', more && s.scrollLeft > 1);
  w.querySelector('.fade.r').classList.toggle('on', more && s.scrollLeft < s.scrollWidth - s.clientWidth - 1);
  w.querySelectorAll('[data-scroll]').forEach(b => {
    b.style.display = more ? '' : 'none';
    b.disabled = !more || (+b.dataset.scroll < 0 ? s.scrollLeft <= 1 : s.scrollLeft >= s.scrollWidth - s.clientWidth - 1);
  });
}

function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['setup', 'Board', Object.keys(SETUPS)],
   ['slots', 'Slots', ['Strip, numbered', 'Strip, by their keys']],
   ['modsIn', 'Modifiers', ['In the rule', 'A table']],
   ['show', 'The board shows', ['The selected override', 'Every override']],
   ['optsAt', 'Start and stop options', ['Folded', 'Shown']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => {
        const was = state.setup; state[k] = v;
        if (k === 'setup' && was !== v) reset();
        if (k === 'modsIn' && ['held', 'neg', 'sup'].includes(state.sel) && v === 'A table') state.sel = 'trig';
        state.msg = null; render();
      };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

// ---------------------------------------------------------------------------------------------
// Editing. A part of the rule is selected; a picked key sets the key or what is sent; a click on
// a board key sets the key to what it sends on the first chosen layer.
function setMods(o, which, mask) {
  if (which === 'held' && o.sup === o.held) o.sup = mask;   // hidden follows held while they match
  o[which] = mask;
}
const changed = () => { state.msg = null; };
const startNew = o => { if (isEmpty(o)) { o.layers = ALL_LAYERS; o.opts = QMK_OPTS; } };
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-scroll],[data-ko],[data-sel],[data-key],[data-tab],[data-act],[data-fix],[data-kidx],[data-layer],[data-mod],[data-side],[data-any],[data-bit]');
  if (!t) return;
  const d = t.dataset, o = cur();
  if (d.scroll !== undefined) { const s = document.getElementById('strip'); s.scrollLeft += +d.scroll * (s.clientWidth - 60); return; }
  if (d.ko !== undefined) { state.ko = +d.ko; state.sel = isEmpty(cur()) ? 'trig' : 'repl'; state.msg = null; }
  else if (d.sel !== undefined) state.sel = d.sel;
  else if (d.tab !== undefined) state.tab = d.tab;
  else if (d.kidx !== undefined) {
    const s = BOARD.sends[+d.kidx];
    const layer = layerList(o.layers || 1).find(l => s[l]) || 0, kc = s[layer] || s[0];
    if (!kc || kc === 'KC_NO') return;
    startNew(o); o.trig = kc;
    state.sel = !o.held && state.modsIn === 'In the rule' ? 'held' : 'repl';
    changed();
  }
  else if (d.key !== undefined) {
    if (state.sel === 'repl') { if (!isPlain(d.key)) return; startNew(o); o.repl = R(d.key, ...(o.repl ? o.repl.mods : [])); }
    else { startNew(o); o.trig = d.key; state.sel = !o.held && state.modsIn === 'In the rule' ? 'held' : 'repl'; }
    changed();
  }
  else if (d.layer !== undefined) {
    if (d.layer === 'all') o.layers = (o.layers & boardLayers()) === boardLayers() ? 0 : ALL_LAYERS;
    else o.layers ^= 1 << +d.layer;
    changed();
  }
  else if (d.mod !== undefined) {
    const which = state.sel, mask = o[which], bits = 0x11 << MBIT[d.mod];
    const side = sideOf(mask), add = side === 'Left' ? 0x01 << MBIT[d.mod] : side === 'Right' ? 0x10 << MBIT[d.mod] : bits;
    startNew(o); setMods(o, which, mask & bits ? mask & ~bits : mask | add);
    changed();
  }
  else if (d.side !== undefined) {
    const which = state.sel, mask = o[which], any = (mask | (mask >> 4)) & 0x0F;
    setMods(o, which, d.side === 'Left' ? any : d.side === 'Right' ? any << 4 : any | (any << 4));
    changed();
  }
  else if (d.bit !== undefined) {
    const [which, bit] = d.bit.split(':');
    startNew(o); setMods(o, which, o[which] ^ (1 << +bit));
    changed();
  }
  else if (d.any !== undefined) { o.opts = +d.any ? o.opts | OPT.oneMod : o.opts & ~OPT.oneMod; changed(); }
  else if (d.fix !== undefined) {
    if (d.fix === 'on') o.opts |= OPT.on;
    else if (d.fix === 'layers') o.layers = ALL_LAYERS;
    else if (d.fix.startsWith('addlayer:')) o.layers |= 1 << +d.fix.slice(9);
    else if (d.fix === 'hide') o.sup |= o.held;
    else if (d.fix === 'mt') o.trig = modTapOf(o.trig);
    changed();
  }
  else if (d.act === 'opts') state.optsOpen = !state.optsOpen;
  else if (d.act === 'toggle') { o.opts ^= OPT.on; changed(); }
  else if (d.act === 'asheld') { o.sup = o.held; changed(); }
  else if (d.act === 'emptytrig') { o.trig = null; changed(); }
  else if (d.act === 'emptyrepl') { o.repl = null; changed(); }
  else if (d.act === 'clear') { state.kos[state.ko] = blank(); state.sel = 'trig'; changed(); }
  else if (d.act === 'new') { const i = state.kos.findIndex(isEmpty); if (i < 0) state.msg = ['warn', 'Every slot is in use']; else { state.ko = i; state.sel = 'trig'; } }
  else if (d.act === 'save') { state.saved = JSON.stringify(state.kos); state.msg = ['ok', 'Stored -- every changed override, read back the same']; }
  else if (d.act === 'revert') { state.kos = savedList(); state.msg = null; }
  render();
});
frame.addEventListener('change', e => {
  const d = e.target.dataset, o = cur();
  if (d.mods !== undefined) { const v = e.target.value; o.repl.mods = v === 'None' ? [] : [v]; changed(); render(); }
  if (d.opt !== undefined) {
    const bit = +d.opt;
    if (bit & 7 && !(o.opts & 7)) o.opts |= 7;   // none set reads as all three: make it explicit first
    o.opts ^= bit; changed(); render();
  }
});

document.getElementById('notes').innerHTML = `
<p><b>What a key override is.</b> With some modifiers held, a key sends another instead -- Shift + Backspace for Delete.

<p><b>Modifiers</b>: <b>in the rule</b> -- Held + Key → Sends read as a chord, "Not while held" and "Hidden from the computer"
as chips under it, each edited in the tool line: Ctrl, Shift, Alt, Win, then the side (either, left, right), and for two
held or more, all of them or any one. Or <b>a table</b>, the three sets side by side, L and R per modifier, as Vial's 24 boxes
but at a glance. Either way <b>hidden follows held</b> while they are the same, so a new override hides what it holds --
QMK's own ko_make_basic() does that; Vial does not.</p>
<p><b>The board shows</b> the key the override acts on, lit, with a tag under it: what is held and what is sent. On another

few keys carry one, so it may stay readable where Combos' every-combo view did not. A click on a key sets the key.</p>
<p><b>What is said</b>: the rule in words and how it ends, then what is wrong -- no layer (KO 6, as Vial leaves a new slot),
a key no key sends on its layers, a modifier both held and not, nothing to send that the firmware can send, two slots
with the same key and modifiers (KO 0 and KO 7: the first wins) -- and what is worth knowing: a held modifier not hidden,
and what the computer then gets (KO 1: Shift + \` is ~), a combination blocked (KO 3), an override off (KO 5).</p>
