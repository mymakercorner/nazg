<!-- Mockup: how Keymap draws a key holding a Vial tap dance, today and once the board's tap dances
     are read (ui-design.md, "Short forms and command keys": a tap dance with a tap and a hold is
     drawn as a tap-hold). The six dances are the Tap Dance mockup's (tap-dance-section.html).

     Already decided (2026-10-03): a tap and a hold -> drawn as LT / MT are, the hold top right in
     its category's colour, with the band; the double tap and tap-then-hold stay off the board, on
     hover. Open, and the variants here: what a dance without a hold shows.

     Settled 2026-10-10 (Rico): the tap under a Dance header, no mark for "more on hover" -- the
     toggles keep the alternatives (ui-design.md, "The Tap Dance section", "On the Keymap's keys").

     Keys drawn simply -- the band, a header, the legends -- in the board-look mockup's colours;
     the real drawing is Nazg's (board-look.html has the full rules). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tap dance keys</title>
<style>
:root{--window:#f3f3f5;--text:#1d1e22;--muted:#6b6e78;--border:#c8cad2;--control:#fff;--accent:#3b82f6;--panel:#f8f8fa;
--plate:#d3d4d8;--key:#ffffff;--keyline:#b4b7c2;--legend:#1d1e22;--beh:#7c3aed;--host:#0e7490;--fw:#dc2626}
:root[data-theme="dark"]{--window:#0f0f11;--text:#ececf1;--muted:#80838f;--border:#3a3d48;--control:#20232b;--accent:#4296fa;--panel:#16171b;
--plate:#1c1d23;--key:#3a3c48;--keyline:#4b4e5c;--legend:#ececf1;--beh:#b69cff;--host:#38c6e0;--fw:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font:13px Arimo,"Segoe UI",Helvetica,Arial,sans-serif}
.controls{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.group{display:flex;align-items:center;gap:4px}
.group .name{color:var(--muted);margin-right:4px}
button{font:inherit;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--control);color:var(--text);cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1000px;margin:0 auto;padding:18px 16px 30px}
h2{font-size:14px;margin:18px 0 8px}
.row{display:grid;grid-template-columns:150px repeat(6,1fr);gap:10px;align-items:start}
.row .lbl{color:var(--muted);padding-top:22px;line-height:1.35}
.plate{background:var(--plate);border-radius:10px;padding:10px;display:flex;justify-content:center}
.k{position:relative;width:62px;height:62px;border-radius:7px;background:var(--key);border:1px solid var(--keyline);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);overflow:hidden;cursor:help}
.k .band{position:absolute;left:0;right:0;top:0;height:4px}
.k .hdr{position:absolute;left:6px;top:7px;font-size:10px;font-weight:600}
.k .hold{position:absolute;right:5px;top:7px;font-size:10px;font-weight:700}
.k .main{position:absolute;left:6px;right:6px;top:24px;font-size:15px;color:var(--legend);line-height:1.1}
.k .main.small{font-size:12px;top:26px}
.k .sub{position:absolute;left:6px;top:40px;font-size:13px;color:var(--legend)}
.k .tapcmd{position:absolute;left:6px;top:21px;font-size:9px;font-weight:600}
.k .tapcmd + .main{top:33px;font-size:13px}
.k .dots{position:absolute;right:5px;bottom:6px;font-size:11px;color:var(--muted);letter-spacing:1px}
.what{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.35}
.what b{color:var(--text);font-weight:600}
.notes{color:var(--muted);line-height:1.55;margin-top:22px}
.notes b{color:var(--text)}
.notes p{margin:0 0 8px}
</style>
</head>
<body>
<div class="controls" id="controls"></div>
<main id="main"></main>
<script>
"use strict";
// The dances: tap, hold, double tap, tap then hold -- each [legend, header, category], or null.
const C = (m, h, cat) => ({ m, h: h || '', cat: cat || '' });
const DANCES = [
  { td: 0, tap: C('Esc'), hold: null, dbl: C('Caps'), th: null, words: 'tap Esc, double tap Caps Lock' },
  { td: 1, tap: C('Space'), hold: C('L1', 'Hold', 'beh'), dbl: null, th: null, words: 'tap Space, hold layer 1' },
  { td: 2, tap: C('Play', 'Media', 'host'), hold: null, dbl: C('Next', 'Media', 'host'), th: C('Prev', 'Media', 'host'), words: 'tap Play, double tap Next, tap then hold Prev' },
  { td: 3, tap: C('C'), hold: C('Ctrl+C', '', 'host'), dbl: C('Ctrl+V', '', 'host'), th: null, words: 'tap C, hold Ctrl+C, double tap Ctrl+V' },
  { td: 4, tap: C('Esc'), hold: C('Boot', '', 'fw'), dbl: null, th: null, words: 'tap Esc, hold Boot (1000 ms)' },
  { td: 5, tap: C(';'), hold: null, dbl: null, th: null, words: 'tap ; only' },
];
const state = { nohold: 'Tap, under a Dance header', theme: 'Light' };
const col = cat => cat ? `var(--${cat})` : 'var(--legend)';
const name = a => (a.h && a.cat !== 'beh' ? a.h + ' ' : '') + a.m;
const tip = d => `TD(${d.td})\nTap: ${d.tap ? name(d.tap) : 'nothing'}\nHold: ${d.hold ? name(d.hold) : '-'}\nDouble tap: ${d.dbl ? name(d.dbl) : '-'}\nTap, then hold: ${d.th ? name(d.th) : '-'}`;

// Today: every tap dance alike, whatever it does.
function today(d) {
  return `<div class="k" title="TD(${d.td}) -- open Tap Dance to see what it does"><span class="band" style="background:var(--beh)"></span>`
       + `<span class="hdr" style="color:var(--beh)">Dance</span><span class="main">TD ${d.td}</span></div>`;
}

// The tap's own legend: a plain key, or a command with its header in its own colour.
function tapLegend(tap, under) {
  if (!tap.cat) return `<span class="main${tap.m.length > 4 ? ' small' : ''}">${tap.m}</span>`;
  return `<span class="${under ? 'tapcmd' : 'hdr'}" style="color:${col(tap.cat)}">${tap.h}</span><span class="main">${tap.m}</span>`;
}

// Read: a tap and a hold -> a tap-hold, the hold top right in its colour, with the band. Without a
// hold, by the variant.
function read(d) {
  const more = d.dbl || d.th;
  if (d.tap && d.hold) {
    return `<div class="k" title="${tip(d)}"><span class="band" style="background:${col(d.hold.cat)}"></span>`
         + `<span class="hold" style="color:${col(d.hold.cat)}">${d.hold.m}</span>`
         + (d.tap.cat ? `<span class="tapcmd" style="color:${col(d.tap.cat)}">${d.tap.h}</span><span class="main">${d.tap.m}</span>` : tapLegend(d.tap))
         + (more && state.dots === 'Shown' ? '<span class="dots">··</span>' : '') + `</div>`;
  }
  if (state.nohold === 'Unchanged: Dance / TD n') return today(d).replace(/title="[^"]*"/, `title="${tip(d)}"`);
  if (state.nohold === 'Tap, under a Dance header')
    return `<div class="k" title="${tip(d)}"><span class="band" style="background:var(--beh)"></span>`
         + `<span class="hdr" style="color:var(--beh)">Dance</span>`
         + (d.tap.cat ? `<span class="tapcmd" style="color:${col(d.tap.cat)}">${d.tap.h}</span><span class="main">${d.tap.m}</span>` : `<span class="main">${d.tap.m}</span>`)
         + `</div>`;
  // The tap alone, as a plain key would be, a small mark saying there is more.
  return `<div class="k" title="${tip(d)}">${d.tap.cat ? `<span class="band" style="background:${col(d.tap.cat)}"></span>` : ''}${tapLegend(d.tap)}<span class="dots" style="color:var(--beh)">TD</span></div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['nohold', 'A dance without a hold shows', ['Unchanged: Dance / TD n', 'Tap, under a Dance header', 'Tap, with a small TD mark']],
   ['dots', 'Mark for "more on hover"', ['Hidden', 'Shown']], ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, n, vs]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${n}</span>`;
    vs.forEach(v => { const b = document.createElement('button'); b.textContent = v; if (state[k] === v) b.className = 'on';
      b.onclick = () => { state[k] = v; render(); }; g.appendChild(b); });
    c.appendChild(g);
  });
  const cell = (d, f) => `<div><div class="plate">${f(d)}</div><div class="what"><b>TD ${d.td}</b><br>${d.words}</div></div>`;
  document.getElementById('main').innerHTML =
    `<h2>Keymap, today</h2><div class="row"><div class="lbl">Every tap dance looks the same: what it does is only in the Tap Dance section.</div>${DANCES.map(d => cell(d, today)).join('')}</div>`
  + `<h2>Keymap, once the tap dances are read</h2><div class="row"><div class="lbl">Hover a key for all four actions.</div>${DANCES.map(d => cell(d, read)).join('')}</div>`
  + `<div class="notes">
<p><b>Decided already</b> (2026-10-03): a dance with a tap and a hold is drawn as a tap-hold key is -- TD 1 looks exactly like
LT(1, Space): "Space", "L1" top right, the band in Behaviour's violet. The hold is in the colour of what it does, so TD 4's
Boot behind a harmless Esc shows red. TD 3's hold Ctrl+C is a shortcut, in Host's colour. A dance's double tap and
tap-then-hold stay off the key: hover gives them, and the Tap Dance section.</p>
<p><b>Open</b>: TD 0, TD 2 and TD 5 have no hold. <b>Unchanged</b> keeps "Dance / TD n". <b>Tap, under a Dance header</b>
shows what a press types, and still says it is a dance -- the violet band and the header warn that it waits for a second
tap. <b>Tap, with a small TD mark</b> draws the tap as an ordinary key, a small mark in the corner.</p>
<p><b>Mark for "more on hover"</b>: TD 3 also has a double tap the key does not show -- a small ·· in the corner could say so.</p>
</div>`;
}
state.dots = 'Hidden';
render();
</script>
</body>
</html>
