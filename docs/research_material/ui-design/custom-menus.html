<!-- Mockup of a board's own menus -- VIA V3's custom menus (ui-design.md, "A board's own menus").

     First round (2026-10-11). A VIA V3 definition's `menus` may hold objects besides the standard
     ids: {label, content} menus the board's maker wrote, each a list of submenus, each a list of
     controls bound to a [channel, value id, ...] of the custom value commands (0x07 set, 0x08 get,
     0x09 save). Nazg draws them from the definition alone, as VIA does: the column's Board group.

     What VIA does, from the VIA app (935106a, 2026-09: custom/menu-generator.tsx,
     custom-control.tsx, store/menusSlice.ts, utils/range-constraints.ts) and @the-via/reader
     1.14.4 (menu-types) and @the-via/pelpi 0.0.3 (showIf), read 2026-10-11:
     - seven controls: range (a slider; two bytes, big-endian, when its maximum passes 255),
       dropdown (names, or [name, value] pairs), toggle (0/1 or its own two values), keycode (two
       bytes), color (hue, saturation), button (sends its one value), label (a fixed text, or a
       string the board sends, ending at a zero);
     - a submenu is a list in the menu's pane; every value of every custom menu is read when the
       board connects; each change is set and saved at once (set, then save of its channel);
     - `showIf` hides a menu, a submenu (greyed: "not available for this firmware version") or a
       control. Its expressions: {id} -- a value's first byte -- {id.1} its second, numbers, == !=
       < <= > >=, && ||, !, brackets. {id_firmware_version} is the board's 32-bit firmware version,
       VIA's keyboard value 4;
     - range `constraints`: a slider kept above or below another by an offset, either stopped
       there (clamp) or pushing the other along (push);
     - extra numbers after the value id are sent with it, before the value: [ch, id, slot, ...].

     How they are used, from VIA's registry (2029 V3 definitions) and the vendor collection
     (../vendor_definitions, 699 more), counted 2026-10-11:
     - 289 registry boards carry 719 custom menus; with the vendors, 942 boards and 1373 menus.
       872 boards have one menu, nearly always their own lighting -- 208 registry boards a single
       "Lighting" menu, mostly RGB Matrix with the board's true effect list, on QMK's channels;
     - cipulot's Hall effect and EC boards (about 63) carry 8-10 menus each, on channels 7-12:
       Switch Configuration, Tap Dance, Combos, SOCD, DKS, Controller, QMK Settings, System.
       They hold most of the controls: 386 values in the DKS menu alone, 16 slots of 24 lines;
     - 289 boards: dropdowns 13964, keycodes 10937 (66 boards), ranges 7222 (3598 with
       constraints), toggles 2436, buttons 707, colours 464, labels 179; color-palette never;
     - showIf on 334 menus (all the firmware version), 1097 submenus (an "Enable" toggle) and
       14845 controls.

     The variants: submenus hidden by their condition left out of the strip or greyed; controls
     hidden or greyed; the board lighting what the submenu concerns, plain, or folded away;
     Keymap's picker beside the lines or under them; buttons; menus the firmware is too old for.

     Settled 2026-10-11 (Rico): submenus their condition hides left out of the strip; lines hidden;
     menus the firmware is too old for left out of the column; the board lighting the keys the
     submenu concerns; buttons labelled, never asking ("we may change this in the future").
     Keymap's picker under the lines, the lines in two columns to give the height back. The
     toggles keep the
     alternatives.

     The boards (VIA registry, 2026-09 pin): the FAve65S (one "Lighting" menu, RGB Matrix, its
     effect list), the Mode M65V2 (VIA's underglow menu and its own "Indicators"), cipulot's EC
     Theca (eight menus). Keymaps and values made up; the EC Theca's DKS slots 1-15 are made from
     slot 0 here, as its definition has them. -->

frame.addEventListener('mousemove', e => { tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + 'px'; tip.style.top = (e.clientY + 18) + 'px'; });
frame.addEventListener('mouseleave', () => { tip.style.display = 'none'; if (state.hover) { state.hover = null; redrawBoard(); } });

document.getElementById('notes').innerHTML = `
