     First draft (2026-11-17). The rest-coupling measure needs each key pressed twice, alone; until
     then the focused key wears a tag, "press twice" then "press again" (Rico, 2026-11-15: grey words in
     the panel went unnoticed). The tag sits on the key's lower half (DrawTags(), NazgBoardView.cpp:
     a key alone, unit * 0.42 below its centre) -- where the bin and the lowest are, now that the
     numbers are always on the keys. The tester: "partially covered ... distracting for those who may
     not want to press each key twice". Below the keycap: rejected by Rico, it covers the next row's
     numbers the same way.

     The board: Rico's F77, as in levels-on-keys.html -- its definition, layer 0, its bins and
     thresholds, the readings simulated from its 2026-10-17 recording. Press a key: hold it with the
     mouse, or press the same key on your own keyboard. A press counts once released, alone; after
     the second, the keys it moves show dashed (made up here: the keys above and below it).

     The variants, two choices that combine:
     - on the key: the tag (as built); a badge in its top-right corner counting the presses still
       wanted, the one empty corner of a key with its numbers; its outline pulsing; nothing;
     - the words: none (as built); at the strip's end, above the board; in the line following the key,

        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];

    : `<text class="lv ${cls}" x="${tx}" y="${ty}" style="font-size:${fs}px${bold ? ';font-weight:700' : ''}"${anchor ? ` text-anchor="${anchor}"` : ''}>${v}</text>`;
  const bin = BINS > 1 ? k.bin : null, pad = Math.max(3, u * 0.09);
  const fs = Math.max(8, Math.round(u * 0.21)), row = (h - 2 * pad) / 3;
  return `<text class="nm" x="${x + pad}" y="${y + pad + row * 0.8}" style="font-size:${fs}px">${esc(legendOf(k.kc))}</text>`
       + lv('', x + pad, y + pad + row * 1.85, k.now, fs, '', true) + lv('ex', x + w - pad, y + pad + row * 1.85, k.max, fs, 'end')
       + lv('bn', x + pad, y + h - pad, bin, fs) + lv('ex', x + w - pad, y + h - pad, k.min, fs, 'end');
}
function svgStyle() {
  return `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}`
    + `.k.seen{fill:var(--seen);stroke:var(--seenline)}`
    + `.k.live{fill:color-mix(in srgb, var(--press) 30%, var(--key));stroke:var(--press);stroke-width:2.5}`
    + `.k.focus{stroke:var(--accent);stroke-width:2.5}`
    + `.tie{fill:none;stroke-width:2;stroke-dasharray:5 3;pointer-events:none}.tie.safe{stroke:var(--muted)}.tie.risk{stroke:var(--warn)}`
    + `.pulse{fill:none;stroke:var(--accent);stroke-width:3.5;pointer-events:none;animation:pulse 1.1s ease-in-out infinite}`
    + `.lv{font-family:Arimo,Arial;pointer-events:none;fill:var(--text);font-variant-numeric:tabular-nums}.lv.ex{fill:var(--muted)}.lv.bn{fill:var(--ok)}`
    + `.nm{font-family:Arimo,Arial;fill:var(--text);pointer-events:none;font-weight:600}`
    + `.tagbox{fill:var(--tag);stroke:var(--accent);stroke-width:1.5}.tagtext{font:12px Arimo,Arial;fill:var(--text);text-anchor:middle}`
    + `.badge{fill:var(--accent)}.badgetext{font-family:Arimo,Arial;font-weight:700;fill:var(--accent-text);text-anchor:middle;pointer-events:none}</style>`;
}
function keyClass(k) {
  if (held.has(k)) return 'k live';
  let c = 'k';
  if (k.seen) c += ' seen';
  if (focus === k) c += ' focus';
  return c;
}
function boardSvg() {
  const bd = boundsOf(KEYS), avail = 1160 - 180 - 28 - 30;
  const u = Math.min(44, Math.floor(avail / (bd.x1 - bd.x0 + 0.7)));
  const m = u * 0.35, gap = Math.max(1, u * 0.06);
  const W2 = (bd.x1 - bd.x0) * u + 2 * m, H = (bd.y1 - bd.y0) * u + 2 * m;
  const box = k => ({ x: (k.x - bd.x0) * u + gap, y: (k.y - bd.y0) * u + gap, w: k.w * u - 2 * gap, h: k.h * u - 2 * gap });
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W2}" height="${H}">${svgStyle()}<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  KEYS.forEach((k, i) => {
    const rect = (x, y, w, h) => `<rect class="${keyClass(k)}" data-key="${i}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.max(2, u * 0.1)}"/>`;
    const b = box(k);
    s += rect(b.x, b.y, b.w, b.h);
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2) s += rect((k.x + k.x2 - bd.x0) * u + gap, (k.y + k.y2 - bd.y0) * u + gap, k.w2 * u - 2 * gap, k.h2 * u - 2 * gap);
    s += keyText(k, b.x, b.y, b.w, b.h, u);
  });

  // The keys the focused key's press moves, dashed, once it was pressed twice alone.
  if (focus && !needed(focus))
    for (const { key, how } of movedBy(focus)) {
      const b = box(key);
      s += `<rect class="tie ${how}" x="${b.x - 2}" y="${b.y - 2}" width="${b.w + 4}" height="${b.h + 4}" rx="${Math.max(2, u * 0.1) + 2}"/>`;
    }

  // The hint on the key, if any.
  if (focus && needed(focus)) {
    const b = box(focus);
    if (state.onKey === 'Tag over the key (as built)') {
      // As DrawTags(): under the key's centre by 0.42 of a unit, a rounded box in the group-title colours.
      const text = asked(focus), tw = text.length * 6.3 + 12, th = 18, cx = b.x + b.w / 2, cy = b.y + b.h / 2 + u * 0.42;
      s += `<rect class="tagbox" x="${cx - tw / 2}" y="${cy - th / 2}" width="${tw}" height="${th}" rx="${th / 2}"/>`
         + `<text class="tagtext" x="${cx}" y="${cy + 4}">${text}</text>`;
    } else if (state.onKey === 'Badge in its corner') {
      // The presses still wanted, in the key's top-right corner -- the one corner its numbers leave empty.
      const r = Math.max(6.5, u * 0.17), cx = b.x + b.w - r - 2, cy = b.y + r + 2;
      s += `<circle class="badge" cx="${cx}" cy="${cy}" r="${r}"/><text class="badgetext" x="${cx}" y="${cy + r * 0.42}" style="font-size:${Math.round(r * 1.25)}px">${WANTED - focus.alone}</text>`;
    } else if (state.onKey === 'Outline pulsing') {
      s += `<rect class="pulse" x="${b.x - 1.5}" y="${b.y - 1.5}" width="${b.w + 3}" height="${b.h + 3}" rx="${Math.max(2, u * 0.1) + 1.5}"/>`;
    }
  }
  return s + `</g></svg>`;
}

// ---------------------------------------------------------------------------------------------
// The words.
function hintWords(k, long) {
  const badge = state.onKey === 'Badge in its corner' ? `<span class="dot">${WANTED - k.alone}</span>` : '';
  const name = esc(legendOf(k.kc) || 'this key');
  if (!long) return `<span class="hint">${badge}${k.alone === 0 ? 'press it twice, alone' : 'press it again, alone'}</span>`;
  return `<span class="hint">${badge}${k.alone === 0 ? `Press ${name} twice, alone` : `Press ${name} again, alone`}: its second press shows the keys it moves</span>`;
}
function sampleKey() {
  const w = 132, h = 50, pad = 5, fs = 10;
  const t = (x, y, s, cls, anchor, bold) => `<text class="lv ${cls}" x="${x}" y="${y}" style="font-size:${fs}px${bold ? ';font-weight:700' : ''}"${anchor ? ` text-anchor="${anchor}"` : ''}>${s}</text>`;
  const inner = `<text class="nm" x="${pad}" y="${pad + 10}" style="font-size:${fs}px">key</text>` + t(pad, h / 2 + 5, 'now', '', '', true) + t(w - pad, h / 2 + 5, 'highest', 'ex', 'end')
              + t(pad, h - pad, 'bin', 'bn') + t(w - pad, h - pad, 'lowest', 'ex', 'end');
  return `<svg width="${w}" height="${h}" style="margin:-3px 0">${svgStyle()}<rect class="k" x="0.5" y="0.5" width="${w - 1}" height="${h - 1}" rx="5"/>${inner}</svg>`;
}
function followHtml() {
  if (!focus)
    return `<div class="follow" id="follow"><span class="muted">Press a key: its levels show here, live, as long as you hold it -- and stay once you let go.</span></div>`;
  const k = focus, v = x => x === null ? '–' : x;
  const num = (value, word, cls) => `<div class="num"><b${cls ? ` style="color:var(${cls})"` : ''}>${v(value)}</b><span>${word}</span></div>`;
  const hint = state.words === 'In the line following the key' && needed(k) ? hintWords(k, false) : '';
  return `<div class="follow" id="follow"><span class="key">${esc(legendOf(k.kc) || 'no key')}</span>`
    + num(k.now, 'now', k.now >= k.th ? '--press' : '') + num(k.max, 'highest') + num(k.min, 'lowest')
    + num(k.th, 'threshold', '--warn') + (BINS > 1 ? num(k.bin, 'bin', '--ok') : '') + hint + `</div>`;
}
function stripHtml() {
  const modes = ['Signal levels', 'Key presses', 'Device'].map((m, i) => `<button class="${i === 0 ? 'on' : ''}">${m}</button>`).join('');
  const hint = state.words === "At the strip's end" && needed(focus) ? hintWords(focus, true) : '';
  return `<div class="strip" id="strip">${modes}${hint}</div>`;
}
function panelHtml() {
  return `<div class="mline"><span class="title">Signal levels</span><span class="desc">press each key firmly twice, holding it a moment: the second press shows the keys it moves</span>`
    + `<span class="right"><span class="margins">Threshold margin, rest <input value="3"> press <input value="3"></span><span class="divider"></span>`
    + `<span class="muted" style="font-size:12px">each key:</span>${sampleKey()}<span class="seg"><button class="on">Board</button><button>Controller</button></span></span></div>`
    + followHtml()
    + `<div class="rest"><div class="ph">As built, unchanged by this mockup: the summary, then <b>Keys</b> and <b>Whole board</b>, and the key's last presses -- `
    + `where a key moved by another's press is listed with why.</div></div>`
    + `<div class="mline" style="border-top:1px solid var(--border);border-bottom:none"><span class="out">Key output off: the keyboard types nothing while Diagnostics shows</span></div>`;
}
function columnHtml() {
  const vial = ['Keymap', 'Layout', 'Macros', 'Tap Dance', 'Combos', 'Key Overrides', 'QMK Settings'];
  return `<div class="col"><div class="hdr">Vial</div>${vial.map(e => `<div class="entry">${e}</div>`).join('')}`
    + `<div class="sep"></div><div class="hdr">Tools</div><div class="entry">Device</div><div class="entry on">Diagnostics</div><div class="entry">Matrix</div></div>`;
}
function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  document.getElementById('frame').innerHTML =
    `<div class="menubar"><span class="board">Model F Labs F77 ▾</span><span class="muted">Vial</span><span class="right">Settings</span></div>`
  + `<div class="body">${columnHtml()}<div class="main">${stripHtml()}`
  + `<div class="boardarea" id="boardarea">${boardSvg()}</div><div class="panel" id="panel">${panelHtml()}</div></div></div>`;
}
function redrawLive() {
  const b = document.getElementById('boardarea');
  if (b) b.innerHTML = boardSvg();
  const f = document.getElementById('follow');
  if (f) f.outerHTML = followHtml();
  const s = document.getElementById('strip');
  if (s) s.outerHTML = stripHtml();
}
function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['onKey', 'On the key', ON_KEY], ['words', 'The words', WORDS], ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => { state[k] = v; render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
  const g = document.createElement('div'); g.className = 'group';
  g.innerHTML = `<span class="name">Try</span>`;
  const bt = document.createElement('button'); bt.textContent = 'Clear readings'; bt.onclick = () => { resetReadings(); render(); }; g.appendChild(bt);
  c.appendChild(g);
}

// ---------------------------------------------------------------------------------------------
// Pressing: the mouse on a key, or the same key on the computer's keyboard. A press counts alone
// when no other key was down at any moment of it, and once released -- as Nazg counts it.
function press(k) {
  for (const o of held) { o.withOthers = true; }
  k.withOthers = held.size > 0;
  held.add(k); focus = k; redrawLive();
}
function release(k) {
  if (!held.has(k)) return;
  held.delete(k);
  if (!k.withOthers) k.alone++;
  redrawLive();
}
const frame = document.getElementById('frame');
let mouseKey = null;
frame.addEventListener('mousedown', e => {
  const r = e.target.closest('#boardarea rect[data-key]');
  if (!r) return;
  mouseKey = KEYS[+r.dataset.key]; press(mouseKey); e.preventDefault();
});
addEventListener('mouseup', () => { if (mouseKey) { release(mouseKey); mouseKey = null; } });
const CODE_TO_KC = c => {
  if (/^Key[A-Z]$/.test(c)) return 'KC_' + c.slice(3);
  if (/^Digit\d$/.test(c)) return 'KC_' + c.slice(5);
  if (/^Numpad\d$/.test(c)) return 'KC_P' + c.slice(6);
  return { Escape: 'KC_ESC', Minus: 'KC_MINS', Equal: 'KC_EQL', Backspace: 'KC_BSPC', Tab: 'KC_TAB',
    BracketLeft: 'KC_LBRC', BracketRight: 'KC_RBRC', Enter: 'KC_ENT', CapsLock: 'KC_CAPS', Semicolon: 'KC_SCLN', Quote: 'KC_QUOT',
    Backslash: 'KC_BSLS', IntlBackslash: 'KC_NUBS', Comma: 'KC_COMM', Period: 'KC_DOT', Slash: 'KC_SLSH', ShiftLeft: 'KC_LSFT',
    ShiftRight: 'KC_RSFT', ControlLeft: 'KC_LCTL', AltLeft: 'KC_LALT', AltRight: 'KC_RALT', MetaLeft: 'KC_LGUI', Space: 'KC_SPC',
    ArrowUp: 'KC_UP', ArrowDown: 'KC_DOWN', ArrowLeft: 'KC_LEFT', ArrowRight: 'KC_RGHT', NumLock: 'KC_NUM', NumpadDecimal: 'KC_PDOT' }[c];
};
addEventListener('keydown', e => {
  const kc = CODE_TO_KC(e.code), k = kc && KEYS.find(x => x.kc === kc);
  if (!k) return;
  e.preventDefault();
  if (!held.has(k)) press(k);
});
addEventListener('keyup', e => {
  const kc = CODE_TO_KC(e.code), k = kc && KEYS.find(x => x.kc === kc);
  if (k) release(k);
});
addEventListener('blur', () => { held.clear(); redrawLive(); });

document.getElementById('notes').innerHTML = `
<p><b>Press a key</b>, with the mouse or on your own keyboard: it takes the focus, outlined, and its numbers fill in. A press counts
<b>alone</b> once released, if no other key was down during it. Until the second, Nazg asks for it; after it, the keys its press moves
show dashed -- made up here: the keys above and below, one grey (safe), one orange (brought close).</p>
<p><b>On the key</b>: <b>the tag</b>, as built -- over the lower half, where the bin and the lowest are, which is the tester's complaint;
<b>a badge in its corner</b> -- the presses still wanted, 2 then 1, in the top-right corner, the one corner a key's numbers leave
empty (the name is at the top left, the highest a row lower); <b>the outline pulsing</b> -- the focus outline breathing until the
second press, nothing written on the key; <b>nothing</b>.</p>
<p><b>The words</b>: <b>none</b>, as built; <b>at the strip's end</b>, above the board, in the accent colour -- where the key test
puts its choice; <b>in the line following the key</b> -- beside its large name and numbers, which is what one watches while
pressing it, outlined in the accent colour. With the badge, the words repeat its count, so the badge explains itself after the
first time.</p>
<p>Rico's 2026-11-15 finding stands: grey words in the panel go unnoticed -- these are in the accent colour, and where the eyes are.</p>`;

resetReadings();
render();
setInterval(tick, READING_MS);
</script>
</body>
