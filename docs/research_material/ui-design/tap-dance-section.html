<!-- Mockup of the Tap Dance section (ui-design.md, "Sections, and the strip that belongs to them"):
     the slots TD0..TDn in the strip, the selected tap dance in the panel.

     First round (2026-10-10). A tap dance is Vial's alone: four keycodes -- on tap, on hold, on
     double tap, on tap then hold -- and a tapping term, 10 bytes per slot, read and written one
     slot per round trip (via-vial-commands.md, vial_dynamic_entry_op). Vial's editor is a tab per
     slot, a 2 x 5 grid of four key buttons and a number, keys written at once and the term by Save.

     What the firmware does with them is in vial-qmk's quantum/vial.c (dance_step, on_dance_finished,
     process_record_vial), read 2026-10-10: an empty action falls back on the others -- hold on the
     tap held, double tap on the tap twice, tap then hold on the tap then the hold -- and a tap is
     sent at release only when the dance has a tap and a hold and nothing else; otherwise it waits
     out the tapping term, counted from the press, for a second tap that does not come.

     Variants: whether each action carries a small timing drawing of the gesture, what an empty
     action shows (what the firmware does instead, faint, or nothing), writing at once or Save /
     Revert, and the board locked (Vial's keycode firewall stores Boot as nothing).

     Settled 2026-10-10 (Rico): the drawings shown, an empty action showing its fallback faint,
     Save / Revert -- the toggles keep the alternatives. The drawings centred and schematic: the
     dashed mark of the tapping term was not needed.

     The board is the Model F B104's real definition (Vial 6, Rico's board), drawn with Nazg's
     placement rule; it reports 32 tap dances, as its EEPROM size gives. -->

// KLE: the keys, each with its matrix cell (legend position 0) and its layout option (position
// 3, "group,option"). Legend-only keys are left out; decals kept, for the pivot, never drawn.
function parseKle(rows) {
  const keys = [];
  let x = 0, y = 0, rx = 0, ry = 0, r = 0, p = {};
  const pair = s => { const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  for (const row of rows) {
    if (!Array.isArray(row)) continue;
    for (const item of row) {
      if (typeof item === 'object') {
        if ('r' in item) r = item.r;
        if ('rx' in item || 'ry' in item) { if ('rx' in item) rx = item.rx; if ('ry' in item) ry = item.ry; x = rx; y = ry; }
        if ('x' in item) x += item.x;
        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];
        continue;
      }
      const w = p.w || 1, h = p.h || 1;
      const labels = String(item).split('\n');
      const cell = pair(labels[0]), option = pair(labels[3]);
      if (cell || p.d)
        keys.push({ x, y, w, h, x2: p.x2 || 0, y2: p.y2 || 0, w2: p.w2 || w, h2: p.h2 || h, r, rx, ry, decal: !!p.d,
                    cell, g: option ? option[0] : -1, o: option ? option[1] : 0 });
      x += w;
      p = {};
    }
    y += 1;
    x = rx;
  }
  return keys;
}

const pivotPoint = k => (k.y2 === 0 ? k.x2 < 0 : k.y2 < 0) ? [k.x + k.x2, k.y + k.y2] : [k.x, k.y];

function fallbackOf(d, act) {

// The timing drawing of a gesture: the key held as bars on a time line, centred -- a short bar a

function gestureSvg(act) {

  const bars = { tap: [[0, 18]], hold: [[0, 70]], double: [[0, 18], [30, 48]], taphold: [[0, 18], [30, 88]] }[act];
  const x0 = (W - bars[bars.length - 1][1]) / 2;
  let s = `<svg class="gest" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><line x1="4" y1="${y}" x2="${W - 4}" y2="${y}" stroke="var(--track)" stroke-width="2"/>`;
  for (const [a, b] of bars) s += `<rect x="${x0 + a}" y="${y - 5}" width="${b - a}" height="10" rx="3" fill="var(--held)"/>`;
  return s + `</svg>`;

// and a hold and nothing else; any other waits out the term from the press for a second tap.
function costHtml(d) {
  if (isEmpty(d)) return `<span class="muted">Empty: pick an action above, then a key below. Put TD ${state.td} on a key in Keymap to use it.</span>`;
  const quick = d.tap && d.hold && !d.double && !d.taphold;
  const waits = d.double || d.taphold;
  let s;
  if (quick) s = `${nameOf(d.tap)} is sent as soon as the key is released; held past ${d.term} ms, it is ${nameOf(d.hold)}.`;
  else if (waits) s = `<span class="warn">A tap waits ${d.term} ms</span> before ${d.tap ? nameOf(d.tap) + ' is sent' : 'anything is sent'} -- the time for a second tap to come. Fast typing on this key may feel late.`;
  else if (d.tap && !d.hold) s = `<span class="warn">Only a tap:</span> the key waits ${d.term} ms for nothing -- an ordinary ${nameOf(d.tap)} key does the same at once.`;
  else s = `${d.hold ? nameOf(d.hold) + ' once held past ' + d.term + ' ms' : ''}`;
  if (!d.tap && (d.hold || d.double || d.taphold)) s += ` <span class="warn">No tap: a quick press sends nothing.</span>`;
  if (d.term < 100) s += ` <span class="warn">${d.term} ms is very short: most presses will count as holds.</span>`;
  return s;
}

function renderPanel() {
  const d = cur(), lk = locked();
  let msg;
  if (state.writing === 'Save / Revert' && state.dances.some((_, i) => dirty(i)))
    msg = `<span class="warn">Not written yet</span> <span class="muted">-- ${state.dances.filter((_, i) => dirty(i)).length} tap dance(s) changed</span>`;
  else if (state.msg) msg = `<span class="${state.msg[0]}">${state.msg[1].split(' -- ')[0]}</span> <span class="muted">-- ${state.msg[1].split(' -- ')[1] || ''}</span>`;
  else msg = `<span class="muted">${state.writing === 'At once' ? 'Each change is written to the board at once.' : 'Changes are written by Save.'}</span>`;
  const place = PLACES[state.td] ? `On ${PLACES[state.td].map(p => p.layer ? 'L' + p.layer + ' ' + p.name : p.name).join(', ')}` : 'On no key yet';
  let h = `<div class="mline"><span class="title" title="TD(${state.td}) in QMK -- ${place.toLowerCase()}">TD ${state.td}</span>`
        + `<button data-act="clear" ${isEmpty(d) ? 'disabled' : ''} title="Empties all four actions">Clear</button>`
        + `<span class="muted">${place}</span><span class="msg">${msg}</span>`;
  if (state.writing === 'Save / Revert') {
    const any = state.dances.some((_, i) => dirty(i));
    h += `<span class="right"><button data-act="save" ${any ? '' : 'disabled'}>Save</button><button data-act="revert" ${any ? '' : 'disabled'}>Revert</button></span>`;
  }
  h += `</div>`;

  // The four actions, side by side, and the term.
  h += `<div class="actions">`;
  for (const [act, label] of ACTIONS) {
    const a = d[act], sel = state.act === act ? ' sel' : '';
    let cap, why = '';
    if (a) cap = capHtml(a);
    else {
      const fb = state.empty === 'What it does instead' ? fallbackOf(d, act) : null;
      if (fb) { cap = capHtml(fb.cap, ' ghost'); why = fb.text; }
      else { cap = `<div class="cap none"><span class="m">—</span></div>`; why = state.empty === 'What it does instead' ? 'nothing' : ''; }
    }
    const tip = { tap: 'Pressed and released before the tapping term',
                  hold: 'Held past the tapping term',
                  double: 'Tapped twice, the second tap within the tapping term of the first',
                  taphold: 'Tapped, then pressed again within the tapping term and held' }[act];
    h += `<div class="act${sel}" data-act-slot="${act}" title="${tip}"><span class="lbl">${label}</span>`
       + (state.drawings === 'Shown' ? gestureSvg(act) : '') + cap + `<span class="why">${why}</span></div>`;
  }
  h += `<div class="termbox"><span class="lbl">Tapping term</span><div class="row"><input data-term value="${d.term}"> ms</div>`
     + `<span class="hint">How long a press may last to count as a tap, and how long the key waits for a second one.</span></div>`;
  h += `</div><div class="cost">${costHtml(d)}</div>`;

  // The tools for the selected action, then the picker.
  const a = d[state.act];
  const label = ACTIONS.find(x => x[0] === state.act)[1];
  let t = `<b>${label}</b>`;
  if (a) t += `<span class="seg"><span class="muted">Sent with</span>${MODS.map(m => `<button data-mod="${m}" class="${a.mods.includes(m) ? 'on' : ''}">${m}</button>`).join('')}</span>`
            + `<button data-act="empty" title="${state.act === 'tap' ? 'A quick press then sends nothing' : 'The board then does what the faint key shows'}">Empty it</button>`
            + `<span class="muted">or pick a key below to change it</span>`;
  else t += `<span class="muted">pick a key below</span>`;
  h += `<div class="tools">${t}</div>`;
  if (lk) h += `<div class="banner">This board is locked: Vial stores Boot as nothing, so Boot is greyed. Everything else is written as usual. To use Boot, click 🔒 in the header and hold the two outlined keys.</div>`;

  h += `<div class="tabs">${TABS.map(([n, c]) => `<span class="tab${state.tab === n ? ' on' : ''}" data-tab="${n}">${c ? `<span class="dot" style="background:${c}"></span>` : ''}${n}</span>`).join('')}<input placeholder="Search"></div>`;
  h += `<div class="tiles">${Object.values(K).filter(k => k.tab === state.tab).map(k => {
    const off = k.name.startsWith('TD(') ? 'A tap dance cannot play another'
              : (lk && k.name === 'QK_BOOT') ? 'This board is locked: Vial would store Boot as nothing' : '';
    return `<div class="cap ${k.cls}${off ? ' off' : ''}" data-key="${k.name}" title="${off || k.name}">${k.h ? `<span class="h">${k.h}</span>` : ''}<span class="m">${k.m}</span></div>`;
  }).join('')}</div>`;
  return h;
}

// Where the tap dances sit on the board: a few keys hold TD0..TD4.
let PLACES = {};
function boardSvg(setup) {
  const b = BOARDS[setup.def];
  const groups = b.labels.map(groupOf);
  const keys = placeKeys(parseKle(b.keymap), groups, groups.map(() => 0)).filter(k => !k.decal);
  const rows = [...new Set(keys.map(k => k.y))].sort((a, b) => a - b);
  const row = y => keys.filter(k => k.y === y).sort((a, b) => a.x - b.x);
  const top = row(rows[0]), bottom = row(rows[rows.length - 1]), home = row(rows[3]);
  // TD0 on Esc, TD1 on the space bar, TD2 on a top-row key on layer 1, TD3 on C, TD4 on the last
  // top-row key, TD5 on ;.
  const space = bottom.reduce((a, k) => k.w > a.w ? k : a, bottom[0]);
  const holders = [[0, 0, top[0], 'Esc'], [1, 0, space, 'Space'], [2, 1, top[6], 'F6'], [3, 0, row(rows[4])[3], 'C'],
                   [4, 2, top[top.length - 1], 'top right'], [5, 0, home[10], ';']];
  PLACES = {};
  const at = new Map();
  for (const [td, layer, k, name] of holders) if (k) { at.set(k, { td, layer }); (PLACES[td] = PLACES[td] || []).push({ layer, name }); }
  const unlock = [top[0], keys.reduce((a, k) => (k.y > a.y || (k.y === a.y && k.x > a.x)) ? k : a, keys[0])];
  const bd = boundsOf(keys), avail = 1160 - 180 - 28 - 30;
  const u = Math.min(40, Math.floor(avail / (bd.x1 - bd.x0 + 0.7))), m = u * 0.35;
  let s = `<svg class="board" xmlns="${NS}" width="${(bd.x1 - bd.x0) * u + 2 * m}" height="${(bd.y1 - bd.y0) * u + 2 * m}">`
        + `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.td{fill:var(--behavface);stroke:var(--behav)}.k.cur{fill:var(--lit);stroke:var(--litline);stroke-width:2}.k.unl{stroke:var(--warn);stroke-width:2.5}.t{font:${Math.round(u * 0.27)}px Arimo,Arial;fill:var(--text);text-anchor:middle}.t.s{font-size:${Math.round(u * 0.2)}px;fill:var(--muted)}</style>`
        + `<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  const gap = Math.max(1, u * 0.06);
  for (const k of keys) {
    const hold = at.get(k);
    const cls = 'k' + (hold ? (hold.td === state.td ? ' cur' : ' td') : '') + (setup.locked && unlock.includes(k) ? ' unl' : '');
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, hh = k.h * u - 2 * gap;
    s += `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="${Math.max(2, u * 0.1)}"/>`;
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2)
      s += `<rect class="${cls}" x="${(k.x + k.x2 - bd.x0) * u + gap}" y="${(k.y + k.y2 - bd.y0) * u + gap}" width="${k.w2 * u - 2 * gap}" height="${k.h2 * u - 2 * gap}" rx="${Math.max(2, u * 0.1)}"/>`;
    if (hold) {
      s += `<text class="t" x="${x + w / 2}" y="${y + hh / 2 + u * 0.1}">TD ${hold.td}</text>`;
      if (hold.layer) s += `<text class="t s" x="${x + w - u * 0.08}" y="${y + u * 0.24}" style="text-anchor:end">L${hold.layer}</text>`;
    }
  }
  return s + `</g></svg>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  const setup = SETUPS[state.setup], b = BOARDS[setup.def];
  const svg = boardSvg(setup);
  const strip = state.dances.map((d, i) => `<button class="${i === state.td ? 'on' : ''}${isEmpty(d) ? ' empty' : ''}" data-td="${i}">TD ${i}${state.writing === 'Save / Revert' && dirty(i) ? '<span class="dot"></span>' : ''}</button>`).join('');
  document.getElementById('frame').innerHTML =
    `<div class="menubar"><span class="board">${b.name} ▾</span><span class="muted">Vial</span>${setup.locked ? '<span class="lock">🔒 Locked</span>' : ''}<span class="right">Settings</span></div>`
  + `<div class="body"><div class="col"><div class="entry">Keymap</div><div class="entry">Layout</div><div class="entry">Macros</div><div class="entry on">Tap Dance</div><div class="entry">Combos</div><div class="entry">Key Overrides</div><div class="entry">QMK Settings</div></div>`
  + `<div class="main"><div class="stripwrap"><button class="sarrow" data-scroll="-1" title="Earlier slots">◀</button>`
  + `<div class="strip" id="strip">${strip}</div><span class="fade l"></span><span class="fade r"></span>`
  + `<button class="sarrow" data-scroll="1" title="Later slots">▶</button></div>`
  + `<div class="boardarea">${svg}</div>`
  + `<div class="panel">${renderPanel()}</div></div></div>`;
  placeStrip();
}

// The strip is one row and scrolls sideways when its slots do not fit, as every strip in Nazg.
function placeStrip() {
  const s = document.getElementById('strip');
  s.style.scrollBehavior = 'auto';
  s.scrollLeft = state.stripScroll;
  const on = s.querySelector('button.on');
  if (on) {
    const l = on.offsetLeft - s.offsetLeft, r = l + on.offsetWidth;
    if (l < s.scrollLeft) s.scrollLeft = l - 30;
    else if (r > s.scrollLeft + s.clientWidth) s.scrollLeft = r - s.clientWidth + 30;
  }
  s.style.scrollBehavior = '';
  s.onscroll = stripEdges;
  s.onwheel = e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && s.scrollWidth > s.clientWidth) { e.preventDefault(); s.scrollLeft += e.deltaY; } };
  stripEdges();
}
function stripEdges() {
  const s = document.getElementById('strip'), w = s.parentElement;
  state.stripScroll = s.scrollLeft;
  const more = s.scrollWidth > s.clientWidth + 1;
  w.querySelector('.fade.l').classList.toggle('on', more && s.scrollLeft > 1);
  w.querySelector('.fade.r').classList.toggle('on', more && s.scrollLeft < s.scrollWidth - s.clientWidth - 1);
  w.querySelectorAll('[data-scroll]').forEach(b => {
    b.style.display = more ? '' : 'none';
    b.disabled = !more || (+b.dataset.scroll < 0 ? s.scrollLeft <= 1 : s.scrollLeft >= s.scrollWidth - s.clientWidth - 1);
  });
}

function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['setup', 'Board', Object.keys(SETUPS)], ['drawings', 'Timing drawings', ['Shown', 'Hidden']],
   ['empty', 'An empty action shows', ['What it does instead', 'Nothing']],
   ['writing', 'Writing', ['At once', 'Save / Revert']], ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => {
        state[k] = v;
        if (k === 'writing') state.saved = JSON.stringify(state.dances);
        state.msg = null; render();
      };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

// ---------------------------------------------------------------------------------------------
// Editing: an action is selected (Tap at first); a picked key sets it.
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-scroll],[data-td],[data-act-slot],[data-key],[data-tab],[data-mod],[data-act]');
  if (!t) return;
  const d = t.dataset;
  if (d.scroll !== undefined) { const s = document.getElementById('strip'); s.scrollLeft += +d.scroll * (s.clientWidth - 60); return; }
  if (d.td !== undefined) { state.td = +d.td; state.act = 'tap'; state.msg = null; }
  else if (d.actSlot !== undefined) state.act = d.actSlot;
  else if (d.tab !== undefined) state.tab = d.tab;
  else if (d.key !== undefined) {
    if (d.key.startsWith('TD(') || (locked() && d.key === 'QK_BOOT')) return;
    const old = cur()[state.act];
    cur()[state.act] = A(d.key, ...(old ? old.mods : []));
    changed(ACTIONS.find(x => x[0] === state.act)[1] + ' set to ' + nameOf(cur()[state.act]));
  }
  else if (d.mod !== undefined) {
    const a = cur()[state.act];
    a.mods = a.mods.includes(d.mod) ? a.mods.filter(m => m !== d.mod) : MODS.filter(m => m === d.mod || a.mods.includes(m));
    changed('modifiers changed');
  }
  else if (d.act === 'empty') { cur()[state.act] = null; changed(ACTIONS.find(x => x[0] === state.act)[1] + ' emptied'); }
  else if (d.act === 'clear') { Object.assign(cur(), { tap: null, hold: null, double: null, taphold: null }); state.act = 'tap'; changed('tap dance cleared'); }
  else if (d.act === 'save') { state.saved = JSON.stringify(state.dances); state.msg = ['ok', `Stored -- every changed tap dance, read back the same`]; }
  else if (d.act === 'revert') { state.dances = savedList(); }
  render();
});
frame.addEventListener('change', e => {
  if (e.target.dataset.term !== undefined) {
    cur().term = Math.min(10000, Math.max(0, parseInt(e.target.value) || 0));
    changed('tapping term ' + cur().term + ' ms');
    render();
  }
});

document.getElementById('notes').innerHTML = `
<p><b>What a tap dance is.</b> One key that does up to four things, told apart by how it is pressed: <b>tap</b> it,
<b>hold</b> it, <b>tap it twice</b>, or <b>tap it then hold</b>. The <b>tapping term</b> separates them: a press shorter
than it is a tap, a longer one a hold, and a second press inside it makes a double. Vial only -- VIA has none -- with
4 to 32 slots by the board's EEPROM (the Model F reports 32). A slot is put on a key in Keymap, as TD 0..TD 31 in the
picker's Macros tab.</p>
<p><b>What it shows.</b> The slots in the strip (an empty one outlined and unfilled -- solid, not dashed: Rico, 2026-10-10), the board with the keys that hold a tap dance
(the selected one's lit, "L1" when on another layer), and the panel: a line saying which slot and where it is, then the
<b>four actions side by side</b> -- the wide, short panel suits a row better than Vial's grid -- and the term, then a
line saying <b>when the tap is sent</b>, then the tools for the selected action and Keymap's picker. Click an action to
select it; a picked key sets it. <b>Sent with</b> makes Ctrl+C, as in Keymap's key line (TD 3). <i>Built as Keymap's own popup -- None, the four modifiers, the side -- not the four toggles drawn here (Rico, 2026-10-10).</i></p>
<p><b>The cost is said</b> (the line under the actions), because it is what surprises users: Vial's firmware sends the
tap at release only when the dance has a tap and a hold and nothing else (TD 1: Space, L1 held); with a double tap or
a tap-then-hold it <b>waits out the term</b> for a second tap that may not come (TD 0, TD 2). A dance with only a tap
waits for nothing (TD 5), and one with no tap sends nothing on a quick press.</p>
<p><b>Timing drawings</b> (chosen). Each action with a small drawing of the gesture, centred -- the key held as blue
bars on a time line, short for a tap, long for a hold. Meant for whoever does not remember what "tap, then hold"
means. Schematic: a dashed mark for the term was tried and dropped (Rico: not needed).</p>
<p><b>An empty action</b> (chosen: its fallback, faint). The firmware falls back on the others (vial-qmk's on_dance_finished): an empty hold
holds the tap, an empty double tap taps it twice, an empty tap-then-hold taps then holds the hold. Shown faint, with the
words under it -- or the action shows only a dash.</p>
<p><b>Writing</b> (chosen: Save / Revert, Rico). One slot is one 10-byte write, so <b>at once</b> costs nothing, as in Keymap and Layout --
Vial itself writes keys at once and the term by Save. <b>Save / Revert</b> is the Macros section's way, a dot on each
changed slot.</p>
<p><b>Locked</b>: Vial's keycode firewall stores Boot as nothing on a locked board, and nothing else changes -- so only
Boot is greyed, with the unlock keys outlined. A tap dance cannot play another (TD tiles greyed).</p>
<p><b>Not shown here, already decided</b> (ui-design.md, "Short forms and command keys"): in Keymap, a tap dance with
a tap and a hold is drawn as a tap-hold, and the double tap and tap-then-hold stay off the board -- hover and this
panel.</p>`;

render();
</script>
</body>
</html>
