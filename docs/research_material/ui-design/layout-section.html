<!-- Mockup of the Layout section (ui-design.md, "The Layout section"): the board's layout options
     -- split backspace, ISO enter, bottom rows -- chosen in the panel, the board redrawn with them.

     First round (2026-10-09): controls, buttons and pictures -- each option drawn small from its
     own keys -- side by side. Rico: too much room overall, the drawings above all; draw them on
     hover only. So two compact panels, one line per group: drop-downs (a checkbox per toggle, a
     combo per choice, as VIA and Vial -- and as ImGui draws them) and buttons (every option of a
     choice in a row). Hovering an option -- a combo's item, a button, a toggle -- shows its
     drawing beside it, and can preview it on the board; hovering a group can light its keys,
     a key of a group lighting the group in turn.

     Settled 2026-10-09 (Rico), and opened on: drop-downs, with the drawing and the board preview
     on hover; the drawing always inside the window. The group's keys are not lit.

     The boards are real definitions, drawn with Nazg's placement rule (PlaceKeys(), VIA's pivot
     rule): ZX60, a 60% with a 10-option and a 9-option choice; the Model F B104, Rico's board, five
     toggles and a choice; Cypher, toggles and short choices; Promenade RP24S, the worst case of
     VIA's registry, 11 groups. Their definitions are embedded below (VIA's registry is GPL-3.0;
     the Model F's is the board's own, tests/ModelFDefinition.h). Of VIA's 2029 V3 definitions,
     1168 have layout options -- most 1 to 6 groups, a choice up to 13 options. -->

*{box-sizing:border-box}
body{margin:0;background:var(--window);color:var(--text);font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px 22px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.group .name{color:var(--muted);margin-right:4px}
button{font:inherit;padding:3px 10px;border-radius:4px;border:1px solid var(--border);background:var(--control);color:var(--text);cursor:pointer}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.stage{padding:16px;overflow-x:auto}
.frame{margin:0 auto;width:1160px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--window);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.menubar{display:flex;gap:18px;align-items:center;background:var(--menubar);padding:5px 14px}
.menubar .board{font-weight:600}
.menubar .muted,.muted{color:var(--muted)}
.menubar .right{margin-left:auto;color:var(--muted)}
.body{display:flex;min-height:560px}
.col{flex:none;width:180px;background:var(--column);border-right:1px solid var(--border);padding:6px 5px;display:flex;flex-direction:column;gap:2px}
.entry{padding:7px 10px;border-radius:6px;color:var(--muted)}
.entry.on{background:var(--selected);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 14px 14px;gap:10px}
.boardarea{display:flex;justify-content:center}
svg.board{display:block}
.panel{flex:1;border:1px solid var(--border);border-radius:6px;background:var(--panel);padding:8px 12px;min-height:150px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 18px;align-items:start}
.lg{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;border:1px solid transparent;min-height:28px;position:relative}
.lg.lit{background:var(--option);border-color:var(--litline)}
.lg .gname{flex:none;max-width:50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg label{display:flex;align-items:center;gap:6px;cursor:pointer}
.combo{position:relative;flex:1;min-width:0}
.combo>button{width:100%;text-align:left;padding:2px 22px 2px 8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.combo>button::after{content:'▾';position:absolute;right:7px;color:var(--muted)}
.list{position:absolute;z-index:10;left:0;right:0;top:100%;margin-top:2px;background:var(--control);border:1px solid var(--border);border-radius:5px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:3px}
.item{padding:3px 8px;border-radius:4px;cursor:pointer;white-space:nowrap}
.item:hover{background:var(--hover)}
.item.on{background:var(--selected)}
.seg{display:flex;flex-wrap:wrap;gap:3px;flex:1;min-width:0}
.seg button{padding:1px 7px;font-size:12px}
.pop{position:fixed;z-index:20;pointer-events:none;background:var(--control);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:6px 8px 4px;text-align:center}
.pop .cap{font-size:11px;color:var(--muted);margin-top:2px}
.status{margin-top:8px;font-size:12px}
.status .ok{color:var(--ok)}
.notes{max-width:1160px;margin:0 auto;padding:4px 16px 30px;color:var(--muted);line-height:1.55}
.notes b{color:var(--text);font-weight:600}
.notes p{margin:0 0 8px}
</style>

// 3, "group,option"). Legend-only keys are left out; decals kept, for the pivot, never drawn.
function parseKle(rows) {
  const keys = [];
  let x = 0, y = 0, rx = 0, ry = 0, r = 0, p = {};
  const pair = s => { const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  for (const row of rows) {
    if (!Array.isArray(row)) continue;
    for (const item of row) {
      if (typeof item === 'object') {
        if ('r' in item) r = item.r;
        if ('rx' in item || 'ry' in item) { if ('rx' in item) rx = item.rx; if ('ry' in item) ry = item.ry; x = rx; y = ry; }
        if ('x' in item) x += item.x;
        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];
        continue;
      }
      const w = p.w || 1, h = p.h || 1;
      const labels = String(item).split('\n');
      const cell = pair(labels[0]), option = pair(labels[3]);
      if (cell || p.d)
        keys.push({ x, y, w, h, x2: p.x2 || 0, y2: p.y2 || 0, w2: p.w2 || w, h2: p.h2 || h, r, rx, ry, decal: !!p.d,
                    cell, g: option ? option[0] : -1, o: option ? option[1] : 0 });
      x += w;
      p = {};
    }
    y += 1;
    x = rx;
  }
  return keys;
}

// A label: a string is a toggle, an array names a group and its options.
const groupOf = label => Array.isArray(label) ? { name: label[0], options: label.slice(1) } : { name: label, options: [] };
const countOf = g => g.options.length ? g.options.length : 2;
const optionName = (g, o) => g.options.length ? g.options[o] : (o ? 'On' : 'Off');

// VIA's pivot rule, as PlaceKeys() has it: each chosen option moved onto option 0's place.
const pivotPoint = k => (k.y2 === 0 ? k.x2 < 0 : k.y2 < 0) ? [k.x + k.x2, k.y + k.y2] : [k.x, k.y];
function findPivot(keys, g, o) {
  let best = null;
  for (const k of keys) if (k.g === g && k.o === o && (!best || k.y < best.y || (k.y === best.y && k.x < best.x))) best = k;
  return best;
}
function shiftOf(keys, g, o) {
  const home = findPivot(keys, g, 0), chosen = findPivot(keys, g, o);
  if (!home || !chosen) return [0, 0];
  const a = pivotPoint(home), b = pivotPoint(chosen);
  return [a[0] - b[0], a[1] - b[1]];
}
function placeKeys(keys, groups, sel) {
  const out = [];
  for (const k of keys) {
    if (k.g >= 0 && k.g < groups.length && sel[k.g] !== k.o) continue;
    const s = k.g >= 0 && k.g < groups.length ? shiftOf(keys, k.g, k.o) : [0, 0];
    out.push({ ...k, x: k.x + s[0], y: k.y + s[1] });
  }
  return out;
}

// As the board stores it: the first group in the most significant bits.
function packed(groups, sel) {
  let value = 0;
  groups.forEach((g, i) => { let bits = 1; while ((1 << bits) < countOf(g)) bits++; value = (value << bits) | sel[i]; });
  return '0x' + (value >>> 0).toString(16).toUpperCase().padStart(8, '0');
}

// ---------------------------------------------------------------------------------------------
const NS = 'http://www.w3.org/2000/svg';
function keyShapes(svg, k, u, ox, oy, cls) {
  const g = document.createElementNS(NS, 'g');
  if (k.r) g.setAttribute('transform', `rotate(${k.r} ${(k.rx - ox) * u} ${(k.ry - oy) * u})`);
  const gap = Math.max(1, u * 0.06), rad = Math.max(2, u * 0.1);
  const rect = (x, y, w, h) => {
    const e = document.createElementNS(NS, 'rect');
    e.setAttribute('x', (x - ox) * u + gap); e.setAttribute('y', (y - oy) * u + gap);
    e.setAttribute('width', Math.max(1, w * u - 2 * gap)); e.setAttribute('height', Math.max(1, h * u - 2 * gap));
    e.setAttribute('rx', rad);
    e.setAttribute('class', cls);
    g.appendChild(e);
  };
  rect(k.x, k.y, k.w, k.h);
  if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2) rect(k.x + k.x2, k.y + k.y2, k.w2, k.h2);
  svg.appendChild(g);
  return g;
}
const boundsOf = keys => keys.reduce((b, k) => ({
  x0: Math.min(b.x0, k.x, k.x + k.x2), y0: Math.min(b.y0, k.y, k.y + k.y2),
  x1: Math.max(b.x1, k.x + k.w, k.x + k.x2 + k.w2), y1: Math.max(b.y1, k.y + k.h, k.y + k.y2 + k.h2) }),
  { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity });

// ---------------------------------------------------------------------------------------------
const VARIANTS = ['Drop-downs', 'Buttons'];
const state = { board: 'ZX60', variant: 'Drop-downs', drawing: 'On', preview: 'On', highlight: 'Off', theme: 'Light',
                sel: {}, hover: null, boardHover: null, open: null, written: null };
for (const name of Object.keys(BOARDS)) state.sel[name] = BOARDS[name].labels.map(() => 0);
const parsed = {};
const keysOf = name => parsed[name] || (parsed[name] = parseKle(BOARDS[name].keymap));

// The drawing an option shows on hover: its own keys, moved to option 0's place, at the scale of
// the whole group -- so a group's options compare -- beside what it is hovered on.
const pop = document.getElementById('pop');
function showDrawing(gi, oi, rect) {
  if (state.drawing !== 'On') return;
  const keys = keysOf(state.board), g = groupOf(BOARDS[state.board].labels[gi]);
  const all = [];
  for (let o = 0; o < countOf(g); o++) {
    const s = shiftOf(keys, gi, o);
    all.push(keys.filter(k => k.g === gi && k.o === o && !k.decal).map(k => ({ ...k, x: k.x + s[0], y: k.y + s[1] })));
  }
  const bd = boundsOf(all.flat());
  const u = Math.min(20, 300 / Math.max(1, bd.x1 - bd.x0), 90 / Math.max(1, bd.y1 - bd.y0));
  const w = (bd.x1 - bd.x0) * u, h = (bd.y1 - bd.y0) * u;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.innerHTML = `<style>.k{fill:var(--key);stroke:var(--keyline)}</style>`;
  for (const k of all[oi]) keyShapes(svg, k, u, bd.x0, bd.y0, 'k');
  pop.innerHTML = '';
  pop.appendChild(svg);
  pop.insertAdjacentHTML('beforeend', `<div class="cap">${optionName(g, oi)}</div>`);
  pop.hidden = false;
  // Always inside the window (Rico): beside the option where there is room, else on its other
  // side, then pushed back in from every edge.
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));
  const room  = window.innerWidth - rect.right;
  const left  = room > pop.offsetWidth + 16 ? rect.right + 8 : rect.left - pop.offsetWidth - 8;
  pop.style.left = clamp(left, 8, window.innerWidth - pop.offsetWidth - 8) + 'px';
  pop.style.top  = clamp(rect.top + rect.height / 2 - pop.offsetHeight / 2, 8, window.innerHeight - pop.offsetHeight - 8) + 'px';
}
function hideDrawing() { pop.hidden = true; }

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  const b = BOARDS[state.board], keys = keysOf(state.board), groups = b.labels.map(groupOf);
  const sel = state.sel[state.board];

  // What the board shows: the stored choice, or the hovered option as a preview.
  const shown = sel.slice();
  if (state.preview === 'On' && state.hover && state.hover.o !== undefined) shown[state.hover.g] = state.hover.o;
  const litGroup = state.highlight === 'On' ? (state.hover ? state.hover.g : state.boardHover) : null;

  const frame = document.getElementById('frame');
  frame.innerHTML = `<div class="menubar"><span class="board">${b.name} ▾</span><span class="muted">${state.board === 'Model F B104' ? 'Vial' : 'VIA'}</span><span class="right">Settings</span></div>`;
  const body = document.createElement('div'); body.className = 'body';
  body.innerHTML = `<div class="col"><div class="entry">Keymap</div><div class="entry on">Layout</div><div class="entry">Macros</div></div>`;
  const main = document.createElement('div'); main.className = 'main';

  // The board.
  const placed = placeKeys(keys, groups, shown).filter(k => !k.decal);
  const bd = boundsOf(placed), avail = 1160 - 180 - 28 - 30;
  const u = Math.min(54, Math.floor(avail / (bd.x1 - bd.x0 + 0.7)));
  const m = u * 0.35;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'board');
  svg.setAttribute('width', (bd.x1 - bd.x0) * u + 2 * m); svg.setAttribute('height', (bd.y1 - bd.y0) * u + 2 * m);
  svg.innerHTML = `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.lit{fill:var(--lit);stroke:var(--litline);stroke-width:1.5}</style>`;
  const plate = document.createElementNS(NS, 'rect');
  plate.setAttribute('width', '100%'); plate.setAttribute('height', '100%'); plate.setAttribute('rx', 12); plate.setAttribute('class', 'plate');
  svg.appendChild(plate);
  const inner = document.createElementNS(NS, 'g'); inner.setAttribute('transform', `translate(${m} ${m})`); svg.appendChild(inner);
  for (const k of placed) {
    const node = keyShapes(inner, k, u, bd.x0, bd.y0, 'k' + (litGroup !== null && k.g === litGroup ? ' lit' : ''));
    if (k.g >= 0 && k.g < groups.length) {
      node.addEventListener('mouseenter', () => { if (state.boardHover !== k.g) { state.boardHover = k.g; render(); } });
      node.addEventListener('mouseleave', () => { if (state.boardHover !== null) { state.boardHover = null; render(); } });
      const t = document.createElementNS(NS, 'title');
      t.textContent = groups[k.g].name + ': ' + optionName(groups[k.g], shown[k.g]);
      node.appendChild(t);
    }
  }
  const area = document.createElement('div'); area.className = 'boardarea'; area.appendChild(svg);
  main.appendChild(area);

  // The panel: one line per group.
  const panel = document.createElement('div'); panel.className = 'panel';
  const list = document.createElement('div'); list.className = 'groups';
  groups.forEach((g, gi) => list.appendChild(groupEl(g, gi, sel)));
  panel.appendChild(list);
  const status = document.createElement('div'); status.className = 'status';
  status.innerHTML = state.written
    ? `<span class="ok">Stored</span> <span class="muted">-- ${state.written}, read back the same. The keymap is untouched: a key hidden by an option keeps its keycode.</span>`
    : `<span class="muted">Each choice is written to the board at once.</span>`;
  panel.appendChild(status);
  main.appendChild(panel);
  body.appendChild(main);
  frame.appendChild(body);
}

function choose(gi, o) {
  const groups = BOARDS[state.board].labels.map(groupOf);
  state.sel[state.board][gi] = o;
  state.open = null;
  state.hover = null;
  hideDrawing();
  state.written = `${groups[gi].name}: ${optionName(groups[gi], o)} (${packed(groups, state.sel[state.board])})`;
  render();
}
function hoverOn(gi, o) { if (state.hover && state.hover.g === gi && state.hover.o === o) return; state.hover = { g: gi, o }; render(); }
function hoverOff() { hideDrawing(); if (!state.hover) return; state.hover = null; render(); }
// An option hovered: its drawing beside `el`, the board previewing it.
function hoverOption(el, gi, oi) { const rect = el.getBoundingClientRect(); hoverOn(gi, oi); showDrawing(gi, oi, rect); }

function groupEl(g, gi, sel) {
  const el = document.createElement('div');
  const lit = state.highlight === 'On' && ((state.hover && state.hover.g === gi) || state.boardHover === gi);
  el.className = 'lg' + (lit ? ' lit' : '');
  el.addEventListener('mouseenter', () => { if (!state.hover || state.hover.g !== gi) hoverOn(gi, undefined); });
  el.addEventListener('mouseleave', () => { if (state.open !== gi) hoverOff(); });
  const isToggle = !g.options.length;

  // A toggle, in both panels: a checkbox; hovered, the drawing of the state a click gives.
  if (isToggle) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" ${sel[gi] ? 'checked' : ''}> ${g.name}`;
    l.querySelector('input').addEventListener('change', e => choose(gi, e.target.checked ? 1 : 0));
    l.addEventListener('mouseenter', () => hoverOption(l, gi, sel[gi] ? 0 : 1));
    el.appendChild(l);
    return el;
  }

  el.insertAdjacentHTML('beforeend', `<span class="gname" title="${g.name}">${g.name}</span>`);
  if (state.variant === 'Buttons') {
    const seg = document.createElement('div'); seg.className = 'seg';
    g.options.forEach((n, oi) => {
      const bt = document.createElement('button');
      bt.textContent = n; if (oi === sel[gi]) bt.className = 'on';
      bt.addEventListener('click', () => choose(gi, oi));
      bt.addEventListener('mouseenter', () => hoverOption(bt, gi, oi));
      seg.appendChild(bt);
    });
    el.appendChild(seg);
    return el;
  }

  // A combo, as ImGui draws one: the choice, and its list once clicked -- hovering an item shows it.
  const combo = document.createElement('div'); combo.className = 'combo';
  const bt = document.createElement('button');
  bt.textContent = g.options[sel[gi]];
  bt.addEventListener('click', e => { e.stopPropagation(); state.open = state.open === gi ? null : gi; hideDrawing(); render(); });
  combo.appendChild(bt);
  if (state.open === gi) {
    const items = document.createElement('div'); items.className = 'list';
    g.options.forEach((n, oi) => {
      const it = document.createElement('div');
      it.className = 'item' + (oi === sel[gi] ? ' on' : '');
      it.textContent = n;
      it.addEventListener('click', e => { e.stopPropagation(); choose(gi, oi); });
      it.addEventListener('mouseenter', () => hoverOption(it, gi, oi));
      items.appendChild(it);
    });
    combo.appendChild(items);
  }
  el.appendChild(combo);
  return el;
}
document.addEventListener('click', () => { if (state.open !== null) { state.open = null; hoverOff(); render(); } });

function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['board', 'Board', Object.keys(BOARDS)], ['variant', 'Panel', VARIANTS], ['drawing', 'Drawing on hover', ['On', 'Off']],
   ['preview', 'Preview on the board', ['On', 'Off']], ['highlight', 'Light the group\'s keys', ['On', 'Off']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([key, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[key] === v) bt.className = 'on';
      bt.onclick = e => { e.stopPropagation(); state[key] = v; if (key === 'board') { state.written = null; state.open = null; } render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

document.getElementById('notes').innerHTML = `
<p><b>What it shows.</b> The Layout section in the column, the board drawn with the options chosen, the panel listing
every option group of the definition on one line each: a plain label is a toggle, an array a choice among named
options. A choice is written to the board at once -- VIA's set keyboard value, then read back -- as Keymap writes a key.
Nothing in the keymap changes: keys an option hides keep their keycodes.</p>
<p><b>The two panels.</b> <b>Drop-downs</b>: a checkbox per toggle, a combo per choice, one line each whatever the
number of options -- what VIA and Vial show, and what ImGui draws. <b>Buttons</b>: every option of a choice at once,
wrapping on ZX60's ten.</p>
<p><b>On hover</b>, an option -- a combo's item, a button, a toggle -- shows <b>its drawing</b> beside it, the
group's own keys in that option, every option of a group at one scale; and can <b>preview</b> it on the board, as
hovering a layer in Keymap's strip does. <b>Light the group's keys</b> marks the keys a group changes, and hovering
such a key lights its group in the panel. The first round drew every option all the time: too much room (Rico).</p>
<p><b>The worst case is real</b>: Promenade RP24S has 11 groups, one of ten options, named in the author's
shorthand. Model F B104 is Rico's board, its definition the one it serves.</p>`;

render();
</script>
</body>
</html>
