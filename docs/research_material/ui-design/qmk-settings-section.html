<!-- Mockup of the QMK Settings section (ui-design.md, "The QMK Settings section").

     First round (2026-10-11). Vial's QMK Settings are build-time QMK options made changeable at
     run time: each a numbered setting (qsid), read and written one per round trip
     (via-vial-commands.md, 0x09-0x0C). The firmware lists the qsids it has; the client must know
     what each one is -- vial-gui keeps them in qmk_settings.json, seven tabs of checkboxes and
     spin boxes, Save / Undo / Reset.

     What the firmware does, from vial-qmk's quantum/qmk_settings.c/.h, vial.c and QMK's
     action_tapping.c, action.c, action_util.c, process_auto_shift.c, process_grave_esc.c (2026-02
     tree), and Rico's fork (2026-08, the settings as of 2023), read 2026-10-11:
     - two generations: before vial-qmk 2025-06-21, qsid 8 is one byte of four bits -- Permissive
       Hold, "Ignore Mod Tap Interrupt" (cleared, Hold On Other Key Press is ON: the firmware
       returns !(bit 1)), "Tapping Force Hold" (quick tap term 0), Retro Tapping; from then on
       qsid 8 is gone and 22-27 take over: Permissive Hold, Hold On Other Key Press, Retro
       Tapping, Quick Tap Term, Chordal Hold, Flow Tap -- each its own setting, a 1-byte boolean;
     - Hold On Other Key Press decides at the other key's press, before Permissive Hold could at
       its release: both on, Permissive Hold changes nothing;
     - the quick tap term only counts inside the tapping term; flow tap stops at 500 ms; one-shot
       timeout 0 is never, tap toggle 0 or 1 is never;
     - the tapping term setting is only read when TAPPING_TERM_PER_KEY is defined, which
       build_vial.mk does only with tap dance on: without tap dance, it changes nothing; a Vial tap
       dance uses its own term;
     - the tap code delay holds every tap the board sends by itself: a tap-hold key's tap, tap
       dances, macros; Caps Lock gets the caps delay instead;
     - Magic (qsid 21, 4 bytes, 10 bits) is QMK's keymap_config, which Magic keycodes (NK_TOGG,
       CL_SWAP, AG_TOGG...) change too, stored in EEPROM: what Nazg read can go stale;
     - Reset sets every setting to the build's defaults, Magic included, which no client can read
       before; nothing here is behind Vial's lock.

     The variants: the groups in the strip or one page; the board lighting what a setting concerns
     or folded away; the tap-hold decision as one choice or QMK's two boxes; words or QMK's names;
     Save / Revert or written at once.

     Settled 2026-10-11 (Rico): the groups in the strip, the board lighting what a setting concerns,
     the tap-hold decision as one choice of three, QMK's names with what each does beside it,
     written at once -- the toggles keep the alternatives. Seen building it: Chordal Hold lights
     every key by its hand, not only the tap-hold keys.

     The boards: the Corne's real definition with home-row mods, a one-shot Shift, Grave Escape
     and mouse keys on layer 1, on today's vial-qmk; the Model F B104 with its keymap (no tap-hold
     key, NK_TOGG on layer 1) on firmware as of 2023 (qsid 8). The values are made up. -->

// KLE: the keys, each with its matrix cell (legend position 0), its layout option (position 3,
// "group,option") and its rotation. Legend-only keys are left out; decals kept, never drawn.
function parseKle(rows) {
  const keys = [];
  let x = 0, y = 0, rx = 0, ry = 0, r = 0, p = {};
  const pair = s => { const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(s || ''); return m ? [+m[1], +m[2]] : null; };
  for (const row of rows) {
    if (!Array.isArray(row)) continue;
    for (const item of row) {
      if (typeof item === 'object') {
        if ('r' in item) r = item.r;
        if ('rx' in item || 'ry' in item) { if ('rx' in item) rx = item.rx; if ('ry' in item) ry = item.ry; x = rx; y = ry; }
        if ('x' in item) x += item.x;
        if ('y' in item) y += item.y;
        for (const k of ['w', 'h', 'x2', 'y2', 'w2', 'h2', 'd']) if (k in item) p[k] = item[k];
        continue;
      }
      const w = p.w || 1, h = p.h || 1;
      const labels = String(item).split('\n');
      const cell = pair(labels[0]), option = pair(labels[3]);
      if (cell || p.d)
        keys.push({ x, y, w, h, x2: p.x2 || 0, y2: p.y2 || 0, w2: p.w2 || w, h2: p.h2 || h, r, rx, ry, decal: !!p.d,
                    cell, g: option ? option[0] : -1, o: option ? option[1] : 0 });
      x += w;
      p = {};
    }
    y += 1;
    x = rx;
  }
  return keys;

// VIA's pivot rule, as PlaceKeys() has it: each chosen option moved onto option 0's place. Every
// group is at option 0 here, so nothing moves; the rule is kept for other choices.
function placeKeys(keys, groups, sel) {
  return keys.filter(k => !(k.g >= 0 && k.g < groups.length && sel[k.g] !== k.o));
}
const NS = 'http://www.w3.org/2000/svg';
const rot = (px, py, k) => {
  if (!k.r) return [px, py];
  const a = k.r * Math.PI / 180, dx = px - k.rx, dy = py - k.ry;
  return [k.rx + dx * Math.cos(a) - dy * Math.sin(a), k.ry + dx * Math.sin(a) + dy * Math.cos(a)];
};
const centreOf = k => rot(k.x + k.w / 2, k.y + k.h / 2, k);
function boundsOf(keys) {
  const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };

      }

}

// ---------------------------------------------------------------------------------------------

  .forEach(([n, m, h]) => key(n, m, 'Features', h, 'behav'));

// What the section says: per group, what is wrong or worth knowing.
function analyse(g) {
  const v = state.vals, says = [];
  const none = (what, where) => says.push({ t: `No key on this board ${what}: nothing here changes anything until one does${where ? ` -- ${where}` : ''}.` });
  if (g.id === 'taphold') {
    if (!has(isTapHold)) none('is a tap-hold key', 'mod-taps and layer-taps are in the picker\'s Layers tab');
    if (!setupOf().tapDance) says.push({ w: 1, t: `This firmware has no tap dance, and vial-qmk then reads the tapping term from its build: "Holds after" changes nothing.` });
    if (qs(25) && v[25] > v[7]) says.push({ t: `A quick tap term above the tapping term counts as the tapping term, ${v[7]} ms.` });
    if (state.hold !== 'One choice of three' && permA().get(v) && hookpA().get(v))
      says.push({ w: 1, t: `Both on: Hold On Other Key Press decides at the press, first -- Permissive Hold changes nothing.`, fix: ['Keep Hold On Other Key Press', 'perm'] });
    if (qs(8)) says.push({ t: `This firmware predates Chordal Hold, Flow Tap and a quick tap term of its own: vial-qmk added them in 2025-06.` });
    if (qs(8) && hookpA().get(v)) says.push({ t: `Holding at once is this firmware's usual way: Vial stored it turned round, as "Ignore Mod Tap Interrupt" off.` });
    says.push({ t: `A tap dance uses its own term, set in Tap Dance.` });
  }
  if (g.id === 'autoshift') {
    if (!bit(3, 0).get(v)) says.push({ t: `Off: nothing below applies.` });
    if (has(kc => ['AS_TOGG', 'AS_ON', 'AS_OFF'].includes(kc))) says.push({ t: `The board's Auto Shift key switches it for the moment, while it is on here.` });
  }
  if (g.id === 'oneshot' && !has(kc => /^(OSM|OSL)\(/.test(kc))) none('is a one-shot key', 'they are in the picker\'s Layers tab');
  if (g.id === 'gesc') {
    if (!has(kc => kc === 'QK_GESC')) none('is Grave Escape', 'it is in the picker\'s Features tab');
    if (bit(1, 3).get(v) && bit(1, 2).get(v)) says.push({ w: 1, t: `With Shift and Win both, \` is never sent: Grave Escape is only Esc.` });
  }
  if (g.id === 'magic') {
    const nk = keysWhere(kc => MAGIC_KEYS[7].includes(kc));
    if (nk.size) says.push({ t: `NK_TOGG on layer ${[...nk.values()][0].layer} switches N-key rollover too, and stores it: what is shown is what the board said when this section opened.` });
    says.push({ t: `N-key rollover works only in a firmware built with it; the board cannot say.` });
  }

  if (g.id === 'mouse') says.push({ t: `The firmware counts the starting delay in tens of ms.` });
  if (g.id === 'combos') says.push({ t: `One term for every combo.` });
  return says;
}

           + (words() ? '' : `<span class="d">${HOLD[c][2]}</span>`) + `</div>`;
    const box = (a, w, n, d, k) => `<div class="row${changedQ(a.q) ? ' changed' : ''}" ${hov}${words() ? tipAttr(n, d) : ''}><label><input type="checkbox" data-hk="${k}" ${a.get(v) ? 'checked' : ''}>${words() ? w : n}</label>${words() ? '' : `<span class="d">${d}</span>`}</div>`;
    return box(permA(), 'Holds when another key is tapped inside it', 'Permissive Hold', HOLD[1][2], 0)
         + box(hookpA(), 'Holds as soon as another key is pressed', 'Hold On Other Key Press', HOLD[2][2] + (qs(8) ? ' -- stored turned round, as "Ignore Mod Tap Interrupt"' : ''), 1);
  }
  if (l.t === 'magic') {
    const rowsM = MAGIC.filter(m => m[0] !== 7).map(([b, w, n]) => `<div class="row${changedQ(21) && ((v[21] ^ state.saved[21]) >> b & 1) ? ' changed' : ''}" data-hover="${gi}:m${b}"${words() ? tipAttr(n, '') : ''}><label><input type="checkbox" data-magic="${b}" ${(v[21] >> b) & 1 ? 'checked' : ''}>${words() ? w : n}</label></div>`);
    const half = Math.ceil(rowsM.length / 2);
    const nk = MAGIC.find(m => m[0] === 7);
    return `<div style="display:flex;flex-wrap:wrap;column-gap:18px"><div>${rowsM.slice(0, half).join('')}</div><div>${rowsM.slice(half).join('')}</div></div>`
         + `<div class="row${changedQ(21) && ((v[21] ^ state.saved[21]) >> 7 & 1) ? ' changed' : ''}" data-hover="${gi}:m7"${tipAttr(words() ? nk[2] : '', 'every key held is reported, rather than six at most')}><label><input type="checkbox" data-magic="7" ${(v[21] >> 7) & 1 ? 'checked' : ''}>${words() ? nk[1] : nk[2]}</label></div>`;
  }
  if (l.t === 'mouse') {
    let h = `<table class="mtab"><tr><th></th><th>Cursor</th><th>Wheel</th></tr>`;
    for (const [w, unit, c, wh, n, step] of MOUSE_ROWS) {
      const cell = q => q === null ? '' : `${numHtml(whole(q), { max: 10000 }, step)}<span class="unit">${unit}</span>`;
      h += `<tr data-hover="${gi}:${li}"${tipAttr(words() ? `Mouse Key ${n}, Wheel ${n}` : '', '')}><td>${words() ? w : n}</td><td>${cell(c)}</td><td>${cell(wh)}</td></tr>`;
    }
    return h + `</table>`;
  }
  return '';
}
function linesHtml(g) {
  const gi = GROUPS.indexOf(g);
  return `<div class="rows">${g.lines.map((l, li) => lineShown(l) ? lineHtml(l, gi, li) : '').join('')}</div>`;
}
function saysHtml(g) {
  const a = analyse(g);
  if (!a.length) return '';
  return `<div class="says">${a.map(x => `<span class="${x.w ? 'w' : 'i'}">${x.w ? '⚠ ' : 'ⓘ '}${x.t}</span>${x.fix ? `<button data-fix="${x.fix[1]}">${x.fix[0]}</button>` : ''}`).join('<br>')}</div>`;
}

function mlineHtml(title, desc) {
  let msg;
  if (state.msg) msg = `<span class="${state.msg[0]}">${state.msg[1]}</span>`;
  else if (atOnce()) msg = `<span class="muted">Each change is written at once, and read back.</span>`;
  else if (anyChanged()) { const n = groupsShown().filter(groupChanged).length; msg = `<span class="warn">Not written yet</span> <span class="muted">-- ${n} group${n > 1 ? 's' : ''} changed</span>`; }
  else msg = `<span class="muted">Changes are written by Save.</span>`;
  return `<div class="mline"><span class="title">${title}</span>${desc ? `<span class="desc">${desc}</span>` : ''}<span class="msg">${msg}</span>`
       + `<span class="right"><button data-act="reset" title="Every setting back to the firmware's own defaults">Reset all…</button>`
       + (atOnce() ? '' : `<button data-act="save" ${anyChanged() ? '' : 'disabled'}>Save</button><button data-act="revert" ${anyChanged() ? '' : 'disabled'}>Revert</button>`)
       + `</span></div>`
       + (state.confirm ? `<div class="confirm">⚠ Every QMK setting back to this firmware's defaults -- Keys swapped and N-key rollover too. Nazg cannot know the defaults before: they are read back after.`
                        + `<span style="margin-left:auto;display:flex;gap:6px"><button data-act="doreset">Reset all</button><button data-act="noreset">Cancel</button></span></div>` : '');
}
function panelHtml() {
  if (state.arrange === 'Groups in the strip') {
    const g = GROUPS.find(x => x.id === state.group);
    return mlineHtml(groupName(g), g.desc) + linesHtml(g) + saysHtml(g);
  }
  // Two columns, balanced by hand: the long groups apart.
  const block = g => `<div class="block" data-hover="${GROUPS.indexOf(g)}:g"><h4>${groupName(g)}<span class="desc">${g.desc}</span></h4>${linesHtml(g)}${saysHtml(g)}</div>`;
  const side = ids => groupsShown().filter(g => ids.includes(g.id)).map(block).join('');
  return mlineHtml('QMK Settings', '') + `<div class="page"${state.board === 'Folded away' ? ' style="max-height:none"' : ''}><div>${side(['taphold', 'oneshot', 'combos', 'taps'])}</div><div>${side(['autoshift', 'gesc', 'magic', 'mouse'])}</div></div>`;
}

// ---------------------------------------------------------------------------------------------
// The board: what the selected group concerns, lit -- or, under the pointer, what one line does.
let BOARD = null;
function buildBoard() {
  const setup = setupOf(), b = BOARDS[setup.def];
  const groups = b.labels.map(groupOf);
  const keys = placeKeys(parseKle(b.keymap), groups, groups.map(() => 0)).filter(k => !k.decal);
  BOARD = { keys, sends: sendsOf(setup.def, keys), b };
}
// QMK's guess of each key's hand (keyboard_c.py, _gen_chordal_hold_layout): a symmetric board
// split at its middle; otherwise a line through the space bar, leaning with the row stagger.
function hands() {
  const keys = BOARD.keys, out = new Map();
  if (setupOf().def === 'Corne') {
    const b = boundsOf(keys), mid = (b.x0 + b.x1) / 2;
    keys.forEach((k, i) => out.set(i, { hand: centreOf(k)[0] < mid ? 'L' : 'R' }));
    return out;
  }
  const spc = keys.reduce((a, k) => k.w > (a ? a.w : 0) ? k : a, null), [sx, sy] = centreOf(spc);
  keys.forEach((k, i) => { const [cx, cy] = centreOf(k), s = (cx - (sx - 0.05)) - (cy - (sy - 1)) / 3;
    out.set(i, { hand: k === spc || Math.abs(s) <= 0.02 ? '*' : s < 0 ? 'L' : 'R' }); });
  return out;
}
function litKeys() {
  if (state.board !== 'Lights what a setting concerns') return null;
  const h = state.hover;
  if (h) {
    const [gi, li] = h.split(':'), g = GROUPS[+gi];
    if (li === 'g') return g.lights();
    if (li[0] === 'm') return magicKeys(+li.slice(1));
    const l = g.lines[+li];
    if (l.hands) { const hk = hands(); return new Map([...hk].filter(([, x]) => x.hand !== '*').map(([i, x]) => [i, { layer: 0, hand: x.hand }])); }
    if (l.t === 'boxes' && g.id === 'autoshift') return autoShiftKeys();
    return (l.lights || g.lights)();
  }
  if (state.arrange === 'Groups in the strip') return GROUPS.find(x => x.id === state.group).lights();
  return new Map();
}
function boardSvg() {
  const keys = BOARD.keys, sends = BOARD.sends;
  const bd = boundsOf(keys), avail = 1160 - 180 - 28 - 30;
  const u = Math.min(42, Math.floor(avail / (bd.x1 - bd.x0 + 0.7))), m = u * 0.35;
  const P = ([x, y]) => [(x - bd.x0) * u, (y - bd.y0) * u];
  const lit = litKeys() || new Map();
  const fs = Math.round(u * 0.3);
  let s = `<svg class="board" xmlns="${NS}" width="${(bd.x1 - bd.x0) * u + 2 * m}" height="${(bd.y1 - bd.y0) * u + 2 * m}">`
        + `<style>.plate{fill:var(--plate)}.k{fill:var(--key);stroke:var(--keyline)}.k.cur{fill:var(--lit);stroke:var(--litline);stroke-width:2}.k.L{fill:var(--lit);stroke:var(--litline);stroke-width:2}.k.R{fill:var(--boardface);stroke:var(--board);stroke-width:2}`
        + `.t{font:${fs}px Arimo,Arial;fill:var(--text);text-anchor:middle;pointer-events:none}.t.h{font-size:${Math.round(u * 0.2)}px;fill:var(--muted)}.t.hb{font-size:${Math.round(u * 0.2)}px;fill:var(--behav)}.t.lay{font-size:${Math.round(u * 0.2)}px;fill:var(--litline);text-anchor:end}`
        + `.ln{stroke:var(--link);stroke-width:2}.pill rect{fill:var(--accent);stroke:var(--accent)}.pill text{font:${Math.round(u * 0.24)}px Arimo,Arial;fill:var(--accent-text);text-anchor:middle}</style>`
        + `<rect class="plate" width="100%" height="100%" rx="12"/><g transform="translate(${m} ${m})">`;
  const gap = Math.max(1, u * 0.06);
  let tags = '';
  keys.forEach((k, idx) => {
    const x0 = lit.get(idx), layer = x0 ? x0.layer : 0;
    const cls = 'k' + (x0 ? (x0.hand === 'L' || x0.hand === 'R' ? ' ' + x0.hand : ' cur') : '');
    const [ox, oy] = P([k.rx, k.ry]);
    s += `<g${k.r ? ` transform="rotate(${k.r} ${ox} ${oy})"` : ''}>`;
    const x = (k.x - bd.x0) * u + gap, y = (k.y - bd.y0) * u + gap, w = k.w * u - 2 * gap, hh = k.h * u - 2 * gap;
    const tip = `<title>${sends[idx][0]}${sends[idx][1] ? ' · layer 1: ' + sends[idx][1] : ''}</title>`;
    s += `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${hh}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    if (k.w2 !== k.w || k.h2 !== k.h || k.x2 || k.y2)
      s += `<rect class="${cls}" x="${(k.x + k.x2 - bd.x0) * u + gap}" y="${(k.y + k.y2 - bd.y0) * u + gap}" width="${k.w2 * u - 2 * gap}" height="${k.h2 * u - 2 * gap}" rx="${Math.max(2, u * 0.1)}">${tip}</rect>`;
    const kc = sends[idx][layer] || sends[idx][0], kk = K[kc] || { m: '', h: '' };
    if (kk.h) s += `<text class="t ${kk.cls === 'behav' || kk.cls === 'fw' || kk.cls === 'host' ? 'hb' : 'h'}" x="${x + w / 2}" y="${y + u * 0.26}">${kk.h.replace('&', '&amp;')}</text>`;
    s += `<text class="t" x="${x + w / 2}" y="${y + hh / 2 + fs * 0.35 + (kk.h ? u * 0.08 : 0)}">${kk.m.replace('&', '&amp;').replace('<', '&lt;')}</text>`;
    if (layer) s += `<text class="t lay" x="${x + w - u * 0.08}" y="${y + u * 0.24}">L${layer}</text>`;
    if (x0 && x0.hand && x0.hand !== '*') s += `<text class="t lay" x="${x + w - u * 0.08}" y="${y + hh - u * 0.08}">${x0.hand}</text>`;
    s += `</g>`;
    if (x0 && x0.tag) {
      const [cx, ky] = P(centreOf(k)), cy = ky + u * 0.55, text = x0.tag, pw = text.length * u * 0.14 + u * 0.3, ph = u * 0.36;
      tags += `<g class="pill"><line class="ln" x1="${cx}" y1="${ky}" x2="${cx}" y2="${cy - ph / 2}"/><rect x="${cx - pw / 2}" y="${cy - ph / 2}" width="${pw}" height="${ph}" rx="${ph / 2}"/><text x="${cx}" y="${cy + u * 0.085}">${text.replace('<', '&lt;')}</text></g>`;
    }
  });
  return s + tags + `</g></svg>`;
}

function stripHtml() {
  return `<div class="strip">${groupsShown().map(g => {
    const idle = analyse(g).some(x => /^No key on this board/.test(x.t)) || (g.id === 'autoshift' && !bit(3, 0).get(state.vals));
    return `<button class="${g.id === state.group ? 'on' : ''}${idle ? ' idle' : ''}" data-group="${g.id}" title="${g.desc}${idle ? ' -- unused on this board' : ''}">${groupName(g)}${hasWarning(g) ? '<span class="bang">!</span>' : ''}${!atOnce() && groupChanged(g) ? '<span class="dot"></span>' : ''}</button>`;
  }).join('')}</div>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  buildBoard();
  const scroll = document.querySelector('.page') ? document.querySelector('.page').scrollTop : 0;
  const showBoard = state.board === 'Lights what a setting concerns';
  document.getElementById('frame').innerHTML =
    `<div class="menubar"><span class="board">${BOARD.b.name} ▾</span><span class="muted">Vial</span><span class="right">Settings</span></div>`
  + `<div class="body"><div class="col"><div class="entry">Keymap</div><div class="entry">Layout</div><div class="entry">Macros</div><div class="entry">Tap Dance</div><div class="entry">Combos</div><div class="entry">Key Overrides</div><div class="entry on">QMK Settings</div></div>`
  + `<div class="main">${state.arrange === 'Groups in the strip' ? stripHtml() : ''}${showBoard ? `<div class="boardarea" id="boardarea">${boardSvg()}</div>` : ''}<div class="panel">${panelHtml()}</div></div></div>`;
  if (document.querySelector('.page')) document.querySelector('.page').scrollTop = scroll;
}
const redrawBoard = () => { const b = document.getElementById('boardarea'); if (b) b.innerHTML = boardSvg(); };

function renderControls() {
  const c = document.getElementById('controls');
  c.innerHTML = '';
  [['setup', 'Board', Object.keys(SETUPS)],
   ['arrange', 'Groups', ['Groups in the strip', 'One page']],
   ['board', 'The board', ['Lights what a setting concerns', 'Folded away']],
   ['hold', 'Tap-hold decision', ['One choice of three', 'Two boxes, as QMK']],
   ['names', 'Names', ['In words', "QMK's names"]],
   ['write', 'Writing', ['Save / Revert', 'At once']],
   ['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => {
      const bt = document.createElement('button'); bt.textContent = v;
      if (state[k] === v) bt.className = 'on';
      bt.onclick = () => { const was = state.setup; state[k] = v; if (k === 'setup' && was !== v) reset(); state.msg = null; render(); };
      g.appendChild(bt);
    });
    c.appendChild(g);
  });
}

// ---------------------------------------------------------------------------------------------
// Editing. At once, every change is "written" and read back; otherwise Save writes the changed.
function changed() {
  if (atOnce()) { state.saved = Object.assign({}, state.vals); state.msg = ['ok', 'Written, read back the same']; }
  else state.msg = null;
}
const frame = document.getElementById('frame');
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-group],[data-act],[data-fix]');
  if (!t) return;
  const d = t.dataset;
  if (d.group !== undefined) { state.group = d.group; state.msg = null; }
  else if (d.fix === 'perm') { permA().set(state.vals, false); changed(); }
  else if (d.act === 'save') { state.saved = Object.assign({}, state.vals); state.msg = ['ok', 'Stored -- every changed setting, read back the same']; }
  else if (d.act === 'revert') { state.vals = Object.assign({}, state.saved); state.msg = null; }
  else if (d.act === 'reset') state.confirm = true;
  else if (d.act === 'noreset') state.confirm = false;
  else if (d.act === 'doreset') {
    state.vals = Object.assign({}, setupOf().vals, { 21: 0, 22: 0, 23: 0, 26: 0, 27: 0, 25: 200, 8: 0 });
    Object.keys(state.vals).forEach(q => { if (!qs(+q)) delete state.vals[q]; });
    state.saved = Object.assign({}, state.vals); state.confirm = false; state.msg = ['ok', 'Reset, and read back: these are the firmware\'s defaults'];
  }
  render();
});
frame.addEventListener('change', e => {
  const d = e.target.dataset, v = state.vals;
  if (d.q !== undefined) {
    let x = Math.max(0, Math.round(+e.target.value || 0));
    if (+d.q === 9 || +d.q === 14) x = Math.round(x / 10) * 10;
    v[+d.q] = x;
  }
  else if (d.acc !== undefined) { const [gi, li] = d.acc.split(':').map(Number); GROUPS[gi].lines[li].a.set(v, e.target.checked); }
  else if (d.box !== undefined) { const [gi, li, k] = d.box.split(':').map(Number); GROUPS[gi].lines[li].items[k][1].set(v, e.target.checked); }
  else if (d.magic !== undefined) bit(21, +d.magic).set(v, e.target.checked);
  else if (d.hk !== undefined) (+d.hk ? hookpA() : permA()).set(v, e.target.checked);
  else if (d.hold !== undefined) { const c = +e.target.value; permA().set(v, c === 1); hookpA().set(v, c === 2); }
  changed(); render();
});
// Hovering a line lights what it concerns; the tooltip says what it is.
const tip = document.getElementById('tip');
frame.addEventListener('mouseover', e => {
  const h = e.target.closest('[data-hover]'), t = e.target.closest('[data-tip]');
  const key = h ? h.dataset.hover : null;
  if (key !== state.hover) { state.hover = key; redrawBoard(); }
  if (t && t.dataset.tip) { tip.innerHTML = t.dataset.tip; tip.style.display = 'block'; } else tip.style.display = 'none';
});
frame.addEventListener('mousemove', e => { tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + 'px'; tip.style.top = (e.clientY + 18) + 'px'; });
frame.addEventListener('mouseleave', () => { state.hover = null; tip.style.display = 'none'; redrawBoard(); });

document.getElementById('notes').innerHTML = `
<p><b>What QMK Settings are.</b> Options QMK fixes when a firmware is built -- the tapping term, Auto Shift, one-shot
keys, mouse key speeds -- that vial-qmk makes changeable on the board, each a numbered setting the firmware lists. Vial
only; 260 of vial-qmk's 623 Vial keymaps turn them off. Vial shows seven tabs of boxes and spin boxes under QMK's names,
with Save, Undo and Reset. The facts, from vial-qmk's qmk_settings.c and QMK's tapping code, are in ui-design.md.</p>
<p><b>Groups</b>: <b>in the strip</b> -- the section's own row of choices, as slots in Combos -- one group in the panel,
the board lighting the keys it concerns; or <b>one page</b>, every group in two columns, scrolling. A group the firmware
lacks is not shown; a group no key uses is greyed in the strip and says so (Grave Escape and Mouse keys on the Model F).</p>
<p><b>The board</b> lights what a group concerns: Tap-Hold the home-row mods, One Shot the one-shot Shift, Auto Shift the
letters, numbers and symbols it shifts. Under the pointer, one line: <b>Chordal Hold</b> shows QMK's guess of each key's
hand, L and R -- the firmware's own, from its build, may differ; <b>Keys swapped</b> tags each key with what it sends
while the swap is on. Or the board is <b>folded away</b>, the room going to the panel.</p>
<p><b>The tap-hold decision</b>: QMK's two boxes, Permissive Hold and Hold On Other Key Press, are three ways in truth --
both on, Hold On Other Key Press decides first and Permissive Hold changes nothing. <b>One choice of three</b> says so by
construction; <b>two boxes</b> keeps QMK's and warns. The Model F's firmware (as of 2023) stores Hold On Other Key Press
turned round, as "Ignore Mod Tap Interrupt" -- off by default, so it holds at once; Nazg shows it the same way as today's.</p>
<p><b>Names</b>: <b>in words</b>, QMK's name and what it does in the tooltip; or <b>QMK's names</b>, with what each does
beside it. <b>Writing</b>: <b>Save / Revert</b>, a dot on each changed line and group, as the slot sections; or <b>at
once</b>, each change written and read back, as Layout. A number is written when it is left or Enter pressed.
<b>Reset all</b> asks first: the firmware's defaults cannot be read before, and Keys swapped resets too.</p>`;

reset();
render();
</script>
</body>
</html>
