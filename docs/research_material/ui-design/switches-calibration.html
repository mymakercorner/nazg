<!-- Mockup: calibrating a Keychron Hall-effect board (ui-design.md, "Calibration"; the wire is
     keychron-commands.md, "Calibration"). The section around it is switches-curve.html, as built.

     What it rests on, from Keychron's source and the K10 HE V3 (2026-11-24, Rico, in Keychron's Launcher):
     - the board measures and stores by itself; a client sends start (0xA9 0x40 2) and stop (4), and watches the
       state and which keys are done (0x41); no calibration can be written back;
     - every key at rest first, hands off; then each pressed fully down, in any order; it ends and saves by itself
       about 3 s after the last one;
     - nothing types meanwhile: the mouse starts it and stops it;
     - stopped early, the keys pressed have new values and the others keep an earlier calibration; unplugged before
       the end, nothing is stored (the source);
     - never stopped while the rest is measured, nor once every key is done (the source's traps).

     Settled by Rico (2026-11-24), the variants removed: opened from the strip's end, not beside the modes; as
     Keychron's Launcher does it, keys turning green and no more -- no half press marked (a key is done 800 counts
     under its rest, where the K10's bottoms are 1481 to 1817 under it; the board corrects itself on full
     presses); at its end the result stays until Close, the only button -- not Calibrate again, which the strip's does. -->

<script>
// The K10 HE ANSI, corrected 0EA7 definition (dist/k10_he_0EA7/k10_he_ansi_0EA7.json): its KLE.
const KLE = [[{"c":"#777777"},"0,0",{"x":1,"c":"#cccccc"},"0,2","0,3","0,4","0,5",{"x":0.5},"0,6","0,7","0,8","0,9",{"x":0.5},"0,10","0,11","0,12","0,13",{"x":0.25},"0,14","0,15","0,16"],[{"y":0.25},"1,0","1,1","1,2","1,3","1,4","1,5","1,6","1,7","1,8","1,9","1,10","1,11","1,12",{"w":2},"1,13",{"x":0.25},"1,14","1,15","1,16",{"x":0.25},"1,17","1,18","1,19","1,20"],[{"w":1.5},"2,0","2,1","2,2","2,3","2,4","2,5","2,6","2,7","2,8","2,9","2,10","2,11","2,12",{"w":1.5},"2,13",{"x":0.25},"2,14","2,15","2,16",{"x":0.25},"2,17","2,18","2,19",{"h":2},"2,20"],[{"w":1.75},"3,0","3,1","3,2","3,3","3,4","3,5","3,6","3,7","3,8","3,9","3,10","3,11",{"w":2.25,"c":"#777777"},"3,12",{"x":3.5,"c":"#cccccc"},"3,17","3,18","3,19"],[{"w":2.25},"4,0","4,2","4,3","4,4","4,5","4,6","4,7","4,8","4,9","4,10","4,11",{"w":2.75},"4,13",{"x":1.25},"4,15",{"x":1.25},"4,17","4,18","4,19",{"h":2},"4,20"],[{"w":1.25},"5,0",{"w":1.25},"5,1",{"w":1.25},"5,2",{"w":6.25},"5,6",{"w":1.25},"5,9",{"w":1.25},"5,10",{"w":1.25},"5,11",{"w":1.25},"5,12",{"x":0.25},"5,14","5,15","5,16",{"x":0.25,"w":2},"5,17","5,18"]];

// The Windows base layer's legends, and the KeyboardEvent.code that plays each key.
const LEGEND = {
 '0,0':['Esc','Escape'],'0,2':['F1','F1'],'0,3':['F2','F2'],'0,4':['F3','F3'],'0,5':['F4','F4'],'0,6':['F5','F5'],'0,7':['F6','F6'],'0,8':['F7','F7'],'0,9':['F8','F8'],
 '0,10':['F9','F9'],'0,11':['F10','F10'],'0,12':['F11','F11'],'0,13':['F12','F12'],'0,14':['PrtSc','PrintScreen'],'0,15':['Cortana','ScrollLock'],'0,16':['Light','Pause'],
 '1,0':['`','Backquote'],'1,1':['1','Digit1'],'1,2':['2','Digit2'],'1,3':['3','Digit3'],'1,4':['4','Digit4'],'1,5':['5','Digit5'],'1,6':['6','Digit6'],'1,7':['7','Digit7'],
 '1,8':['8','Digit8'],'1,9':['9','Digit9'],'1,10':['0','Digit0'],'1,11':['-','Minus'],'1,12':['=','Equal'],'1,13':['Backspace','Backspace'],'1,14':['Ins','Insert'],
 '1,15':['Home','Home'],'1,16':['PgUp','PageUp'],'1,17':['Num','NumLock'],'1,18':['/','NumpadDivide'],'1,19':['*','NumpadMultiply'],'1,20':['-','NumpadSubtract'],
 '2,0':['Tab','Tab'],'2,1':['Q','KeyQ'],'2,2':['W','KeyW'],'2,3':['E','KeyE'],'2,4':['R','KeyR'],'2,5':['T','KeyT'],'2,6':['Y','KeyY'],'2,7':['U','KeyU'],'2,8':['I','KeyI'],
 '2,9':['O','KeyO'],'2,10':['P','KeyP'],'2,11':['[','BracketLeft'],'2,12':[']','BracketRight'],'2,13':['\\','Backslash'],'2,14':['Del','Delete'],'2,15':['End','End'],
 '2,16':['PgDn','PageDown'],'2,17':['7','Numpad7'],'2,18':['8','Numpad8'],'2,19':['9','Numpad9'],'2,20':['+','NumpadAdd'],
 '3,0':['Caps','CapsLock'],'3,1':['A','KeyA'],'3,2':['S','KeyS'],'3,3':['D','KeyD'],'3,4':['F','KeyF'],'3,5':['G','KeyG'],'3,6':['H','KeyH'],'3,7':['J','KeyJ'],'3,8':['K','KeyK'],
 '3,9':['L','KeyL'],'3,10':[';','Semicolon'],'3,11':["'",'Quote'],'3,12':['Enter','Enter'],'3,17':['4','Numpad4'],'3,18':['5','Numpad5'],'3,19':['6','Numpad6'],
 '4,0':['Shift','ShiftLeft'],'4,2':['Z','KeyZ'],'4,3':['X','KeyX'],'4,4':['C','KeyC'],'4,5':['V','KeyV'],'4,6':['B','KeyB'],'4,7':['N','KeyN'],'4,8':['M','KeyM'],
 '4,9':[',','Comma'],'4,10':['.','Period'],'4,11':['/','Slash'],'4,13':['Shift','ShiftRight'],'4,15':['↑','ArrowUp'],'4,17':['1','Numpad1'],'4,18':['2','Numpad2'],
 '4,19':['3','Numpad3'],'4,20':['Enter','NumpadEnter'],
 '5,0':['Ctrl','ControlLeft'],'5,1':['Win','MetaLeft'],'5,2':['Alt','AltLeft'],'5,6':['Space','Space'],'5,9':['Alt','AltRight'],'5,10':['Win','MetaRight'],
 '5,11':['Fn','ContextMenu'],'5,12':['Ctrl','ControlRight'],'5,14':['←','ArrowLeft'],'5,15':['↓','ArrowDown'],'5,16':['→','ArrowRight'],'5,17':['0','Numpad0'],'5,18':['.','NumpadDecimal']};

function parseKle(rows) {
  const keys = []; let y = 0;
  for (const row of rows) {
    let x = 0, p = {};
    for (const item of row) {
      if (typeof item === 'object') { if ('x' in item) x += item.x; if ('y' in item) y += item.y; if ('w' in item) p.w = item.w; if ('h' in item) p.h = item.h; continue; }
      const w = p.w || 1, h = p.h || 1;
      keys.push({ x, y, w, h, cell: item, name: (LEGEND[item] || ['?'])[0], code: (LEGEND[item] || [])[1] });
      x += w; p = {};
    }
    y += 1;
  }
  return keys;
}
const KEYS = parseKle(KLE);
const BY_CODE = new Map(KEYS.map((k, i) => [k.code, i]));

// ---------------------------------------------------------------------------------------------
// The profile. A key: mode 1 regular / 2 rapid trigger and its distances (0.1 mm), as round one; adv 0
// none, 3 DKS, 4 gamepad, 5 toggle -- the STORED adv_mode -- and data, the DKS slot or the control.
const FULL = 35;
const REGULAR = 1, RAPID = 2, DKS = 3, PAD = 4, TOGGLE = 5;
const MODES = [[REGULAR, 'Regular'], [RAPID, 'Rapid Trigger'], [DKS, 'One Key Multiple Commands'], [TOGGLE, 'Long-Press Switch'], [PAD, 'Gamepad Analog']];
const POINTS = ['Starting Trigger', 'Bottom In', 'Bottom Out', 'Bounce Back'];
const POINT_SAYS = ['Going down past it.', 'Going down further, past it.', 'Coming back up above it, after Bottom In.', 'Coming back up above it, after Bottom Out.'];
// Game controller values (game_controller_common.h), named as an Xbox controller's (xinput_keycodes.h).
const GC = { 0: 'L ←', 1: 'L →', 2: 'L ↓', 3: 'L ↑', 4: 'LT', 5: 'RT', 6: 'R ←', 7: 'R →', 8: 'R ↓', 9: 'R ↑', 10: 'RZ −', 11: 'RZ +',
  13: 'A', 14: 'B', 15: 'X', 16: 'Y', 17: 'LB', 18: 'RB', 19: 'View', 20: 'Menu', 21: 'L3', 22: 'R3', 23: 'D ↑', 24: 'D ↓', 25: 'D ←', 26: 'D →', 27: 'Xbox' };
const GC_LONG = { 0: 'Left stick, left', 1: 'Left stick, right', 2: 'Left stick, down', 3: 'Left stick, up', 4: 'Left trigger', 5: 'Right trigger', 6: 'Right stick, left',
  7: 'Right stick, right', 8: 'Right stick, down', 9: 'Right stick, up', 17: 'Left bumper', 18: 'Right bumper', 21: 'Left stick pressed', 22: 'Right stick pressed',
  23: 'D-pad up', 24: 'D-pad down', 25: 'D-pad left', 26: 'D-pad right', 27: 'Xbox button' };
const gcName = v => GC[v] || `Button ${v - 12}`;
const gcLong = v => GC_LONG[v] || (GC[v] ? `${GC[v]} button` : `Button ${v - 12}`);
const PRESET = { '3,1': 0, '3,3': 1, '3,2': 2, '2,2': 3, '5,0': 4, '5,12': 5, '3,6': 6, '3,8': 7, '3,7': 8, '2,7': 9, '4,11': 13, '3,11': 14, '3,10': 15, '2,11': 16,
  '2,3': 17, '2,6': 18, '1,0': 19, '1,16': 20, '4,0': 21, '4,13': 22, '4,15': 23, '5,15': 24, '5,14': 25, '5,16': 26, '1,15': 27 };
const at = c => KEYS.findIndex(k => k.cell === c);
// The picker's names: the keyboard's, but for the three keys that are not basic keys.
const CMD = { '0,15': 'ScrLk', '0,16': 'Pause', '5,11': 'Menu', '5,0': 'LCtrl', '5,12': 'RCtrl', '4,0': 'LShift', '4,13': 'RShift', '5,2': 'LAlt', '5,9': 'RAlt', '5,1': 'LWin', '5,10': 'RWin' };
const cmdName = c => c ? (CMD[c] || KEYS[at(c)].name) : '';

const REL = 1, PRESS = 2, TAP = 6;   // bit 0 release, bit 1 press, bit 2 release
function emptySlot() { return { pts: [11, 22, 22, 11], cmds: [0, 1, 2, 3].map(() => ({ key: null, acts: [0, 0, 0, 0] })) }; }
// Bars over the four points <-> the firmware's action bits: a bar of one point is a tap, a longer one is
// pressed at its first point and released at its last. A key pressed and never released is let go when
// the key comes back (release_okmc_keys), so its bar runs to the last point.
function bars(acts) {
  // What is played, not the bits: pressing a key already held changes nothing, releasing one ends its bar.
  // Every one of the 4096 combinations of a key's actions plays as the bars read from it play.
  const out = []; let from = null;
  acts.forEach((a, p) => { for (let bit = 0; bit < 3; bit++) if (a & (1 << bit)) {
    if (bit % 2) { if (from === null) from = p; } else if (from !== null) { out.push([from, p]); from = null; }
  } });
  if (from !== null) out.push([from, 3]);
  return out;
}
function actsOf(list) {
  const a = [0, 0, 0, 0];
  for (const [f, t] of list) if (f === t) a[f] |= TAP; else { a[f] |= PRESS; a[t] |= REL; }
  return a;
}
function freshProfiles() {
  const base = mode => ({ mode, act: 17, press: 4, rel: 4, adv: 0, data: 0 });
  const all = mode => ({ keys: KEYS.map(() => base(mode)), slots: Array.from({ length: 20 }, emptySlot) });
  const def = all(REGULAR), gaming = all(RAPID), pad = all(RAPID);
  for (const [c, v] of Object.entries(PRESET)) Object.assign(pad.keys[at(c)], { adv: PAD, data: v });
  // Made up: W walks, and runs when bottomed; F is Keychron's own A B C D example; C held by a tap.
  Object.assign(def.keys[at('2,2')], { adv: DKS, data: 0 });

  const seg = MODES.map(([m, label]) => {
    const single = m === DKS || m === PAD, bad = (single && selected.size !== 1 && !(m === PAD && !selected.size)) || (m === TOGGLE && !selected.size);
    const tip = bad ? (single ? 'Select one key: each has its own.' : 'Select the keys first.') : m === TOGGLE ? 'One press holds the key down, the next lets it go.' : m === DKS ? 'Up to four keys sent by one, at four points of its travel.' : m === PAD ? 'Plays a game controller.' : '';
    return `<button class="${cur === m ? 'on' : ''}" data-mode="${m}"${bad && !back ? ' disabled' : ''}${back ? ' data-tip="Back to the keys: changes nothing."' : tip ? ` data-tip="${tip}"` : ''}>${label}</button>`;
  }).join('');
  const apart = `<span class="seg" style="margin-left:6px"><button data-tip="As built: not in this mockup.">SOCD</button><button class="${state.want === 'curve' ? 'on' : ''}" data-act="curve" data-tip="How far a stick goes for how far its key is pressed.">Curve</button></span>`;
  return `<span class="seg${cur === null ? ' mixed' : ''}">${seg}</span>${apart}${cur === null && list.length ? '<span class="muted">mixed</span>' : ''}`;
}
function rapidWords(k) {
  return k.mode === REGULAR ? `Pressed when it goes down past ${mm(k.act)} mm, released when it comes back above ${mm(Math.max(0, k.act - 3))} mm.`
    : `Pressed at ${mm(k.act)} mm. From there, at any depth: released as soon as it comes up ${mm(k.rel)} mm, pressed again as soon as it goes down ${mm(k.press)} mm. Back above ${mm(Math.max(0, k.act - 3))} mm, it starts over.`;
}
function editorBody(list) {
  if (state.want === 'curve') return curveHtml();
  if (state.want === PAD) return padHtml(list);
  const m = common(list, modeOf);
  if (m === DKS && list.length === 1) return dksHtml(list[0]);
  if (m === DKS) return `<div class="words">Select one key to see its commands.</div>`;
  if (m === PAD) return padHtml(list);
  if (m === TOGGLE) return slider('Actuation Distance', 'act', 1, FULL, list) + `<div class="words">Pressed once, the key stays down; pressed again, it is let go. It sends what the Keymap says.</div>`;
  if (m > TOGGLE) return `<div class="words">A mode Nazg does not know (${m}), set with Keychron's Launcher: its Turbocharged or PDO, perhaps. Nazg leaves it as it is unless another mode is chosen here.</div>`;
  let t = slider('Actuation Distance', 'act', 1, FULL, list);
  if (m === RAPID) t += slider('(Press) Trigger Distance', 'press', 1, 20, list) + slider('(Release) Reset Distance', 'rel', 1, 20, list);
  return t + `<div class="words">${m ? rapidWords(P().keys[list[0]]) : `These ${list.length} keys differ in their Mode.`}</div>`;
}
function testHtml() {
  if (!state.testing) return `<div class="gauge" id="gauge"><div class="h" style="display:flex;align-items:center">Test<button style="margin-left:auto" data-act="test">Test keys</button></div><div class="muted" style="font-size:12px;line-height:1.5;margin-top:6px">Press keys on the board to see how far they go, and what they do with these settings. While testing, pressing a key does not select it.${hasPadKeys() ? ' The gamepad shows here too.' : ''}</div></div>`;
  const i = followed !== null ? followed : null, h = `<div class="h" style="display:flex;align-items:center">Test<button class="on" style="margin-left:auto" data-act="test">Stop</button></div>`;
  if (i === null) return `<div class="gauge" id="gauge">${h}<div class="muted" style="font-size:12px">Press a key on the board. <i>(Here: on your own keyboard.)</i></div>${padLive() ? padTestHtml() : ''}</div>`;
  const s = sim[i], k = P().keys[i];
  let extra = '';
  if (k.adv === DKS) extra = `<div class="sent"><span class="muted">Sent</span> ${s.log.length ? s.log.map(esc).join(', ') : '<span class="muted">nothing yet</span>'}</div>`;
  if (k.adv === TOGGLE) extra = `<div class="sent">${s.hold ? '<b style="color:var(--press)">held down</b>' : '<span class="muted">let go</span>'}</div>`;
  return `<div class="gauge" id="gauge">${h}<div style="display:flex;align-items:center;gap:8px"><span class="kname">${esc(KEYS[i].name)}</span><span class="muted" style="white-space:nowrap">${mm(Math.floor(s.travel))} mm</span>`
    + `<span style="flex:1;height:11px;border:1px solid var(--keyline);border-radius:6px;background:var(--key);overflow:hidden"><span style="display:block;height:100%;width:${s.travel / FULL * 100}%;background:var(--press);opacity:${s.pressed ? .6 : .3}"></span></span><b style="color:var(--press);width:48px;font-size:12px">${s.pressed ? 'pressed' : ''}</b></div>${extra}${padLive() ? padTestHtml() : ''}</div>`;
}
function panelHtml() {
  if (state.cal) return calHtml();
  const list = target(), one = list.length === 1;
  let t = headLine(list);
  t += `<div class="cols"><div class="editor">${editorBody(list)}</div>${testHtml()}</div>`;
  if (state.slotPick !== null && state.more && one && selected.size && P().keys[list[0]].adv === DKS) t += pickerHtml(list[0]);
  return t;
}
function columnHtml() {
  return `<div class="col${running() ? ' inert' : ''}"><div class="hdr">VIA</div><div class="entry">Keymap</div><div class="entry">Macros</div><div class="sep"></div><div class="hdr">Board</div><div class="entry">Lighting</div>`
    + '<div class="entry on">Switches</div>'
    + `<div class="sep"></div><div class="hdr">Tools</div><div class="entry">Matrix view</div><div class="entry">Device</div></div>`;
}
function stripHtml() {
  return PNAMES.map((n, i) => `<button class="${state.profile === i ? 'on' : ''}" data-prof="${i}"${state.profile === i ? ' data-tip="The board uses this profile"' : ''}>${state.profile === i ? '<span class="dot">●</span>' : ''}${n}</button>`).join('')
    + `<span style="margin-left:auto;display:flex;gap:14px;font-size:12px"><span class="muted">Full travel ${mm(FULL)} mm <i>(estimated)</i></span><button data-act="calopen">Calibrate…</button><span class="link">Reset profile…</span></span>`;
}
window.calRest = () => { if (state.cal && state.cal.phase === 'press') KEYS.forEach((_, i) => { if (state.cal.phase === 'press' && !state.cal.done.has(i) && i !== KEYS.length - 1 && i !== 0) { state.cal.done.add(i); state.cal.last = i; } }); render(); };
function render() {
  document.documentElement.dataset.theme = state.theme.toLowerCase();
  renderControls();
  document.getElementById('frame').innerHTML = `<div class="menubar${running() ? ' inert' : ''}"><span class="board">Keychron K10 HE ANSI ▾</span><span class="muted">VIA</span><span class="right">Settings</span></div>`
    + `<div class="body">${columnHtml()}<div class="main"><div class="strip${running() ? ' inert' : ''}">${stripHtml()}</div><div class="boardarea">${boardSvg()}</div><div class="panel" id="panel">${panelHtml()}</div></div></div>`;
}
function redrawBoard() { const g = document.getElementById('keys'); if (g) g.innerHTML = KEYS.map(keySvg).join(''); }
function redrawLive() {
  redrawBoard();
  const g = document.getElementById('gauge'); if (g) g.outerHTML = testHtml();
  const pad = document.getElementById('controller'); if (pad) pad.outerHTML = controllerSvg();
  const pl = document.getElementById('plot'); if (pl && curveDrag === null) pl.outerHTML = plotSvg();
  const d = document.querySelector('svg[data-dks]'); if (d) d.outerHTML = dksSvg(+d.dataset.dks);
}
function redraw() { document.getElementById('panel').innerHTML = panelHtml(); redrawBoard(); renderControls(); }
function renderControls() {
  const c = document.getElementById('controls'); c.innerHTML = '';
  [['theme', 'Theme', ['Light', 'Dark']]].forEach(([k, name, values]) => {
    const g = document.createElement('div'); g.className = 'group'; g.innerHTML = `<span class="name">${name}</span>`;
    values.forEach(v => { const b = document.createElement('button'); b.textContent = v; if (state[k] === v) b.className = 'on'; b.onclick = () => { state[k] = v; render(); }; g.appendChild(b); });
    c.appendChild(g);
  });
  const r = document.createElement('button'); r.textContent = 'Press all but two'; r.onclick = () => window.calRest(); c.appendChild(r);
  const t = document.createElement('span'); t.className = 'toast'; t.textContent = state.toast; c.appendChild(t);
}

// ---------------------------------------------------------------------------------------------
// Events.
const frame = document.getElementById('frame'), tip = document.getElementById('tip');
let handleDrag = null, laneDrag = null;
function toggleKey(i) { if (state.want === 'curve') return; selected.has(i) ? selected.delete(i) : selected.add(i); if (state.want !== PAD) state.want = null; state.slotPick = null; state.toast = ''; }
// Starting Trigger is never under 0.2 mm: the firmware lets the key go below it less 0.1 mm, and nothing
// is below 0.0 (okmc_action).
function setPoint(p, v) { theDks().pts[p] = Math.max(p === 0 ? 2 : 1, Math.min(FULL, v)); }
// What the command being chosen sends: clicked on the board, pressed, or -- for a key the board does not
// have -- from the picker in a popup (Rico, 2026-11-23: a keyboard in a popup was too small).
function pickCommand(cell) {
  const c = theDks().cmds[state.slotPick];
  if (cell === '5,11') { state.toast = 'Fn sends no ordinary key: choose another'; return; }
  if (!cell) Object.assign(c, { key: null, acts: [0, 0, 0, 0] });
  else { if (!c.key) c.acts = actsOf([[0, 3]]); c.key = cell; }
  state.slotPick = null; state.more = false; saved('AMC_SET_ADVANCE_MODE DKS');
}
function theDks() { const i = [...selected][0]; return P().slots[P().keys[i].data]; }
frame.addEventListener('mousedown', ev => {
  const t = ev.target;
  if (t.dataset.pt4 !== undefined) { curveDrag = +t.dataset.pt4; state.hot = curveDrag; ev.preventDefault(); redrawCurve(); }
  if (t.dataset.handle !== undefined) { handleDrag = { p: +t.dataset.handle }; ev.preventDefault(); }
  if (t.dataset.lane !== undefined) {
    const n = +t.dataset.lane, p = +t.dataset.pt, bar = bars(theDks().cmds[n].acts).find(([f, g]) => f !== g && (p === f || p === g));
    laneDrag = { n, from: p, to: p, bar, anchor: bar ? (p === bar[0] ? bar[1] : bar[0]) : p };
    ev.preventDefault();
  }
});
window.addEventListener('mousemove', ev => {
  if (curveDrag !== null) {
    const r = document.getElementById('plot').getBoundingClientRect();
    setCurve(curveDrag, Math.round((ev.clientX - r.left - CX) / CW * FULL), Math.round((1 - (ev.clientY - r.top - CY) / CH) * 127));
    redrawCurve();
  }
  if (handleDrag) {
    const svg = document.querySelector('svg[data-dks]'), y = ev.clientY - svg.getBoundingClientRect().top;
    setPoint(handleDrag.p, Math.round((y - DTOP) / DH * FULL));
    redrawLive();
  }
  if (laneDrag) {
    const svg = document.querySelector('svg[data-dks]'), x = ev.clientX - svg.getBoundingClientRect().left;
    laneDrag.to = COL.reduce((best, c, p) => Math.abs(c - x) < Math.abs(COL[best] - x) ? p : best, 0);
    redrawLive();
  }
});
window.addEventListener('mouseup', () => {
  if (curveDrag !== null) { curveDrag = null; curveSaved(); redraw(); }
  if (handleDrag) { handleDrag = null; saved('AMC_SET_ADVANCE_MODE DKS'); redraw(); }
  if (laneDrag) {
    const { n, from, to, bar, anchor } = laneDrag, c = theDks().cmds[n], list = bars(c.acts); laneDrag = null;
    if (from === to) {
      const hit = list.findIndex(([a, b]) => from >= a && from <= b);
      if (hit >= 0) list.splice(hit, 1); else list.push([from, from]);
      c.acts = actsOf(list.sort((a, b) => a[0] - b[0]));
    } else {
      // The new bar, or the one whose end was dragged; what it covers goes, what it only touches stays.
      const [f, g] = [anchor, to].sort((a, b) => a - b);
      const rest = list.filter(([a, b]) => !(bar && a === bar[0] && b === bar[1]) && (b < f || a > g || (f !== g && a !== b && (b === f || a === g))));
      c.acts = actsOf([...rest, [f, g]].sort((a, b) => a[0] - b[0]));
    }
    saved('AMC_SET_ADVANCE_MODE DKS'); redraw();
  }
});
frame.addEventListener('click', ev => {
  const t = ev.target.closest('button,[data-preset],[data-key],[data-gc],[data-slotkey],[data-cmdkey]') || ev.target, d = t.dataset;
  if (state.cal && d.key !== undefined) { calPress(+d.key); return; }
  if (d.key !== undefined && state.slotPick !== null) { pickCommand(KEYS[+d.key].cell); redraw(); }
  else if (d.key !== undefined) { toggleKey(+d.key); redraw(); }
  else if (d.prof !== undefined) { state.profile = +d.prof; selected.clear(); if (state.want !== 'curve') state.want = null; state.slotPick = null; sim.forEach(s => { s.st = 0; s.held.clear(); s.hold = false; }); trail = { L: [], R: [] }; lastSig = ''; readLive(); state.toast = 'AMC_SELECT_PROFILE'; render(); }
  else if (d.mode !== undefined) { setMode(+d.mode); redraw(); }
  else if (d.gc !== undefined) { setControl(+d.gc); redraw(); }
  else if (d.slotkey !== undefined) { state.slotPick = state.slotPick === +d.slotkey ? null : +d.slotkey; redraw(); }
  else if (d.cmdkey !== undefined) { pickCommand(d.cmdkey); redraw(); }
  else if (d.act === 'more') { state.more = true; redraw(); }
  else if (d.act === 'calopen') { state.cal = { phase: 'intro' }; state.want = null; state.testing = false; render(); }
  else if (d.act === 'calstart') { calStart(); state.toast = 'AMC_CALIBRATE 2'; render(); }
  else if (d.act === 'calstop') { state.cal.phase = 'done'; state.toast = 'AMC_CALIBRATE 4'; render(); }
  else if (d.act === 'calclose') { state.cal = null; state.toast = ''; render(); }
  else if (d.preset !== undefined) { CURVE = copy(PRESETS[+d.preset][1]); curveSaved(); redraw(); }
  else if (d.act === 'curve') { state.want = 'curve'; redraw(); }
  else if (d.act === 'test') { state.testing = !state.testing; followed = null; trail = { L: [], R: [] }; lastSig = ''; if (state.testing) readLive(); else sim.forEach(s => { s.down = false; s.travel = 0; s.pressed = false; }); redraw(); }
  else if (d.act === 'pickdone') { state.slotPick = null; state.more = false; redraw(); }
  else if (d.act === 'clear') { selected.clear(); state.want = null; state.slotPick = null; redraw(); }
  else if (d.act === 'selall') { KEYS.forEach((_, i) => selected.add(i)); state.want = null; redraw(); }
});
frame.addEventListener('input', ev => {
  const d = ev.target.dataset, v = ev.target.parentElement.querySelector('.val');
  if (d.field && v) { v.textContent = `${mm(+ev.target.value)} mm`; v.classList.remove('mixed'); }
});
frame.addEventListener('change', ev => {
  const d = ev.target.dataset;
  if (d.field) { target().forEach(i => { P().keys[i][d.field] = +ev.target.value; }); saved('AMC_SET_TRAVAL'); redraw(); }
  if (d.cv !== undefined) {
    const v = parseFloat(ev.target.value.replace(',', '.')), n = +d.cv;
    if (!Number.isNaN(v)) { d.ax === '0' ? setCurve(n, Math.round(v * 10), CURVE[n][1]) : setCurve(n, CURVE[n][0], Math.round(v / 100 * 127)); curveSaved(); }
    redraw();
  }
  if (d.ptv !== undefined) {
    const v = Math.round(parseFloat(ev.target.value.replace(',', '.')) * 10);
    if (!Number.isNaN(v)) { setPoint(+d.ptv, v); saved('AMC_SET_ADVANCE_MODE DKS'); }
    redraw();
  }
  if (d.xin !== undefined) { state.xinput = d.xin === '1'; state.toast = 'AMC_SET_GAME_CONTROLLER_MODE, stored at once'; redraw(); }
  if (d.flag) { state[d.flag] = ev.target.checked; state.toast = 'AMC_SET_GAME_CONTROLLER_MODE, stored at once'; redraw(); }
});
frame.addEventListener('mousemove', ev => {
  const t = ev.target.closest('[data-tip]');
  const hot = curveDrag !== null ? curveDrag : ev.target.dataset.pt4 !== undefined ? +ev.target.dataset.pt4 : null;
  if (hot !== state.hot) { state.hot = hot; const pl = document.getElementById('plot'); if (curveDrag === null && pl) pl.outerHTML = plotSvg(); }
  const gc = ev.target.dataset.gc, hov = gc !== undefined ? (boundTo(+gc)[0] ?? null) : null;
  if (hov !== state.hover) { state.hover = hov; redrawBoard(); }
  if (!t || handleDrag || laneDrag || curveDrag !== null) { tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 400) + 'px'; tip.style.top = ev.clientY + 16 + 'px';
});
// The wheel moves a point as the circle moves: up is shallower.
frame.addEventListener('wheel', ev => {
  const cv = ev.target.dataset.cv;
  if (cv !== undefined && !ev.target.disabled) {
    ev.preventDefault();
    const n = +cv, up = -Math.sign(ev.deltaY), y = CURVE[n][1];
    if (ev.target.dataset.ax === '0') setCurve(n, CURVE[n][0] + up, y); else setCurve(n, CURVE[n][0], Math.round((pct(y) + up) * 1.27));
    curveSaved(); redraw(); return;
  }
  const p = ev.target.dataset.handle ?? ev.target.dataset.ptv;
  if (p === undefined) return;
  ev.preventDefault();
  setPoint(+p, theDks().pts[+p] + Math.sign(ev.deltaY)); saved('AMC_SET_ADVANCE_MODE DKS'); redraw();
}, { passive: false });
frame.addEventListener('keydown', ev => { if ((ev.target.dataset.ptv !== undefined || ev.target.dataset.cv !== undefined) && ev.key === 'Enter') ev.target.blur(); });
frame.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
window.addEventListener('keydown', ev => {
  if (/INPUT|SELECT/.test(ev.target.tagName) && ev.target.type !== 'checkbox' && ev.target.type !== 'range') return;
  const i = BY_CODE.get(ev.code);
  if (i === undefined) return;
  ev.preventDefault();
  if (ev.repeat) return;
  if (state.cal) { calPress(i); return; }
  if (state.testing) { sim[i].down = true; followed = i; return; }
  if (state.slotPick !== null) pickCommand(KEYS[i].cell); else toggleKey(i);
  redraw();
});
window.addEventListener('keyup', ev => { const i = BY_CODE.get(ev.code); if (i !== undefined) { ev.preventDefault(); sim[i].down = false; } });
window.addEventListener('blur', () => sim.forEach(s => { s.down = false; }));

document.getElementById('notes').innerHTML = `
<p><b>Try it</b>: <b>Calibrate…</b>, Start, then click keys on the board, or press them on your own keyboard. <b>Press all but two</b>, above, goes quickly to
the end: press Esc and the last key to see it save by itself.</p>
<p><b>At the strip's end</b> (Rico): beside Reset profile…, where the board's own matters are. The panel becomes the calibration.</p>
<p><b>The board is the progress</b>: green once done, distances and marks hidden meanwhile.</p>
<p><b>As Keychron's Launcher does it</b> (Rico): keys turn green, it ends by itself. No key is judged pressed less deep than another.</p>
<p><b>While it runs nothing else is there</b>: the column, the strip and the board's menu wait, the way out being Stop, or unplugging. Stop waits too while the keys
are measured at rest and once every key is done: the source is wrong to stop there.</p>
<p><b>At its end the board stays green and the panel says it, until Close</b> (Rico). Going back to the keys at once, with a line in the strip, was tried:
the result was gone too soon. Calibrate again is the strip's Calibrate….</p>
<p>The old calibration cannot be put back, so there is nothing to compare or undo.</p>`;

render();
</script>
</body>
