# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds Nazg and runs its tests on every push and pull request (build-and-release.md,
# "Automatic builds: GitHub Actions"). Windows and Linux; macOS joins as a job here. Debug runs
# the tests with the asserts on, Release runs them optimised; on Windows it also keeps the
# testers' zip tools/package_windows.py makes, as an artifact of the run.

name: Build

# Not for a push that only changes notes: nothing built or tested would differ. GitHub never
# applies the filter to a tag, so a tag always builds; the Actions tab's button always runs.
on:
  push:
    paths-ignore: &notes
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore: *notes
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (${{ matrix.config }})
    # windows-2025 carries Visual Studio 2026 only; Nazg builds with 2022 (CLAUDE.md, "Stack").
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Both bundles, so via_bundle_contents and community_bundle_contents run instead of being
      # skipped, and the package has them.
      - name: Fetch the definition bundles
        run: |
          python tools/update_via_bundle.py
          python tools/update_community_bundle.py

      - name: Configure
        run: cmake -S . -B build_VS2022 -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build_VS2022 --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build_VS2022 -C ${{ matrix.config }} --output-on-failure

      - name: Package
        if: matrix.config == 'Release'
        run: |
          python -m pip install markdown
          python tools/package_windows.py

      - name: Keep the package
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: nazg-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  # GCC on the Ubuntu of Rico's WSL, as GenerateBuildForLinux.sh builds there. Tests only: the
  # testers' AppImage comes from tools/package_linux.py's container, a job of its own later.
  linux:
    name: Linux (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # SDL's docs/README-linux.md list without audio, plus Wayland and libdecor; libudev for
      # hidapi's hidraw backend.
      - name: Install the build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libwayland-dev libdecor-0-dev

      - name: Fetch the definition bundles
        run: |
          python3 tools/update_via_bundle.py
          python3 tools/update_community_bundle.py

      - name: Configure
        run: sh GenerateBuildForLinux.sh

      - name: Build
        run: cmake --build build_Linux --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build_Linux -C ${{ matrix.config }} --output-on-failure
