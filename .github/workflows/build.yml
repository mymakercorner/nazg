# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds Nazg and runs its tests on every push and pull request (build-and-release.md,
# "Automatic builds: GitHub Actions"). Windows, Linux, macOS, and the web build. Debug runs the tests with the
# asserts on, Release runs them optimised and packages what testers download: the Windows zip and
# the macOS app, kept as artifacts of the run.
#
# A pushed tag v<NAZG_VERSION> also builds the Linux AppImage in its container and puts the three
# packages in a draft release, for Rico to write its notes and publish ("Releases"). Run by hand
# from the Actions tab, the workflow builds the AppImage too and rehearses the release, publishing
# nothing.

name: Build

# Not for a push that only changes notes: nothing built or tested would differ. GitHub never
# applies the filter to a tag, so a tag always builds; the Actions tab's button always runs.
on:
  push:
    paths-ignore: &notes
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore: *notes
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (${{ matrix.config }})
    # windows-2025 carries Visual Studio 2026 only; Nazg builds with 2022 (CLAUDE.md, "Stack").
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Both bundles, so via_bundle_contents and community_bundle_contents run instead of being
      # skipped, and the package has them.
      - name: Fetch the definition bundles
        run: |
          python tools/update_via_bundle.py
          python tools/update_community_bundle.py

      - name: Configure
        run: cmake -S . -B build_VS2022 -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build_VS2022 --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build_VS2022 -C ${{ matrix.config }} --output-on-failure

      # The zip, and the manual as its own page beside it for the release.
      - name: Package
        if: matrix.config == 'Release'
        run: |
          python -m pip install markdown
          python tools/package_windows.py

      - name: Keep the package
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: nazg-windows-x64
          path: |
            dist/*.zip
            dist/*.html
          if-no-files-found: error

  # GCC on the Ubuntu of Rico's WSL, as GenerateBuildForLinux.sh builds there. Tests only: the
  # testers' AppImage comes from tools/package_linux.py's container, the appimage job below.
  linux:
    name: Linux (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # SDL's docs/README-linux.md list without audio, plus Wayland and libdecor; libudev for
      # hidapi's hidraw backend.
      - name: Install the build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libwayland-dev libdecor-0-dev

      - name: Fetch the definition bundles
        run: |
          python3 tools/update_via_bundle.py
          python3 tools/update_community_bundle.py

      - name: Configure
        run: sh GenerateBuildForLinux.sh

      - name: Build
        run: cmake --build build_Linux --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build_Linux -C ${{ matrix.config }} --output-on-failure

  # Apple's Clang on Apple Silicon, the Mac Nazg is tried on. No generate script yet: nobody builds
  # Nazg on a Mac by hand, so the job calls CMake as tools/package_macos.py says to, into its own
  # build_macOS/ -- macOS 11 the oldest, the first on Apple Silicon. SDL3 and hidapi stay libraries
# of their own, as on Windows: linked statically, SDL's copy of hidapi clashes with hidapi's.
  macos:
    name: macOS (${{ matrix.config }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Fetch the definition bundles
        run: |
          python3 tools/update_via_bundle.py
          python3 tools/update_community_bundle.py

      - name: Configure
        run: cmake -S . -B build_macOS -G "Ninja Multi-Config" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build_macOS --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build_macOS -C ${{ matrix.config }} --output-on-failure

      - name: Package
        if: matrix.config == 'Release'
        run: python3 tools/package_macos.py

      - name: Keep the package
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: nazg-macos-arm64
          path: dist/*.zip
          if-no-files-found: error

  # The web build, as GenerateBuildForWeb.sh makes it, its tests run by Node (build-and-release.md,
  # "The web build"). Release only: the browser runs nothing else. Published by pages.yml, not here.
  web:
    name: Web (Release)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      # The Emscripten GenerateBuildForWeb.sh names, from Emscripten's own emsdk.
      - name: Install Emscripten
        run: |
          version=$(sed -n 's/^NAZG_EMSCRIPTEN_VERSION=//p' GenerateBuildForWeb.sh)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$version"
          "$HOME/emsdk/emsdk" activate "$version"

      - name: Fetch the definition bundles
        run: |
          python3 tools/update_via_bundle.py
          python3 tools/update_community_bundle.py

      - name: Configure
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          sh GenerateBuildForWeb.sh

      - name: Build
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          cmake --build build_Web --config Release --parallel

      - name: Test
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          ctest --test-dir build_Web -C Release --output-on-failure

  # The AppImage, in tools/package_linux.py's AlmaLinux 8 container (podman is on the runner),
  # with its tests run there too. Minutes of container build: for a release or by hand only.
  appimage:
    name: Linux AppImage
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Fetch the definition bundles
        run: |
          python3 tools/update_via_bundle.py
          python3 tools/update_community_bundle.py

      - name: Build, test and package in the container
        run: python3 tools/package_linux.py --test

      - name: Keep the package
        uses: actions/upload-artifact@v6
        with:
          name: nazg-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  # The three packages in a draft release, once every job has passed. The tag must name the
  # version CMakeLists.txt builds. By hand, everything but the release itself.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [windows, linux, macos, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Collect the packages
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag against NAZG_VERSION
        id: version
        run: |
          version=$(sed -n 's/^set(NAZG_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l dist
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not name NAZG_VERSION $version"
            exit 1
          fi

      # A draft: nobody sees it until Rico has written its notes and published it. A version with
      # a label (0.1.0-test.4) is a pre-release.
      - name: Make the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=$(case "$VERSION" in *-*) echo --prerelease ;; esac)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft $prerelease --title "$GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_REF_NAME by the Build workflow. Notes to write before publishing."
