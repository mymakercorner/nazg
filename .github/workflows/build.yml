#
# Builds Nazg and runs its tests on every push and pull request (build-and-release.md,
# "Automatic builds: GitHub Actions"). Windows only for now; Linux and macOS join as jobs here.
# Debug runs the tests with the asserts on; Release runs them too and keeps the testers' zip
# tools/package_windows.py makes, as an artifact of the run.

name: Build

# Not for a push that only changes notes: nothing built or tested would differ. GitHub never
# applies the filter to a tag, so a tag always builds; the Actions tab's button always runs.
on:
  push:
    paths-ignore: &notes
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore: *notes
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (${{ matrix.config }})
    # windows-2025 carries Visual Studio 2026 only; Nazg builds with 2022 (CLAUDE.md, "Stack").
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Check out, with the pinned submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Both bundles, so via_bundle_contents and community_bundle_contents run instead of being
      # skipped, and the package has them.
      - name: Fetch the definition bundles
        run: |
          python tools/update_via_bundle.py
          python tools/update_community_bundle.py

      - name: Configure
        run: cmake -S . -B build_VS2022 -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build_VS2022 --config ${{ matrix.config }} --parallel

      - name: Test
        run: ctest --test-dir build_VS2022 -C ${{ matrix.config }} --output-on-failure

      - name: Package
        if: matrix.config == 'Release'
        run: |
          python -m pip install markdown
          python tools/package_windows.py

      - name: Keep the package
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: nazg-windows-x64
          path: dist/*.zip
          if-no-files-found: error
